# Range calibration history — append-only (WS-293).
#
# One entry per run of the range-calibration Layer Probe
# (`node scripts/backtest/run-range-calibration.mjs --record`). Appended by
# `scripts/backtest/rangeCalibrationReport.mjs:historyRow`, never edited in place, so drift
# across runs is visible rather than reconstructed.
#
# `source` names the evidence file the metrics were read from, and `result_card_id` /
# `deal_book_hash` / `engine_commit` name the run that produced them. A row without a source is
# not admissible evidence.
#
# ── WHY THIS IS A SEPARATE FILE FROM scorecard-history.yaml ──────────────────────────────
# That file carries the readiness gate's fixed metric set (accuracy / logLoss / lift /
# worstCalibrationError / heroEv*), and criterion C6 reads its last three entries. Its `lift`
# column means VILLAIN-PREDICTION lift. This file's `coverageLift` means coverage over retained
# fraction. Writing one into the other's column would put two different quantities in one
# series — precisely the incommensurability POKER_THEORY §14 is about.
#
# ── HOW TO READ ANY ROW ─────────────────────────────────────────────────────────────────
# 1. `villainDeltaLog` is the metric that matters. It is mean log P(true holding) minus log
#    uniform-over-live-combos, in nats per decision. POSITIVE means the inferred range beats
#    "every live combo equally likely". It cannot saturate.
# 2. `villainCoverage` SATURATES. Since WS-291's floor and WS-302's preflop support weight,
#    every live combo carries positive weight by construction, so coverage is ~100% whatever
#    the model does. `coverageSaturated: true` on a row means coverage is not evidence that the
#    run went well — read `discriminatingMetric`.
# 3. Coverage never appears without `*Retained` and `*CoverageLift` beside it. A range that
#    keeps every combo scores 100% coverage for free; the retained fraction is what a range of
#    that width would score by eliminating at random.
# 4. EVERY coverage figure is P(covered | the holding was revealed). `*RevealRate` is the
#    other half, and `*CoverageBoundLow/High` bracket coverage over ALL scoreable decisions
#    assuming nothing about the unrevealed ones. The bracket is the population claim; the
#    point estimate is not.
# 5. The corpus is online 6-max/full-ring, July 2009. The founder's game is live 9-handed
#    1/2-1/3. Any live claim anchored on a row here is TRANSFERRED, not measured.

runs:

  - date: "2026-07-28"
    label: "WS-291 baseline — hard quantile cut, BEFORE the logistic replacement"
    source: "docs/research/range-calibration-2026-07-28.md"
    arm: "range-calibration (pre-WS-291)"
    corpus: "HandHQ online cash, July 2009, 50NL (SRC-011/SRC-012), FTP + PS"
    engine_commit: null
    deal_book_hash: null
    result_card_id: null
    disclaimer_register_version: null
    admissible: false
    metrics:
      villainDeltaLog: -5.272
      villainCoverage: null
      villainRetained: null
      villainCoverageLift: null
      villainN: 5598
      actingDeltaLog: -3.744
      actingCoverage: null
      actingRetained: null
      actingCoverageLift: null
      actingN: 8996
      chainDepth3DeltaLog: -8.314
      players: 1300
      villainRevealRate: null
      villainCoverageBoundLow: null
      villainCoverageBoundHigh: null
      actingRevealRate: null
      actingCoverageBoundLow: null
      actingCoverageBoundHigh: null
      coverageSaturated: false
      discriminatingMetric: "coverage+deltaLogVsUniform"
    notes: >
      THE BEFORE ROW, so WS-291 has a genuine before/after rather than a post-hoc story.
      Measured on 321,196 hands / 1,300 players / 32,779 postflop decisions / 8,996 revealed
      acting-seat + 5,598 revealed villain-seat holdings, two independent sites.
      `narrowByBoard` implemented P(action|hand) as a hard top-N quantile cut, so the model
      assigned probability ZERO to the hand actually held 11% of the time on the flop, 29% on
      the turn and 44% on the river — falsified, not miscalibrated.
      COVERAGE IS DELIBERATELY WITHHELD ON THIS ROW. The documented figures are villain-seat
      63.8% and acting-seat 74.6%, but the 2026-07-28 measurement recorded an overall RETAINED
      fraction for neither arm (only per-action: call 42.9%, bet 31.6%, check 49.9%, raise
      10.8%), and per-action n was not recorded either, so no honest overall retained can be
      reconstructed. The same rule that governs every new row — coverage never travels without
      its baseline — is applied backwards rather than waived for the row that happens to
      predate it. deltaLog is fully documented and is the metric that carries this row.
      NOT ADMISSIBLE as a Result Card: this run predates `replicationStamp.mjs`, so it names no
      engine commit, no Deal Book hash and no fault-register version. It is a recorded
      historical measurement, not a replicable one.
      NO SELECTION TERM: the reveal rate was not measured until WS-293, so the showdown-selection
      bounds cannot be reconstructed for this row. Every coverage-family figure from this era is
      P(covered | revealed) with an unknown and unrecorded reveal rate.

  - date: "2026-08-05"
    label: "WS-293 — standing metric established; post-WS-291/WS-302 engine"
    source: "out/ws293-standing.json"
    arm: "range-calibration"
    corpus: "HandHQ online cash, July 2009, 50NL"
    engine_commit: "78ceccc9d54c216cac682eef218553c956a1c859"
    engine_dirty: true
    deal_book_hash: "sha256:997edabaf37738ee5976c9db49333a840fd417a6d1bdba631f1b0c7928a55ffb"
    result_card_id: "RC-range-calibration-997edaba-78ceccc9"
    disclaimer_register_version: "FR-1+d4c7809e77b7"
    admissible: true
    metrics:
      villainDeltaLog: 0.53761
      villainCoverage: 1
      villainRetained: 1
      villainCoverageLift: 1
      villainN: 3423
      actingDeltaLog: 0.48519
      actingCoverage: 1
      actingRetained: 1
      actingCoverageLift: 1
      actingN: 5596
      chainDepth3DeltaLog: 0.21935
      players: 400
      villainRevealRate: 0.26993
      villainCoverageBoundLow: 0.26993
      villainCoverageBoundHigh: 1
      actingRevealRate: 0.27248
      actingCoverageBoundLow: 0.27248
      actingCoverageBoundHigh: 1
      coverageSaturated: true
      discriminatingMetric: "deltaLogVsUniform"
    notes: >
      FIRST RUN OF THE STANDING INSTRUMENT. 200 corpus files, 400 EVAL player-clusters, FTP+PS
      50NL. Coverage is SATURATED at 100% on both arms and is therefore not evidence — deltaLog
      carries the run: villain +0.538 nats/decision (n=3423), acting +0.485 (n=5596),
      chain-depth-3 +0.219 (n=3423). Every figure is P(covered | revealed) at a reveal rate of
      27.0% villain / 27.2% acting, so coverage over ALL scoreable decisions is bracketed only to
      [0.270, 1.000] and [0.272, 1.000]; quote the bracket, not the point. Showdown selection is
      strongly action-dependent: folds reveal at 0.0% and are absent from the measured set
      entirely, while RAISES reveal at 46.1% against a 27.0% base — a selection ratio of 1.71,
      making the raise branch the most selection-contaminated slice on the page, which is also the
      branch WS-291 identified as the expensive defect. Engine tree was DIRTY at run time, so the
      stamped commit does not identify the code that ran.
