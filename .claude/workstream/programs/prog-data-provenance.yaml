  protocol_history: []
  retention_days: 365
  evidence_dir: ".claude/workstream/evidence/data-provenance/"

maturity:
  level: 1
  criteria:
    level_1: "Program established. Registry and chain map promoted and verified against code."
    level_2: "All 5 problem classes checked. Every displayed value and decision-gating artifact traces to a registered source."
    level_3: "Challenge active. Source id travels at row grain through joins and aggregations; composition is reportable automatically."
    level_4: "Blind-spot active. Claim scope is machine-checkable against source composition; no unguarded leakage path exists."
  current_gaps: >
    Provenance is documented but not yet CARRIED. The registry's row-grain rule is stated and
    unimplemented: source id does not travel with data through aggregation, so composition
    reporting and scope-leak detection remain manual. DP-009 (the hero-EV / readiness chain)
    is unwalked. The claims half of the apparatus barely exists — docs/claims/ still holds
    templates and April drafts, so "what a number is NOT" has no home yet.

