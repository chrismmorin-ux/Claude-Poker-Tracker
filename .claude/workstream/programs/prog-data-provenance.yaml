id: data-provenance
name: "Data Provenance & Source Accountability"
schema_version: 4
status: NEW

contract: >
  Every number this product shows, and every claim it makes, can be traced to the data that
  produced it — through joins, aggregations and derivations, without anyone having to
  remember where it came from. The founder can ask "what is this built on, what is it NOT
  evidence for, and how should I discount it?" of any figure, and get an answer from the
  system rather than from recollection. This program exists because the repo is accumulating
  several structurally different datasets — the founder's own live hands, an Ignition
  capture stream, a 2009 online corpus in both raw and aggregated form, and a planned solver
  import — and inferences drawn across them are only as trustworthy as the bookkeeping
  underneath.

capability_brief:
  value: "Holds data provenance accountable — sources stay registered, chains stay walkable, and claims stay inside the evidence that supports them."
  problems_prevented:
    - "Overlapping inferences drawn across datasets that were never comparable"
    - "A corpus-mined prior leaking into a backtest scored on that same corpus"
    - "Trust-tier upgrades through a derivation chain (a weak estimate laundered into a measured fact)"
    - "Evidence pointers rotting silently as files move — three had already rotted between the 2026-06-19 baseline and the 2026-07-31 verification"
    - "A claim outliving the data that justified it, or being restated for a pool it was never measured on"
  cost:
    activation: "~10-15 min for the audit sweep"
    ongoing: "Re-run when a source is added, a store gains a migration, or a displayed number changes computation path"
  first_output:
    - "Drift report against the promoted registry + chain map"
    - "Broken / rotted evidence pointers"
    - "Unregistered sources feeding displayed values or founder decisions"
    - "Monotonicity violations — any chain step that upgrades trust tier"
  activation_command: "/pulse run data-provenance baseline"
  requires_user_input: false

problem_classes:
  - name: Source Registration
    description: "Every dataset feeding a displayed value or a founder decision is registered with a trust tier"
    examples:
      - "a new ingest path lands without an SRC- entry"
      - "live hands identified by ABSENCE of a source stamp, so a third source is indistinguishable from them"
      - "an artifact that gates a decision (readiness scorecard) treated as scratch output"
    detection: "Diff registered sources against ingest paths, stores, and evidence files cited by any gate or surface"

  - name: Chain Integrity
    description: "The path from source to displayed number is walkable, and its evidence pointers still resolve"
    examples:
      - "a cited file has moved or been renamed"
      - "two computation paths exist for one displayed number"
      - "a chain terminating in a founder decision rather than a pixel was never modelled"
    detection: "Resolve every file:line reference in the chain map; scan for duplicate computation of registered quantities"

  - name: Trust Monotonicity
    description: "No derivation step raises the trust tier of what it consumes"
    examples:
      - "re-aggregating observed hands into a Reference-tier table"
      - "a founder estimate cited downstream as a measured baseline"
      - "a derived posterior fed back in as an observation"
    detection: "Walk each chain and compare tier_at_step across derivations; flag any increase"

  - name: Leakage & Circularity
    description: "Nothing is evaluated against data it was derived from"
    examples:
      - "scoring the engine on the corpus its priors were mined from (SRC-011 / SRC-012 shared origin)"
      - "shrinking a villain toward a pool baseline that includes that villain"
      - "quoting a model's own estimate as the base rate it is compared against"
    detection: "Check every measurement states its reference table and partition; verify leave-one-out guards on pooled baselines"

  - name: Claim Scope
    description: "A claim stays inside the population, era, and game type its evidence covers"
    examples:
      - "a live-play claim supported entirely by 2009 online rows"
      - "a smoke-run figure quoted as a validated result"
      - "a 1/2 pool estimate used silently as the 1/3 prior"
    detection: "Compare each claim's stated scope against the source composition of the rows behind it"

scope:
  file_patterns:
    - "docs/provenance/**"
    - "docs/claims/**"
    - "docs/domain/readiness/**"
    - "scripts/backtest/**"
    - "src/utils/persistence/**"
    - "src/utils/exploitEngine/poolBaseline.js"
    - "src/utils/exploitEngine/handhqReferencePool.js"
    - "src/utils/rangeEngine/populationPriors.js"
    - "src/utils/exploitEngine/bayesianConfidence.js"
  invariants: []
  anti_invariants: []
  constraints: []

tier: active
tier_triggers:
  watch: "Repo has more than one data source feeding a displayed value"
  active: "Multiple structurally different datasets are combined, or a source gates a founder decision"
  critical: "A claim has been made outside its evidence, or a leakage path is found unguarded"

protocols:
  baseline:
    engine: provenance-audit
    focus: "Full provenance assessment: source registration, chain integrity, monotonicity, leakage, claim scope"
    problem_classes: all
    outputs: [baseline_report, initial_findings, problem_class_coverage]

  delta:
    engine: preflight
    cadence_days: 7
    focus: "New or changed sources, migrations, ingest paths, and backtest reference/partition arguments"
    method: "git diff against last_run_by_protocol.delta.date, filtered to scope file_patterns"
    min_tier: watch

  sweep:
    engine: provenance-audit
    cadence_days: 21
    focus: "Re-resolve every evidence pointer; re-walk every chain; diff registered sources against reality"
    problem_classes: all
    min_tier: active

  challenge:
    engine: eng-engine
    cadence_days: 30
    focus: "Adversarial provenance review"
    prompt_additions: >
      CHALLENGE protocol for Data Provenance. Think like a number that wants to look
      better-supported than it is:
      - Pick the most confident figure on any surface. Walk it to source. Does the tier at
        display match the confidence the UI projects?
      - Which aggregate mixes rows from more than one source without saying so?
      - Where could a derived value re-enter the pipeline as if it were an observation?
      - Which measurement is scored on data its own priors were mined from?
      - Name a claim in POKER_THEORY or the engine CLAUDE.md whose supporting rows are all
        from a population the claim does not mention.
      - Which conditional is quoted as a marginal? (P(x|showdown) as a population rate is
        the standing example — showdown reveals are a selected set, never a sample.)
    min_tier: active

  blind_spot:
    engine: eng-engine
    cadence_days: 60
    focus: "What provenance risks are we systematically missing?"
    prompt_additions: >
      BLIND SPOT protocol for Data Provenance. Review history and ask:
      - What new dataset arrived without anyone deciding where it belongs?
      - Which chains terminate in a decision rather than a pixel, and were therefore never
        modelled as chains at all?
      - Where does source identity get dropped on ingest, join, or aggregation — after which
        no downstream check can recover it?
      - Are volume and relevance being collapsed into a single "quality" score anywhere?
        They are different axes and a scalar hides the trade.
      - What did we stop being able to reconstruct?
    min_tier: critical

accountability:
  on_finding:
    action: create_work_item
    max_open_items: 5
    priority_floor: 20
    escalation:
      stale_days: 21
      escalate_to: session_start
      escalate_priority_bump: 8
  on_stale:
    action: create_work_item
    message: "Provenance has not been checked in {days} days — registry and chain map decay silently."
    block_sprint: false
  on_tier_change:
    action: notify_founder
    auto_escalate: true
    auto_deescalate: false

interconnections:
  feeds_into: [domain-correctness, claims-policy, data-quality, methodology-integrity]
  fed_by: [data-quality]
  blocks: []

phase_relevance:
  foundation: high
  pre-launch: critical
  launch: high
  growth: high
  maturity: high

