  baseline:
    date: "2026-05-01"
    engine: eng-engine
    run_id: "run-domain-correctness-baseline-2026-05-01"
    result: "21 findings (5 HIGH auto-promoted to queue); engines mostly compliant on 9 anti-patterns; theory-doc drift identified. (Reformatted flow->block 2026-06-20 so the naive YAML reader parses date — was silently undefined, zeroing protocol_currency.)"
  delta:
    date: "2026-07-30"
    engine: preflight
    run_id: "run-domain-correctness-delta-2026-07-30"
    result: "Delta window 2026-07-22..HEAD (5aa1419..292e56f), 8 days on a 3-day cadence — 51 scope files, +7671/-732, reviewed against the 9 anti-patterns plus the WS-285 threshold doctrine that landed mid-window. VERDICT: SOUND-WITH-MINOR-ISSUES. VERIFIED COMPLIANT: WS-302 support floor is real and its structural-vs-epistemic discriminator is implemented mechanically (withEquitySupport passes an identically-zero grid through untouched at populationPriors.js:309, applied at the single construction point :484, ranked by the grid's own smoothed shape not raw equity); WS-274 confines position labels to resolveFoldPrior tier 4 (:183-194) behind the §6.5a pool prior with a styleApplied guard preventing stacking, behindCount*0.04 and the flat callerFoldPct are gone, and applySizingResponse takes pot odds rather than a sizing multiplier; §7.4 mutual exclusivity holds in adaptMultipliers (:585-616 gated !hasModel && !hasObservedAdjustments); lineTaxonomy reads sequence state only. FIND-038 (HIGH, sizing-tell circularity) RESOLVED in-window by WS-261 — decisionAccumulator.js:515-562 now samples the actual shown hand via comboStrengthPercentile against the real board and drops uparseable/colliding cards with no fallback, so the UI's 'confirmed by showdowns' claim is now true. 3 NEW FINDINGS: FIND-040 MEDIUM — preflopFoldResolver.js:258-275 tier 1 keeps a hard `dist.confidence >= MODEL_CONFIDENCE_THRESHOLD` gate and RETURNS EARLY, so (a) a villain just under threshold has model info discarded instead of shrunk (the exact construction §11.5 generalizes and §11.4 already recorded against preflop fold rates specifically) and (b) when it fires, facedRaisePreflop/foldTo3Bet are never read — a thin model beats 200 observed hands, and priorWeight:0 reports full confidence; the same function's comment at :288-290 asserts 'NO hard observation cutoff', true of tiers 2-4 and false of tier 1 eight lines above; root cause is WS-274 lifting the old chain verbatim on 07-26 and WS-285 fixing queryActionDistribution's internals on 07-27 without revisiting its caller. FIND-041 MEDIUM — the sizing-tell adjustment has two hard cliffs with divergent constants (foldEquityCalculator.js:552 |r|>0.3 && n>=8 vs gameTreeDepth2.js:210 |r|>0.2 && n>=5), so the two layers of one evaluation disagree about whether a tell exists, both are step functions on a continuous quantity, and the aggregate site multiplies the posterior after the observed-data blend; now more valuable to fix since the signal became real. FIND-042 LOW — comboMultiplier + adaptMultipliers have no callers outside their own test file (WS-291 replaced the narrowing path); the section header claims they are 'kept for villainDecisionModel Dirichlet priors' but villainDecisionModel imports only the ACTION_MULTIPLIERS constant, so ~100 lines of AP-RL-01-shaped bucket narrowing sit test-green and ready to be rewired. Also LOW: gameTreeEvaluator.js:456-468 river texture uses two binary flag multipliers under a comment claiming 'continuous, not binary'. BACKLOG PREMISE VERIFIED: WS-304 CONFIRMED-REAL by arithmetic — handStrengthTier is an additive rank sum (AKo=23/32=0.719, AKs=0.781) against a 3-bet threshold of 0.73 LATE / 0.81 otherwise, so AKo is excluded at every position and AKs everywhere but LATE, leaving EARLY/MIDDLE 3-bet = JJ+ with TT (0.75) ranked above AKs; root cause is the additive form (cannot express dominance), not the threshold value, so retuning the cutoff keeps the wrong ordering — WS-305 is the substrate and preflopEquityTable.js already landed in-window. Findings recorded but NOT auto-promoted: program is at 37/25 items with FIND-039 still ungoverned. Evidence: .claude/workstream/evidence/domain-correctness/run-domain-correctness-delta-2026-07-30/delta-2026-07-30.yaml. PRIOR DELTA (2026-07-22, run-sweep-2026-07-22) preserved inline: Delta window 2026-06-20..HEAD (ecd20b8..5aa1419) — shares evidence with the 2026-07-22 sweep run: the sweep's drift review IS the delta guardrail pass over this window (only one engine-scope commit, 5aa1419, reviewed file-by-file against the 9 anti-patterns by a dedicated agent). Zero anti-pattern hits; changes doctrine-improving (poolBaseline segmentation + leave-one-out; multiwayFoldPct exact independence product; showdown-calibrated sizingTells). 2 MEDIUM findings filed under the sweep stamp (FIND-034 doc-drift, FIND-035 async-fragility guard). Evidence: .claude/workstream/evidence/domain-correctness/run-sweep-2026-07-22/phase-1/sweep-drift.yaml. PRIOR DELTA (2026-06-20, run-domain-correctness-delta-2026-06-20) preserved inline: Window 2026-06-10..HEAD, engine-scope. Major delta = new src/utils/icmEngine/ (Malmuth-Harville $EV, riskPremium, buildIcmStacks) + src/utils/pushFoldEngine/ (push/fold + call verdicts) from the ICM/tournament commits (7507af0, 69ed46d, 335f7c7). VERDICT: SOUND-WITH-MINOR-ISSUES. Malmuth-Harville recursion independently re-derived in Node — matches textbook {50,30,20} -> [38.39,32.75,28.86] to 4dp and conserves prize pool even when paid<players; ICM-tax signature present + asserted; risk premium is genuinely DERIVED ((heroNow-heroLose)/(heroWin-heroLose)), no bubble-factor/M-zone lookup table (§10.3 compliant); push/fold verdicts derive from equity + ICM pot-odds with NO position/style/bucket label as input (§7/§10.4-5); honesty flags isApproximate/tooLarge functionally wired (setup.js declines ICM build when tooLarge, falls back to chip-EV; MAX_ICM_FIELD=10 guards factorial blowup); hardcoded ranges serve as population REFERENCE feeding MC equity, never bypass the equity math; tests validate real poker correctness (textbook MH value, conservation, ICM CALL->FOLD flip at 0.47eq). 1 NEW LOW finding: covered-shove riskPremium asymmetry — riskPremium.js:49-50 passes riskChips:heroChips (full stack) while winChips=min(hero,villain), over-debiting hero in the lose branch when the contested villain is shorter than hero; masked in normal use (first-in jams target the chip leader so villain>=hero),