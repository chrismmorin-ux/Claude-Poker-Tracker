status_note: |
  FILED LATE 2026-08-05. Recorded in the 2026-07-30 delta run record
  (prog-domain-correctness.yaml:402) and in the run's evidence file, never registered as a
  findings/ file. Content extracted from
  evidence/domain-correctness/run-domain-correctness-delta-2026-07-30/delta-2026-07-30.yaml:102-126
  (and the unnumbered LOW at :149-162, which that record explicitly folds into this
  finding's fix) and re-verified against HEAD before filing.

  NOT PROMOTED, AND THE OVERLAP MATTERS. WS-395 (from FIND-050, 2026-08-05 blind-spot run)
  re-derives the SAME aggregate gate at foldEquityCalculator.js:661-671, computes its ~47%
  null fire rate, and requires it be re-thresholded or removed. It does NOT enumerate
  gameTreeDepth2.js:279-295 — its files_involved list omits gameTreeDepth2.js entirely and
  its text names only two gates (weaknessDetector's |r|>0.5 and foldEquityCalculator's
  |r|>0.3). So closing WS-395 would leave a THIRD gate live on the depth-2 per-combo path
  with a constant nobody has re-derived, which is precisely the mechanism WS-395's own
  accept criteria warn about ("it must not be left as a computed-and-unread quantity that a
  future reader wires up without re-deriving its null rate"). Linking this finding to WS-395
  would record coverage that does not exist. The right move is to add the depth-2 gate to
  WS-395's scope — until that happens this finding stays unpromoted.

  PROBLEM CLASS. "Villain decision model fidelity" — the declared class for how villain fold
  response is SHAPED (its examples include "Linear fold% scaling on bet size"), and the class
  FIND-038 was filed under for the same sizing-tell machinery. Runner-up "First-principles
  decision modeling" (a constant resolving context via a threshold).
