id: "FIND-041"
title: "The sizing-tell adjustment has two entry cliffs with divergent constants in two modules, and both multiply a finished estimate"
severity: MEDIUM
status: open
category: "domain-defect"
program: "domain-correctness"
problem_class: "Villain decision model fidelity"
source:
  engine: "preflight"
