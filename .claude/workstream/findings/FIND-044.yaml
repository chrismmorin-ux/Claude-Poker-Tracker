recommended_fix: |
  Ordering is load-bearing: (0) record stacks — gameReducer has no stack field, so effectiveStack is
  unrecordable; (1) thread multiway — gameTreeEvaluator.js:792-793 default numOpponents=1 and
  opponentModels=[]; (2) monotonicity or depth disclosure — refinement is wall-clock gated at :814;
  (3) wire. The one-hook edit is harmful in isolation: it ships a heads-up fold model on a 9-handed
  table with rake omitted.
