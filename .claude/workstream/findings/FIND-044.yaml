status_note: |
  VOCABULARY REVIEW 2026-08-05 — DELIBERATELY LEFT NON-CONFORMING. `problem_class:
  "Engine reachability"` is not one of the nine classes prog-domain-correctness.yaml
  declares, and it is being kept, because none of the nine fits and forcing one would
  destroy the finding.

  All nine declared classes ask "is the number the engine computes correct?" — decision
  modelling, range estimation, equity, game-tree EV, confidence representation, villain
  model fidelity, exploit soundness, theory drift, anti-patterns. THIS finding says the
  engine's numbers are fine and never arrive: evaluateGameTree is fully produced at
  OnlineAnalysisContext.jsx:57-60 and pushed to the extension, while useSyncBridge.js:329
  is the sole writer of liveHandState, so the live path gets nothing. A correct engine
  that no surface reaches is a defect of a kind the class list cannot express.

  THIS IS A FINDING ABOUT THE PROGRAM. prog-domain-correctness needs a tenth class —
  "Engine reachability" or "surface wiring" — covering produced-but-unconsumed engine
  output. It is the same gap FIND-046 mechanism 2 names from the other side (the program's
  scope excludes src/hooks/** and src/components/**, the exact files this finding is
  about), so the two should be resolved together. Until then this finding will trip the
  problem-class warning added to cwos-reconcile.js on 2026-08-05; that warning is correct
  and is pointing at the program, not at the finding.

  (The secondary defect carried inside this finding — preflopAdvisor.js:435 inferring the
  big blind as potSize/1.5 where the pot already contains the limps — WOULD sit under
  "Game tree EV correctness". It is not the finding's subject and is not grounds for
  reclassifying the whole.)
