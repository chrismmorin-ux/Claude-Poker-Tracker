description: |
  OnlineAnalysisContext.jsx:57-60 produces the full evaluateGameTree output and :68-70 pushes it to
  the Chrome extension; ignition-poker-tracker/side-panel/render-coordinator.js:386 renders topRec;
  LiveAdviceBar.jsx:181-390 is a complete LIVE-side renderer for the same object, gated on
  useGameTree. useSyncBridge.js:329 is the SOLE writer of liveHandState and fires only on a
  BRIDGE_MSG.HAND_STATE window message, so the object is permanently null without the extension.

  The correct framing is a second PRODUCER for a consumer that already exists and already has a
  rendering contract — not a build-the-connection project. Nobody costed it that way.

  Also in this finding: preflopAdvisor.js:435 infers the big blind as potSize/1.5 inside
  facing_limpers, where the pot already contains the limps — a 2.3x error at $1/$2 with two limpers,
  on the online path only.
