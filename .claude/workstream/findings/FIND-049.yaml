description: |
  LIVE — absent: LiveAdviceBar.jsx:256 gates ConfidenceBadge behind useGameTree (:181), false
  without the extension.

  IGNITION — degenerate: the DATA tier needs source.includes('model'); villainDecisionModel.js emits
  only 'prior' (:508, :524, :558), `shrinkage-L${n}` (:537) and `level-${n}` (:550). The EST tier
  needs effectiveN < 5; every construction adds PSEUDOCOUNT = 10 (:36) — :325, :445, :739, :746 —
  so effectiveN has a floor of 10. Every villain at every sample size renders PARTIAL.
  actionClassifier.js:302 prints `(${effectiveN} obs)`, so ONE observation renders as "11 obs".
  LiveAdviceBar.test.jsx:30, :66, :78 fixture source strings the producer cannot emit.

  The honest twin: ignition-poker-tracker/shared/stats-engine.js:34 sampleQualityTier takes a RAW
  count against the same 15/5 thresholds, returns all three tiers, and its palette comment says it
  mirrors LiveAdviceBar. Identical thresholds, opposite behaviour, no cross-reference.
affected_files:
  - "src/utils/exploitEngine/villainDecisionModel.js"
  - "src/utils/exploitEngine/gameTreeEvaluator.js"
  - "src/utils/exploitEngine/actionClassifier.js"
  - "src/components/views/TableView/LiveAdviceBar.jsx"
  - "ignition-poker-tracker/shared/stats-engine.js"
recommended_fix: |
  evidenceN is ALREADY computed and returned at villainDecisionModel.js:445 and simply not carried
  forward. Propagate it to the other four return sites and the three villainPrediction literals
  (gameTreeEvaluator.js:332, :517, :757); key the badge on the shared sampleQualityTier.
  PSEUDOCOUNT is NOT the defect — it is the Dirichlet prior strength matched to PRIOR_WEIGHT = 10,
  validated on the WS-262 corpus. Caveat: evidenceN is a sum of DECAYED weights (a fractional ESS)
  while the 15/5 thresholds are calibrated on raw counts — feed the raw count, put the ESS in a
  tooltip.
theory_citation: "POKER_THEORY §11.5; consequence-weighted confidence (exploitEngine/CLAUDE.md §2)"
