status_note: |
  VOCABULARY NORMALISATION 2026-08-05. `problem_class` was "Uncertainty transmission" —
  not one of the nine classes prog-domain-correctness.yaml declares. Original text
  preserved here; nothing else in the finding changed.

  Mapped to "Bayesian confidence representation", which declares "All decision-display
  surfaces must reflect uncertainty" and lists as examples "Action recommendation
  displayed without sample-size caveat" and "Confidence band not narrowing as samples
  accumulate". Both are literally this finding: the badge is absent on live, and on
  Ignition every villain renders PARTIAL because PSEUDOCOUNT = 10 floors effectiveN.
  The old name described the MECHANISM (a computed quantity not carried to the surface);
  the declared class names the DOCTRINE it breaks.
