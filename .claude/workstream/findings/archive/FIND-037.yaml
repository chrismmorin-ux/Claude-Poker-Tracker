description: |
  createOnlineSession() (sessionsStorage.js:422-449, literal at :428) writes
  gameType: 'NL Holdem' for every auto-created online session regardless of
  actual stakes/format. poolBaseline.segmentKey() (poolBaseline.js:75-81)
  therefore produces exactly ONE segment ('online/nl-holdem') for all online
  play — a founder playing $1/$2 zone and $5/$10 regular pools tight-reg and
  loose-rec tendencies into a single blended baseline, then shrinks every
  online villain toward that wrong-population mean. Contradicts the module's
  own doctrine (poolBaseline.js:13-15: different populations never pooled) —
  the guard holds at the online/live boundary but silently fails the
  within-online stake boundary. Violates anti_invariant "No 'population prior'
  that ignores stakes/pool conditioning".
affected_files:
  - "src/utils/persistence/sessionsStorage.js"
  - "src/utils/exploitEngine/poolBaseline.js"
recommended_fix: |
  Capture actual stakes/table format from the Ignition wire data (blinds/table
  metadata already exist per wire-schemas.js) and write it into
  session.gameType (or a dedicated stakes field that segmentKey reads).
  Backfill consideration: existing online sessions all carry the literal —
  decide whether to re-key from stored wire captures or accept a fresh start.
