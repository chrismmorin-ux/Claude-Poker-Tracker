description: |
  Two live-low-stakes exploit tells are missing:
  (a) Sizing-tell calibration is STUBBED — villainProfileBuilder.js:446-451 hard-codes
      sizingTells.detected = false ("reserved for future showdown calibration"). No
      module regresses shown-hand strength on bet_size_pct, despite §3.5/§5.9 calling
      it the most exploitable tell. The data IS captured (showdowns store
      {bet_size_pct, hand_shown}) — this is a wiring gap, not a data gap.
  (b) Timing tells are absent AND the raw data isn't recorded — no time-to-act /
      tookMs field on action records in gameConstants.js. Requires a data-model change
      before any engine work (the Ignition extension could capture it precisely).
  Returns "no tell" rather than wrong output, so low severity (incomplete, not wrong).

  RE-RULED 2026-08-05 (run-domain-correctness-blindspot-2026-08-05): the sizing-tell half is CLOSED
  but RE-OPENED on different grounds; the timing half is CONFIRMED-STILL-OPEN.
  (a) WS-261 genuinely unstubbed the calibration — decisionAccumulator.js:632-637 samples the shown
      hand, so the circularity recorded in FIND-038 is gone. But it shipped with NO admissibility
      gate: see FIND-050, where the production gates fire on noise at ~21% and ~47% under H0 and the
      ~47% one multiplies the fold estimate that reaches EV. The half that was "fixed" now needs a
      gate, not a stub removal.
  (b) Timing tells remain absent AND the raw data is still not recorded:
      `grep -rn 'timeToAct|tankTime|actionTime|decisionTime|timingTell' src/` returns nothing
      outside session duration and compute profiling; gameReducer.js:42 action shape is
      `{seat, action, street, order, amount?}` with no timestamp, and recordSeatAction has no
      Date.now(). WS-253 remains backlog.
  Status returned to open and the file moved out of archive/ on that basis. Note for the vocabulary:
  "resolved" in this repo's finding files has meant promoted-to-ticket, not shipped — that ambiguity
  is itself the proposed register entry FAULT-status-unverified-closure.
affected_files:
  - "src/utils/exploitEngine/villainProfileBuilder.js"
  - "src/constants/gameConstants.js"
recommended_fix: |
  (a) Per villain, regress shown-hand strength on bet_size_pct per street; emit
  sizingTells:{correlation:+/0/-, confidence}; feed into bluff-catch thresholds. N-gated.
  (b) Add optional tookMs to action records (auto in extension, best-effort manual);
  build a timing-tell trait. Defer (b) until (a) proves the showdown-calibration pattern.
