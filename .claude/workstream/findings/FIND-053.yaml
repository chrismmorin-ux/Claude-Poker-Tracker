status_note: |
  VOCABULARY NORMALISATION 2026-08-05. `problem_class` was "Uncertainty disclosure" —
  not one of the nine classes prog-domain-correctness.yaml declares. Original text
  preserved here; nothing else in the finding changed.

  Mapped to "Bayesian confidence representation" — "All decision-display surfaces must
  reflect uncertainty". ConfidenceDisclosure.jsx is a decision-display surface that
  reflects one term (MC sampling noise, 1/sqrt(trials)) and omits every dominant one, so
  it does not merely fail to disclose, it MIS-states the width. Same class as FIND-049
  (badge absent/degenerate) and FIND-047 (confidence computed on a different denominator
  than the estimate) — the three are one cluster and are easier to see as one under a
  shared class than under three invented ones.
