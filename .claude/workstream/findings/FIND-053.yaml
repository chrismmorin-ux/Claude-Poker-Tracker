description: |
  ConfidenceDisclosure.jsx:70-72 renders "MC trials: {mcTrials} (± rough CI = 1/√trials)" — Monte
  Carlo sampling noise ONLY, on a panel labelled "confidence". :82-88 renders
  cascadingFoldProbability and names the method ("multiwayFoldPct, independent multiplication per
  villain") without naming the bet fraction that produced it; that value comes from
  drillModeEngine.js:808-815, where 0.75 is passed positionally as the betFraction argument
  (signature at gameTreeEquity.js:1119) — the run record cites :813, but at HEAD the literal is
  on :814.

  Excluded and dominant: the bet-fraction assumption, four of six estimators never scored against
  truth (groundTruthCoverage census 2 of 6; the gaps are computeVillainEquityVsPerceived and the
  three approximate*RangeEquity functions that feed the aggregate), and the online-2009 population
  transfer (fault register rank 1, breadth 0.90).

  Verdict: worse-than-none. A reader with no disclosure knows he does not know; a reader with this
  one has a narrow interval on a panel labelled "confidence" and will size decisions to it.
affected_files:
  - "src/components/views/PostflopDrillsView/panels/ConfidenceDisclosure.jsx"
  - "src/utils/postflopDrillContent/drillModeEngine.js"
recommended_fix: |
  NOT removal — the standing rule forbids deleting an instrument for being wrong. Widen it: re-label
  the interval for what it bounds, name the excluded terms in the panel's own idiom, state the bet
  fraction as a VALUE read from the call site, and surface the ground-truth coverage count live
  rather than transcribed.
theory_citation: "memory: feedback_never_delete_for_null_result; Standard of Record (ADR-009); DISCLAIMER-AND-FAULT-REGISTER §1"
