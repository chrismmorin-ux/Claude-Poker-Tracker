description: |
  Two low-priority verification items from the blind-spot run:
  (a) The Bayesian confidence MATH is solid (bayesianConfidence.js, PRIOR_WEIGHT=10,
      consequence-weighted tiers in exploitValidator.js), but verify it reaches the
      live-advice UI as an explicit "N=4, low confidence" signal rather than a bare
      recommendation — a confident-looking exploit on 3 hands invites table over-
      adjustment. More a surfacing/design gap than a theory gap.
  (b) rangeVsRangeEquity exists only in the drill product (postflopDrillContent); the
      live advisor uses hand-vs-range (correct, hero knows their cards). The missing
      piece is using board-favors-which-range (range/nut advantage, §3.2) to set bet
      sizing live. Verify heroActionBuilder's advantage object comes from a real
      range-vs-range computation, not a heuristic.

  RE-RULED 2026-08-05 (run-domain-correctness-blindspot-2026-08-05): part (a) is
  CONFIRMED-STILL-OPEN, settled in BOTH directions, and worse than "open".
    COMPUTED: yes, and well — bayesianSampleConfidence, per-stat credible intervals against correct
    opportunity denominators (tendencyCalculations.js:346-362), effectiveN threaded through every
    recommendation. The math is not the problem.
    TRANSMITTED: ABSENT on the manual live surface (LiveAdviceBar.jsx:256 gates ConfidenceBadge
    behind useGameTree, false without the Chrome extension) and DEGENERATE on Ignition (every
    villain at every sample size renders PARTIAL). Detail and the minimum fix are in FIND-049 —
    treat that as the actionable form of part (a) and do not file a second live-path ticket, which
    the run's do_not_file list rules a mis-scoped duplicate.
  Three lenses gave three different verdicts on this finding (still-open / closed / partially-
  closed). All three were tracing different paths and none had traced both; the online-vs-manual
  split is the unifying explanation and it also resolves the FIND-032 disagreement.
  Severity understated at LOW: the live surface shows a numberless opacity rather than a sample
  size, which is the "confident-looking exploit on 3 hands" risk this finding was raised to prevent.
  Part (b) (range-advantage sizing) was not re-examined by this run and remains as recorded.
