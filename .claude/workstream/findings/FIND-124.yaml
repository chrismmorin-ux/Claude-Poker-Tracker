  could reintroduce a style branch from it. 4-lens convergent (architect/senior/failure/security).
  Companion cosmetic site: modelAudit.js:114 reattaches style for display parity — documented
  and regression-tested (villainDecisionModel.test.js:124), no action beyond awareness.
