  - "src/components/ui/VillainModelCard.jsx"
recommended_fix: |
  Wire calibrateThoughts into a scored run against the corpus and publish the scorecard, so the 85
  weights become measured rather than asserted; until they are, mark the surface as unscored in the
  UI rather than removing it (the standing rule forbids deleting an instrument for being wrong).
  If the weights cannot be scored, the honest move is to state in POKER_THEORY.md that thought
  inference is a heuristic layer outside the doctrine, rather than leaving code-with-no-doctrine
  rendering to the founder as if it carried the same standing as the engine's EV output. Track the
  Class-3 items (equityCI, credibleInterval) as their own cheap ticket, not merged into this one.
