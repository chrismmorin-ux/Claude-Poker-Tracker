description: |
  thoughtCatalog.js carries 64 catalog entries with 85 literal `weight:` floats (verified count at
  HEAD). analysisPipeline.js:24 and :150 run `inferVillainThoughts` in the PRODUCTION pipeline, and
  the output renders in VillainProfileModal.jsx and VillainModelCard.jsx — surfaces the founder
  reads at the table. `grep -ci thought .claude/context/POKER_THEORY.md` returns 0 across all 16
  sections: the doctrine document does not contain the concept the shipped weights encode.

  ITS OWN FALSIFIER EXISTS AND IS NOT WIRED. thoughtInference.js:293 `calibrateThoughts`, driven by
  PREDICTION_TESTS, is a real self-check — and its only caller is
  __tests__/thoughtInference.test.js.

  TAXONOMY RULING (cross-critic) — DO NOT MERGE THIS WITH THE ORPHANED-MODULE FAMILY. Three classes
  with three different remedies:
    1. UNWIRED PRODUCT — a feature with no caller (bluffValueConstruction, unexploitableFloor,
       equityCache, icmContext). Cost is opportunity cost; remedy is a wiring ticket.
    2. UNWIRED SELF-CHECK OF A LIVE CLAIM — this finding. Not an opportunity cost but a DOCTRINE
       VIOLATION, because the thing the check would falsify IS shipping to the founder.
    3. UNWIRED UNCERTAINTY ON A SHIPPING NUMBER — computed, transmitted, then dropped at the last
       hop. equityCI: produced at liveAdvisor/computeHelpers.js:93, carried on the wire at
       ignition wire-schemas.js:50, consumed by no renderer. credibleInterval: defined in
       pokerCore, imported by tendencyCalculations.js:22 and skillAssessment/shapeLanguage/
       betaPosterior.js:17, rendered at AnchorCalibrationPanel.jsx:202 and
       PrimitiveCalibrationPanel.jsx:100 — so the lens claim "referenced only by its own
       definition" is OVERSTATED and the defensible, still-damning version is that NO EV OR
       DECISION PATH CONSUMES A CREDIBLE INTERVAL. Class 3 was named by no lens and is the
       cheapest of the three to close.
affected_files:
