title: "The program's declared detection methods return zero matches - it cannot execute its own sweep as specified"
description: |
  prog-design.yaml:71 greps 'status: PROTO' - actual field is '**Evidence status:** PROTO' (one file lowercase Proto): zero matches. :76 expects a discovery status field - the LOG index disagrees with the files it indexes. :91 expects scannable audit findings - audits carry no structured status. The facilitator also refuted a panel claim with this same shape: an unquoted grep for program: design returned 0; the correct quoted grep returns 34 queue files. Nothing checks the checker.
affected_files:
