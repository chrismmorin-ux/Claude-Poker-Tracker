recommended_fix: |
  Make every detection: field an executable command; add a test asserting each returns >0 matches against current artifacts (zero matches must be distinguishable from a broken grep). Exact string fixes recorded in the sweep's SELF-REPAIR section (run evidence). Where the artifact is the wrong side (audits), fix the template not the grep.
