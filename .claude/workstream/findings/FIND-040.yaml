recommended_fix: |
  Give the bet/raise narrowing a second (bluff) arm so a polarized betting range
  is representable, then verify the direction of the change rather than assuming
  it:

  1. Split `continuationRate` for aggressive actions into a value fraction and a
     bluff fraction, selecting the bluff arm from the BOTTOM of the equity sort
     (optionally blocker-weighted, since POKER_THEORY 3.x already treats blockers
     as bluff-selection criteria). Keep merged/linear representable — the fix is
     to ADD the polarized shape, not to force it.
  2. Condition the value:bluff split on street and sizing rather than a single
     constant, because the measured pool composition differs sharply by both
     (river overbet ~4% air vs flop 1/3-pot ranges that are wide). Do NOT author
     one global ratio.
  3. Run the AS-GUT-8 falsification test before shipping: rebuild villain bet
     ranges with the bluff arm and compare hero's EV-optimal action against the
     current top-slice model over a representative flop sample. The finding is
     confirmed as material if the action flips on >10% of spots.
  4. Note POKER_THEORY 9.4 (live-pool small-sizing donk composition skews
     value-heavy, ~60-80% value) — the live-pool target is NOT solver-balanced
     50:50, so the bluff arm must be calibratable per segment, not fixed.
