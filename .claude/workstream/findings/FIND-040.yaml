description: |
  RE-VERIFIED AT HEAD 2026-08-05 — STILL OPEN. Line numbers corrected: the run record
  cites :258-275 and :288-290; at HEAD the tier-1 block is preflopFoldResolver.js:294-313
  and the comment is at :327-329. The mechanism is unchanged.

  resolveSeatFoldToRaise's tier 1 (:294-313) queries the villain decision model and then
  gates on `if (dist.confidence >= MODEL_CONFIDENCE_THRESHOLD)` (:300; the constant is 0.3,
  villainModelData.js:33). Inside the gate it RETURNS (:302-310), bypassing the Beta
  posterior at :314-330 entirely. Two consequences:

  (1) A villain just under the threshold has model information DISCARDED OUTRIGHT rather
  than shrunk — the exact `if (n >= K) use the specific estimate` construction that
  POKER_THEORY §11.5 generalizes from the WS-285 fix, and that §11.4 had already recorded
  against a minimum-N gate on preflop fold rates specifically: "a threshold label, the same
  anti-pattern in another costume."

  (2) When the gate DOES fire, the early return means `facedRaisePreflop` (:317) and the
  fold-vs-preflop-raise count (:318-320) are never read. A villain with a thin model and
  200 observed faced-raise hands is priced off the thin model and the 200 hands are thrown
  away. The branch returns `priorWeight: 0` (:308), which reports FULL confidence for an
  estimate that carries none.

  THE FILE CONTRADICTS ITSELF EIGHT LINES APART. The same function's comment at :327-329
  states "Per founder decision (WS-274): NO hard observation cutoff. The Beta posterior
  self-weights ... A threshold would reintroduce the label anti-pattern in another guise."
  That is true of tiers 2-4 beneath it and false of tier 1 above it.

  ROOT CAUSE — DRIFT BETWEEN TWO COMMITS IN ONE WINDOW. WS-274 (2026-07-26) lifted the
  pre-existing priority chain into the resolver verbatim, including its threshold. WS-285
  (2026-07-27) then established shrinkage-not-thresholds and fixed queryActionDistribution's
  internals, but did not revisit its caller.
affected_files:
  - "src/utils/exploitEngine/preflopFoldResolver.js"
  - "src/utils/exploitEngine/villainModelData.js"
recommended_fix: |
  Treat the model distribution as another level in the ladder rather than a gate on it: use
  its estimate to prime the Beta prior (strength = dist.effectiveN) and let the observed
  faced-raise counts update it, instead of early-returning. No cutoff. Report priorWeight
  honestly — the returned figure should reflect how much of the posterior came from the
  prior, which for a thin model is most of it.
theory_citation: "POKER_THEORY §11.5 (shrinkage, not thresholds — generalized from WS-285); §11.4 (minimum-N gate on preflop fold rates is 'a threshold label, the same anti-pattern in another costume')"
