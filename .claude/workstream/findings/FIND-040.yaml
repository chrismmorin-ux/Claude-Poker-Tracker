  NOT PROMOTED. No queue item covers this. WS-393 (:72) and WS-333 (:140) both name
  `preflopFoldResolver.resolveSeatFoldToRaise` as the correct per-seat pricing entry point,
  but neither touches the tier-1 gate inside it — closing either would leave this open. The
  run record's own judgement was that "FIND-040 is the one worth promoting on its own
  merits"; it was withheld only because domain-correctness was at 37/25 items at the time.

  PROBLEM CLASS. Mapped to "Bayesian confidence representation" — the declared class
  carrying "Sample-size-aware confidence must propagate as credible intervals (Bayesian)
  not point estimates". Tier 1 returns a point estimate with `priorWeight: 0` in place of
  the Beta blend, which is that rule broken in both directions at once. Runner-up
  "Villain decision model fidelity" (the estimator is the villain fold-rate model);
  recorded here so a future re-file does not read the choice as arbitrary.
