description: |
  useLiveEquity.js:138 `getVillainRange(villain.tendencies.rangeProfile, position, actionKey)` and
  :167 `estimateFoldPct(seg, 'bet')` are the COMPLETE per-villain input to the live recommendation.
  Both are structurally incapable of carrying per-villain information.

  THE RANGE HALF IS ALGEBRAICALLY INERT. rangeEngine/bayesianUpdater.js:174-183 computes one
  Bayesian effective frequency per (position, action), divides it by the population frequency to
  get `ratio`, and then writes `ranges[action][i] = Math.min(1.0, prior[i] * ratio)` across all 169
  cells. ONE scalar scales the whole grid; the SHAPE is untouched by data. Any downstream consumer
  that normalises has that uniform factor divided straight back out, so a villain observed for a
  thousand hands — absent showdowns — presents the population prior bit for bit. More table time
  moves volume; it cannot move WHICH hands the opponent holds.

  THE INHERITED SHAPE'S PROVENANCE IS STATED IN THE CODE. bayesianConfidence.js:36-49 — "FOUNDER
  ESTIMATE of the live 1/2 pool — informed judgment, NOT a measured dataset."

  THE FOLD HALF IS A PURE POPULATION CONSTANT (cross-critic extension). useLiveEquity.js:167 calls
  estimateFoldPct with two arguments, so playerStats and villainModel default to {} and null and
  every personalisation branch in foldEquityCalculator.js (:443, :468) is dead on every live call.

  THE IDENTIFIABLE COORDINATE EXISTS AND IS NOT WRITTEN BACK. rangeEngine/pipCalculator.js computes
  a low-dimensional shape coordinate that is consumed only by RangeProvenance.jsx for display.

  WHY THIS IS THE FOUNDER'S QUESTION, NOT A SIDE ISSUE. The stated premise is "whatever mechanism
  we use should transfer to the live data and we should see it adjust." Against HEAD it cannot
  adjust, and the reason is algebra rather than thin live volume — so the flatness is demonstrable
  today and is itself the falsification.
