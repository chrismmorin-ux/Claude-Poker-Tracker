recommended_fix: |
  Make the update RESHAPE rather than RESCALE, at a parameter count the data can identify: a width
  percentile plus 3-5 PIP-category deviations is 4-6 free parameters, identifiable from roughly
  50-150 preflop decisions, against 169 cells that never will be. Use the hierarchical form
  updateSubclassRanges already uses one level down (bayesianUpdater.js:241-311), measure against
  n_parent rather than the scenario-wide N (DEC-025 Amendment 1), and never normalise a prior grid
  into a distribution — prior grids are propensities. Report the movement curve AND held-out
  log-loss together; a model that moves without improving is worse than the inert channel, because
  the inert channel at least sits on a prior measured to be worth +0.1137 nats.
