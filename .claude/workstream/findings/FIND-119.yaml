title: "A per-combo equity baseline is computed and explicitly discarded (void); the flat population marginal is used instead"
description: |
  gameTreeDepth2.js:373-374 — const popCallRate = computePopBaselineFromEquity(villainEquity,
  potOddsNeeded); void popCallRate; — then :377 uses 1 - POPULATION_PRIORS.bet.fold (flat
  constant). Facilitator-verified verbatim. The comment above (:370-372, "Use per-combo equity
  logistic (not bucket anchors) for population baseline") describes behavior the code does not
  perform — the §11.6/11.9 "comment asserting what the values contradict" pattern
  (WS-285/291/300/402 lineage). This is POKER_THEORY §13.3's anti-pattern (flat population
  marginal where per-combo equity is available), firing exactly where a per-combo baseline
  matters most: villain has bucket evidence but no situation-level rates (:369).
  CONTAMINATES SCORED FIGURE: YES, bounded to one evidence tier.
