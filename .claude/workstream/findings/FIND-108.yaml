  - "kit/scripts/cwos-session-recovery.js"
  - "kit/scripts/cwos-session-register.js"
  - "kit/scripts/lib/session-liveness.js"
recommended_fix: |
  Fix the three regressions (string, assumeLocal, pid_recorded_at); correct the record everywhere the environmental label was propagated.
