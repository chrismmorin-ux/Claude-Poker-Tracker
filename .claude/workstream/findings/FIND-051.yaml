update_note: |
  UPDATED 2026-08-07 by domain-correctness/delta: the wall-clock mechanism WIDENED in-window - four NEW
  Date.now() mid-loop bailouts (computeCallDepth2EV ~:690, computeBetCallDepth2EV, computeRaiseResponseDepth2EV,
  depth-3 flop-path river loop) plus claimStageBudget()/isTimeBudgetExceeded() now gate five stages on a 2000ms
  clock where the old 150ms clock was dead. Genuine mitigations shipped alongside (stratum guard, bailedAt/
  weightConsumed visibility, seeded RNG) - mechanism widened but instrumented. refinementBudgetMs=0 remains the
  only deterministic configuration. Cross-ref WS-432 (claimed, SPR-177). ALSO: methodology sweep found the Step-8
  MC refinement call (gameTreeEvaluator.js:1119) passes NO rng - unseeded Math.random noise inside the DEPTH-1
  answer itself, concentrated on close calls via the dominantMargin gate - a nondeterminism source WS-432s
  enumeration missed. Relay to the WS-432 implementer.
