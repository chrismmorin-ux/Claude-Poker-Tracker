recommended_fix: |
  1. Correct POKER_THEORY §11.3: the gate is the FLOP, not the showdown. State the founder's
     game explicitly (no preflop rake; postflop folded pots raked) and record immediate-rake
     jurisdictions as deliberately out of scope.
  2. Correct the `rakedShowdownPot` docblock (potCalculator.js:460-463) — the function is fine,
     the contract it advertises is not. Consider renaming to `rakedPot`, since "showdown" in the
     name is the error in miniature.
  3. Tax the fold branch on the pot it actually wins (P, excluding hero's returned uncalled bet)
     at foldEquityCalculator.js:168 and :210-211, and at gameTreeDepth2.js:1699 and the river
     check path.
  4. Re-point WS-451: keep the shared per-branch helper and the depth-3 pot-actually-reached fix;
     REPLACE the fold-invariance criterion with its inverse — fold-branch EV MUST move when rake
     is on for a postflop street, and MUST NOT move preflop under noFlopNoDrop.
  5. Re-run the corpus backtest and price the shift in bluff frequency. Pre-register the
     direction: bluff/raise frequency should FALL, since every bluff's fold branch now pays less.
  6. Out of scope by founder ruling: California/AC immediate-rake structures. `estimateRake`
     already cannot express them and does not need to.
