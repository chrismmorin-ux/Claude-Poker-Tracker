description: |
  §6.5 "Bayesian Updates for Ranges" (POKER_THEORY.md:374-382) still describes
  only the 2-tier model (population prior + per-player observed data,
  PRIOR_WEIGHT=10) and is the section engine code cites by number
  (betaMath.js:168). As of commit 5aa1419 (WS-235/SPR-142) the exploit engine's
  stat-prior pipeline is actually 3-tier: founder estimate → segmented empirical
  pool aggregate (poolBaseline.js — live/online never pooled, leave-one-out
  guard, POOL_PRIOR_MAX_PSEUDOCOUNT=200 cap) → per-villain Read. A reader
  following the §6.5 pointer never learns the pool-aggregate layer exists.
  Same doc-drift class as open FIND-012 (code source-of-truth advances,
  canonical doctrine doesn't follow). Engine-local docs (poolBaseline.js
  header, bayesianConfidence.js:36-48 provenance) are accurate — the gap is
  only at the cross-engine doctrine level.
