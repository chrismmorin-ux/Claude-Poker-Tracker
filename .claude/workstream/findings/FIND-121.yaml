title: "OnlineStakesBackfill runs an ungated sequential IDB migration on every launch, and its derived stakes are never revisited (self-sealing)"
description: |
  OnlineStakesBackfill.jsx:22-39 fires in a useEffect on every mount per resolved userId, deduped
  only in-memory (attemptedRef) — not across restarts. backfillOnlineStakes.js:57-87: one readTx
  over the full SESSIONS index, then a sequential for...of issuing two more IDB transactions per
  un-healed session (no batching, no backoff, no storage.estimate()), serializing against
  startup-critical reads until every legacy session is healed. The failure-lens addition: the
  pass PERSISTS derived stakes fields and never revisits them — if the derivation is wrong once,
  it is sealed into the corpus (self-healing = self-sealing). No lens verified the derivation
  itself; that check is part of this finding's work.
  CONTAMINATES SCORED FIGURE: Indirectly — wrong persisted stakes mis-segment the pool baselines
  the figure conditions on (WS-260 lineage).
affected_files:
  - "src/components/OnlineStakesBackfill.jsx"
  - "src/utils/persistence/backfillOnlineStakes.js"
recommended_fix: |
  Persist a completion flag; batch the writes into one transaction; add a known-answer test on
  the stakes derivation before more sessions are sealed.
