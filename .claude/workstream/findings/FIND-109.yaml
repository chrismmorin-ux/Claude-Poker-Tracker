correction_2026_08_15: |
  CORRECTION (WS-441 execution, 2026-08-15): the claim above that the scale formula
  "clamps to 1.0" on the S22 is FALSE — it conflates physical px with CSS px. The
  formula reads the CSS viewport; at the S22's assumed-DPR-2 CSS viewport (1170x540)
  the scale is min(1170*0.95/1600, 540*0.95/720, 1) = 0.695, matching the 2026-07-31
  measured evidence (docs/design/evidence/2026-07-31-tvr-device-baseline/). A declared
  44px control renders ~30.6px; the declared floor at this profile is ceil(44/0.695)=64.
  The DPR itself is still an assumption — /device-probe.html measures it on-device;
  tests/playwright/deviceProfiles.mjs is the single place the correction lands.
