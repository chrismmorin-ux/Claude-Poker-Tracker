title: "decisionRecord.mjs computes its integrity hash over whatever survived parsing and reports the result as complete"
description: |
  scripts/backtest/decisionRecord.mjs:302-306 — at close(), each JSONL line is JSON.parse'd and
  any failure is swallowed (catch { continue; }), dropping the line from both rowCount and the
  sha256 contentHash with no error surfaced. A crash/disk-full mid-write still yields a
  contentHash that presents as a complete, verified record to any downstream Result Card
  consumer (the hash's presence, not its derivation, is what callers check). The sibling
  atomStore.mjs (WS-438, c55a132c) does this correctly — distinguishes TRUNCATED from
  HASH_MISMATCH and refuses rather than silently re-deriving a clean hash over what survived.
  CONTAMINATES SCORED FIGURE: YES on the reproducibility axis — this is the sink the scored
  figure is derived from, and it cannot report its own truncation. Highest
  risk-reduction-per-effort item in the sweep (S fix).
affected_files:
  - "scripts/backtest/decisionRecord.mjs"
  - "scripts/backtest/atomStore.mjs"
recommended_fix: |
  Port atomStore.mjs's TRUNCATED/HASH_MISMATCH discipline into decisionRecord.mjs close();
  an interrupted run must refuse to validate rather than report a clean hash over a partial file.
