  - "src/components/views/TableView/CommandStrip.jsx"
  - "src/components/views/TableView/LiveAdviceBar.jsx"
recommended_fix: |
  Consume the analysis context's isComputing in CommandStrip/LiveAdviceBar and render the same
  affordance ExtensionPanel.jsx:308 already has; dim the previous recommendation until the new one
  lands.
