title: "The live TableView cannot show that a recompute is in flight — within-street advice goes silently stale (Online panel already has the affordance)"
description: |
  Scope corrected by the facilitator's verification pass (D4): the phase-1 claim "isComputing is
  dropped by its only consumer" is REFUTED in general — ExtensionPanel.jsx:67 destructures it and
  :308 renders it. What survives: CommandStrip.jsx:88 destructures advice only;
  LiveAdviceBar.jsx:177 reads liveEquity?.isComputing — the equity hook's DIFFERENT flag, not the
  game-tree compute; staleness logic (:184-187) is street-mismatch or age>60s (fade >20s), which
  cannot fire on a within-street recompute. A turn check-raise triggers a fresh compute bounded
  only by the refinement budget, during which the bar shows pre-raise advice with no badge and no
  spinner. Surface-parity defect: Online has the signal, the live table (the founder's primary
  surface) does not.
