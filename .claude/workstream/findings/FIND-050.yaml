status_note: |
  VOCABULARY NORMALISATION 2026-08-05. `problem_class` was "Estimator admissibility" —
  not one of the nine classes prog-domain-correctness.yaml declares. Original text
  preserved here; nothing else in the finding changed. The old name is the more precise
  description of the defect (an estimator whose null fire rate is ~50-85%) and is worth
  keeping in view for that reason.

  Mapped to "Bayesian confidence representation" on the detection recipe, which is the
  tie-breaker that actually reaches these files: that class says "Audit
  bayesianConfidence.js + downstream consumers", and bucketQueryUtils.js:114 —
  `bayesianSampleConfidence(vpips.length * 5)`, the confidence argument that counts
  POSITION CATEGORIES rather than hands — is exactly such a consumer. The class also
  carries the doctrine both halves break: "Sample-size confidence must propagate as
  credible intervals, not point estimates" (and the program's anti-invariant "No
  frequentist statistical method ... in inference paths").

  Runner-up "Range estimation correctness", whose example "z-test on small-sample VPIP —
  should be Bayesian credible interval" matches the position-awareness half almost word
  for word, and whose detection recipe points at rangeEngine/traitDetector.js — the
  correct estimator this finding's fix defers to. It lost because its detection scope is
  `src/utils/rangeEngine/*` and every defective file here is under exploitEngine/.
