status_note: |
  VOCABULARY NORMALISATION 2026-08-05. `problem_class` was "Provenance / premise
  integrity" — not one of the nine classes prog-domain-correctness.yaml declares.
  Original text preserved here; nothing else in the finding changed.

  Mapped to "Anti-pattern enforcement" — "Anti-patterns enumerated in
  src/utils/exploitEngine/CLAUDE.md and src/utils/rangeEngine/CLAUDE.md must not appear
  in committed code". The finding's own theory_citation is one of those enumerated rules
  (exploitEngine/CLAUDE.md:238, inside the anti-patterns section: "when a comment states
  a fact the code could assert instead, assert it"), and a comment asserting a false fact
  about which surface the hook serves — which then justified a shipped fix and a
  roundtable recommendation — is that anti-pattern in committed code.

  Runner-up "Theory-spec drift", the other doc-vs-code class. It lost because that class
  is specifically about POKER_THEORY.md as canonical doctrine (cf. FIND-052, filed there
  for exactly that reason); FIND-054 involves no doctrine document, only a file
  contradicting itself thirty lines apart.
