# ============================================================================
verdict: >
  NOT-CLEAN. The blind-spot question this protocol exists to ask was answered, and the answer is
  structural: THIS PROGRAM HAS VERIFIED CORRECTNESS AND HAS NEVER VERIFIED REACHABILITY. The
  2026-06-20 run certified multiway, SPR, blockers and equity realization as "verified not gaps".
  All four are correct. All four are unreachable from the founder's live surface. Roughly fifteen
  instances of the same shape were found across six lenses.

  A second, sharper finding came from the cross-critic: the convergent headline was PARTLY
  INHERITED, not discovered — it was already recorded at file:line resolution seven weeks earlier in
  `memory/project_allin_side_pots.md:19`, which every session loads at start. What was genuinely
  found rather than recalled: the per-file defects listed under `confirmed_findings` below.

  THE PROGRAM'S OWN INSTRUMENT IS BROKEN. Nine of thirteen paths named in
  `prog-domain-correctness.yaml` scope patterns and detection recipes MATCH ZERO FILES. A literal
  execution of this program's detection recipes reads clean because it greps paths that do not
  exist. `src/hooks/**` and `src/components/**` are outside scope entirely — so the file containing
  the single most consequential poker-logic line in the repo is one the program is configured never
  to look at.

