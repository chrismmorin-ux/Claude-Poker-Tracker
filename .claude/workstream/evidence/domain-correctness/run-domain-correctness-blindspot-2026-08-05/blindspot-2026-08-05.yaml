    session at start. Six lenses were HANDED it, not independently converging on it. Three tells:
    (1) cto-agent reproduced the memory's structure but got the MECHANISM wrong, attributing the
    absence to useLiveEquity's import list rather than to liveHandState being extension-fed — the
    signature of recall-then-reconstruct rather than reading; (2) no lens noticed the engine DOES
    reach a live surface (the Ignition side panel renders topRec) because the memory frames it as
    'online-only', which reads as 'not the founder' rather than 'a different founder surface that
    already works'; (3) five of six inherited the memory's SCOPE, auditing src/utils and
    src/components while `ignition-poker-tracker/` — which the memory does not discuss — went
    unopened by all six.
  partial_rebuttal: >
