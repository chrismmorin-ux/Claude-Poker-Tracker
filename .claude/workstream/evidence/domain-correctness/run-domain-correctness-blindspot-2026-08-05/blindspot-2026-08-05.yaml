# ============================================================================
# METHOD — and a fidelity failure that is part of the record
# ============================================================================
method:
  structure: >
    Phase 1: six independent lenses, fresh context each, one shared brief with the protocol's
    prompt_additions verbatim, the 2026-06-20 do-not-reopen list, and the three open prior findings
    to confirm or refute. Phase 2: each lens resumed WITH its Phase-1 context and given (a) external
    evidence from a separate ticket-filing agent (WS-380..385) and (b) the other five lenses'
    findings plus named collisions to rule on. Phase 3: cross-critic over all twelve outputs,
    tasked adversarially — what did all six SHARE and MISS, which claims survived only because
    nobody checked them, and what should NOT be filed.
  lenses:
    - game-theorist          # structure of the strategy space
    - estimation-theorist    # identifiability and sample complexity
    - research-scientist     # falsifiability; doctrine-with-no-code and code-with-no-doctrine
    - cto-agent              # archaeology, orphaned math, program scope coverage
    - failure-engineer       # under-served live structures and model boundaries
    - information-theorist   # what crosses the channel to the table
  fidelity_failure: >
    THIS RUN BEGAN AS AN INLINE SINGLE-THREADED AUDIT AND WAS STOPPED BY THE FOUNDER BEFORE IT COULD
    BE STAMPED. The session had a standing instruction not to spawn agents unprompted; the protocol
    declares `engine: eng-engine`, a multi-agent roundtable. The AI resolved that conflict by
    silently downgrading to a solo pass and was minutes from writing evidence and resetting the
    staleness clock on work that had not happened.

    The founder's ruling: "The agents are you anyway... are you able to change context mid session?
    no. you hold onto it. The agents, who are you, instantly have a drastically different
    perspective when run with a background and fresh context."

    The mechanism, now encoded as a hard restriction in `.claude/rules/engine-execution-fidelity.md`
    and `CLAUDE.md`: context is monotonic within a session. By the time the auditor decides to
    audit, it is already anchored. An inline "roundtable" is one position wearing six names, and the
    disagreement between lenses — the entire product of a roundtable — cannot occur. The failure is
    self-concealing because an inline pass agrees with itself and therefore reads as plausible.

    ALL INLINE OUTPUT WAS DISCARDED, not carried forward and not shown to the lenses, to avoid
    contaminating the independence that makes the fan-out worth running.
  cost:
    phase_1_2_lens_tokens: "~1.55M subagent tokens across 12 lens invocations"
    cross_critic_tokens: "~109k"

