# Phase 0b-ii-B model-level rules — architect counterfactual pass, run-sweep-2026-07-22
rules:
  - name: "Villain model is a continuously-updating belief state, not a fixed label"
    statement: "This system's model of a villain is correct iff it represents a continuously-updating posterior belief per opponent, where Y is independently verifiable by confirming that a villain's displayed profile/exploit read changes measurably after each new hand involving that villain, rather than remaining a static classification assigned once and reused for the rest of the session."
    category: "Villain decision model fidelity"
    source_evidence:
      - file: "system/intention.md"
        lines: "Imagined Outcome"
        note: "'Deliver the most accurate predictive poker decisions in the moment new data arrives' implies the villain model must actually move when new data arrives, not just accumulate it inertly."
      - file: "counterfactual"
        lines: null
        note: "If the villain model were a fixed label rather than an updating belief state, the user would experience the tool giving the same exploit read on a villain across an entire session even after that villain visibly changed how they were playing — advice that ignores what just happened at the table."
    confidence: "Medium"
    review_notes: null
    enforcement_mechanism: proposable_invariant
    enforcement_ref: "Proposed: audit confirming per-villain model output changes within N hands of a new observed action for that villain; not currently a scripted check."
    origin: model

  - name: "Villain tendencies are non-stationary within a session — recent evidence can override stale priors"
    statement: "This system's model of 'new data arriving mid-session' is correct iff a single sufficiently informative event for a villain can measurably override an established prior for that villain even against a large accumulated sample, where Y is independently verifiable by feeding a manufactured, decisively contradicting observation into a well-established villain profile and confirming the posterior shifts by more than a negligible amount, rather than being averaged into near-invisibility."
    category: "First-principles decision modeling"
    source_evidence:
      - file: "system/intention.md"
        lines: "Imagined Outcome"
        note: "'...in the moment new data arrives' is the load-bearing clause: the model must treat within-session change as real, not just noise around a fixed long-run rate."
      - file: "counterfactual"
        lines: null
        note: "If the model treated villain tendencies as time-invariant regardless of new evidence, the user would experience the tool ignoring a villain's obvious in-session adjustment (e.g., a villain who just started 3-betting light after being caught bluffing) because the old, larger sample still dominates — the system would feel behind the table, not ahead of it."
    confidence: "Medium"
    review_notes: null
    enforcement_mechanism: proposable_invariant
    enforcement_ref: "Proposed: contradiction-injection test — inject a manufactured decisive contradicting observation into a high-sample villain profile and assert the posterior moves by more than epsilon; not currently implemented."
    origin: model

  - name: "Displayed confidence must be empirically calibrated, not merely well-formed"
    statement: "This system's model of decision confidence is correct iff its stated confidence level matches real-world accuracy at that level (predictions labeled, e.g., '80% confident' are correct roughly 80% of the time in aggregate), where Y is independently verifiable via a calibration curve built from logged prediction-vs-outcome pairs — not merely by confirming the underlying math produces a well-formed credible interval."
    category: "Bayesian confidence representation"
    source_evidence:
      - file: "system/intention.md"
        lines: "Imagined Outcome"
        note: "'Most accurate predictive poker decisions' requires that 'confidence' mean something calibrated in reality, not just an internally consistent statistical object."
      - file: "counterfactual"
        lines: null
        note: "If confidence were internally well-formed but not empirically calibrated, the user would experience being told a read is 'high confidence' and acting on it (e.g., committing a stack), only to discover over many repetitions that 'high confidence' reads are wrong far more often than the stated confidence implied — eroding trust that the confidence number means anything."
    confidence: "Medium"
    review_notes: null
    enforcement_mechanism: proposable_invariant
    enforcement_ref: "Proposed: calibration-curve check comparing stated-confidence bins to observed outcome accuracy over a rolling window of resolved predictions; not currently a scripted check."
    origin: model

  - name: "An 'exploit' must be an attributable edge, not any deviation from equilibrium"
    statement: "This system's model of an 'exploit' is correct iff a recommended exploitative deviation is directly attributable to villain-specific evidence that exceeds a defined noise floor, where Y is independently verifiable by confirming that removing the villain-specific evidence for that spot causes the recommendation to revert to the equilibrium/baseline line, rather than persisting as a labeled 'exploit' with no attributable cause."
    category: "Exploit generation soundness"
    source_evidence:
      - file: "system/intention.md"
        lines: "Imagined Outcome"
        note: "'Most accurate predictive poker decisions' implies exploit recommendations must track real edge, not merely look different from a textbook baseline."
      - file: "counterfactual"
        lines: null
        note: "If any deviation from GTO could be labeled an exploit regardless of attributable evidence, the user would experience being told to take a 'clever' exploitative line that, on reflection, has no real read behind it — and would lose money on lines that felt sophisticated but were unfounded."
    confidence: "Medium"
    review_notes: null
    enforcement_mechanism: proposable_invariant
    enforcement_ref: "Proposed: reversibility test — for any exploit-flagged recommendation, strip villain-specific evidence and confirm the recommendation reverts to the equilibrium baseline; not currently a scripted check."
    origin: model

  - name: "Live and online opponent pools are distinct reference populations, never merged"
    statement: "This system's model of a 'population baseline' is correct iff live-table and online populations are treated as two distinct reference distributions that are never merged into one pooled average, where Y is independently verifiable by confirming the two populations' aggregate stats (e.g., VPIP/PFR/3-bet frequency) form measurably different distributions, such that a pooled average would sit between two real modes rather than describing either actual population."
    category: "Range estimation correctness"
    source_evidence:
      - file: "system/intention.md"
        lines: "Imagined Outcome"
        note: "Not named directly — inferred from 'most accurate predictive poker decisions' requiring the reference population a villain is compared against to actually resemble the villain's real context (live vs. online)."
      - file: "counterfactual"
        lines: null
        note: "If live and online opponents were modeled against one pooled baseline, the user would experience the tool importing online-typical tendencies (e.g., wider 3-bet ranges) onto a live opponent it has little data on, or vice versa — producing exploit suggestions calibrated to a population the person across the table doesn't actually belong to."
    confidence: "Low"
    review_notes: "Intention.md does not mention live vs. online pools at all; this rule is my inference of an unstated precondition for 'accurate' predictions to hold across both contexts the app supports. Should be confirmed with the founder as an actual goal before treating as binding."
    enforcement_mechanism: proposable_invariant
    enforcement_ref: "Proposed: distributional-divergence check (e.g., a two-sample test) confirming live-tagged and online-tagged aggregate stats differ significantly and are never combined into a single baseline; not currently a scripted check."
    origin: model

  - name: "The study section and the live engine must express one consistent theory, not two"
    statement: "This system's model relating the study section to the live decision engine is correct iff both express a single underlying poker theory, where Y is independently verifiable by confirming that for any canonical spot taught in the study section, the live engine's recommendation in an equivalent live spot does not rest on assumptions contradicting the taught principle."
    category: "Theory-spec drift"
    source_evidence:
      - file: "system/intention.md"
        lines: "Imagined Outcome"
        note: "The outcome names two coupled deliverables — 'most accurate predictive poker decisions...paired with a complete beginner-to-pro study section' — implying the pairing must be coherent, not two independently-evolving artifacts."
      - file: "counterfactual"
        lines: null
        note: "If the study section taught one framework while the live engine's recommendations rested on a different or contradictory one, the user would experience studying a concept (e.g., 'bet sizing doesn't reliably indicate hand strength'), then seeing the live tool make an in-hand recommendation that only makes sense if sizing does indicate strength — undermining trust in both the lessons and the live advice simultaneously."
    confidence: "Medium"
    review_notes: null
    enforcement_mechanism: cross_component_reconciliation
    enforcement_ref: "Proposed periodic reconciliation between study-section content and live-engine behavior on a shared set of canonical spots, analogous in spirit to the existing theory-doc-vs-engine-constants sweep cadence; no such reconciliation currently targets study-section content specifically."
    origin: model
