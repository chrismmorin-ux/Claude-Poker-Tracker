# CHALLENGE protocol run 2026-07-22 (shares run workspace with run-sweep-2026-07-22)
# Focused adversarial pass over the post-2026-06-20 surface (WS-235 pool baseline + companions) + FIND-029 recheck + regression spot-check.
challenge:
  date: "2026-07-22"
  attack_surface: [poolBaseline, sizingTells, multiwayFoldPct, FIND-029-recheck, spot-check]
  held_up:
    - "blendPrior hierarchical update is NOT double-counting: STAT_PRIORS (bayesianConfidence.js:47-57) is a fixed-pseudocount (=10) subjective founder prior, pool aggregate is independent raw hand data; poolBaseline.js:166-174 combines them as a textbook conjugate Beta-Binomial update, and tendencyCalculations.js derivePercentages (308-361) applies the resolved prior exactly once — no stacking with raw STAT_PRIORS anywhere downstream."
    - "Cap-200 pseudocount rescaling preserves the pool MEAN exactly: poolBaseline.js:171-173 computes mu from full uncapped n, reconstructs alpha/beta from that mu against the capped total — alpha/(alpha+beta) == mu regardless of cap. Confirmed by poolBaseline.test.js:200-206."
    - "Leave-one-out exclude-key matching is sound: buildPoolIndex (poolBaseline.js:117-119) and resolveStatPriors (:199,209) both normalize playerId through the same pidKey(), and analysisPipeline.js:77 passes the identical playerId used to build the villain's own stats (:86) as excludePlayerId — no key-mismatch self-shrinkage in the wiring."
    - "multiwayFoldPct's pure conditional-independence product (gameTreeEquity.js:636-655) is theoretically correct given independently-dealt hole cards conditional on shared board/bet; card removal explicitly named as the one residual second-order approximation (:648-651)."
    - "FIND-029 raise-suppression gate is FIXED and not regressed by WS-247 (60387ef): gameTreeEquity.js:549-579 computes raiseEV unconditionally; only fold-equity-reliant raises require a reliable villain model (§5.6 evidentiary standard); value raises always recommendable. isIP→villain-position mapping at :561 correctly inverted."
    - "Regression spot-check: estimateFoldPct single-source hierarchy (foldEquityCalculator.js:255-292) still zeroes style bucket rates whenever a higher-fidelity source exists — no stacking since the 2026-06-20 challenge."
  defects:
    - title: "Online sessions never get real stake segmentation — hardcoded gameType collapses ALL Ignition play into one pool"
      severity: "high"
      file: "src/utils/persistence/sessionsStorage.js"
      lines: "422-449 (literal at 428)"
      detail: "createOnlineSession() writes gameType: 'NL Holdem' as a literal for every auto-created online session. poolBaseline.segmentKey() (poolBaseline.js:75-81) therefore produces exactly one segment ('online/nl-holdem') for all online play — $1/$2 zone and $5/$10 regular pool into a single blended, wrong-population baseline, and every online villain shrinks toward it. Contradicts poolBaseline.js:13-15 doctrine ('online and live 1/2 are DIFFERENT populations'), which only guards the online/live boundary and silently fails the within-online stake boundary."
      suggested_fix: "Capture actual stakes/table format from the Ignition wire data (blinds/table metadata exist per wire-schemas.js) into session.gameType or a stakes field segmentKey can read."
      finding_id: "FIND-037"
    - title: "sizingTells correlation is circular: correlates bet size with the engine's OWN range estimate, not the actual revealed showdown hand"
      severity: "high"
      file: "src/utils/exploitEngine/decisionAccumulator.js"
      lines: "362-369 (handShown stored), 465 (existence gate only), 501-517 (strengthOrdinal from bucket.avgSegmentation)"
      detail: "POKER_THEORY §3.5/§5.9 requires the actual hand shown at showdown. handShown is stored but NEVER read for strengthOrdinal — bucket.avgSegmentation (the model's own recency-weighted range-narrowing estimate, constant per bucket) is used instead. The Pearson r therefore measures 'do buckets with theoretically-stronger model ranges see bigger bets' — self-consistency with the engine's own prior, not an empirical showdown-verified tell. UI presents it as 'confirmed by showdowns'. WS-250 gates it display-only (no live EV feed, villainProfileBuilder.js:457-460) limiting blast radius, but the read is misleading and doctrine-violating."
      suggested_fix: "Compute strengthOrdinal from handShown evaluated against the board (pokerCore/handEvaluator.js available). Surface the MNAR selection-bias caveat (folded-out bluffs invisible) in confidence/description."
      finding_id: "FIND-038"
    - title: "Live-session stake segmentation is naive string normalization — free-text labels fragment one true segment"
      severity: "medium"
      file: "src/utils/exploitEngine/poolBaseline.js"
      lines: "75-81"
      detail: "segmentKey() only lowercases and swaps whitespace/slashes; '1/2', '$1/$2', '1/2 NL' become three distinct segments for the same game (free-text labels via GameTypesManager.jsx:19-23; fixture diversity confirms real-world variance). Safe-degradation means thin fragments just fall back to the founder estimate — no corruption, but the empirical-baseline goal is silently defeated exactly where segmentation matters."
      suggested_fix: "Canonicalize at the writer boundary (constrained stake vocabulary) or normalize in segmentKey (strip currency symbols and NL/NLH/NLHE suffixes, sort blind numbers)."
      finding_id: "FIND-039"
    - title: "activeStatPriors module-global swap unguarded (corroborates FIND-035; adds: zero test coverage of runWithStatPriors)"
      severity: "low"
      file: "src/utils/exploitEngine/statRules.js"
      lines: "35, 45-54"
      detail: "Duplicate of FIND-035 (filed this run, WS-258) — independent confirmation by the challenge pass, plus: no test file references runWithStatPriors at all."
      suggested_fix: "Covered by WS-258 (thenable guard + tests)."
      finding_id: "FIND-035 (existing)"
  verdict: "Pool-baseline math sound (conjugate blend, exact-mean cap, leave-one-out keying verified); WS-235 WIRING has two real segmentation defects (online stake collapse; live label fragmentation) and the sizingTells 'showdown-confirmed' claim is circular — never reads the shown hand."
