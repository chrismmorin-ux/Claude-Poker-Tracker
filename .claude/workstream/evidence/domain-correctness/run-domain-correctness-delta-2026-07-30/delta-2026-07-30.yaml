findings:
  - id: FIND-040
    severity: MEDIUM
    title: >
      preflopFoldResolver tier 1 keeps the hard confidence gate WS-285 removed
      everywhere else — and returns early, discarding the villain's observed
      fold counts
    file: src/utils/exploitEngine/preflopFoldResolver.js
    lines: "258-275"
    detail: >
      `if (dist.confidence >= MODEL_CONFIDENCE_THRESHOLD)` selects the model
      estimate and RETURNS, bypassing the Beta posterior at :277-301 entirely.
      Two consequences. (1) A villain just under the threshold has their model
      information discarded outright rather than shrunk — the exact
      `if (n >= K) use the specific estimate` construction that
      POKER_THEORY §11.5 generalizes from the WS-285 fix, and that §11.4 had
      already recorded against a minimum-N gate on preflop fold rates
      specifically: "a threshold label, the same anti-pattern in another
      costume." (2) When the gate DOES fire, `facedRaisePreflop` / `foldTo3Bet`
      are never read, so a villain with a thin model and 200 observed
      faced-raise hands is priced off the thin model and the 200 hands are
      thrown away. `priorWeight: 0` is returned, which reports full confidence
      for that branch.
      The same function's own comment at :288-290 states "NO hard observation
      cutoff. The Beta posterior self-weights... A threshold would reintroduce
      the label anti-pattern in another guise." That is true of tiers 2-4 and
      false of tier 1, eight lines above it.
    root_cause: >
      WS-274 (2026-07-26) lifted the pre-existing priority chain into the
      resolver verbatim, including its threshold. WS-285 (2026-07-27) then
      established shrinkage-not-thresholds and fixed queryActionDistribution's
      internals, but did not revisit its caller. Drift between two commits in
      this same window.
    fix: >
      Treat the model distribution as another level in the ladder: use its
      estimate to prime the Beta prior (strength = dist.effectiveN) and let the
      observed faced-raise counts update it, instead of early-returning. No
      cutoff. Report priorWeight honestly.

  - id: FIND-041
    severity: MEDIUM
    title: >
      The sizing-tell adjustment has two hard cliffs with divergent constants in
      two modules, and both multiply a finished estimate
    files:
      - "src/utils/exploitEngine/foldEquityCalculator.js:552-563"
      - "src/utils/exploitEngine/gameTreeDepth2.js:210-220"
    detail: >
      foldEquityCalculator gates on `|corr| > 0.3 && n >= 8`; gameTreeDepth2
      gates the same signal on `|corr| > 0.2 && n >= 5`. A villain at r=0.25
      with 6 samples gets a depth-2 adjustment and no aggregate adjustment; the
      two layers of the same evaluation disagree about whether the tell exists.
      Both are step functions on a continuous quantity — r=0.299/n=7 yields
      exactly zero, r=0.301/n=8 yields the full confidence-ramped effect. The
      aggregate site also applies its multiplier to `estimate` AFTER the
      observed-data blend, which is the "a label may shape a PRIOR, never scale a
      POSTERIOR" corollary in numeric costume.
      Note this is now a REAL signal (FIND-038 fixed in-window), which raises
      rather than lowers the value of pricing it continuously.
    fix: >
      One shared helper, one set of constants, effect scaled continuously by
      correlation magnitude x sample confidence with no entry cliff. Fold it
      into the prior for the aggregate path.

  - id: FIND-042
    severity: LOW
    title: >
      The bucket-keyed narrowing machinery AP-RL-01 forbids survives as
      test-only dead exports after WS-291
    file: src/utils/exploitEngine/postflopNarrower.js
    lines: "458-497, 510-616"
    detail: >
      `comboMultiplier` (bucket-keyed: `multipliers[bucket] ?? 0`) and
      `adaptMultipliers` have no callers anywhere in src/, scripts/, or the
      extension — only postflopNarrower.test.js. WS-291 replaced the narrowing
      path with DEFAULT_CONTINUATION_RATES + soft weights. The section header
      claims they are "kept for villainDecisionModel Dirichlet priors", but
      villainDecisionModel imports only the ACTION_MULTIPLIERS *constant*
      (:24, :597, :647) — never either function. So the header is true of the
      constant and false of the two functions beneath it, and 100 lines of
      bucket-label narrowing sit in the file the doctrine names as the
      AP-RL-01 hazard, passing tests, ready to be wired back in.
    fix: >
      Delete both functions and their tests; keep ACTION_MULTIPLIERS with a
      header naming its one real consumer.

  - id: null
    severity: LOW
    title: "gameTreeEvaluator river texture: two binary flags under a comment claiming continuity"
    file: src/utils/exploitEngine/gameTreeEvaluator.js
    lines: "456-468"
