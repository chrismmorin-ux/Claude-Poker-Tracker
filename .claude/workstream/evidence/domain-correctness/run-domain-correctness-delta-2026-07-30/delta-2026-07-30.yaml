confirmed_backlog_premise:
  - item: WS-304
    status: CONFIRMED-REAL
    detail: >
      Verified arithmetically rather than by reading the ticket. handStrengthTier
      (populationPriors.js:329-334) is an ADDITIVE rank sum:
      raw = rank1 + rank2 + 8*isPair + 2*suited, normalized by 32.
      AKo = 12+11 = 23/32 = 0.719. AKs = 25/32 = 0.781. The 3-bet chart
      threshold (:399) is 0.73 for LATE and 0.81 otherwise. So AKo is excluded
      from the 3-bet prior at EVERY position, and AKs is excluded from every
      position except LATE — leaving the EARLY/MIDDLE 3-bet prior as JJ+ only
      (JJ = 0.8125), with TT (0.75) ranked ABOVE AKs. The ticket's framing is
      right and its title understates it.
      Root cause is the additive form, not the threshold value: a sum of two
      ranks plus a pair bonus cannot express dominance, so no single cutoff on
      it will order AK correctly against middling pairs. Fixing the threshold
      alone would move the boundary and keep the wrong ordering. WS-305
      (per-bucket hand-vs-range equity) is the substrate that makes a real
      ordering available; note preflopEquityTable.js already landed in-window.
      Post-WS-302 these cells are no longer literally zero — the support floor
      lifted them — so the symptom is now a wrong SHAPE rather than an
      impossible hand, which is why it survived the WS-302 fix.

