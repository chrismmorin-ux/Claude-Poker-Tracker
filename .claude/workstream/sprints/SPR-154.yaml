id: "SPR-154"
title: "Poker-theory gap batch #1 — fix the §3.4 taxonomy hole, then build the instrument that measures the rest"
status: done
approved_at: "2026-07-26T00:00:00Z"
completed_at: "2026-07-26T19:01:38.968Z"
