  2. The real mechanism is HOLDING-CONFOUNDING. pi_pool conditions on six features,
     none of which is hand strength, so the holding confounds action and outcome.
     Conditioning on the revealed holding removes 53.2% of the bias HELD OUT
     (scripts/backtest/probe-showdown-propensity.mjs, prereg ladder/holdingConfoundPrereg.json).
     clone-the-pool exactly 0.0000 under all three propensities.
  3. BUT ACCEPT CRITERION 3 IS NOT MET. r(ESS share, edge) went -0.9432 -> -0.9835.
     The bias LEVEL halves; the ESS STRUCTURE is untouched. r(ESS, reduction%) = +0.9973 --
     the holding explains the bias in proportion to ESS, so the residual concentrates in
     low-ESS arms (those leaning on a RARE action). Criterion 1 also open: never-fold
     still +2.03 bb held out where domination guarantees negative.

