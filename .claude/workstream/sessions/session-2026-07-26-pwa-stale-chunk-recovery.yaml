handoff_notes: |
  ## What happened

  Founder tapped a seat on the Table screen and got the E401 boundary:
  "Failed to fetch dynamically imported module: .../PlayerFinderView-DyXyQHTf.js".
  Root cause was four things lining up, not one:

  1. Views are code-split with content-hashed names; the 1:43 PM deploy replaced
     `dist/` and that filename stopped existing.
  2. Workbox (`skipWaiting` + `clientsClaim`) had already activated the new
     worker and deleted the old precache — so the chunk was gone from cache AND
     from the server, with the page still running the old bundle.
  3. `firebase.json` rewrites unmatched paths to `/index.html`, so the request
     returned HTML with a 200 and the import rejected on a MIME mismatch rather
     than an honest 404.
  4. `useBuildVersion` seeded `current` from the first `/version.json` poll —
     comparing the server to itself — so the update banner was structurally
     incapable of detecting that the page was already stale. It never fired.

  Every exit was closed: "Try Again" re-throws (React.lazy caches the
  rejection), "Reload Page" is answered from the worker's own precache, and
  Force Update lives behind `SettingsView`'s lazy chunk — the same failure.

  ## Shipped (PR #3, merged 963f1ec)

  - `src/utils/chunkRecovery.js` — wraps every lazy view import; one
    `hardRefresh()` on a chunk failure, guarded per-tab in sessionStorage.
  - Both boundaries classify chunk failures as **E405** with a plain-language
    "A new version is ready" surface, rendered from the main bundle.
  - `useBuildVersion` seeds from `BUILD_SHA`; re-checks on
    visibilitychange/focus/online; `requestSwUpdate()` asks the browser for a
    newer worker (nothing did before).
  - `OnlineView` mismatch reload uses `hardRefresh()` — same defect, found by
    the sweep.
  - Health pill deep-links into Settings' Error Log (new `settingsFocus` UI
    state, mirroring `dashboardAnchorDeepLink`); its count badge loads on mount.
  - Root `ErrorBoundary` now persists to the readable error log; entries stamp
    `BUILD_SHA` instead of the frozen `'v122'` literal.
  - Pill counts only errors from the running build (founder hit this: a
    day-old error kept a red alert up through Force Update).

  ## Shipped (PR #4, merged 57ef88d)

  Closed the two gaps #3 deliberately left open:

  - `src/utils/persistenceHealth.js` + **E307** — the four persistence hooks
    still degrade-and-continue but no longer silently; `HealthIndicator` shows
    "Not saving — data at risk" at the top of its fault precedence.
  - `src/components/ui/ViewLoadingFallback.jsx` — a stalled (not failed) chunk
    now explains itself at 6s with Back to Home, adds Update App at 18s, and
    never auto-clears caches.

  ## Verified in production

  Deploy 57ef88d completed 2026-07-27 15:34 UTC, "Verify deployment" step
  passed. Founder confirmed the phone reached 57ef88d **with no manual Force
  Update** — the first real-world proof the auto-update path works end to end.

