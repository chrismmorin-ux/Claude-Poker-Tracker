  HOW THIS STARTED. A plain question — "walk me through the 3-bet range vs a CO
  open from the button." The answer I gave was sourced from the WRONG LAYER:
  `archetypeRanges.js` is drill content, imported only by PostflopDrillsView, and
  its own header says it is "not consumed by the exploit/range engines." The live
  engine has no concept of a 3-bet range at all. The founder then asked for a
  provenance audit separating engine-sourced claims from LLM-sourced ones, which
  became the real work.

  ITEMS COMPLETED
  - P-1a (d4339a5): `parseRangeString` silently dropped every dash span. 22 such
    tokens in archetypeRanges.js alone; BB_vs_BTN was missing 244 combos (every
    pocket pair below QQ, every weak suited ace, EVERY offsuit ace). Unrecognized
    tokens now throw; weight handling stays lenient (pinned by existing tests).
  - P-1b (1be6d9d): PREFLOP_RAISE_SIZES carries two unit conventions with nothing
    saying so. The iso branch read bb multiples; the open branch read the same
    table as POT multiples, so a constant labelled "2.5bb EP open" produced 3.75bb.
    Added `resolveBigBlind` as the single choke point S1 will fill.

  ITEMS REMAINING — none claimed, none in progress. No active sprint.

  KEY FINDINGS (each measured, not inferred)
  1. `spr` is NEVER passed on the preflop path — zero occurrences in
     preflopAdvisor.js. Every preflop EV silently assumes SPR_ZONES.HIGH.
  2. `getSPRZone` buckets everything >=13 as DEEP, so 100bb and 200bb produce
     BYTE-IDENTICAL ranges. Blocks the founder's 3-stack-depth requirement; the
     fix is continuous interpolation (precedent already in gameTreeConstants.js).
  3. Preflop blockers CANCEL BY CONSTRUCTION. foldThroughPerCombo calibrates
     against a hero-dead deck, so AKs and 32o give the same fold-through
     (measured delta 1.8e-4 at 3 seats). The engine cannot tell A5s from 65s as a
     bluff — the one comparison bluff selection exists to make.
  4. 4-bet frequency was NEVER MINED despite a 13.4M/20.6M-hand corpus. The six
     extracted stats have no `fourBet`/`foldTo4Bet`. WS-270's P1 is
     consequence-argued (soundly — see its "WHY THIS OUTRANKS ITS FREQUENCY"
     section) but NOT frequency-derived, and `priority_score: 16.0` has no
     computing formula anywhere in .claude/.
  5. `.claude/projects/gut-range.md` was chartered 2026-07-29 and never started.
     The plan EXECUTES it rather than duplicating it. Its measured defect
     analysis (grids vs scalars off by up to 12x; scenario sums of 0.777 and
