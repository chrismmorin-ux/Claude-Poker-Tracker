        target alone returns ~296 again after 4-5h — the "shortfall a third time" outcome
        the ticket's own pre-registered falsifier forbids.
    (2) THE k=308 BASELINE IS FTP-ONLY. Sorted discovery returns FTP 525 then PS 1231; the
        first PS file is at index 525, so ANY --max-files <= 525 is 100% FTP. Confirmed in
        the artifact: out/hero-ev-c3-20260816.json has 4,640 `FTP:` and ZERO `PS:`.
    This FALSIFIES two load-bearing sentences in WS-504 ("did NOT corrupt anything measured
    so far" and "WS-503 is pinned with --sites FTP,PS to sidestep it") — both corrected
    in-ticket. A site filter is upstream of a sorted prefix and cannot correct it; no value
    of --max-files yields a two-site sample. WS-503 is now blocked_by:[WS-504].

