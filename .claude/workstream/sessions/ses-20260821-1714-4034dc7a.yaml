  FOUR DEFECTS, ONE SYMPTOM CLASS — the panel could not tell the truth about
  whether it was working. All four fixed, 4 commits on
  `worktree-sidebar-table-identity` (02976d97, 6cef6fc5, e5912a45, 76956d54).

  1. Table identity was the WebSocket connId — a monotonic per-socket counter.
     Every routine Ignition socket cycle read as a table switch and wiped
     advice, live context, seat stats, villain reads. Now keyed on the stable
     game-WS URL (`tableKey`).
  2. The reconnect-stitch was DEAD on the real lifecycle: it required the old
     table to still be in `tables`, which the close handler had already
     deleted. A close now opens a 15s grace window; reconnect migrates the
     machine intact (CO_TABLE_INFO rehydrates the live hand).
  3. The HUD shell gated on `hasTableHands` ("a hand finished and was stored"),
     so it rendered "No active table detected" over a live hand for the whole
     first hand at any table. Now gates on table presence. Seat arc had the
     same defect.
  4. WS-516: the silence alarm was INVERTED — it could only fire for a capture
     that never started, and was structurally blind to one that died
     mid-session. Now recency-based, decision extracted to a pure module.

  Plus WS-517 (a dead capture was pixel-identical to a live one on the status
  bar) and WS-515 (a full journal returned `success: true` and lost the hand).

