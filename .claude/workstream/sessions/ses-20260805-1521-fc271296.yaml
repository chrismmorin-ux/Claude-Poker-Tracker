handoff_notes: |
  Started as /next. The sprint gate was blocked on a 46-day-stale
  domain-correctness blind_spot protocol. That protocol was nearly run inline as
  a single-threaded audit where it declares engine: eng-engine — the founder
  stopped it, and that correction reshaped the whole session.

  WHAT SHIPPED (6 commits, c51fddf3..1be3f926; 3654 tests pass, build clean,
  reconcile 0 violations)

  Engine. The fold estimate read a curve on the wrong AXIS ((R-B)/(P+2B) fitted,
  inc/(P+B) fed — 39% overstated at the steepest point), fitted for the wrong
  ACTION (bet curve used facing a raise; raise curve now fitted, hold-out Brier
  0.22007 -> 0.21754), from an ANCHOR that counted sizing twice. Continue
  probability was truncated at 0.80 against a pool-implied 0.986, and lifting it
  exposed a latent INVERSION in shiftFoldMass where a stickier villain came out
  calling LESS. Depth-2/3 sampling seeded (boardDerivedRng was module-private,
  which is why it stayed unseeded through WS-355) — two identical runs now give
  an identical edge.
  Facing aggression: 92.2% raise -> 82.3%, ESS 26.0% -> 29.9%, pool 15.2%.
  Price sensitivity restored (48/48 raises at every price -> 43/48 falling
  monotonically). The gap closes ~7%; what remains is not this constant.

  Measurement. The hole map prices branches the pool does NOT take — required
  vs predicted fold, gap in bb, occurrence rate, bb/hour, with nGap and nRate
  carried separately and a disjointness guard that refuses to sum alternatives.
  Freshness re-stamps on READ, keyed to engine commits not age. A decision-record
  sidecar persists per-combo candidate lists so questions can be asked later
  without re-running. And strategyCard.js — ADR-009's Declared surface — turned
  out complete except for a caller: evaluateCard had none in scripts/backtest/.
  Bridge built, prototype runs end to end.

  Governance. Two hard rules enforced by hooks rather than by having been read:
  engine-execution-fidelity and improvement-default. DEC-037..040 recorded.

  KEY FINDINGS
  - The program verified CORRECTNESS and never REACHABILITY. Four things the
    2026-06-20 run certified as "not gaps" are correct AND unreachable from the
    live surface. ~15 instances of the shape.
  - FIND-046: nine of thirteen paths in this program's own scope patterns match
    ZERO files; src/hooks and src/components are out of scope entirely, so the
    file with the most consequential poker-logic line is one it never looks at.
  - The live decision rule is three literals violating S3.4.3 and S6.3.
  - The learned range channel is algebraically inert — one scalar per
    (position, action) scaling all 169 cells, divided out at the point of use.
    So "live data will adjust it" is currently false for a CODE reason.
  - The 20 bb/hr anchor is REAL (Goone at $5/$5 Hustler; persuadeo 18.8 at
    $1/$3) and unfit as a scale test. Rake-adjusted onto Vegas $1/$3 it is
    12.3-14.6, which an independent bias correction brackets at 10-16.
  - No published live standard deviation exists anywhere; the apparent consensus
    is one author replicated across five sites.
  - The roundtable's convergence was PARTLY INHERITED from a memory file loaded
    at session start — caught by the cross-critic.

  NEXT SESSION SHOULD DO THIS FIRST
  Read .claude/projects/context-shift-implementation.md and the judge's
  synthesis at docs/context-system-comparison.md. The context rebuild is
  deliberately handed to a FRESH session — this one carries the maximum drag the
  shift exists to remove. Do not import this session's narrative; the handoff
  states facts with their evidence, and that is all that should cross.

  Then, in order: WS-402 (over-raising, still 82.3% vs pool 15.2% — the binding
  constraint on every measurement at ESS ~30%), WS-403 (stage scheduler starves
  the flop at every budget), WS-404 (per-stage ablation flags — no
  per-capability EV number is possible without it), WS-411 (wall clock).

  Then the baseline EV run: docs/runbooks/baseline-ev-run.md, ~4 hours. It has
  never completed at >=30 clusters, which is the only thing standing between the
  founder and the figure he asked for.

  DO NOT RE-DERIVE (tested and settled this session)
  - Depth-1 does NOT overfold — it under-folds by ~49 points.
  - Depth-1 does NOT lack check-raise; the candidate set is identical in both
    arms. WS-314 is already fixed at HEAD — close it.
  - The represented range is NOT the dominant residual; its 27-48 point swing
