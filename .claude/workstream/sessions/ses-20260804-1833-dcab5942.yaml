handoff_notes: |
  Ad-hoc founder bug report, no queue item: "some screens in the app are too full
  but dont scroll", later narrowed by the founder to "drills found through the self
  coach".

  THE SCREEN THE FOUNDER HIT was LessonDetailView — Self Coach -> Curriculum tab ->
  "Drill" on a concept row (CurriculumTab.jsx:63 openLessonDetail) -> SCREEN.LESSON_DETAIL.
  It had NO scroll container at all. Measured live: the "pot odds" lesson is 1120px
  tall in a 640px viewport, so 480px — about 43% of the lesson — was unreachable.

  ROOT CAUSE is one bug class, not five bugs. index.css pins html/body/#root to
  height:100dvh; overflow:hidden, so the page itself cannot scroll. Any view that
  fails to bound its own height AND scroll internally has its overflow silently
  clipped — no scrollbar, no signal. docs/design/audits/2026-06-19-responsive-layout-audit.md
  catalogued this class and introduced <FluidView>; it kept drifting back because
  nothing enforced it.

  Items completed: none from the queue (ad-hoc work).

  Fixes (5 views):
    - LessonDetailView.jsx          -> wrapped in <FluidView>          [founder's screen]
    - OnlineView.jsx                -> bounded to LAYOUT canvas + overflow-y-auto
    - PreflopDrillsView.jsx         -> mode content overflow-hidden -> overflow-y-auto
    - PostflopDrillsView.jsx        -> same
    - OnlineView/ExtensionPanel.jsx -> h-screen -> h-dvh

  THE GUARD IS THE REAL DELIVERABLE: src/test/viewScrollContainers.test.js
  (INV-VIEW-SCROLL, 51 assertions). Derives its view list from viewRegistry.jsx, so
  a newly registered view is covered automatically and cannot opt out by being new.
  Two exemptions, each with a written reason; the PresessionDrillView one is
  self-verifying (asserts all five mode children still scroll). See DEC-034/035.

  Key findings:
    - The guard found a defect I had NOT found by inspection: ExtensionPanel used
      h-screen (100vh = the LARGE mobile viewport), overshooting the 100dvh lock.
      That fix exists only because the test caught it.
    - Two traps while writing the guard, both fixed and worth remembering: (a) naive
      source scanning flagged the very files that DOCUMENT their own fix in comments
      ("was minHeight:100dvh -> clipped") — comments must be stripped before matching;
      (b) barrel index.js re-exports hide the real component — must be followed.
    - CalibrationDashboardView has the same minHeight:100dvh defect but is registered
      `deferred: true`, so it is unreachable. It will become a real bug the moment
      someone gives it a `component`. Not ticketed.

  Deliberately NOT done (out of scope, pre-existing):
    - NavShell "Home" pill overlaps the lesson title at top-left — visible in the
      Playwright capture. This is cross-cutting defect #6 in the 2026-06-19 audit.
      Unticketed. Worth a small item if the founder finds it annoying.
    - The audit's other open Phase-2/3 items (sub-44px modal touch targets,
      keyboard-unaware modals, orientation-lock portrait fallback) remain open.
    - Login/Signup/PasswordReset use FluidView but are still registered without
      orientation:'portrait' — a registry inconsistency left from the audit's
      Phase 2. Harmless today; would matter if orientation policy is tightened.

