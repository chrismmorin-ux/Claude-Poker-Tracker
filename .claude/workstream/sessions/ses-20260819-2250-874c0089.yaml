handoff_notes: |
  CONDUCT CARD INSTRUMENT SESSION. Founder asked for a retrospective artifact on the Conduct
  Card plus recommendations, and dispatched agents to deep-dive it. The dispatch found six LIVE
  defects instead — two of them on dossiers published earlier the same day — so the artifact was
  deferred by founder direction ("delay delivery until we are confident and have done a few
  passes of improve") and the session became instrument work.

  THE ARTIFACT IS STILL OWED. It was explicitly deferred, not cancelled. Everything it needs is
  in the four lens reports and the pilot, summarised below and in the commits.

  SIX DEFECTS, all verified by known-answer test before acceptance:
    1. contentHash bound 0.91% of the card (replacer-allowlist misuse). Sabotaging every nested
       value and flipping all 23 gates to FAILED left the digest unchanged. FIXED + check.
    2. Separator test declared a ZERO-INFORMATION feature significant (no expected-cell-count
       guard; G degenerates to 2nH on near-continuous columns). Took THREE rounds to fix —
       guard, then banding + collapse + exact permutation, then the banding branch turned out to
       be dead code because feature values are label strings and Number() was NaN. FIXED + check.
    3. `air` negative on 1,249/2,085 postflop rows; published as "Air -27.7%". FIXED.
    4. `strength.draw` NaN on every row (summed a Map); published as "0.0%". FIXED.
    5. `my_bet_x_pot` median exactly 350 (= 3.5/0.01, the clamp). FIXED.
    6. `residual` named a 330-decision c-bet rule as the enclosure clause. FIXED by deletion —
       the round-trip gate now PROVES the partition, so no fallback needs naming.

  BOTH of villain 2's `hidden-cond` verdicts were artifacts of defect 2. The card now reports
  none. Villain 1's survives on three BINARY features at p=4.8e-5 and is real.

  THE CARD IS NOW A POLICY. Rules carry an evaluable `predicate`; two round-trip gates prove the
  card reproduces itself (0 overlaps, 0 off-support, 0 count disagreements over 3,386 and 9,442
  decisions). `scoreHeldOut.mjs` gives the first falsifiable quality figure this artifact has
  ever had — pre-registered falsifier MET on both subjects (+0.0726 / +0.1220 bits/decision over
  a legality control, hand-split walk-forward). Every prior accuracy figure was resubstitution.

  THE FINDING THAT MATTERS MOST FOR DIRECTION: the lift is CONCENTRATED. Top 3 rules carry
  68%/64% of the card's total advantage; best single rule 0.810/0.865 bits against averages of
  0.073/0.122. And 9 of villain 1's 19 rules do WORSE than the legality control — fitted noise,
  currently unmarked on the card. Marking per-rule held-out lift is the obvious next pass.

