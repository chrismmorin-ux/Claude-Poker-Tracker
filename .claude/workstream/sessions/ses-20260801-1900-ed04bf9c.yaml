  =====================================================================
  PASS 1 — TWO DEFECTS, NOT OF EQUAL WEIGHT
  =====================================================================
  1. REAL, ON A LIVE PATH. getMinRaise had ZERO tests despite feeding the
     sizing UI (CommandStrip.jsx:504) and the recorder (recordSeatAction.js:178).
     It advanced the ladder off an INCOMPLETE all-in and offered an ILLEGAL size:
         flop bet 10, shove to 14  -> returned 18, legal 24
         preflop open 6, shove to 9 -> returned 12, legal 13
     Root cause was clean: recordSeatAction ALREADY implements the
     incomplete-raise rule and stamps reopensAction:false correctly. getMinRaise
     simply had no concept of it, so the ladder computed AFTER one was wrong.
     Fixed by tracking the last FULL increment. INV-POT-INCOMPLETE-RAISE-LADDER,
     21 tests, DEC-029.

     NOTE ON MY OWN ERROR: my first probe wrote the preflop legal answer as 14.
     It is 13 (last full increment is 4, the open over the bb). Caught before it
     became a test. If you re-derive these, derive them; do not copy mine.

  2. UNREACHABLE, ROBUSTNESS ONLY. 300 randomized side-pot structures x 6
     properties found silent non-conservation — 166 of 338 chips stranded when
     EVERY large contributor folded. DO NOT REPORT THIS AS A MONEY BUG. Forcing
     the last big contributor out needs a live player with chips behind, who
     would then be eligible, so legal play cannot reach it. Guarded anyway
     because the failure was SILENT. Generator then constrained to reachable
     states — asserting a property over a fiction is worse than not testing it.
     DEC-030.

  =====================================================================
  PASS 2 — POSTFLOP EQUITY GROUND TRUTH (the interesting one)
  =====================================================================
  The prior check compared evaluate7 against bestFiveFromSeven over 10,000
  hands. Both are OURS. It could never have caught a bug IN bestFiveFromSeven —
  the shared dependency both sides rest on. That is a general failure mode of
  self-referential suites: coverage rises, actual risk untouched. DEC-031.

  Replaced with three kinds of evidence that are not our own code agreeing
  with itself:
    - 6 ANALYTIC FIXTURES where the expected equity is arithmetic derived by
      hand-counting outs over a known denominator (12/44, 42/44, 0, 0.5, 1, and
      a flop drawing-dead case over C(45,2)=990 runouts). EACH DERIVATION IS
      WRITTEN INTO THE TEST so it can be re-checked rather than trusted.
    - 2 ANALYTIC INVARIANTS true of any correct equity function regardless of
      how hands are ranked: complementarity (hero + villain === 1) over 120
      random spots, and suit isomorphism (relabel all 4 suits -> IDENTICAL
      equity) over 90 spots x 4 permutations. The suit one tests suit handling
      with no reference to any ranker at all. INV-EQUITY-ANALYTIC.
    - An INDEPENDENT FROM-SCRATCH NAIVE EVALUATOR (enumerate all C(7,5) subsets,
      plain rank/suit counting, no bit tricks, no lookup tables, no shared
      imports) agreeing with production on the WINNER across 20,000 random
      board-sharing matchups + 8 constructed category boundaries.

  EVERYTHING IN PASS 2 PASSED ON THE FIRST RUN. NO DEFECTS FOUND. That is
  confirmation, not discovery. Do not let it get retold as "fixed the equity
  engine" — nothing was wrong with it.

