  ** THE FINDING THAT OUTRANKS EVERYTHING ELSE HERE **
  The HandHQ corpus is NOT a 9-handed corpus. Each hand carries a `seats` list; sampled:
    FTP  HU 2,500 · 6-max ~3,446 · 9-max ~900+
    PS   HU 9,914 · 6-max ~4,093 · 9-max ~300
  PS is ~2/3 actual HEADS-UP TABLES — a different game, not a heads-up POT at a full table.
  This app targets 9-handed play. Every measurement in POKER_THEORY §11.7 / §11.8 / §11.9 was
  pooled across table sizes without stratifying, so those magnitudes describe a blend matching
  no real game — INCLUDING the engine change they justified (ACTION_TAU_FRACTION.check = 1.0).
  A caveat block is now at the head of §11.7 saying so. Directionally the findings may survive;
  DO NOT quote a magnitude from those sections as a 9-handed number until a stratified re-run
