handoff_notes: |
  THE VILLAIN CONDUCT CARD SESSION. Started as "evaluate villain 1 and make a visual", became
  a new Standard-of-Record record form plus its first two consumers. Three independent
  adversarial passes ran against each artefact and each pass found defects the other two missed.

  WHAT SHIPPED AND IS GREEN
    - Conduct Card: the record form a `Read` surface never had, while `Declared` surfaces have
      had the Strategy Card since WS-322. src/utils/standardOfRecord/conductCard.js, schema v2,
      24 tests, additive check green (28 objects / 386 fields), 631 SoR tests pass.
    - VOCABULARY.md registers: Conduct Card, the second-argument rule, Mix, Mix verdict,
      separatorSearch, the conduct occupancy bound, and the code-`Read`-means-Conduct collision.
    - The mix rule shape (founder's idea, measured): villain 1 went 34 rules -> 13, coverage
      unchanged at 100%, accuracy 83.0% -> 84.4%, median interval 20pp -> 12pp.
    - Card CC-SO0OmHLLvkJp emitted, content-hashed, with v2 provenance:
      PokerStars, 2009-07-01..2009-07-23, 50NLH, short-handed ONLY (6-max 982 / 5h 438 / 4h 96,
      nine-handed ZERO).
    - populationBaseline.mjs - the field measured on the same instrument, which is what a
      comparison needs and what the first version of the dossier did not have.

  FIVE INSTRUMENT BUGS FOUND AND FIXED, each now gated
    iBetThisStreet read the CURRENT street aggressor, so it flipped false the moment someone
      raised over him - all 39 "raise over my bet" rows claimed he never bet.
    off_button counted seats from the button INCLUDING blinds, so one value meant EP at
      six-handed and the small blind at four. It was pooling seats that play nothing alike.
    can_raise did not exist, so mixes counted forced continuations as choices.
    Board texture disagreed with the draw flags on some rows.
    EP was one undifferentiated label; now UTG/UTG1/UTG2/MP (founder: "SB, BB and UTG are
      drastically different").

  THE HEADLINE CORRECTION, AND THE METHOD LESSON IN IT
    The dossier's flagship claim - "he is choosing hands, not seats", elasticity 2.16x vs a
    chart's 5.03x - was WRONG. The reference chart is labelled "9-max 100bb cash" in
    rangeMatrix.js:272 and he never played a nine-handed hand. Measured against the field he
    actually sat in, his elasticity is the 58th percentile: the most ordinary number on the page.
    Withdrawn, along with "sizing is arithmetic" and the c-bet claim (that one failed twice
    over - a collider AND an inverted inference).

    The structural fix was the founder's: comparisons are a DIFFERENT OBJECT from the
    description. The Conduct Card now contains zero comparisons; the population baseline lives
    in a separate Appraisal section. That is the second-argument rule, which the artefact
    violated after the register defined it.

  THE EXPLOIT CARD IS NOT PUBLISHABLE AND WHY
    Built and adversarially tested; three conclusion-changing defects, all verified locally:
      1. Field fold rates were pooled over ALL raise sizes and applied to a 2bb open. The field
         BB folds 57.4% to 2bb and 79.5% to 4bb. Size-matched, the sizing ranking INVERTS (3bb
         beats 2bb), the field control flips sign (+0.576 -> -0.498), and "most of the edge is
         the game, not the man" is BACKWARDS - at 2bb it is overwhelmingly the man. -> WS-548
      2. It prices only the fold branch, so dEV/drisk = -(1-P) < 0 always: it can ONLY ever
         recommend the minimum size, for a 60% folder and a 99% folder alike. -> WS-549
      3. The interval multiplied per-seat Wilson bounds, which is a worst-case envelope with
         ~99.9% coverage, not 95%. FIXED IN MODULE (seeded Jeffreys-Beta posterior on the
         product, validated against the textbook mean 0.8802 vs 0.8801).

    I WAS WRONG TWICE IN OPPOSITE DIRECTIONS on the same question: first claiming a
    subject-specific edge on bad intervals, then "correcting" to it-is-everyone on the interval
    fix. Both wrong. The conditioning error is ~5x the interval error and pushes the other way,
    so fixing the statistics while leaving the conditioning wrong moved the conclusion further
    from the truth, confidently. That is the lesson worth carrying.

