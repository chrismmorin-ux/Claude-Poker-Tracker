decision_flags:
  - |
    OPEN — WHAT SHAPE THE EXPORTED RECORD TAKES. Two answers, and they are not the same ticket.
    (a) A raw dump of the journal's hand records: smallest change, unblocks the founder's backup
    problem immediately, and is enough to prove hands come out. (b) A shape a node harness can
    score against a versioned Deal Book under ADR-009 — which needs an adapter from an app hand
    record to a mined (k,n) cell, plus a content hash and a manifest. WS-353's blocker asks for
    (b); the founder-facing data-loss half only needs (a). Doing (a) now and (b) as a
    strategy-of-record ticket is the recommended split, but it should be a stated decision
    rather than a default, because shipping (a) alone leaves the register entry blocked.
  - |
    OPEN — WHETHER THE JOURNAL CAP IS THE RIGHT ONE FOR AN ARCHIVE. `MAX_JOURNAL = 5000` was
    sized for a delivery-recovery mirror (WS-358), where 5000 un-synced hands is already a
    pathological backlog. If the journal is now also the export source, it is doing a second job
    — archive — for which oldest-first eviction at 5000 is a silent data ceiling. Either raise
    it, or state clearly that the export is a recovery snapshot and not a history.
