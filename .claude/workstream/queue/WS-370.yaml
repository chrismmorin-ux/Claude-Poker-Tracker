status_note: |
  Filed 2026-08-05 out of WS-353's closeout, alongside the clearing of WS-352's identity
  blocker. Premises re-verified against HEAD before filing rather than taken from the commit
  message, and one correction resulted: WS-353 describes the export as dumping "the volatile
  capture buffer", but at HEAD there is no buffer to dump — `service-worker.js:467-471` is an
  unconditional `sendResponse({ hands: [] })` stub, and the adjacent `CLEAR_CAPTURED_HANDS`
  handler at `:473-479` says outright that "the staging buffer no longer exists". The observable
  outcome WS-353 recorded is exactly right; the mechanism is one step deader than described.

  Verified: `popup/popup.js:152-166` (exportHands), `:60` (the hands log on the same message),
  `background/service-worker.js:467-471` (the stub), `:512-527` (GET_QUEUED_HANDS / DEQUEUE_HANDS,
  the live path), `shared/storage-writer.js:35-92` (the WS-358 durable journal), `:59`
  (MAX_JOURNAL = 5000), `:261-268` (getQueuedHands reads session storage),
  `shared/constants.js:15-16` (both legacy message types still exported).
  Artefact on disk: `C:\Users\chris\Downloads\ignition-hands-1781851220916.json`, 2 bytes, `[]`,
  2026-06-19 — the only file the button has ever produced.

  SCOPE — WHAT THIS TICKET IS NOT. It is not the app-side export. WS-352's second blocker on
  FAULT-population-mismatch ("SRC-014 IS UNREACHABLE BY THE HARNESS") is about the founder's
  LIVE hands in the app's browser IndexedDB, a different store, a different population, and a
  different fault entry. The two are easy to conflate because both end in "no file the harness
  can read"; they share no code. That blocker remains open and is unaffected by this ticket.

  PROGRAM CHOICE. `data-provenance` rather than `engineering`, because the reason this is P1 is
  not that a button is broken — it is that a registered source (SRC-005, the Ignition capture
  stream, named in the program's own contract) produces no evidence any downstream claim can
  rest on. The program's Source Registration problem class covers exactly this. The extension
  files sit in `engineering`'s scope paths; flag it there if the split matters at composition.
