description: |
  FILED 2026-08-04 while closing WS-334, which made depth-2/3 reachable on the live path for
  the first time. The subsystem is correct-looking, tested, and — until this week — had never
  executed on a real evaluation. Turning it on changes advice, and two of those changes look
  wrong.

  THE MEASUREMENT. `dumpGameTreeEV.mjs` now takes `WS334_REFINEMENT_MS`, so the same eight
  scenarios can be dumped at depth-1 and at full depth and differenced per decision (the
  WS-285 rule — an arm scored on its own decision set is measuring the decisions).

  | action | mean EV change, depth-2 vs depth-1 | n |
  |---|---|---|
  | call  | **+26.7%** | 5 |
  | raise | **+18.0%** | 5 |
  | bet   | +0.9%      | 3 |
  | fold  |  0.0%      | 5 |
  | check | **-11.7%** | 3 |

  Top action flips in 1 of 8 (`flop-wet-facing-raise-full`: raise -> call, on call +134.8).
  So there is no systematic pull toward passivity; continuation gets more valuable, which is
  poker-sensible — depth-1 has no model of hero's future streets at all, so it cannot see
  implied odds or the option to barrel and must undervalue every line that continues.

  DEFECT 1 — DRAWS ARE PRICED TOO PESSIMISTICALLY. T♠9♠ on 8♥7♦2♣, calling 40 into 80 with
  an open-ended straight draw getting 3:1. Depth-2 prices the call at **-26.2 EV**, i.e.
  hero realises roughly 12% of a 120 pot holding 8 outs plus backdoors. `advisorAccuracy`'s
  "OESD on flop — call is +EV with implied odds" is skipped pending this ticket.

  DEFECT 2 — CHECKING BACK A MONSTER IP OUTSCORES BETTING IT. AA on A♠7♥2♦ in position vs a
  full range. Four assertions in `gameTreeEvaluator.test.js` encoded the depth-1 relationship
  and are now pinned to `refinementBudgetMs: 0`; `depthReachability.test.js` carries an
  OPEN QUESTION test recording the divergence. Checking back there is a defensible line, so
  this may be a CORRECTION rather than a defect — it is listed because it is unvalidated,
  not because it is known wrong.

  THE COMMON SUSPECT. `computeCallDepth2EV` and `computeBetCallDepth2EV` both average
  `max(checkEV, bestBetEV)` over sampled runouts, and a max over noisy estimates is biased
  upward: E[max(X̂,Ŷ)] > max(E[X],E[Y]). Checking back is composed ENTIRELY of that term,
  while betting is only pCall-weighted into it (a fold ends the hand and wins the pot
  cleanly), so the optimism lands unevenly even where the structure is right. That is
  WS-295's optimizer's curse, and it is open. `bestBetEV` is itself a max over sizings, so
  there are two nested maxima.

  WHY THE GREEN SUITE DID NOT CATCH ANY OF THIS. `advisorAccuracy.test.js`'s describe block
  is literally named "Depth-2 per-combo validation" and passed for the life of the project
  while depth-2 never ran — it was validating depth-1 numbers under a depth-2 name. One test
  in it, "Turn call — depth-2 uses exact river enumeration", had been marked `test.fails`,
  which was the accurate bug report: it could not be true. It passes now. Same family as
  WS-312's 59 green tests on a hand-fed number the engine cannot produce.
accept_criteria: |
  - The OESD call price is explained or corrected, and the explanation is a MEASUREMENT, not
    an argument. If -26.2 is right, the reasoning that makes it right is written down and the
    skipped test is restored with the corrected expectation.
  - The `E[max(...)]` optimism is quantified, not just named: estimate the bias by scoring
    the same spots at increasing runout counts and observing whether the max-term shrinks
    toward a limit. Its size decides whether it needs correcting or only documenting.
  - Whichever way DEFECT 2 resolves, it resolves DELIBERATELY: either the depth-1 assertions
    come back (depth-2 corrected) or they are retired with the poker reasoning recorded.
  - `advisorAccuracy.test.js`'s skipped test is un-skipped. A depth-2 validation suite that
    does not run depth-2 must never exist again — assert `depthReached === 2` inside it.
  - Scored through the WS-273 calibration harness so depth-1 and depth-2 advice land on ONE
    scale, per the Standard of Record. Any comparative figure resolves to a Result Card.
