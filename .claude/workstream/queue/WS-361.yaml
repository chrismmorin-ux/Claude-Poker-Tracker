  - |
    OPEN — is DEFECT 2 a defect at all? Checking back AA on A72 in position against a range
    that folds most of its air to a bet is a line real players take, and depth-1 cannot
    represent it. The question is not "does the engine prefer checking" but "is the margin
    by which it prefers checking an artefact of the max-bias". Answer that before touching
    the EV.
  - |
    OPEN — does this block shipping depth-2 to the founder's sidebar? WS-334's two-phase
    split makes the fast depth-1 answer independent of the refined one, so the refined
    answer can be withheld from the headline recommendation while still being computed and
    inspectable. That is a design decision (WS-334 Phase C, sidebar zones 2/4), not an
    engine one.
