status_note: |
  Filed while WS-334 was in flight. WS-334's own accept criteria are about REACHABILITY and
  OBSERVABILITY and are met; this ticket owns the question WS-334 could only ask once the
  subsystem started running. Per the founder's standing rule recorded in WS-334's decision
  flags: a null or surprising result measured on an unverified substrate is a statement
  about the substrate. Depth-2 is now the substrate under test.

  ============================================================================
  2026-08-05 — WIDEN SCOPE TO `riverPerCombo`. Measured, not argued.
  ============================================================================

  WS-334's AC5 measurement shipped: `docs/standard-of-record/DEPTH-ABLATION-2026-08-05.md`,
  Result Card `RC-depth-ablation-1c560bcc-67e9e14e`. 260 paired corpus decisions, 22 players,
  depth-1 vs depth-2 evaluated at the SAME decision in one pass. It also satisfies THIS
  ticket's fifth accept criterion (one scale, Result Card).

  WHAT IT FOUND, AND WHY IT MATTERS HERE. The pull toward passivity this ticket suspects is
  REAL, LARGE and ONE-DIRECTIONAL — 38 of 40 top-action flips move toward passivity
  (bet->check 30, raise->fold 6, raise->call 2, and only 2 the other way). But it is not
  where this ticket is looking:

    | street | n   | flips | rate  |
    |--------|-----|-------|-------|
    | flop   | 138 |   1   |  0.7% |
    | turn   |  77 |   3   |  3.9% |
    | river  |  45 |  36   | 80.0% |

  **80% of river decisions flip; 4 of 215 flop+turn decisions do.** Every depth-2 branch is
  gated `needsDepth2: street !== 'river'`, so on the river the `E[max(check, bet)]` machinery
  this ticket names as the common suspect DOES NOT EXECUTE. The stage that fires there is
  `riverPerCombo` (`gameTreeEvaluator.js:1327`): `computeRiverCheckEV` replaces the check
  candidate's EV wholesale and `computeRiverBetEV` replaces the bet candidate's, so the two
  are re-priced by DIFFERENT functions and any asymmetry between them lands straight on the
  comparison. That is a second, independent candidate mechanism for the same symptom.

  CONSEQUENCE FOR THE ACCEPT CRITERIA. They are written entirely around `gameTreeDepth2`.
  Quantifying the `E[max(...)]` bias alone would measure the stage that moved FOUR decisions
  and miss the one that moved THIRTY-SIX. Add `riverPerCombo` to scope, or state explicitly
  why the river is out of scope.

  WHAT THE RUN DOES NOT SAY. Neither of this ticket's two named spots was reproduced — the
  corpus decision set does not contain the OESD-at--26.2 spot or the AA-on-A72 spot, which
  came from `dumpGameTreeEV`'s eight hand-picked scenarios. Nothing here confirms or refutes
  DEFECT 1 or DEFECT 2. The EV delta itself does not resolve: -0.4711 bb, CI [-2.7653,
  +1.3290], includes zero at n=260 / 22 players.

  Also: the three `dumpGameTreeEV` percentages quoted in this ticket's description (call
  +26.7%, raise +18.0%, check -11.7%) are percentage changes in the engine's own EV numbers
  on eight scenarios, carry no manifest, and are not comparable to anything. Do not re-quote
  them; cite the Result Card.
