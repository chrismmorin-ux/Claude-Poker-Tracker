status_note: |
  Scored 30 — below WS-313 (33) and WS-314 (32) because both are prerequisites, not
  because it is smaller. It is plausibly the largest single idea raised in this session
  and it reframes what the engine's output IS: a plan, rather than a next action.

  Note the pattern this continues. WS-256 already built exactly this decomposition for
  PREFLOP (parent action -> subclasses, with containment enforced). The postflop side was
  never given the same treatment, so hero's postflop range is still modelled one action
  at a time. That asymmetry is the gap.
