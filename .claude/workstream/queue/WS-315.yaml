decision_flags:
  - "Is a line a fixed enum (check-fold / check-call / check-raise / bet-fold / bet-call / bet-3bet-fold) or derived per spot from the game tree? The enum is legible to the founder and matches how the preflop taxonomy already works; derived is more general and less likely to miss a line the board dictates."
  - "Does line selection feed BACK into hero's perceived range (villain responds to the line), or is it output-only in v1? Feeding back is the theoretically correct move and is what makes blockers select the line, but it is circular and needs a fixed point or a single pass."
