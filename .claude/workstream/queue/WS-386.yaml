status_note: |
  Small in code, and filed anyway because the failure was not the missing scenarios — it was
  concluding over a population the sample did not cover, with nothing in the output making
  the gap visible. The fix that matters is the coverage line in the output, not the extra
  spots.

  CLOSED same session 2026-08-05 (filing it and leaving it would have been the accommodation
  this repo's improvement-default rule exists to stop).

  SHIPPED: four river scenarios (dry checked-to, dry facing a bet, wet, paired facing a bet)
  and a street-coverage census printed before the run AND written into the JSON as
  `streetCoverage` / `coverageGaps`, so a partial set announces its own gap.

  THE HARNESS NOW AGREES WITH THE CORPUS — which is the result that makes it trustworthy
  again, and it was the fourth accept criterion:

    | street | widened harness | corpus ablation (n=260) |
    |--------|-----------------|-------------------------|
    | flop   | 0/5   =  0.0%   | 0.7%                    |
    | turn   | 0/3   =  0.0%   | 3.9%                    |
    | river  | 3/4   = 75.0%   | 80.0%                   |

  All three river flips move toward passivity (bet->check, raise->call, raise->call),
  matching the corpus's one-directional finding (38 of 40). The harness costs ~60s against
  the corpus run, so it is now a usable cheap proxy for the same question — which it was
  NOT before, on the street where the answer lives.
