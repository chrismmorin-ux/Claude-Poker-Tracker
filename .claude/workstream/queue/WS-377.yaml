status_note: |
  Filed 2026-08-05 out of WS-371's closeout, which named this finding as "confirmed and out of
  scope". Same split as WS-284 -> WS-363 and WS-371 -> WS-376.

  ALL THREE PREMISES RE-VERIFIED AGAINST HEAD (0cf1b915) BY READING CODE, NOT BY TRUSTING THE
  COMMIT MESSAGE:
    - `bayesianConfidence.js:50-60` — the STAT_PRIORS block; `foldTo3Bet: { alpha: 5.5,
      beta: 4.5 }` at `:56`, mean 55%, total pseudocount 10; header at `:8-10` ("typical 1/2
      live player frequencies", 50/50 blend at n=10) and `:42-48` (the tier note).
    - `tendencyCalculations.js:342-343` (the ratio on `facedRaisePreflop`) and `:360-361`
      (`intervals.foldTo3Bet` built with `P.foldTo3Bet`) — the prior IS applied to the broad
      quantity, confirmed at the call site.
    - `poolBaseline.js:69` (`{ num: 'foldTo3BetCount', den: 'facedRaisePreflop' }`), `:88`
      (weight 10), `:356` (`staticPriors = STAT_PRIORS` fallback).
    - `preflopFoldResolver.js:240-243` — the tier-4 'founder' fallback taking 55% as the mean.
    - `subActionRules.js:41` and `:63` — `statKey: 'foldTo3Bet'` on limp-fold counts
      (`totalLimpFold` / `totalLimpsFacedRaise`), thresholds 0.50 above and 0.30 below.
      THE THIRD-QUANTITY CLAIM HOLDS: neither is fold-vs-any-preflop-raise.

  THE FIELD FIGURES WERE COMPUTED FRESH FOR THIS TICKET, NOT COPIED. Source: the WS-262
  per-site mining output at `C:\Users\chris\data\phh-mining\out\` (`SITE-<stake>.json`,
  `<bucket>.overdispersion.<stat>` = `{players, mean, sd_between, avg_n}` over players at
  n >= 30), pooled by the law of total variance weighted by player count — the identical
  method `generate-handhq-reference.mjs:236-243` uses. VALIDATION: the same routine over
  `overdispersion.foldTo3Bet` reproduces WS-371's published figures exactly (6max 72.95% +/-
  14.15pp, full 79.80% +/- 13.36pp, 105,640 players), so the other five sit on the same
  footing. Full table in the description. These are INDICATIVE — regenerate through the
  generator during the work rather than pasting from here.

  VERIFIED NEGATIVE, AND IT CONSTRAINS THE FIX: there is NO limp-fold family in the mined
  output. Per-bucket `stats` and `overdispersion` both carry exactly six keys —
  `vpip, pfr, threeBet, foldTo3Bet, cbet, foldToCbet` — alongside `fold_curve`, `barrels`,
  `open3b` and `river_sd`. So limp-fold cannot be derived from the existing extract; it needs
  a miner change or an explicit founder estimate. Stated here so the ticket does not begin by
  looking for data that is not there — the recurring composition failure recorded in memory
  (`verify ticket premise at composition`, 8 occurrences).
