status_note: |
  PREMISES RE-VERIFIED AGAINST HEAD (fe716f59), EVERY LINE READ IN PLACE.

    - `heroEvRunner.mjs:62` — `const normalizeDepthArms = (depthArms) => {`; `:73` — the strip line,
      verbatim: `return depthArms.map((a) => ({ id: a.id, refinementBudgetMs: a.refinementBudgetMs }));`.
      `:58-61` documents why `refinementBudgetMs: undefined` on the default arm is load-bearing.
    - `heroEvRunner.mjs:256-258` — the `heroPolicyAt` call, with `refinementBudgetMs:
      arm.refinementBudgetMs` at `:258`. (The audit note cited `:258` for the call site; the call
      opens at `:256` and the budget key is at `:258`.)
    - `heroPolicy.mjs:146` — `export const heroPolicyAt = async ({`; `:158` —
      `refinementBudgetMs = undefined,` and no other engine-configuring parameter; `:263` —
      `result = await evaluateGameTree({`, a fixed object literal.
    - `gameTreeEvaluator.js:794` — `enableDepth2Raise = true,` in the parameter list; `:1632` — its
      one consumption site, `gateStage('raiseResponseDepth2', { enabled: enableDepth2Raise,
      raiseLikely: pRaise > 0.02 })`. Confirmed by grep over the whole file: this is the ONLY
      per-stage toggle. The other five gates carry only street and candidate conditions.
    - `gameTreeEvaluator.js:967-983` — `gateStage` building `blockedBy` from failing condition keys
      and appending `'budget'`, then pushing the record into the ledger. Verified empirically: a
      temporary probe on HEAD produced `raiseResponseDepth2:skip(raiseLikely|budget)` and
      `checkRaiseDepth2:skip(budget)` in the same ledger, so multi-blocker attribution already
      works and a flag key will appear alongside the others without new code.
    - The five gate lines to wire: `:1413`, `:1521`, `:1552`, `:1594`, `:1679`, plus `:1732` for
      depth-3. One correction to the audit note's list: `:1632` (`raiseResponseDepth2`) is gated on
      `{enabled, raiseLikely}` and is street-gated only transitively through its enclosing
      `betCallDepth2` block, so it is the template rather than a sixth street-gated stage.
    - `gameTreeConstants.js:35-48` — `REALIZATION_TABLE`, the lookup `realizationOverride` must
      bypass; consumed via `adjustedRealization` at `gameTreeEvaluator.js:703` and
      `gameTreeEquity.js:1044`.

  CROSS-REFERENCE, NOT DUPLICATION. `.claude/workstream/queue/WS-399.yaml` decision_flags[2] states
  the same gap and recommends splitting it into its own item; its `status_note` (`:320-323`) records
  a prior-art search finding that nothing covers threading an arbitrary engine constant through
  `heroPolicyAt` or the `runHeroEv` depth-arm axis. This ticket is that split. WS-399's own
  `blocked_by` is deliberately NOT edited here — that is its owner's call, and editing another
  agent's in-flight ticket to satisfy this one is the kind of quiet coupling the queue exists to
  make visible.
