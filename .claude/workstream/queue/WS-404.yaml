id: "WS-404"
title: "No per-capability EV number can be produced at all: the arm axis strips every key except refinementBudgetMs at three separate chokepoints, and the engine has exactly one per-stage toggle out of six — thread an opaque engineOverrides object and wire the remaining flags into the gate conditions that already record blockedBy"
