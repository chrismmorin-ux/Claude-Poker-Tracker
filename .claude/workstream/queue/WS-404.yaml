decision_flags:
  - |
    OPEN — DOES `engineOverrides` GET A SCHEMA, OR STAY GENUINELY OPAQUE? Opaque is what makes it
    reusable and is what stops the next ablation needing edits in three files. But opaque means a
    typo in an arm definition reaches the engine, is ignored by `evaluateGameTree`'s destructuring
    default, and produces a zero delta — reintroducing at the engine boundary exactly the silent
    no-op this ticket removes at the runner boundary. The middle option is that the ENGINE, not the
    runner, validates: `evaluateGameTree` rejects an override key it does not recognise. That keeps
    the runner opaque and puts the check where the vocabulary actually lives.
    RECOMMENDATION: opaque runner, validating engine. The founder should confirm, because it means
    `evaluateGameTree` gains a throw on a bad config, and the app calls that function on every live
    decision.
  - |
    OPEN — DOES THE REPLICATION MANIFEST HAVE TO CARRY THE OVERRIDES? Any Result Card produced from
    an ablated arm is a card whose engine was not the engine at `manifest.engineCommit`. Per the
    Standard of Record, the manifest carries "every load-bearing constant", and a stage flag is as
    load-bearing as a seed. Adding it means a new manifest field and a register-version consequence;
    not adding it means two cards with the same `engineCommit` can differ arbitrarily and nothing
    says so. RECOMMENDATION: add it. It is the same argument that produced
    `disclaimerRegisterVersion`, and the cost of retrofitting it later is a migration of every card
    written in between.
