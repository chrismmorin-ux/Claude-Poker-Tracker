status_note: |
  ORIGINALLY FILED AS A DELETION, OVERTURNED BY ADVERSARIAL REVIEW THE SAME DAY.

  The greenfield units review (2026-08-06) derived the estimand from the estimator's own
  algebra rather than from the spec, and found `edge` is per scored decision — making
  `edge x 100` denominator-consistent. It stated the consequence plainly: "Deprecating a
  correct field on a wrong diagnosis removes the one honest per-100 figure that exists."

  Two agents in the same run disagreed about emphasis — one still treated the field as the
  landmine the spec describes — and the disagreement was put to the founder rather than
  resolved silently. Founder ruled: rename.

  RECORDED BECAUSE IT IS THE POINT: this ticket was authored by an AI reading a spec, and the
  spec's claim was wrong. Two independent agents checking the code caught it before the field
  was deleted. The original ticket text cited "TWO INDEPENDENT AGENTS" verifying zero
  consumers — which was true, and irrelevant to whether the field should exist.
