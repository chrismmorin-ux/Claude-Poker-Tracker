        (`scripts/__tests__/heroEv.test.js`, "is INVARIANT to decisions-per-hand").
  - [x] `npm test` green on the hero-EV path (110 tests across 5 suites).

  STILL OPEN, TRACKED ELSEWHERE — the same false sentence propagated verbatim to three more
  files and they are NOT corrected by this ticket:
    - `docs/runbooks/baseline-ev-run.md:28`
    - `docs/standard-of-record/DISCLAIMER-AND-FAULT-REGISTER.md:66`
    - `docs/standard-of-record/SCORED-READOUT-SPEC.md:157`
  plus the spec's own deprecation instructions at `:159-163`, `:338`, `:1044`, `:1054`, which
  now describe an action that was correctly NOT taken. Owned by WS-428's spawned work.
