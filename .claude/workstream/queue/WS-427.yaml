description: |
  SUPERSEDES THE ORIGINAL FRAMING OF THIS TICKET, which called for DELETION. That framing was
  filed on 2026-08-06 from `SCORED-READOUT-SPEC.md:159-163`, which calls the field "A LANDMINE
  ... a bare rescale with NO denominator change". **The diagnosis was wrong**, and the
  adversarial review that overturned it is recorded below. Founder ruled `rename` on
  2026-08-06 after seeing both readings.

  WHAT THE FIELD ACTUALLY IS. `scripts/backtest/ipsEstimator.mjs` emitted:

      edgeBBPer100: Number((edge * 100).toFixed(2))

  `edge` is per SCORED DECISION — the estimand is `E[change in the hand's net from
  substituting our action at ONE node]`, averaged over a decision-uniform population. So
  `edge x 100` IS denominator-consistent: it is **bb per 100 scored decisions**, the same
  quantity `scripts/backtest/evCost.mjs:203` already correctly names `bbPer100Decisions`.
  The rescale changes no denominator because none needed changing.

  WHAT IT IS NOT is a winrate, and the NAME is what invited that reading. `edgeBBPer100`
  scans as bb/100 hands to anyone who has ever read a poker stat. Deleting the field would
  have removed the only correctly-denominated per-100 number this estimator produces, on a
  diagnosis that did not survive being checked.

  THE PER-100-HANDS FIGURE IS A DIFFERENT QUANTITY WITH A DIFFERENT DENOMINATOR, and it is
  NOT this number times anything. See `scripts/backtest/handLedger.mjs` (WS-428 Stage 0) for
  the hands-dealt denominator and the field-winrate anchor that makes a violation visible.

  WHY THE ORIGINAL DIAGNOSIS SURVIVED AS LONG AS IT DID. It sat forty lines below a docblock
  that stated — falsely — that reading `edgeBB` as a winrate "overstates it by roughly the
  decisions-per-hand factor". Read together, the field looked like a loaded gun. The docblock
  sentence has now been measured and refuted (see WS-428 and the test named below), so the
  pairing that made deletion look obvious no longer exists.
