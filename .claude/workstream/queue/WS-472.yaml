description: |
  The calibration doc's own rule ("re-run after any engine hot-path change") was violated four
  times inside the review window (WS-436 A1-A4, WS-450, WS-451 all added work inside the counted
  loop after the 2026-08-07 calibration). COMBO_EVAL_COST is static and now under-bills, which
  compounds the FIND-129 wall-clock exposure and makes scored runs across the calibration boundary
  non-comparable (different stages complete). Re-run calibrate-refinement-units.mjs at HEAD,
  publish the constants as a Result Card with full manifest, bump REFINEMENT_CLOCK_VERSION, and
  add a check failing the build when a hot-path file is newer than the calibration artifact
  without a bump.
accept_criteria: |
  - A dated calibration Result Card exists for the HEAD engine; its constants differ from or are
    confirmed equal to 2026-08-07's, stated explicitly.
  - REFINEMENT_CLOCK_VERSION is bumped.
  - Editing a hot-path engine file without re-calibrating fails the test run, naming the
    calibration doc.
