description: |
  Founder request, 2026-07-27: "a large effort to make our new theory (which the
  player can understand and progressively memorize in order to manipulate the game)
  and curriculum better."

  THE TRANSLATION PROBLEM. POKER_THEORY.md is written for an ENGINE and for an AI
  editing that engine — exhaustive, cross-referenced, ordered by subject. None of
  that survives contact with a human at a table who has four seconds to act. The
  curriculum is not a summary of the theory doc; it is a different artifact with a
  different ordering principle.

  ORDER BY LEVERAGE, NOT BY SUBJECT. The theory doc is organised preflop -> postflop
  -> math. A curriculum should be organised by how much money the concept moves and
  how often it comes up. WS-285's own finding is the model for this: WHO THE
  AGGRESSOR IS carries more information than board texture, street, or position —
  which is close to the opposite of how most players are taught to read a spot, and
  it is exactly the kind of ordering the measurements can now settle.

  BINDING CONSTRAINTS (from established project doctrine):
    - HIGH CONCEPT GRANULARITY. A concept must be a coherent solver-baseline region.
      Split umbrella concepts; do not teach "c-betting" as one thing.
    - LEARNING STATE, NOT TIER RANK. Mastery is the truth being tracked; any tier is
      a derived descriptor and never a user-facing rank.
    - LABELS ARE OUTPUTS, NEVER INPUTS. The curriculum must teach the founder to
      reason from equity / pot odds / SPR / who is left to act — the same
      first-principles rule the engine is held to. Teaching "in EP, fold more" would
      install in the founder the exact anti-pattern the engine forbids.
    - Every taught claim must cite the measurement or theory section behind it, so a
      later overturn can find and correct everything it touched.

  PROGRESSIVE STRUCTURE. Layered so each layer is independently usable at a table:
  a small memorizable core, then refinements that assume the core, then the rare
  spots. The founder should be able to stop at any layer and still play better.
accept_criteria: |
  - Curriculum exists as a standalone artifact, ordered by leverage x frequency, with
    each layer independently usable.
  - Every claim cites its POKER_THEORY section or its measurement, so an overturn can
    be traced to every lesson it invalidates.
  - No lesson teaches a label as a decision input. Reviewed against
    exploitEngine/CLAUDE.md anti-patterns and POKER_THEORY 7 explicitly.
  - Concept granularity is solver-baseline-region level; umbrella concepts split.
  - Explicitly states what the model CANNOT tell you and where the founder is on
    their own — a curriculum that hides its edges teaches false confidence.
  - Reviewed for the live/online divergences already catalogued in POKER_THEORY 9;
    where corpus evidence is online and play is live, the lesson says so.
