description: |
  A read-only probe shipped 2026-07-28 (scripts/backtest/rangeCalibrationProbe.mjs,
  run-range-calibration.mjs) and immediately found a falsified range model (WS-291). It is
  currently a one-off. It should be a STANDING metric, for the same reason WS-273's
  villain-prediction harness is: the instrument is the durable asset, the numbers decay.

  WHAT IT MEASURES. For every decision where a seat's cards were later revealed:
    coverage      — does the inferred range give the true hand NON-ZERO probability?
                    (a zero is falsification, not miscalibration)
    retained      — share of all possible combos kept; the random-elimination baseline,
                    without which coverage flatters any wide range
    lift          — coverage / retained; ~1.0 means the eliminations are arbitrary
    delta-log     — mean log P(true hand) minus uniform; POSITIVE = the range beats
                    "every combo equally likely"

  Sliced by street, by observed action, by seat role (acting vs the villain range the game
  tree consumes), by site, and by chained-narrowing depth.

  BASELINE ALREADY RECORDED (docs/research/range-calibration-2026-07-28.md, 321,196 hands
  / 1,300 players / two sites), so WS-291 has a genuine before/after rather than a
  post-hoc story.

  WHY IT MUST BE STANDING, NOT A ONE-OFF. Once WS-291 lands, coverage becomes ~100% BY
  CONSTRUCTION — any positive floor guarantees it. So coverage stops discriminating and
  DELTA-LOG becomes the metric that matters. Without a standing instrument the fix would
  look like a total success on the metric it was designed to satisfy, which is exactly the
  self-certifying trap the readiness gate exists to prevent.

  GATE CANDIDATE. C3 (hero-EV) is only meaningful if the ranges hero's advice is
  marginalized over are calibrated. Proposing range calibration as a gate criterion is a
  threshold change and therefore a /decide with a recorded reason, not a silent addition
  — see MODEL_READINESS_GATE.md.
accept_criteria: |
  - The probe is runnable as a normal harness command with the same leakage discipline as
    the villain-side backtest (explicit partition, no implicit corpus-wide tables).
  - Reports coverage, retained, lift and delta-log by street / action / seat-role / site /
    chain-depth, and REFUSES to report coverage without its retained baseline — coverage
    alone is a number that improves by doing nothing.
  - Results are appendable to a history file so drift is visible across runs, in the shape
    scorecard-history.yaml uses.
  - The 2026-07-28 baseline is recorded as the first row.
  - Tests: coverage/lift arithmetic on synthetic ranges with known answers; a range
    containing every combo scores lift 1.0; a range excluding the true hand scores
    coverage 0 for that decision.
  - A /decide records whether range calibration becomes a gate criterion, with the
    threshold and the reason. Not added silently.
