compute_job:
  maxJobHours: 8
  inputs:
    - from: 'C:\Users\chris\fleet\compute-inputs\behavior-policy-ws503.json'
      to: "out/behavior-policy.json"
      sha256: "57c69e8346d30b0e20d56515720fe21aee405c43df7eabb28747b71dfb2f73da"
  steps:
    - name: ladder-full50-produce
      cmd: node
      args:
        - "scripts/backtest/run-rule-ladder.mjs"
        - "--behavior-policy"
        - "out/behavior-policy.json"
        # IDENTICAL conditioning to the 77k run. Only --max-files and --max-decisions move.
        - "--sites"
        - "FTP,PS"
        - "--stakes"
        - "50NLH"
        - "--max-files"
        - "1756"
        - "--file-selection"
        - "proportional"
        - "--max-decisions"
        - "300000"
        - "--max-decisions-per-player"
        - "4"
        - "--wave-size"
        - "16"
        - "--workers"
        - "4"
        - "--target-bb"
        - "0.10"
        - "--context-set"
        - 'C:\Users\chris\data\ws540-sets\ladder-full50.jsonl'
        - "--out"
        - "out/ws612-ladder-full50.json"
      env:
        # MEASURED OOM, 2026-08-21, job ws-612-02b5ae6601a1 attempt 0. The first submission of
        # this exact spec died with "Ineffective mark-compacts near heap limit" at 4,086 MB --
        # node's DEFAULT ~4 GB cap -- after reading 900,000 hands and indexing 27,074 eval
        # players, and it was still reading. Nothing was wrong with the n projection; the
        # corpus READ phase ran out of heap before scoring ever began.
        #
        # THE SIZING, from the two runs rather than from taste:
        #   600 files   ->   368,036 hands, 15,276 eval players -- fit in the 4 GB default
        #   1,756 files -> ~1,077,000 hands (2.927x), ~30-31k eval players (the curve is
        #                  SUBLINEAR: the same pseudonyms recur, so players do not scale with
        #                  hands -- 27,074 at 900k, not the 44,700 a linear read would give)
        #   death point implies ~0.144 MB per resident eval player above a ~0.2 GB baseline
        #   projected peak ~4.7 GB -- inside this ceiling with margin
        #
        # WHY 8192 AND NOT MORE: WS-293 already measured that cm-node1 cannot supply 12288
        # (15.8 GB total, ~9-10 GB free). A ceiling above available memory is not a ceiling.
        # Workers inherit NODE_OPTIONS but score per-wave and do not hold the eval index.
        NODE_OPTIONS: "--max-old-space-size=8192"
      expectFiles:
        - "out/ws612-ladder-full50.json"
      maxAttempts: 2
    - name: ladder-full50-replay-gate
      cmd: node
      args:
        - "scripts/backtest/rescore-rungs.mjs"
        - "--context-set"
        - 'C:\Users\chris\data\ws540-sets\ladder-full50.jsonl'
        - "--gate"
        - "out/ws612-ladder-full50.json"
        - "--target-bb"
        - "0.10"
        - "--out"
        - "out/ws612-replay-full50.json"
      expectFiles:
        - "out/ws612-replay-full50.json"
      maxAttempts: 2
  artifacts:
    - "out/ws612-ladder-full50.json"
    - "out/ws612-replay-full50.json"
