decision_flags:
  - |
    OPEN — WHY `:119` WAS WRITTEN THAT WAY, WHICH MUST BE ANSWERED BEFORE IT IS CHANGED. Building the
    test range profile on the wider window is not an obvious typo; someone may have done it because a
    range profile built on `trainingHands` alone is too sparse to bucket the test decisions at all,
    in which case naively narrowing the window will make checkpoints silently `continue` at `:120`
    (`if (!testRangeProfile) continue;`) and shrink the audit's effective sample without anyone
    noticing. Check the checkpoint survival count in both arms and report it beside the metrics. If
    the corrected arm loses a large fraction of its checkpoints, the fix is not "use `trainingHands`"
    — it is a decision about the minimum training window, and it belongs to the founder because it
    trades audit coverage against audit validity.
  - |
    OPEN — WHETHER A DECAY BELONGS IN AN AUDIT AT ALL. The decay exists so that a LIVE model tracks a
    player who changes. An audit asking "did the model predict the next ten hands" is a different
    question, and weighting its evidence by recency inside the test window has no obvious
    justification — the test hands are all equally out-of-sample. It is arguable that the audit
    should score with decay OFF on the test side and ON for the model it is auditing, which is a
    third configuration nobody has considered. Cheap to run once the arms above exist, and it may
    make the whole asymmetry question moot.
