status_note: |
  Premises re-verified against HEAD by reading the code, not by trusting the roundtable record:
    - `src/utils/exploitEngine/modelAudit.js:98-127` read in full. `:99` `trainingHands`,
      `:100` `testHands`, `:105` the training `buildRangeProfile`, `:107` the training
      `accumulateDecisions`, `:119` the test `buildRangeProfile` on
      `sorted.slice(0, cp + CHECKPOINT_INTERVAL)`, `:120` the `continue` guard, `:121` the test
      `accumulateDecisions(playerId, testHands, testRangeProfile, userId)`. The leak is exactly as
      described and the labels really are clean.
    - `src/utils/exploitEngine/decisionAccumulator.js:30` `DECAY_HALFLIFE = 50`; `:252`
      `const totalHands = hands.length;`; `:403` `const handAge = totalHands - 1 - handIdx;`;
      `:404` `recencyWeight = Math.pow(0.5, handAge / DECAY_HALFLIFE)`.

  ONE CITATION CORRECTED, MINOR BUT WORTH NOT PROPAGATING. The roundtable record cites the decay as
  "`decisionAccumulator.js:252,:402-404`". Line 252 is `const totalHands = hands.length;` — it is the
  source of the array-length basis and is correctly part of the mechanism, but it does not contain
  `handAge`. The `handAge` and `recencyWeight` lines are `:403` and `:404`, not `:402-404`. Cited
  precisely above so a reader opening the file finds what the ticket says is there.

  ONE FIGURE RE-DERIVED RATHER THAN QUOTED. The record says "every test hand carries weight ≥ 0.87".
  Computed from the source: with `CHECKPOINT_INTERVAL` as the test slice length, the oldest test hand
  has `handAge = CHECKPOINT_INTERVAL - 1`. At the interval implied by `:119`'s arithmetic and a
  50-hand halflife, a 10-hand slice gives 0.5^(9/50) ≈ 0.883. The ≥0.87 figure is consistent with a
  10-hand interval. `CHECKPOINT_INTERVAL`'s actual value was NOT read in this pass — the ticket's
  argument does not depend on it (the asymmetry holds for any test window materially shorter than the
  training window), but confirm it before quoting a specific weight in a commit message.

  ON THE `blocked_by: WS-389`. `modelAudit` scores model predictions and does not itself call
  `evaluateGameTree`, so its arms are less exposed to the wall-clock defect than the engine-side
  items are. It is still blocked, because accept criterion 1's chain terminates in an EV delta
  measured on the shared harness, and because running a leak measurement whose result will later have
  to be re-run against a reproducible baseline is work done twice. If the founder wants this earlier,
  the leak-versus-decay arms in criterion 4 are independently meaningful and could run first.
