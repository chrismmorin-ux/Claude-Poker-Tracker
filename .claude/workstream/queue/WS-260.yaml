description: |
  _Convergence: closes FIND-037 (HIGH) + FIND-039 (MEDIUM) — challenge protocol, run-sweep-2026-07-22_

  Two segmentation defects defeat the WS-235 empirical pool baseline's
  core doctrine (different populations never pooled):

  (a) HIGH — createOnlineSession() (sessionsStorage.js:428) hardcodes
  gameType 'NL Holdem', so segmentKey() yields ONE segment for all online
  play; $1/$2 zone and $5/$10 regular blend into a single wrong-population
  baseline every online villain shrinks toward. Fix: capture real stakes/
  format from the Ignition wire data (blinds/table metadata exist per
  wire-schemas.js) into the session record; decide backfill policy for
  existing literal-labeled sessions.

  (b) MEDIUM — live gameType labels are free-text; segmentKey's naive
  normalization splits '1/2' / '$1/$2' / '1/2 NL' into distinct thin
  segments that individually fall back to the founder estimate, silently
  defeating the empirical baseline. Fix: canonicalize (strip currency
  symbols + NL/NLH/NLHE suffixes, sort blind numbers) in segmentKey or
  constrain the writer boundary vocabulary.

  MANDATORY before editing: POKER_THEORY.md + exploitEngine/CLAUDE.md.
  Note segmentation isolation tests at poolBaseline.test.js:137-158 must be
  extended, not weakened.
accept_criteria: |
  - Online sessions record real stakes/format from wire data; segmentKey
    produces distinct segments for distinct online stakes (test with two
    stake levels).
  - segmentKey canonicalization: '1/2', '$1/$2', '1/2 NL', '2/5' vs '$2/$5
    NLH' resolve to the expected canonical segments (table-driven test).
  - Live/online never pooled (existing isolation tests still green).
  - Backfill decision recorded (re-key existing online sessions vs fresh
    start) — decision note in the commit or /decide if trade-offs emerge.
  - exploitEngine + persistence suites green.
