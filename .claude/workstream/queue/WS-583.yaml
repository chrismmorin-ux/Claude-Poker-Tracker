status_note: |
  Blocked by WS-580 because a generator built on the marginal policy would produce hands in which
  no villain's action depends on his cards, and re-inducing from those would produce cards that
  reproduce the sources trivially — passing the round trip while proving nothing. The test only
  has teeth once the villains being simulated actually hold hands.

  Related standing memory: `project_synthetic_amplification` records the founder's own naming of
  the fatal trap and the four valid forms (calibration null, power analysis, held-out both ways,
  optimal experimental design). This item is the held-out-both-ways form applied to the generator.
