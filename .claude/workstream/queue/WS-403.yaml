decision_flags:
  - |
    OPEN — WHAT ORDERS THE STAGES? The measured defect is not that the cap is 0.4 but that
    `callDepth2` runs first and consumes a 4x budget increase by itself while `betCallDepth2` stays
    pinned at 0.184. Fixing the denominator alone leaves the ordering untouched. The options are
    (a) fixed source order with a corrected cap, (b) order by which candidate is currently closest
    to the top of the ranking — refine the decision that is actually in doubt — or (c) order by
    measured marginal EV movement per millisecond, which requires the per-stage flags in WS-404 to
    exist first. (b) is the poker-correct answer: refinement that cannot change the argmax is
    refinement that cannot change advice. (c) is the measurable one. RECOMMENDATION: implement (b),
    and treat (c) as the follow-up that validates it once WS-404 makes per-stage attribution
    possible.
  - |
    OPEN — IS THE BUDGET A CAP OR A TARGET? It is currently written as a cap, checked as a cap
    (`isTimeBudgetExceeded`, `:906-907`), reported as a cap (`latency.overBudget`), and overrun by
    2x. Making it a real cap means the stages must bail at much finer granularity, which costs
    accuracy inside each stage. Declaring it a target means `budgetSkipped` becomes advisory and the
    live surface needs a different guarantee. This matters beyond the engine: the app ships this on
    a phone, and the standing finding that advice depth already varies with machine load
    (`Date.now()` gating) makes a soft budget a source of NON-DETERMINISTIC ADVICE, which is a worse
    property than slow advice. The founder should decide, because it trades table latency against
    reproducibility.
