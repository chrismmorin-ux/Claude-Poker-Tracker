status_note: |
  PREMISES RE-VERIFIED AGAINST HEAD (fe716f59), AND THE BUDGET-SWEEP CLAIMS RE-MEASURED RATHER THAN
  QUOTED, BECAUSE THE AUDIT NOTE'S VERSION OF THEM WAS PARTLY WRONG AND THE ERROR CHANGED THE FIX.

  Code, read in place:
    - `:929` — `const MAX_STAGE_SHARE = 0.4`; `:930-936` — `claimStageBudget` returning
      `timeBudgetMs: Math.min(remaining, timeBudgetMs * MAX_STAGE_SHARE)`. The multiplicand is the
      TOTAL budget, confirming the "cap against total, not remaining" premise exactly.
    - `:967-983` — `gateStage(stage, conditions)`: `blockedBy` is the list of failing condition keys
      plus `'budget'` when `isTimeBudgetExceeded()`. This is why per-stage ablation in WS-404 gets
      its observability for free.
    - The six stage gates: `riverPerCombo` `:1413` (`street === 'river'`), `callDepth2` `:1521`,
      `checkCheckDepth2` `:1552`, `betCallDepth2` `:1594`, `checkRaiseDepth2` `:1679` (all
      `street !== 'river'`), `depth3Barrel` `:1732` (`street === 'flop' || street === 'turn'` and
      `betDepth2Ran`).
    - CORRECTION TO THE AUDIT NOTE'S LINE LIST: `raiseResponseDepth2` at `:1632` is NOT street-gated
      in its own right — its conditions are `{ enabled: enableDepth2Raise, raiseLikely: pRaise > 0.02 }`.
      It is street-gated only transitively, being nested inside the `betCallDepth2` block. That
      matters for WS-404, because it is the stage whose gate already carries the `enableDepth2Raise`
      toggle and is therefore the template for the rest.
    - `:1740-1741` — `depth3ComboLimit = street === 'turn' ? 1200 : 800`, and the qualifying
      condition `segmentation.totalCombos <= depth3ComboLimit`.

  Measurement, run by me on HEAD via a temporary vitest probe (created, run, deleted — nothing left
  in the tree) reusing the fixture from `depthReachability.test.js`: full 169-cell villain range,
  board A-spade 7-heart 2-diamond, hero A-heart K-heart, pot 60, villain bet 40 for the facing-bet
  node, `trials: 2000`, budgets 0 / 2000 / 8000 / 30000 ms. Both tables in the description are that
  probe's output. `segmentation.totalCombos` was 1081 in every configuration.

  THREE PREMISES FROM THE AUDIT NOTE DID NOT VERIFY:
    1. "Raising the budget does not fix it — at 8000 and 30000 ms the same stages are still
       skipped." FALSE at 30000 ms: `budgetSkipped` is EMPTY on both node shapes. TRUE at 8000 ms.
    2. "`betCallDepth2`'s `weightConsumed` is pinned at 0.23 at all three budgets." Measured 0.184
       at 2000 and 8000, 1.000 at 30000. Pinned across 2000 to 8000 only, and the value is 0.184.
    3. "At the shipped 2000 ms on a flop node `ranStages` is exactly `['checkCheckDepth2']`."
       Measured `['checkCheckDepth2', 'betCallDepth2']` on the check node and
       `['callDepth2', 'betCallDepth2', 'raiseResponseDepth2']` facing a bet.
  The differences are almost certainly fixture-dependent — the audit probed real corpus decisions
  with narrowed ranges, this probe uses a full range on one board — which is itself the point: the
  stage set that runs is a function of the node, and NOTHING RECORDS WHICH STAGE SET PRODUCED A
  GIVEN SCORED DECISION. The claim that survives all three corrections, and the one the ticket rests
  on, is the audit's own headline: there is no shipped budget at which a flop node runs its full
  stage set, and every arm differenced against "depth-2 @ 2000 ms" is differenced against a
  truncated tree. That is measured, not inferred.

  The `depthReachedMax` census is separately confirmed by recomputation over
  `out/depth-ablation.json`: flop 138/138 at depth 2 (0 of 138 ever reach 3), turn 74/77 at depth 3,
  river 45/45 at depth 1.
