id: "WS-403"
title: "The refinement scheduler caps each stage at 40% of the TOTAL budget rather than of what remains, stages overrun that cap by 2x anyway, and at the shipped 2000 ms a flop node drops half its stage set — so every arm ever differenced against 'depth-2 @ 2000 ms' was differenced against a truncated tree"
