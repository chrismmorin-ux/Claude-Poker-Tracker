compute_job:
  # Authored 2026-08-17. NOT SUBMITTABLE UNTIL WS-523 CLOSES — see blocked_by. The spec is
  # written now, while the invocations are in hand, rather than reconstructed later; the job
  # fingerprint is content-derived, so editing this block is what re-keys it for the feeder.
  #
  # Parameters read out of the artifacts themselves, not recalled: out/depth-ablation.json
  # config carries maxDecisions 260, poolPct 50, minTrainHands 15, comboSamples 10, trials 200,
  # rake {pct 0.05, cap 3, noFlopNoDrop}, arms depth1@0ms / depth2@2000ms with depth2 primary.
  # The river-flip invocation is in that script's own header (run-river-flip-replicate.mjs:53-56).
  #
  # Sizing: G16 ran the original 300-file depth ablation inside the baseline-ev runbook budget.
  # cm-node1 is a Surface Pro 8 (8 logical cores, ~4 workers), so the cap is set above a
  # pessimistic multiple rather than at the number it "should" take.
  maxJobHours: 6
  inputs:
    # Same reasoning as WS-503: pi_pool is the denominator of every importance weight, so it is
    # staged rather than re-mined. Re-mining on cm-node1 would fit the field on that machine's
    # 27-directory corpus and swap the FIELD underneath a run whose purpose is "same field,
    # honest sample". The sha256 makes a drifted file fail preflight instead of silently rebasing.
    - from: "C:\\Users\\chris\\fleet\\compute-inputs\\behavior-policy-ws503.json"
      to: "out/behavior-policy.json"
      sha256: "57c69e8346d30b0e20d56515720fe21aee405c43df7eabb28747b71dfb2f73da"
  steps:
    - name: depth-ablation-stratified
      cmd: node
      args:
        - "scripts/backtest/run-depth-ablation.mjs"
        - "--reference"
        - "none"
        - "--behavior-policy"
        - "out/behavior-policy.json"
        - "--stakes"
        - "50NLH"
        - "--max-files"
        - "300"
        - "--max-decisions"
        - "260"
        - "--refinement-ms"
        - "2000"
        - "--out"
        - "out/depth-ablation-stratified.json"
        - "--card"
        - "docs/standard-of-record/cards/RC-depth-ablation-stratified.json"
      expectFiles:
        - "out/depth-ablation-stratified.json"
        - "docs/standard-of-record/cards/RC-depth-ablation-stratified.json"
      maxAttempts: 2
    - name: river-flip-replicate-stratified
      cmd: node
      args:
        - "scripts/backtest/run-river-flip-replicate.mjs"
        - "--reference"
        - "none"
        - "--behavior-policy"
        - "out/behavior-policy.json"
        - "--stakes"
        - "50NLH"
        - "--max-files"
        - "300"
        - "--max-players"
        - "300"
        - "--max-hands-per-player"
        - "60"
        - "--out"
        - "out/river-flip-replicate-stratified.json"
        - "--card"
        - "docs/standard-of-record/cards/RC-river-flip-replicate-stratified.json"
      expectFiles:
        - "out/river-flip-replicate-stratified.json"
        - "docs/standard-of-record/cards/RC-river-flip-replicate-stratified.json"
      maxAttempts: 2
  artifacts:
    - "out/depth-ablation-stratified.json"
    - "out/river-flip-replicate-stratified.json"
    - "docs/standard-of-record/cards/RC-depth-ablation-stratified.json"
    - "docs/standard-of-record/cards/RC-river-flip-replicate-stratified.json"
