description: |
  FILED 2026-08-17 while closing WS-504. Founder ruling the same day: flag the contaminated
  cards in the fault register AND re-run them, rather than flag alone.

  WHAT IS CONTAMINATED, MEASURED NOT INFERRED. `handhq-allsites-50NLH-1c560bcc` carries 300
  members and 300 of 300 are `FTP-2009-07-01_2009-07-23_50NLH_OBFU`. Zero PokerStars. The
  book was named from the discovery FILTER, not the realised sample, so `allsites` describes
  a one-site measurement. Three published Result Cards stand on it:

    docs/standard-of-record/cards/RC-depth-ablation.json:6
    docs/standard-of-record/cards/RC-river-flip-replicate.json:6
    docs/standard-of-record/cards/RC-river-flip-replicate-ws378fix.json:6

  and it is quoted in DEPTH-ABLATION-2026-08-05.md:118, SCORED-READOUT-SPEC.md,
  POKER_THEORY.md and docs/runbooks/baseline-ev-run.md.

  WHY THIS IS NOT A RE-LABEL. WS-492 measured a monotone stake gradient across the corpus
  directories (6-max 3-bet +57% from 25NLH to 1000NLH, PFR +31%), so directories are not
  exchangeable. A one-site sample is an estimate of a different population, not a noisier
  estimate of the same one. Re-labelling makes the card honest; it does not answer the
  question the card was written to answer.

  THE 300-FILE DRAW IS ALREADY MEASURED, so the re-run's population is known in advance:
  the 50NLH slice is 1,756 files (525 FTP, 1231 PS), and proportional selection at 300 draws
  90 FTP / 210 PS as `handhq-FTP+PS-50NLH-ae2172f5`. The prefix draw reproduces the published
  `sha256:1c560bcc8ba77b640…` bit-identically, so the OLD cards remain replicable — this adds
  a successor rather than destroying a predecessor.

  BLOCKED BY WS-523 AND THIS IS A REAL DEPENDENCY, NOT A DEFERRAL. `depthAblationReport` and
  the river-flip report do not yet read `manifest.fileSelection`, so re-running today produces
  a correctly stratified sample carried by a card that still cannot state its own composition
  — a corrected number with an uncorrected record, which is the WS-504 defect one layer along.

  SIBLING BOOKS with the same shape, to be swept in the same pass or explicitly deferred with
  a reason: `…-aa3f0447` (RC-layer-divergence), `…-790a6ffd` (per-player-width),
  `…-38f96a38`, `…-c0043f8b`, `…-24302c8e`.
accept_criteria:
  - "Both runs complete on cm-node1 with `admissible: true` and no SAMPLE_COLLAPSED blocker."
  - "Each new card's `manifest.fileSelection.realised.perDirectory` shows a non-zero count from BOTH 50NLH directories."
  - "New cards are written alongside the old, not over them — the old ones stay replicable under `--file-selection prefix` and remain flagged by FAULT-prefix-corpus-selection."
  - "The delta between old and new is reported for every headline figure, and reported whether it is large or small. A null delta is a result about transferability across sites, not a reason to drop the work."
  - "DEPTH-ABLATION-2026-08-05.md, SCORED-READOUT-SPEC.md and POKER_THEORY.md point at the successor cards."
  - "The five sibling books are each either swept or deferred with a stated reason."
