decision_flags:
  - |
    OPEN AND THE FIRST ONE — IS THERE A STACK ENTRY SURFACE THE FOUNDER WILL ACTUALLY USE AT THE
    TABLE? Step (0) is not a data-model change, it is a data-CAPTURE change, and the founder is
    entering hands live on a phone in a 9-handed game. Per-seat stacks for eight opponents entered
    by hand is a real interaction cost and it may simply not be payable. The cheaper alternatives
    are worse in known ways: a single hero effective stack (loses per-opponent SPR, which is the
    multiway case), a session-level default (constant SPR again, i.e. today's defect with extra
    steps), or estimating from pot growth (unidentifiable). This needs Gate 1 of the design program
    before any reducer field is added, and it should be decided by the founder rather than inferred.
  - |
    OPEN — WHETHER THE BACKTEST'S HARDCODED 100bb AND THE LIVE PATH'S MISSING STACKS ARE ONE FIX OR
    TWO. They are the same absent quantity reached from opposite ends, and the backtest half
    (`handStateReconstructor.js:19,:254,:330`) is in the backtest-integrity family filed separately
    and higher. If the corpus carries real stack data that reconstruction is discarding, the backtest
    half is cheap and should not wait on a live entry surface; if it does not, the two halves are
    genuinely independent. Establish which before scheduling step (0).
