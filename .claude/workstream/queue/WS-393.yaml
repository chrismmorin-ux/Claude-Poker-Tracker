description: |
  THE CORRECTION THAT CHANGES THE COST MODEL. Every prior framing of this — including three of the
  six roundtable lenses and the standing memory entry `project_allin_side_pots.md:19` — describes
  the live table as having "no game-tree advisor". That is wrong in a way that matters for pricing.
  The advisor is COMPLETE and RUNNING. It terminates at a different venue:

    - `src/contexts/OnlineAnalysisContext.jsx:57-60` — `useLiveActionAdvisor(safeLiveHandState,
      tendencyMap, { equityFn, rakeConfig })` produces the full `evaluateGameTree` output, with a
      rake config resolved at `:51-55` (`source: 'ignition'`, stated rather than inferred).
    - `:68-70` — `pushAdvice(advice)` ships it to the Chrome extension.
    - `ignition-poker-tracker/side-panel/render-coordinator.js:386` — the side panel reads
      `snap.lastGoodAdvice?.recommendations?.[0]` and renders it.
    - `src/components/views/TableView/LiveAdviceBar.jsx:181` — the LIVE bar already has a full
      render path for the same object, gated on `topRec && gameTreeAdvice.heroEquity != null`.
    - `src/components/views/TableView/CommandStrip.jsx:88` — the live table reads the same context.

  It is null on the live path for exactly one reason: `src/hooks/useSyncBridge.js:329` is the SOLE
  writer of `liveHandState`, and it fires only on a `BRIDGE_MSG.HAND_STATE` window message from the
  extension. So the prop, the renderer, the rake resolution, and the rendering contract all exist.
  What is missing is a producer that marshals the MANUAL table's state into the same shape.

  Nobody has costed it that way, and the difference is large: this is not "build a connection", it
  is "add a second producer behind an existing contract" — with the whole risk sitting in the
  ARGUMENTS that producer would pass, which is the rest of this ticket.

  WHY THE ONE-HOOK VERSION MUST NOT BE SHIPPED. The tempting minimal cut is to replace the
  `actionAdvice` useMemo at `CommandStrip.jsx:653-665` with a `useActionAdvisor` call, on the
  argument that every input is already in scope. Read from HEAD, it is not:

    - `gameTreeEvaluator.js:792` defaults `numOpponents = 1` and `:793` defaults
      `opponentModels = []`. `useActionAdvisor.js:59-70` passes NEITHER. A 9-handed table would be
      evaluated with a HEADS-UP fold model on 100% of hands.
    - `gameTreeEvaluator.js:791` defaults `effectiveStack = null`, and `useActionAdvisor` does not
      pass it because it cannot: `src/reducers/gameReducer.js` has no stack field anywhere (direct
      grep: zero matches for `stack`). SPR — the variable the founder's own doctrine names as the
      cause of fear-driven passivity in medium hands — is not merely unmodelled on the live path,
      it is UNRECORDABLE.
    - `useActionAdvisor.js:41` defaults `rakeConfig = null`, and no caller supplies one. The online
      path builds one (`OnlineAnalysisContext.jsx:51-55`); the manual path has no equivalent.
      WS-333 measured the omission at ~4.8pp of required equity for a live blind defender.

  Shipping that puts a heads-up fold model on a nine-handed table with rake omitted, and it replaces
  three constants the founder can distrust on sight with an EV number he will trust. That is
  strictly worse than the current state, which is why the roundtable ruled it harmful-in-isolation.

  THE HONEST ORDERING, AND IT IS THE STRUCTURE OF THIS TICKET:
    (0) RECORD STACKS. A per-seat stack field in `gameReducer`, an entry surface for it, and
        persistence. Nothing downstream of this is honest without it — and note that the corpus
        backtest has the same hole from the other side
        (`assumptionEngine/__backtest__/handStateReconstructor.js:254` hardcodes
        `effectiveStackBB = 100`), so SPR is currently a CONSTANT in both the scored figure and the
        live path. Step 0 is shared infrastructure, not live-path-only work.
    (1) THREAD MULTIWAY. `numOpponents` and `opponentModels` from the live seat state. The live
        table is the one surface where multiway is the NORMAL case, and per
        `exploitEngine/CLAUDE.md` "players remaining means WHO, not how many" — resolve the seat
        list through `liveGameContext.buildSeatsToAct` / `preflopFoldResolver.resolveSeatFoldToRaise`,
        do not pass a count and a per-opponent constant.
    (2) MONOTONICITY OR DEPTH DISCLOSURE. Refinement depth is wall-clock gated
        (`gameTreeEvaluator.js:814` `refinementBudgetMs = 2000`, `:822` `Date.now()`), and WS-378
        measured that 80% of top-action flips are depth-1→2. Wiring the live path FIRST would take
        the non-determinism from 0% of the founder's hands to 100% of them. Either refinement is
        asserted monotone, or the surface says which depth produced the answer.
    (3) WIRE. Only then, and behind the existing `LiveAdviceBar` contract rather than a new one.

  THE SEQUENCING HAZARD IS THE POINT OF THIS TICKET. Each of (0)-(2) is independently justified;
  (3) without them converts three visible constants into one invisible, non-reproducible,
  structurally-misconfigured number. The ordering is not caution, it is the difference between an
  improvement and a regression.

  RANK. Below the backtest-integrity family and below WS-392. The founder has accepted thin live
  volume: mechanism is scored on the corpus and live data then MOVES it (POKER_THEORY §11.5
  admissibility), so a defect that does not touch the scored figure does not outrank one that does.
  This one touches the scored figure only through step (0), which is shared with the backtest.
accept_criteria: |
  - THE §11.9 ARM SCORE FROM WS-392 IS READ BEFORE THIS TICKET IS SCHEDULED. That run prices the
    shipped three-literal rule against the engine on an identical decision set. If a corrected small
    rule recovers most of the engine's edge, this project's remaining value is the residual and it
    must be re-priced against that number rather than assumed. This is a gate, not a formality.
  - EACH STEP CARRIES ITS OWN EV DELTA, MEASURED BY THE STANDARDIZED METHOD ON AN IDENTICAL DECISION
    SET. Not "the advisor now renders on the live table". Specifically:
      * step (0): re-run the corpus scored figure with real per-hand effective stacks replacing the
        hardcoded 100bb and report the EV delta and the change in the SPR distribution. Direction is
        NOT predicted — 100bb is a plausible central value and the effect could go either way; that
        is exactly why it must be measured rather than argued.
      * step (1): re-run with `numOpponents`/`opponentModels` threaded on multiway decisions only,
        and report the EV delta on that subset. Expected direction: fold equity DOWN and hero
        aggression DOWN multiway, since a heads-up fold model understates how often at least one of
        several opponents continues.
      * step (3): report the EV delta of engine advice vs the WS-392-corrected rule on the live
        decision set, which is the number that justifies the whole project.
  - NO STEP SHIPS BEFORE ITS PREDECESSOR. Enforce it structurally, not by discipline: the live
    producer must REFUSE to construct an `evaluateGameTree` call that omits `effectiveStack` or
    `numOpponents` on a table with more than two live seats, rather than letting the defaults apply.
    `exploitEngine/CLAUDE.md`'s standing preference is "prefer unrepresentable to validated" — a
    default that silently means "heads-up, no rake, unknown stacks" is precisely the representable
    wrong state to remove.
  - THE RAKE CONFIG IS RESOLVED AND STATED, NEVER INFERRED FROM A STAKE LABEL. The online provider
    states `source: 'ignition'` by construction because it knows its venue. The manual path knows
    its venue too — it is live. Resolve through `rakeResolver.resolveRakeConfig` with the venue
    stated, and surface WHICH rake the numbers were computed under, including when the answer is
    "unknown", since an unknown rake is not a zero rake.
  - THE EXISTING CONSUMER CONTRACT IS REUSED, NOT FORKED. `LiveAdviceBar` already renders this
    object (`:181-390`) and the Ignition side panel renders the same shape. A second render path
    for the same data is how the two surfaces drift, and the confidence badge (WS-394) is already
    an instance of that drift. Assert that both surfaces consume the same producer output shape.
  - REPRODUCIBILITY IS DEMONSTRATED ON THE LIVE PATH SPECIFICALLY. Identical inputs, two runs on the
    founder's phone under different load, identical top action — or the surface states the depth it
    got. WS-379 measured desktop and phone disagreeing on identical inputs; that must not become the
    live experience.
