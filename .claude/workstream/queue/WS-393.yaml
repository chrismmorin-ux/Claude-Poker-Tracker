status_note: |
  Premises re-verified against HEAD by reading the code.

  VERIFIED AS STATED:
    - `OnlineAnalysisContext.jsx:51-55` rake resolution with `source: 'ignition'`; `:57-60` the
      `useLiveActionAdvisor` call; `:68-70` the `pushAdvice` effect.
    - `useSyncBridge.js:329` — `setLiveHandState(event.data)`, inside the `window` message handler,
      after `validateLiveContext` and a debounce key. Sole writer confirmed.
    - `render-coordinator.js:386` — `const topRec = snap.lastGoodAdvice?.recommendations?.[0];`
    - `gameTreeEvaluator.js:791` `effectiveStack = null`, `:792` `numOpponents = 1`,
      `:793` `opponentModels = []`, `:814` `refinementBudgetMs = 2000`, `:815` `onFastResult = null`.
    - `useActionAdvisor.js:59-70` — the `evaluateGameTree` call passes `villainRange`, `board`,
      `heroCards`, `potSize`, `villainAction`, `villainBet`, `playerStats`, `villainModel`, `trials`,
      `rakeConfig` and nothing else. Neither `numOpponents` nor `opponentModels` nor `effectiveStack`.
    - `useActionAdvisor.js:41` — `rakeConfig = null` default.
    - `src/reducers/gameReducer.js` — grep for `stack` returns ZERO matches. Effective stack is
      genuinely unrecordable from the manual table today, not merely unpassed.
    - `CommandStrip.jsx:88` and `LiveAdviceBar.jsx:181` both consume the same context object.

  ADDED, NOT IN THE RUN RECORD: `LiveAdviceBar.jsx:181-390` is a COMPLETE live-side renderer for the
  game-tree object — sizing, fold%, reasoning, advantage badges, risk, staleness, flop breakdown —
  all gated on the same `useGameTree` boolean. The run record establishes that the Ignition side
  panel renders `topRec`; it does not note that the LIVE bar does too. That strengthens the "second
  producer, existing contract" framing considerably: the live consumer is not merely possible, it is
  already written and already dead.

  NOTE ON A NEIGHBOURING CLAIM, NOT FILED HERE: the run record's `backtest_contaminants` states that
  `gameTreeEvaluator.js:602-603`'s stale 0.75 is guarded by `if (numOpponents > 1)` and therefore
  fires only in the backtest and never on the live path — "exactly backwards from how the external
  ticket framed it". That is a backtest-integrity item and belongs to that batch; it is recorded here
  only because it is the same `numOpponents` default and the two tickets must not both edit it.
