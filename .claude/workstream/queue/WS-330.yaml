decision_flags:
  - "Is the register ranked by PROBABILITY of being wrong, or by EXPECTED DAMAGE if wrong? Population mismatch is near-certain but its damage is bounded and known; a leakage channel is unlikely but would invalidate everything. Recommend ranking by expected damage (probability x contamination breadth) and showing both components, since that is what should drive what gets measured next."
