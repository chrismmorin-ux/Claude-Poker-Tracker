status_note: |
  DUPLICATION IS DELIBERATE AND MUST BE RESOLVED BEFORE WORK STARTS — see the first decision
  flag. WS-254 exists and is the same defect. This ticket was filed anyway because the WS-325
  audit produced two things WS-254 does not have: the measurement that every population cell
  trips both founder-facing thresholds, and the reference table (shipped after WS-254 was
  written) carrying the same denominator in all 14 rows. Filing it silently as a fresh P0 while
  a P2 duplicate sits in the queue would be the worse error, so the overlap is stated here
  rather than buried.

  Premises re-verified against HEAD by reading code, not by trusting the commit message:
  all 14 rows enumerated from `handhqReferencePool.js` at runtime and `foldTo3Bet.n` confirmed
  equal to `threeBet.n` in every one, with the percentages in the table above computed from
  those k/n; `tendencyCalculations.js:243` (`facedRaisePreflop` on any preceding raise), `:245`
  (`foldTo3BetCount`), `:342-344` (the division); `weaknessDetector.js:464` (`> 65`);
  `villainObservations.js:58` (`foldTo3BetMin: 60`) and `:328` (the gate);
  `preflopFoldResolver.js:27-34` (the correct-consumer header);
  `docs/research/mass-pool-data-2026-07-25.md:20` (49.9% / 38.8% / 11.0%, n=1.83M).
staleness_update: |
  2026-08-07 (methodology sweep, facilitator-verified at HEAD): THE CODE FIX HAS LANDED.
  villainObservations.js:80 (foldTo3BetMin removed), weaknessDetector.js:478-490 (rule renamed
  pf-overfolds-vs-preflop-raise, bar from FIELD_FOLD_VS_PREFLOP_RAISE), n back-computation removed
  (villainObservations.js:400-403), preflopFoldQuantities.js exists. This ticket's premises cite
  line numbers that no longer exist. RESIDUAL ONLY: tendencyCalculations.js:342-343 still computes
  a field NAMED foldTo3Bet on the facedRaisePreflop denominator; handhqReferencePool mirrors it in
  14 rows; no extractor computes true fold-vs-3-bet (corpus value exists at handhqReferencePool.js:99-106,
  49.9 percent vs misnamed 82.3). Reprice from P0 to the rename+extractor residual; dedupe with WS-254.
