decision_flags:
  - |
    OPEN — WHETHER THIS TICKET AND WS-254 ARE ONE PIECE OF WORK. They are the same defect.
    WS-254 (P2, backlog, score 14.0, filed 2026-07-22) owns the definition audit and already
    carries the 49.9% evidence in its status_note. This ticket owns the measured consequence
    and the reference-table instance, which postdates it. Doing them separately means touching
    `extract3BetStats` twice and re-running the parity suite twice. The founder should decide
    whether to merge them, or close WS-254 into this one — but the priority gap is itself the
    finding: WS-254 sat at P2 for two weeks because nobody had measured that the population
    trips its own detector.
  - |
    OPEN — WHAT THE CORRECTED WEAKNESS RULE SHOULD SAY WHEN n IS SMALL. The narrow denominator
    (raised, then faced a 3-bet) is a much rarer event than "faced any raise". On the founder's
    live sample a villain may have single-digit observations. `villainObservations.js:326-328`
    currently back-computes its denominator from the percentage
    (`foldTo3BetCount / (pct.foldTo3Bet / 100)`) — a reconstruction that recovers
    `facedRaisePreflop`, not faced-3bet, so the sample gate is also measuring the wrong thing
    and will need re-setting once the true n is available directly.
