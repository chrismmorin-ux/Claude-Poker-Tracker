status_note: |
  Premises re-verified against HEAD by reading code, not by trusting the commit message:
  `poolBaseline.js:262` (the JSDoc `@returns {{stats, meta}}`), `:264`
  (`resolveReferenceCounts` definition), `:304` (the meta literal with `minedLabel`,
  `referenceBb`, `requestedBb`, `seatBucket`), `:369` (the call in `resolvePoolPriors`),
  `:380-381` (`reference.stats[stat]` then `blendPrior(prior, ref.k, ref.n, cap)`), `:398`
  (`return result` — the bare map). A repo-wide grep for `resolveReferenceCounts` outside
  `poolBaseline.js` returns only `poolBaseline.test.js` and two comments in
  `scripts/backtest/`, confirming no consumer reads `meta` anywhere.

  Cross-reference verified rather than asserted: WS-284's residual is filed as WS-363, whose
  description records `derivePercentages` returning raw point estimates with the prior surviving
  only in an additive `intervals` field — the same computed-then-discarded shape one layer
  downstream of this one.
