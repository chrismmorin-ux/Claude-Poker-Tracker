decision_flags:
  - |
    OPEN — WHAT SHAPE THE PRIOR BECOMES. Today `resolvePoolPriors` returns
    `{ vpip: 0.286, ... }` and every caller treats those as numbers. Turning them into objects
    is a breaking change at every call site; adding a parallel `meta` map beside the numbers
    preserves the callers but recreates the exact structure that let this happen — a value and
    its provenance in two places, where a caller can hold one without the other. WS-363's
    decision flag records the same choice one layer up, about `intervals` beside the point
    estimates. Decide once, for both layers, or the two layers will disagree.
  - |
    OPEN — WHETHER THE DISPLAY PATH AND THE MODEL PATH WANT THE SAME THING. A surface showing
    "pool VPIP 28.6%" is reporting a summary and may not want the apparatus. The model needs the
    evidence weight. If both shapes are kept they must be named so they cannot be confused at a
    call site — the same requirement WS-363 records, for the same reason.
