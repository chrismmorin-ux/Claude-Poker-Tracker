decision_flags:
  - |
    OPEN — WHETHER THE SWEEP SHOULD ASSERT GUARDEDNESS, NOT JUST ENUMERATION. The current test
    proves every reacher is LISTED. It cannot prove any of them is guarded — the reason strings
    are prose, and a module could flip from GUARDED to unguarded without the test noticing, which
    is the same prose-versus-structure defect WS-369 fixed in the fault register. Making it
    structural means detecting a `LeakageGuard` construction (or a declared mode constant) in the
    source rather than reading a sentence about one. That is a real widening of this ticket and
    should be decided rather than absorbed.
  - |
    OPEN — WHETHER THIS SCRIPT SHOULD EVENTUALLY SCORE CORPUS HANDS. "What does the declared
    strategy do" invites "and what did the field actually do at the same decisions", and the
    corpus can answer it. If that is on the roadmap this ticket is a prerequisite rather than
    hygiene and its priority should rise. If it is not, P2 is right. The founder should say which.
