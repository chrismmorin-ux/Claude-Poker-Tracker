status_note: |
  Premises re-verified against HEAD by reading the code, not by trusting the commit message:
  `run-strategy-profile.mjs:36` (`loader.load('/src/utils/exploitEngine/handhqReferencePool.js')`),
  `:41-43` (the `HANDHQ_REFERENCE_STAKES.find` and the two k/n rate reads), `:44` (the entry map
  read from disk — the actual data source), `:47` (`profileStrategy(map, poolRates, ...)`), and a
  grep of the whole file for `LeakageGuard`/`leakage`/`REFERENCE_` returning no guard construction;
  `scripts/__tests__/entryEvaluatorGuard.test.js:73` (`CORPUS_ARTIFACTS`), `:81-95` (the `ALLOWED`
  map), `:91-94` (this module's entry, ending "UNGUARDED"), `:97-107` (the sweep that enumerates
  reachers by import/loader-load regex).

  Filed at P2 deliberately, the same call WS-375 made about itself and for the same reason: there
  is no live consequence, and it is filed only because the failure it guards against is SILENT.

  One structural observation recorded here rather than buried in the fix: the sweep enforces
  ENUMERATION, not guardedness. Editing the allowlist string to say "GUARDED" would satisfy the
  existing test whether or not a guard was added. That is why the accept criteria require a test
  that fails at HEAD independently of the allowlist edit.
