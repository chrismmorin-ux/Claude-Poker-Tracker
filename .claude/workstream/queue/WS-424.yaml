decision_flags:
  - |
    OPEN AND THE FIRST ONE — DOES THE BARRIER SHIP AT ALL, GIVEN THAT ITS OWN FALSIFIER MAY DELETE IT?
    The greenfield arm pre-registered that if withholding buys less than 5 points of mechanism-
    correctness, the barrier "should be deleted", and said so in advance specifically so it could not
    be renegotiated. That is the right discipline and it creates a real sequencing question: build the
    barrier and risk deleting ~180 lines, or run the A/B first using `permissions.deny` (zero code) as
    the withholding mechanism and build the hook only if the effect is real. The second is cheaper and
    weaker — the static deny list cannot express per-task withholding, so the A/B would test a
    coarser treatment than the one being proposed. The founder should decide, because it trades cost
    against how much the study actually licenses.
  - |
    OPEN — WHETHER THE COMPACT TIER IS POKER DOCTRINE, REPO METHOD, OR BOTH. `docs/context-architecture.md`
    designs a poker-doctrine light tier (WS-423); this ticket designs the injection channel. They are
    orthogonal by construction — one is content, one is position — but there is exactly one compact
    tier and it has a hard 2,000-byte ceiling, so they compete for it. Either the channel carries both
    and the ceiling is split with a stated priority order, or WS-423's light tier becomes a FILE loaded
    by bundle rather than an injection — which is the two-tier storage design this comparison ruled
    against. Deciding this late means one of the two designs gets rebuilt.
  - |
    OPEN — WHAT HAPPENS TO THE PRE-REGISTERED NEGATIVE RESULT. `docs/context-system-comparison.md` §3
    reports that P1 and P2 both failed and therefore, by the criterion fixed in advance, the
    context-drag hypothesis is NOT SUPPORTED for design tasks. The post-hoc refinement (both failed on
    the implementability clause, and the drag ordering itself came out monotone as predicted) is
    weaker evidence than the pre-registered rule, and it is the refinement this ticket is built on. If
    the founder weights the pre-registered negative as controlling, the honest consequence is that
    S6/S7/S10's withholding machinery is unjustified and this ticket shrinks to S1–S5 plus the four
    defect fixes. That is a legitimate reading of the founder's own instrument and the ticket must not
    quietly assume otherwise.
