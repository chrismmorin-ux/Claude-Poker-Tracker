status_note: |
  EVERY LOAD-BEARING CLAIM IN THIS TICKET WAS VERIFIED AGAINST THE RUNNING REPO BY THE JUDGE, WHO
  PRODUCED NONE OF THE ARMS. Verified directly, not taken from any arm's text:
    - `.claude/hooks/git-guard.cjs:276` — `process.exit(2)` at exactly that line.
    - `.claude/settings.json` — `PreToolUse` matcher `"Bash"` only; no `Read`/`Grep`/`Glob` matcher
      exists; `permissions.deny` is present and EMPTY.
    - Global `~/.claude/settings.json` — `PreToolUse` matcher `"Write|Edit|NotebookEdit|Bash"`, which
      is the direct proof that matchers take arbitrary pipe-separated tool names.
    - `kit/hashes-3.8.5.yaml:233` — `cwos-reconcile.js`, manifest `sha256:700d470d…`; the file on
      disk hashes to `sha256:cdc827a3…`. `kit/scripts/cwos-bundle-validate.js` is ABSENT from the
      manifest; `kit/scripts/lib/cwos-bundle-validate.js` is present at :286.
    - `kit/scripts/cwos-verify.js:596` — `require('./lib/cwos-bundle-validate')`.
    - `git rev-parse --git-path hooks` → `C:\Users\chris\OneDrive\Desktop\Claude-Poker-Tracker\.git\hooks`;
      `.git/hooks/` holds only `.sample` files; `kit/scripts/git-hooks/` holds six real hooks.
    - `.claude/hooks/readiness-gate.cjs:9` ("a banner shown every session is a banner nobody reads by
      week three") and `:12-15` (the kit/-is-overwritten constraint), both read verbatim.
    - `.claude/hooks/retreat-detector.cjs:6-11` — the recorded reasoning for blocking rather than
      warning, read verbatim.
    - `grep` for `writeFile|appendFile|cwos-event` across `.claude/hooks/*.cjs` → NOTHING. No hook
      records that it fired; recurrence is uncountable today, which is what makes S10's `fire_count`
      rule new rather than a restatement.
    - `FIND-014.yaml:11,22` — `run_id` and `dedup_key` both real, so S10's promotion query is
      runnable against existing data.
    - `Four Motivations` occurs in 3 files repo-wide, all of which are POKER_THEORY.md or documents
      about it — the names-do-not-travel measurement, re-run independently rather than taken from
      `docs/context-architecture.md`.
    - 35 files in `.claude/agents/`; 42 `.md` under `docs/design/personas/` (40 in core/situational).
      Arm A said 35/43, Arm B said 38/40 — both close, neither exactly right, and neither claim is
      load-bearing.

  ONE ARM'S CLAIM WAS REFUTED AND IT IS THE MOST CONSEQUENTIAL ONE IN THE COMPARISON: Arms B and C
  both asserted withholding cannot be enforced. It can. See the description.

  THE COMPARISON'S OWN CONFOUNDS, CARRIED HERE SO THIS TICKET IS NOT READ AS A CLEAN 3-0: Arm B's
  brief was written by Arm C's author, so the 2-1 majority against the greenfield arm on the
  withholding question was never two independent judgements. Arm A was not fully greenfield — the
  harness injected both CLAUDE.md files, all five `.claude/rules/*.md`, and MEMORY.md before its first
  action, and it read the bundle validator's header as permitted source, which describes Arm B's
  design. Arm A disclosed all of that unprompted and at length. Arm B answered a narrower brief
  (roughly R7–R11), so its silence on R1–R6 is scope; its silence on R14 is not.
