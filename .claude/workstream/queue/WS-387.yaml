status_note: |
  Premises re-verified against HEAD by reading the code, not by trusting the roundtable record:
    - `src/utils/exploitEngine/gameTreeSizingHelpers.js:162` — the signature, exactly as quoted
      (`rates, priorAction = 'call', foldRate = 0.45`); `:164` the `clamp(1 - foldRate, 0.2, 0.9)`;
      `:167` the `air * survivalRate * 0.7` on the 'call' branch.
    - Every call site enumerated by grep across `src/` and `scripts/`. EIGHT production sites, all
      two-argument: `gameTreeDepth2.js:744,:745,:876,:877,:985,:986,:1073,:1074,:1077,:1078` and
      `gameTreeEvaluator.js:1691,:1692`.
    - `gameTreeDepth2.js:1077-1078` — the double application, read in place. The arithmetic
      0.55 × 0.7 = 0.385, squared = 0.1482, was computed from the source, not quoted.
    - `gameTreeDepth2.js:1087` and `:1158` — `maxNarrowingCount`, confirming the counters track
      narrowings and not rate adjustments, so the WS-303 invariant test cannot see this.
    - `gameTreeDepth2.js:1113-1125` — the WS-303 comment naming `turnCallingRates`/`turnBettingRates`
      as where the continuation effect now lives.
    - `__tests__/gameTreeSizingHelpers.test.js:342-405` — every assertion passes `foldRate`
      explicitly; `:395` uses 0.90 and `:402-403` use 0 and 1.0 to demonstrate the parameter varies
      the output. Read in full rather than sampled.

  ONE PREMISE CORRECTED, AND THE CORRECTION MAKES THE TICKET LARGER RATHER THAN SMALLER. The
  roundtable record (FIND-045) says "both call sites at gameTreeDepth2.js:1073-1078 pass TWO
  arguments." That is true and it understates the scope: there are EIGHT production call sites across
  two files, and all eight pass two arguments. The defaulted `foldRate` is therefore not a depth-3
  problem — it is every depth-2 and depth-3 branch plus the check-raise branch in the evaluator. The
  DOUBLE application is specific to `:1077-1078`; the DEFAULTED constant is universal. The ticket is
  written on the verified scope, not the reported one.

  ONE STALE REFERENCE FOUND WHILE VERIFYING, RECORDED AND NOT ACTED ON.
  `scripts/synthesize-domain-correctness-baseline.py:438` cites this same defect at
  "gameTreeDepth2.js:818-819, 901-906" — line numbers that no longer point at
  `tightenRatesForContinuation` calls. A baseline synthesizer carrying stale line references will
  report on code that has moved. Not filed separately; noted here because it is the same class of
  fact as FIND-046 (a program's own instrument naming locations that do not resolve).

  ON THE `blocked_by: WS-389` — IT IS DELIBERATE AND IT IS THE FOUNDER'S OWN ORDERING RULE, NOT
  CAUTION. The fix here can be WRITTEN at any time; what cannot be done before WS-389 is EVALUATE the
  accept criteria, because every one of them is an EV delta between two arms measured on a harness
  that currently returns different answers on re-run. Under "reproducibility outranks accuracy", a
  delta measured on a non-reproducible harness cannot distinguish this fix from machine load. If the
  founder wants the code change landed before the harness is fixed, that is defensible — but the
  measurement, and therefore the completion of this ticket, waits.

  DEPENDENCY NOT YET MACHINE-READABLE: the standardized-readout spec (which defines the harness, the
  identical decision set, the baseline arm and the minimum detectable effect that the EV criteria
  above depend on) did not exist in `.claude/workstream/queue/` when this was filed — checked by
  grep. This item's EV criteria are written to that spec and should have its ID wired into
  `blocked_by` when it lands. Filed unblocked rather than blocked on a nonexistent ID, because this
  is also the one item in the family whose EV criterion is evaluable with the harness that already
  produced the existing Result Cards.
