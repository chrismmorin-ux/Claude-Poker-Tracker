decision_flags:
  - |
    OPEN — WHETHER THE CONTINUATION EFFECT BELONGS IN A RATE AT ALL. WS-303 moved it here on the
    argument that "villain is stronger for having called" is a rate, not a second likelihood. That
    argument is sound and it was never followed by a measurement of whether the rate it moved into
    is any good. The alternative — recomputing continuing-range composition from per-combo equity
    against the pot odds villain actually faced — needs no anchor table and no bucket labels, and is
    the construction the repo's own doctrine prefers. It is more work and it may be the right answer.
    Price it before threading a parameter into a formula nobody has defended.
