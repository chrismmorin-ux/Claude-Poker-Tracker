description: |
  FOUND BY THE 2026-08-05 DOMAIN-CORRECTNESS BLIND-SPOT ROUNDTABLE (FIND-045), confirmed by the
  cross-critic against source rather than taken from a lens, and re-verified here against HEAD.

  THE MECHANISM, IN THREE LINES OF CODE.

    `gameTreeSizingHelpers.js:162`
      export const tightenRatesForContinuation = (rates, priorAction = 'call', foldRate = 0.45) => {
    `:164`
      const survivalRate = clamp(1 - foldRate, 0.2, 0.9);
    `:167`
      adjusted.air = clamp(rates.air * survivalRate * 0.7, 0.02, 0.99);

  The third parameter is the fold rate the villain model just computed. NO PRODUCTION CALL SITE
  PASSES IT. Read from HEAD, every one of the eight passes exactly two arguments:

    gameTreeDepth2.js:744, :745      (bet-call depth-2, 'call')
    gameTreeDepth2.js:876, :877      (raise branch, 'raise')
    gameTreeDepth2.js:985, :986      (turn→river, 'call')
    gameTreeDepth2.js:1073, :1074    (flop depth-3, flop call → turn rates)
    gameTreeDepth2.js:1077, :1078    (flop depth-3, turn rates → RIVER rates — the double application)
    gameTreeEvaluator.js:1691, :1692 (check-raise branch, 'raise')

  So `foldRate` is 0.45 on every path that runs, `survivalRate` is `clamp(0.55, 0.2, 0.9) = 0.55`,
  and the air multiplier is a fixed `0.55 * 0.7 = 0.385` regardless of whether the villain in front
  of the engine folds 22% or 82%.

  THE DOUBLE APPLICATION IS AT `:1077-1078`, AND IT IS NOT A SECOND VILLAIN ACTION BEING PRICED —
  IT IS THE SAME CONSTANT APPLIED TO ITS OWN OUTPUT. `riverCallingRates` is
  `tightenRatesForContinuation(turnCallingRates, 'call')`, where `turnCallingRates` is already the
  tightened value. Air is therefore multiplied by `0.385² = 0.1482`. Villain's river air rate is
  **14.8% of his flop air rate**, and that figure is a property of the constant, not of the villain.
  In a module whose entire purpose is per-villain modelling, the villain has no influence on it.

  Note what this is NOT: it is not the WS-303 defect. WS-303 was a third *narrowing* applied when a
  card was dealt, and it was fixed. The comment WS-303 left at `gameTreeDepth2.js:1113-1125` says
  explicitly that the "villain is stronger for having called" effect "is carried by `turnCallingRates`
  / `turnBettingRates` above, which is where it belongs — a rate, not a second helping of the same
  likelihood." WS-303 RELOCATED an effect into this channel and did not look at what the channel was
  computing. The channel is computing a constant.

  WHY NO EXISTING GUARD CATCHES IT.
    - It is invisible to `holdingKnowledge`. The provenance counters at `gameTreeDepth2.js:1087` and
      `:1158` count NARROWINGS, and this is a rate adjustment, not a narrowing. `maxNarrowingCount`
      is correct at 2 while the rates have been tightened twice. The WS-303 invariant test passes.
    - It runs in the OPPOSITE direction from the inflated-fold-equity family that most of this
      repo's guards were built for. Tightening villain's continuing range too hard makes hero
      UNDER-barrel; the guards in `exploitEngine/CLAUDE.md` are aimed at the reckless direction.
    - AP-RL-01: the adjustment is keyed on bucket LABELS (air/draw/marginal/strong/nuts) with fixed
      multipliers, which is the "DO NOT use bucket labels when per-combo equity is available"
      anti-pattern. Per-combo equity is in scope at both `computePerComboEV` call sites.

  THE TEST SUITE IS EVIDENCE AGAINST THE CODE, IN THE SHIPPED-BUT-INERT SHAPE. Every assertion in
  `__tests__/gameTreeSizingHelpers.test.js:342-405` passes `foldRate` EXPLICITLY (`0.45`, `0.90`,
  `0`, `1.0`) and asserts the parameter behaves correctly — including `:395` and `:402-403`, which
  demonstrate that varying it changes the output. The parameter is therefore proven to work and
  proven to be unreachable, in the same file. This is the `perceivedHeroRange` / `predictionAudit`
  failure mode recorded in memory (`feedback_shipped_but_inert_capability`): a capability behind an
  optional parameter no call site passes.

  WHY IT IS P1 RATHER THAN A TIDY-UP. It is a wrong NUMBER, not absent wiring, and it is wrong today
  in every path that runs — Ignition live play, drills, `computeDepth2Plan`, `replayAnalysis`, and
  THE CORPUS BACKTEST. Under the founder's 2026-08-05 redirect the deliverable is a scored aggregate
  EV figure with per-improvement deltas. Every one of those deltas is measured against a baseline
  that contains this defect, so this contaminates the evidence used to justify every other fix in
  this family, including the fixes whose whole purpose is to make the figure trustworthy.
accept_criteria: |
  - THE EV DELTA IS THE CLAIM, AND IT IS DIRECTLY AVAILABLE HERE. Re-run an existing Result Card on
    an IDENTICAL decision set under three arms — (a) HEAD, (b) the villain-model fold rate threaded
    instead of the defaulted 0.45, (c) single versus double application on the depth-3 river branch
    — and report the aggregate EV delta per arm with a per-branch decomposition (which street, which
    action family, which bucket). Flip counts and rate changes are DIAGNOSTICS and may be reported
    alongside; they are not the claim. A flip count treats a marginal check/bet flip and a stack-off
    flip as the same event, and only EV separates them.
  - EXPECTED DIRECTION, STATED BEFORE MEASURING SO IT CAN BE WRONG: threading a real fold rate should
    move hero toward MORE barrelling against villains who fold more than 45% and less against
    villains who fold less, with the aggregate sign depending on where the corpus pool sits relative
    to 0.45. The magnitude is UNMEASURED. That is an accept criterion, not a claim — do not state a
    number here or in the commit message before the run produces one.
  - THE ARITHMETIC GATE ON THE BACKTEST'S USABILITY. If top-action flips under arm (b) or (c) exceed
    the WS-378 depth-1→2 flip rate on the same decision set, then backtest evidence gathered before
    this fix is not usable as a baseline for any other improvement in this family, and that must be
    written into the Result Card and reported to the founder. This is settled by arithmetic on two
    measured numbers, not by judgement.
  - THREADING, NOT DELETING. The parameter must be supplied at every one of the eight production call
    sites from the fold estimate already resolved in scope, not removed and not given a "better"
    constant. Where a call site genuinely has no per-villain fold rate available, it passes the
    composition estimate the context computed and the code says so in one sentence at the site.
  - THE DOUBLE APPLICATION IS RESOLVED EXPLICITLY, ONE WAY OR THE OTHER, WITH THE REASON IN CODE.
    Either villain's two calls (flop and turn) genuinely warrant two rate adjustments — in which case
    each must use ITS OWN street's fold rate, and the code must say why compounding is correct — or
    the river rates derive from the flop rates once. "It has always been chained" is not a reason,
    and the WS-303 comment two hundred lines below already establishes that this repo distinguishes
    an effect applied per-ACTION from an effect applied per-STREET-TRANSITION.
  - A TEST THAT FAILS AGAINST HEAD, THROUGH `evaluateGameTree` (WS-309 rule). The existing unit tests
    pass an explicit `foldRate` and therefore cannot fail on this defect — they are the reason it
    survived. The new test must construct two villains whose models differ materially in fold rate,
    run the depth-3 path, and assert the resulting river rates DIVERGE. Against HEAD the two must
    come out identical, which is the point.
  - AP-RL-01 IS ANSWERED IN WRITING. The multipliers are bucket-label-keyed with per-combo equity in
    scope. Either the adjustment is reformulated on the equity ratio (per `exploitEngine/CLAUDE.md`,
    "the logistic of equity ratio is always more precise than a bucket lookup"), or a comment at
    `gameTreeSizingHelpers.js:162` records why a label-keyed rate is correct here. Do not leave the
    anti-pattern silently in place after touching the function.
  - THE COMPARATIVE FIGURE RESOLVES TO A RESULT CARD per ADR-009, stamped with
    `manifest.disclaimerRegisterVersion`. The corpus is online-2009 and the founder's game is live
    9-handed 1/2–1/3, so any live reading of the delta is TRANSFERRED, not measured — say so.
