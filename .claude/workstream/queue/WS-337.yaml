description: |
  MEASURED 2026-08-03, ENGINE-FREE. Reproduce with:
    node --import ./scripts/utils/register-src-resolver.mjs \
         scripts/research/build-equity-matrix.mjs --boards 20000
    python scripts/research/spectrum.py equity-matrix.csv
    python scripts/research/verify-cycles.py equity-matrix.csv
  Seeded (mulberry32, seed 20260803) and byte-reproducible — unlike
  generate-preflop-equity-table.mjs, which its own header notes is not.

  THE STRUCTURE. Equity is a bilinear form with E(A,B) + E(B,A) = 1. Centring it gives
  M = 0.5*J + S with S EXACTLY skew-symmetric (verified: max |S + S^T| = 5.6e-17, machine
  zero, not an approximation). Skew-symmetric operators admit no real eigen-axes; they
  decompose canonically into 2D ROTATION PLANES. A rotation in range space is a cycle —
  rock-paper-scissors. So the equity structure of preflop poker decomposes, uniquely, into
  a ranked stack of independent intransitive cycles. This is a theorem about skew matrices,
  not a modelling choice; only the magnitudes were open.

  WHAT THE MAGNITUDES ARE (169x169, 20,000 boards, exact card-removal exclusion; validated
  against published all-in equities, mean error 0.60pp over 12 reference matchups):

    energy share      plane 1 81.9% | plane 2 7.9% | plane 3 2.8%
    planes for 90/95/99% of energy: 3 / 6 / 13

    BUT reconstruction error is the honest metric, and it is much less flattering:
    planes:      1      3      6     13     20
    mean |err|  5.67   3.48   2.57   1.09   0.63   percentage points
    max  |err| 36.7   23.3   19.4   14.1    6.7    percentage points

  TRANSITIVE VS INTRANSITIVE — the load-bearing split. A pure strength ladder is already
  rank 2, so "low rank" alone would be no news. Fitting the best rank-2 ladder:
    - the strength ladder explains 75.2% of S
    - the INTRANSITIVE residual is 24.8% — and it is NOT low-rank: 9 planes for 90% of
      its energy, 21 for 99%.
  So: equity is mostly a ladder, and the part that makes poker a GAME resists compression
  far more than the whole does. Any future compression claim must report this split.

  WHERE THE INTRANSITIVITY LIVES — the most actionable output. Residual magnitude by class:
    MOST cyclic:  AKo, AKs, KQo, AA, AQo, KJo, QJo, KQs, AQs, AJo, KK, KTo, QTo, KJs
    LEAST cyclic: 92s, T2s, 93s, 82s, 72s, T3s, A5s, 73s, 74s, J3s, 83s, 94s, T4s, J2s
  The cyclic structure is concentrated almost entirely in the big-ace / broadway cluster —
  i.e. in exactly the hands that populate raising ranges. The trash is a pure strength
  ladder. This says WHERE strategic subtlety can exist at all, and it is a partition of the
  169 grid that nothing in the repo currently carries.

  CONFIRMED CYCLES in the raw matrix (not the model): 22 > AKo (53.14%), AKo > JTs (59.26%),
  JTs > 22 (53.33%). Also 22 > AQo > QTs > 22, and 22 > AJo > JTs > 22.

  A FAILED PREDICTION, RECORDED. The run also tested a locator heuristic: that classes ~120
  degrees apart in the top residual plane would form raw-matrix triples. It found NONE. The
  heuristic was invalid by construction — it used RESIDUAL angles to predict RAW cycles while
  the transitive component (75% of the structure) is added back in and swamps them. The
  rotation-plane decomposition is untouched by this (it is a theorem); the locator is wrong.
  A valid locator must search the residual operator, not the raw matrix. Recorded so it is
  not re-proposed.

  WHY THIS IS WORTH SHIPPING, not just knowing. rangeProfile.js estimates a 169-cell
  Float64Array per villain per position per action from tens of observations. WS-273 measured
  that the guard rails carry the ENTIRE edge (removing the ladder: -3.98% lift; accepting
  n=1 evidence: +1.69% -> -0.07%). Scaffolding that load-bearing is the signature of an
  ill-posed estimation problem, and the plausible cause is the basis: ~13-20 coordinates
  reproduce every class-vs-class equity to ~1pp. Estimating 15 coordinates from 40 hands is
  an ordinary problem; estimating 169 cells is not.
accept_criteria: |
  - The 169x169 operator and its skew decomposition are generated by a committed, seeded,
    byte-reproducible script; a test asserts max |S + S^T| < 1e-12.
  - The intransitivity map (residual magnitude per hand class) is a committed artifact,
    consumable by other modules — not a number in a ticket.
  - Any compression claim derived from this reports BOTH energy share and reconstruction
    error, AND the transitive/intransitive split. A claim reporting only energy share fails
    review.
  - The estimation claim is tested, not asserted: villain range estimation in the low-dim
    basis is scored against the shipped 169-cell ladder on HandHQ, log-loss, under the
    two-level split (POOL/EVAL partition AND walk-forward). Corpus-mined priors must be
    structurally excluded from the eval fold.
  - The full 169-grid remains available and authoritative. The low-dim coordinates ship as
    an ADDITIONAL lens carrying a measured residual — never a replacement.
  - POKER_THEORY gains a section stating the transitive/intransitive split and the
    intransitivity map, with the measurement cited.
