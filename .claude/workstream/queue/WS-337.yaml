status_note: |
  Filed 2026-08-03. ENGINE-INDEPENDENT: the measurement touches only pokerCore's hand
  evaluator and a seeded board sampler — no villain model, no fold curve, no realization,
  no EV. Founder correctly noted the engine is not accuracy-validated; that caveat does not
