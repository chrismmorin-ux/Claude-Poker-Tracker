description: |
  Design record: docs/research/villain-strategy-inference-2026-08-17.md §1 (D4), §5.4, §8.

  Founder, 2026-08-17: "The greater the hero can know the villain... that's a measurable
  drillable thing."

  TWO PARTS, and the first blocks the second.

  PART A — THE CENSUS, and it is the one open question the repo cannot answer about itself.
  Everything measured so far is corpus-side: online, 2009, 50NL. The founder's game is live
  9-handed 1/2-1/3, so the pool half is a TRANSFERRED prior, not a measurement. The
  villain-specific half has to come from hands the app itself recorded, and nobody knows how
  many hands exist on any single real villain. That number decides whether this program ships
  against live opponents or stays a corpus instrument.
  Measure: hands per identified villain, showdowns per villain, decisions per villain, and the
  distribution across the player book — from IndexedDB on device, not from the corpus.

  PART B — THE DRILL SURFACE. Per villain per situation class, report BOTH:
    achieved prediction accuracy, AND the estimated entropy ceiling.
  98% accuracy is attainable exactly to the extent the villain plays PURELY; a villain
  genuinely mixing 60/40 caps any rule set at 60% in that spot. Where achieved ~= ceiling the
  rule set is complete; where it is far below, there is more rule to find. And the ceiling is
  itself the product — a villain predictable at 98% is a villain counterable almost perfectly,
  so the readout says which seat is worth attention.
  Current shipped baseline: villain-action log-loss 0.757 (WS-436, n=10,147). A calibrated
  model right 98% of the time over a 3-4 action set scores ~0.12.

  SCOPE SPLIT 2026-08-17: WS-539 owns the Lesson itself (read-warrant -> drill item, full axis
  census). This item keeps PART A (the live hand census, which nothing else can answer) and the
  drill SCORE — achieved accuracy against the entropy ceiling, per villain per situation class.

  GATES BIND. This is a new surface, possibly targeting an underserved persona. Per
  docs/design/LIFECYCLE.md, Gate 1 (Entry: scope, personas, JTBD, gap analysis) comes first,
  and Gate 4 requires a surface artifact in docs/design/surfaces/. Do not write production
  code before both. If Gate 1 comes back YELLOW or RED, Gate 2 (Blind-Spot Roundtable) runs —
  and per .claude/rules/engine-execution-fidelity.md a declared roundtable is executed by
  spawning those agents or not at all.
accept_criteria: |
  - Part A: live per-villain hand/showdown/decision census reported, with the distribution,
    not just a mean. States plainly whether the live sample can support per-villain inference.
  - Part B: Gate 1 complete with a GREEN/YELLOW/RED verdict recorded.
  - Surface artifact in docs/design/surfaces/ before any production code.
  - Every displayed figure carries its n and its conditioning set; any corpus-anchored figure
    is labelled TRANSFERRED, not measured.
