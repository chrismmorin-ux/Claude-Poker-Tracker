status_note: |
  Filed 2026-08-02. Founder asked for a boring, highly-trusted statistical pier post to
  attribute EV to perfect play against the pool. Analysis separated three conflated objects
  (least-squares fitting, max-EV best response, equilibrium) and established that the best
  response is computable TODAY from the already-mined behaviour policy, provided it is held
  out — which is the difference between a trusted anchor and an inflated fantasy.
