status_note: |
  READ `.claude/context/POKER_THEORY.md` AND `src/utils/rangeEngine/CLAUDE.md` BEFORE EDITING —
  mandatory guardrail for this directory.

  RELATIONSHIP TO WS-270: WS-270 is the 4-bet TREE (a third scenario with its own subclasses).
  This is narrower and prior — the decision point is not emitted at all, so even parent-level
  `threeBet` / `coldCall` / `fold` counts from the opener's seat are missing. Fixing emission
  does not require the tree to exist. Cross-reference both ways before starting.

  PRIORITY ARGUMENT: filed P0 because it is a silent data gap on a stat the model already
  treats as estimable (`foldTo3Bet`, pseudocount cap 10, POKER_THEORY §6.5a). Unlike a wrong
  number, a missing observation produces no symptom — the range model simply never learns from
  those decisions, and nothing anywhere reports the absence.
