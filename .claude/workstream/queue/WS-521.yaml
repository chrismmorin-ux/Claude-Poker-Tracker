id: "WS-521"
title: "The opener's response to a 3-bet is emitted NOWHERE — derivePreflopDecisions guards its second emission on `if (seatLimped)`, so open-then-4bet produces exactly one record and the most common aggressive preflop trajectory is invisible to the range model"
