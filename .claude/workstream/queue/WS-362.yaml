decision_flags:
  - |
    SEQUENCING WITH WS-318 — READ BEFORE STARTING. This ticket makes the match rate
    observable; WS-318 decides WHAT the match should compare. Landing this one alone would
    make `"Pattern: <label> — occurrence #n in flop agg spots"` render for the first time,
    under a semantic (aggressor-status) that WS-318 flags as probably wrong and that only
    the founder can settle. That is worse than the dead feature, because it looks like
    working output.

    So either the two land together with the semantic chosen, or this one lands with
    `matchHeroWeakness`'s emitting branch held back until it is. Not: repair and see.
  - |
    OPEN — what `buildQuickSituationKeys` should do about board texture. It has no board in
    scope and hardcodes 'unknown'. Options: thread the board through and compute the texture
    (aligns it with the accumulator, costs a plumbing change), or make significance match on
    a documented subset of identity axes (cheaper, but then "a matching weakness" means two
    different things in two places — the exact divergence WS-317 existed to end). Whichever
    is chosen must be written down; both are defensible and they are not equivalent.
