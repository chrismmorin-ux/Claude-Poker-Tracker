  - DONE: kit/scripts/cwos-fleet-compute.js status|rank|feed|validate, runs from either end.
  - DONE: /next Step 1b surfaces node1 state; information, never a gate.
  - DONE: Fleet-ComputeFeeder on node1, every 2h + at boot, pulls then feeds.
  - DONE: WS-320 dispatched and verified running on the full 21,782-file corpus.
