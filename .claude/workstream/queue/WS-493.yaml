description: |
  cm-node1's compute runner was never the missing piece. Measured 2026-08-16: it had ticked
  cleanly every five minutes since 2026-08-15 and 314 of its 379 ledger events were
  `tick_idle` — ~27 hours of a machine waking up to discover it had nothing to do — while six
  `runs_on: node1` items sat unclaimed in this repo's queue. The supply chain was missing.

  Four links were broken, and the first is the one that would have been missed by patching
  the obvious place:

  1. `runs_on` never reached state. The workstream reducer's ITEM_FIELDS whitelist omitted
     it, so all 174 labels from the 2026-08-05 backfill were invisible to every consumer.
     Patching only the cwos-next.js candidates projection would NOT have worked.
  2. No item was executable. A WS-*.yaml is prose; the runner needs argv + expectFiles.
  3. Nothing ever asked. /next had no fleet step.
  4. node1's claude-poker-tracker clone is absent from repo-pull.ps1's $Repos, so nothing
     refreshes it on a cadence (see WS-495).
accept_criteria: |
