status_note: |
  Established 2026-07-27 at founder request. Two founder decisions shaped it:

  1. HERO-EV IS REQUIRED (C3). Every metric the repo can currently produce scores
     VILLAIN ACTION PREDICTION. Nothing measures whether hero's recommendations make
     money — the §6.1-6.4 value/bluff/MDF spine between a good villain model and a
     good recommendation has never been scored, and WS-277 already found a gap in its
     multiway half. The founder would be memorizing the output of that unmeasured
     layer. Gate blocked on WS-287 building the instrument.
  2. THE FLAG BLOCKS. Founder chose halt-until-acknowledged over a passive banner.

  Backstop: the SessionStart hook fails open by design, so a silently broken checker
  looks exactly like a closed gate. Run `node scripts/readiness/model-readiness.mjs`
  by hand periodically — the /pulse domain-correctness protocol is the natural home.
