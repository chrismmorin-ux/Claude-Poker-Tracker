description: |
  THIS ITEM IS A FLAG, NOT A TASK. It does not get "worked". It opens.

  The founder's purpose for the whole domain-correctness push (stated 2026-07-27):

    "I want to set a stake in the ground somewhere, where the model and engine have
     adapted enough to be reliable and consistent... Thats my que to study the final
     product we've built knowing how it was built and all its levers and mappings."

  So the bar was written down FIRST, in numbers, before anyone knew whether it was
  easy: docs/domain/MODEL_READINESS_GATE.md. Six criteria. When all six pass, the
  gate opens, sprint composition HOLDS, and the founder is told to sit down and study.

  WHY THE BAR WAS FIXED IN ADVANCE. WS-285 found the engine's context hierarchy had
  been ordered for months by an unmeasured code comment that turned out to be roughly
  the inverse of the truth. A readiness bar defined after the fact is the same failure
  wearing a milestone's clothes — "good enough" gets declared at whatever the numbers
  happen to be, and it feels earned. Fixing the numbers first is the only defence.

  DO NOT EDIT A THRESHOLD TO OPEN THIS GATE. Moving a bar is a founder decision,
  recorded via /decide with its reason. Moving one silently voids the whole artifact.

  THE TWO THINGS THE GATE PROTECTS. The founder intends to MEMORIZE this theory and
  use it at a table. That makes accuracy AND stability load-bearing: an accurate but
  still-churning theory is a draft you will have to relearn; a stable but wrong one
  teaches errors. The criteria require both.

  BASELINE AT ESTABLISHMENT (2026-07-27, post-WS-285):
    accuracy 58.7% · lift 6.03% · worst calibration error 0.058 · hero-EV UNMEASURED
    Gate status: 0 / 6.
