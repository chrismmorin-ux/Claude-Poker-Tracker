description: |
  Nobody in the 2026-08-19 sweep asked whether the failure they proved is POSSIBLE has already
  HAPPENED. Six experts, ~90KB of analysis, and this ten-minute check was not run by any of them.

  hands records carry timestamps and sessions carry hand counts, so a per-session count mismatch is
  queryable directly from the founder's own IndexedDB. Reading db.version answers whether the v23/v24
  cursor clobber (WS-560) is a live hazard on this device or archaeology.

  HIGHEST INFORMATION-PER-MINUTE ITEM IN THE RUN. It also sets the priority of WS-556 and WS-560: a
  confirmed loss makes them urgent; a clean history makes them preventive. Either answer is worth
  having before the work starts, and the answer is currently unknown rather than unknowable.
