decision_flags:
  - "PRIOR vs TRUTH. Corpus output is an online-pool prior for a live game. The right architecture is almost certainly corpus-derived shape as the PRIOR, updated by the founder's own recorded hands — the same Bayesian pattern POKER_THEORY already mandates for population priors + per-player updates. That also resolves the hero-vs-villain problem raised in the sizing exploration: population prior for villain sizings, the founder's own history for hero sizings. Do not blend them."
  - "Do NOT let the engine's OWN sizing recommendation seed these defaults. That is FIND-038 (the model validating itself). Defaults must come from observed frequencies — corpus or the founder's own recorded actions — never from what the engine thinks the size should be."
  - "If the cells turn out NOT to differ materially, close this and keep the single postflop bucket. A negative result here is worth as much as a positive one and is much cheaper to act on."
