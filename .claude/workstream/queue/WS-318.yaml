decision_flags:
  - "What does 'a matching weakness' mean — same action (contextAction), same role (isAgg), or both? Changes match rate and the user-visible copy. Current behaviour is isAgg by accident, not by decision."
  - |
    OPEN — NEEDS THE FOUNDER, AND IT IS WHY THIS WORK STOPPED. The aggressor-status-versus-
    action semantics choice above is unresolved, and it is not an implementation detail that
    can be settled in passing.

    The sequencing trap: repairing the producers (WS-362) is what makes the match rate
    measurable, but it is ALSO what would make `"Pattern: <label> — occurrence #n in flop
    agg spots"` render for the first time. Today that string is unreachable, so the wrong
    semantic is latent. Land WS-362 without this decision and an incorrect user-visible
    label starts appearing on the founder's screen — a strictly worse state than the dead
    feature, because it looks like working output.

    So the work stopped at diagnosis deliberately. Either the founder settles (a)/(b)/(c)
    and both tickets land together, or WS-362 lands with the emitting branch's copy held
    back until the semantic is chosen. Not: repair the producers and see what happens.
