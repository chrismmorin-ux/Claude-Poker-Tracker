status_note: |
  Filed 2026-07-31 from WS-317. Behaviour is preserved in the migration commit; the variables
  now carry the honest name (`isAgg`, `heroIsAgg`) and each site has a comment pointing here.
  Priority is P1 rather than P0 because it degrades a secondary matching feature rather than
  the engine's EV path — but the wrong string is on screen today.

  ============================================================================
  2026-08-05 — PREMISE TESTED BEFORE FIXING. PARTIALLY REFUTED. NOT STARTED.
  ============================================================================
  The mechanism holds at all three sites; both stated consequences do not. The feature is
  dead (match rate 0), so the string is NOT on screen today — the last sentence of the
  filing note above is wrong, and is left standing rather than edited out because the
  correction is the record. Full evidence in the description's correction block; the
  standing diagnostic is `src/utils/handAnalysis/__tests__/ws318-diagnostic.test.js`
  (green on HEAD, delete on close).

  Title amended the same day: it asserted "far looser than intended", which the measurement
  refutes. Priority left at P1 and status left at backlog — the defect is now known to be
  smaller in user impact (nothing renders) but blocked on a founder decision, and the
  producer half is separately filed as WS-362.
