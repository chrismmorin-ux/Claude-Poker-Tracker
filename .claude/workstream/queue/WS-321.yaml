description: |
  The 2026-08-07 remote session reviewed a founder hand (1/3 live, BTN straddle, 4-way
  all-in — full analysis in docs/hand-reviews/2026-08-07-aks-squeeze-4way.md) and built +
  validated the hand record through the real reducer pipeline. But the founder's actual hand
  record lives in the PWA's IndexedDB on their device; a cloud container cannot write to it.
  This task is the deferred on-device entry step.

  ENTRY SEQUENCE (validated in src/test/aksSqueezeHandEval.test.js Part 1; seat map uses
  dealer = straddler's seat 1, SB 2, BB 3, UTG 4, MP 6, LJ 7, HJ 8, hero CO 9):
    1. Set dealer button = seat 1; hero seat = 9. Hero hole cards A♠ K♠.
    2. Record the BTN straddle $7 FIRST — the reducer rejects a straddle after any
       preflop action (straddle-first invariant).
    3. Betting actions in order: SB fold · BB call 7 · UTG fold · UTG+1 fold ·
       MP raise 45 (all-in) · LJ fold · HJ call 45 · Hero raise 200 ·
       BTN raise all-in (~1000) · BB fold · HJ call 395 (all-in) · Hero call 750 (all-in).
    4. Villain shown cards: MP 6♥4♥ · HJ 5♣5♦ · BTN K♥K♦. Board was not recorded —
       leave community cards empty (only outcomes are known).
    5. Pot winners (three layers): main $188 → MP · side 1 $1,050 → HJ ·
       side 2 $710 → BTN. Hero mucked.

  DO NOT use Settings → import to shortcut this: exportUtils.importAllData() calls
  clearAllData() first — it is a full restore, not a merge, and would wipe the founder's
  entire hand history. (Candidate follow-up if this bites again: a merge-import path.)
accept_criteria: |
  - Hand exists in the on-device record with the straddle entry, 12 betting actions,
    three per-pot WON attributions, and the three villains' shown cards.
  - Hero cards A♠K♠ attached; board left empty.
  - Existing hand history untouched (no import/restore path used).
