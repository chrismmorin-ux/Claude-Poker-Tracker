status_note: |
  Filed 2026-08-03 from WS-318 (SPR-168). WS-318 routed all three weakness-match sites
  through the shared `weaknessMatchesSituation` predicate, so the semantics are now correct
  and consistent — but at these two sites the predicate is unreachable. This is the
  shipped-but-inert failure mode the engine has hit before (WS-276's `perceivedHeroRange`
  shipped correct and unreachable for months because no call site passed it).

  The third site, `heroAnalysis.matchHeroWeakness`, is LIVE and did receive WS-318's
  behaviour change — it is fed canonical keys.
