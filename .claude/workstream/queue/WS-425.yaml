description: |
  THE FOUNDER'S ASK: "we might glean from each absorbed strategy ran against our standard."
  Published charts, c-bet frequencies, sizing rules and solver baselines, run against the SAME
  decision set through the SAME estimator as the engine, each producing a number in the repo's
  own currency. Not adopted as doctrine — encoded, scored, compared. Where a published rule
  beats the engine on the engine's own metric, that is a MEASURED GAP IN THE ENGINE rather than
  an argument about whose theory is better.

  Design document: `docs/standard-of-record/DECLARED-ARM-SCORING-SPEC.md`. Prototype:
  `scripts/backtest/strategyArm.mjs` + `run-strategy-arms.mjs`, run end to end 2026-08-05.

  THE FINDING THAT REORGANISES THE WORK. The encoding format already exists and has never been
  scored. A Strategy Card (`src/utils/standardOfRecord/strategyCard.js`) IS ADR-009's `Declared`
  surface: `MATCHABLE_AXES` (`:76`), action distributions with bare actions as sugar
  (`desugarAction`, `:99`), a REQUIRED residual clause (`:227-231`), a warrant per rule, a content
  hash, and `evaluateCard` (`:358`) to execute it. It is validated on load — the loader throws,
  not warns.

  AND `evaluateCard` HAS NO CALLER ANYWHERE IN `scripts/backtest/`. Verified by grep. The Declared
  surface can be authored, validated and hashed but never scored. That is the shipped-but-inert
  pattern from the standing memory entry, in its purest form: a capability behind an interface no
  measurement site calls. The gap between "a published strategy" and "a number in bb" was never a
  missing format — it was one missing bridge function. This ticket does NOT define a new encoding.

  WHICH HARNESS, AND THE ONE THAT LOOKS RIGHT AND IS NOT.
    - `teachableArmsProbe.mjs` is a DEAD END for this. Its metric is `deltaLogVsUniform` (`:301`),
      NATS not bb — POKER_THEORY 11.9's 56-57% figure is real, replicates on two sites, and is
      range-prediction quality, not EV. Worse, its arms are the wrong KIND of object: every arm is
      a villain range-NARROWING rule scored on P(villain's true holding), and it is
      showdown-selected (`:167-170`). A published HERO strategy cannot be scored there without a
      category error. What WOULD open it: published RANGE assertions encode as a replacement for
      `buildBaselineRange` at `:180` and score as a villain-prior arm. Different question.
    - The HERO-EV harness is the answer and it is available TODAY. `ipsEstimator.weightFor`
      (`:76`) reads only `piOurs`/`piPool`/`observedAction`/`netBB`; `pairedDelta` (`:204`) reads
      `piOursByArm[id]`; `buildDepthAblationReport` scores each arm by remapping `piOurs =
      piOursByArm[armId]` into the same `estimateEdge` (`:422-423`). None of them knows where the
      distribution came from. Scored on `edgeBB`, which is the founder's stated currency.

  THE INTERFACE IS A SIBLING OF `heroPolicyAt`, NOT A CONFIGURATION OF IT — so this is NOT
  blocked by WS-404 and WS-404 is NOT sufficient for it. WS-404 threads config INTO the engine so
  an arm can vary its SEARCH; that is a real and different need (absorbing a publication as a
  parameter change to our engine). A published strategy is a different FUNCTION.
  `policyAt({ctx, hand, geo, responses}) -> {covered, actions} | {covered: false}`.

  THE ONE AXIS THE CORPUS CANNOT SUPPLY, which is the substantive design content. Every matchable
  axis is on a scored decision — `street`/`texture`/`posCategory`/`isAgg`/`isIP`/`facingAction`/
  `contextAction` off ctx, `sprBand`/`closesAction`/`sBucket` off geometry — EXCEPT `handClass`
  (`situationKey.js:101`). The corpus masks hole cards; a decision has a RANGE, not a hand. So a
  card matching on `handClass` is evaluated ONCE PER SAMPLED COMBO and mixed by range weight, the
  identical construction `heroPolicy` uses for engine advice, over the SAME `sampleCombos` sample.
  TWO CONSEQUENCES: (1) the frequency-vs-decision problem DISSOLVES for any publication that names
  hands — the range does the mixing and we supply no ordering; it is real only for publications
  stating a frequency without saying which hands carry it, which is a property of the publication.
  (2) The card path costs no engine call.

  THE FREQUENCY PROBLEM, for bare frequencies. Three encodings, recorded as DATA on every arm:
  MARGINAL (flat across the class; assumes randomisation independent of holding; THE ONLY ONE
  that may be reported as "the published strategy" because it adds nothing), ORDERED (top X% by a
  strength ordering; assumes an ordering the publication did not supply; HYBRID), TILT (tilt the
  engine's own pi until the class marginal matches; assumes our hand-SELECTION is right and only
  our FREQUENCY is wrong; HYBRID, and the most informative arm for improving the engine because
  it varies one dimension). Ship all three per the "ship both, state the limit of each" doctrine;
  the gap ORDERED-minus-MARGINAL is the value of OUR ordering and is its own finding.

  THE ABSTENTION RULING, which is the part that can quietly lie. Every published strategy is
  partial and the runner's existing rule keeps a decision only if EVERY arm produced a policy
  (`heroEvRunner.mjs:262-270`) — so an abstaining arm silently shrinks the decision set for the
  engine arm, the population control and the PBR ceiling alike.
    FALLBACK.ENGINE (default) measures the MARGINAL CONTRIBUTION of the rule dropped into our
      engine; diluted by coverage, so `coveredShare` must travel with it.
    FALLBACK.POOL measures the rule ALONE, playing population poker elsewhere; edge is roughly
      coverage x covered-edge. Right for ranking two publications, wrong for asking what one adds.
    FALLBACK.REFUSE measures the rule on its own turf AND changes the set every other figure is
      averaged over; REFUSED unless `allowSetChange: true`, never a headline.
  THE DEFAULT COSTS NOTHING, which is why it can be the default: the covered-only figure REFUSE
  is wanted for is already available from the paired delta without changing the set. Under
  ENGINE fallback an uncovered decision produces an identical weight in both arms and carries no
  information about the difference, and `pairedDelta` ALREADY counts exactly that as
  `discordantN`/`discordantShare` (`depthAblationReport.mjs:252-253`). Observed live in the
  prototype: `always-fold` covered 9/30 but discordantN was 7, because the engine folded too on
  two of them — a distinction invisible from coverage alone.

  DETERMINISM CONTROL, with its honest caveat. A strategy arm is pure — no engine call, no RNG, no
  clock — so it is bit-reproducible while WS-411 remains open (`gameTreeEvaluator.js` gates
  refinement on `Date.now()`, working-tree `:954`/`:961`/`:985`; the audit note's `:814,822` is
  stale). BUT its EDGE depends on which decisions survived, and survival depends on the engine
  arms. To measure the engine's run-to-run floor cleanly the strategy arm must run as the ONLY arm
  (`fallback: 'pool'`, which needs no engine at all and which the runner permits). Alongside
  engine arms it controls the ESTIMATOR AND DECISION SET, not the engine's nondeterminism.

  WHAT THE PROTOTYPE ALREADY PROVES (30 decisions, 4 players, 2 of 1231 PS files, depth-1, 155s —
  NOT quotable, both admissibility bars fail on clusters): a non-engine policy scores end to end
  on `edgeBB` with a cluster-bootstrapped CI; the range-marginalization path works (the fixture
  card DECLARES check .70/bet .30 and REALISES check .65/bet .35, the five points being its
  hand-class rule firing on ~7% of range mass); abstention and both fallback rulings work in one
  pass; arm ordering is sign-correct (engine +5.79, always-fold +4.08, uniform +1.47, card -1.04).

  TWO DEFECTS THE PROTOTYPE SURFACED AND FIXED, both of which would have shipped silently:
    - `realisedMarginal` pooled across facing classes produced `{check:.35, bet:.35, fold:.1,
      call:.1, raise:.1}` — an average over two DIFFERENT response sets in which no cell is a
      frequency anything can be checked against. Now keyed by `facingAction`. A "c-bet 65%" claim
      lives in the `none` row and must be read against that row alone.
    - `loadStrategyCardSync` computes NO content hash (only the async `loadStrategyCard` does,
      `:197-198`). The first run stamped `strategyVersion: "schema1+nohash"` — a card whose
      version cannot be identified. Rule order is semantic (first match wins), so a reordered card
      is a different card and the hash is the only thing that says so.
accept_criteria: |
  - THE BRIDGE IS REAL AND THE PATHS DIVERGE. `evaluateCard` is called from the backtest harness
    and a card arm's `piOursByArm` entry differs from the engine arm's on at least one decision in
    a fixed set. Per the standing shipped-but-inert rule, a bridge that arrives and changes nothing
    must be reported as such, not quietly accepted. (Prototype already satisfies this; the ticket
    must not close on the prototype alone — see the last criterion.)
  - THE DEFAULT PATH IS UNCHANGED. A `runHeroEv` call with no strategy arms produces byte-identical
    output to HEAD on a fixed decision set. The arm reordering (engine arms first) must be a no-op
    when there are no strategy arms, and the `geometry` block's move above the arm loop must not
    change a single field on a decision row. The 98 tests in heroEv/heroEvPolicy/heroEvPiers/
    heroEvAdmissibility/depthAblation are the floor, not the ceiling — add a test asserting the
    no-strategy-arm path is identical.
  - A STRATEGY ARM MAY NEVER BE PRIMARY, ENFORCED BY THROW. The primary arm supplies `perCombo`
    (the PBR ceiling, `heroEvRunner.mjs:277-279`) and `evStats` (the optimizer's curse). Naming a
    strategy arm primary would null both while every other figure kept working. Test the throw.
  - THE ABSTENTION RULING IS RECORDED PER ARM AND `REFUSE` IS GATED. `config.strategyArms[].fallback`
    is present on every run; `FALLBACK.REFUSE` throws without `allowSetChange: true`; and a run
    using it carries a caveat saying its absolute edges may not be compared to any other run.
  - THE DECLARED-VS-REALISED FREQUENCY CHECK IS DATA, KEYED BY FACING CLASS. `realisedMarginal`
    is emitted per `facingAction`, never pooled. A publication that says 65% and realises 41% here
    must be visible as a gap in the artifact rather than discovered later by someone re-deriving
    it — the decision set is not the population the author had in mind, and that is a finding.
  - THE CARD IS HASH-IDENTIFIED. Card arms load through the ASYNC `loadStrategyCard` so
    `contentHash` reaches the arm's version string and the replication manifest. A run whose
    `strategyVersion` contains `nohash` must fail rather than write an unidentifiable card.
  - RESIDUAL SHARE IS REPORTED AND ACTUALLY EXERCISED. `residualMassShare` and `ruleFires` are on
    every card arm. The prototype's residual never fired (no `facingAction: 'raise'` in a 30-
    decision slice), so this criterion is NOT met by the prototype and requires a slice large
    enough to hit it. An arm whose edge comes mostly from its residual has been credited for a
    fold rule, not for the strategy it cites.
  - THE FIRST REAL PUBLISHED CARD IS SCORED AND REPORTED, on an ADMISSIBLE run (>=30 player
    clusters, ESS >= 20%), with `encoding`, `coveredShare`, `fallback`, `discordantN` and
    `manifest.disclaimerRegisterVersion` all stamped. Do not close this ticket on the fixture.
    The report must state that the corpus is online 2009 and the founder's game is live 9-handed
    1/2-1/3, so the result is TRANSFERRED, not measured, for his game.
  - THE EQUILIBRIUM GUARD IS EXTENDED. `refuseChartsAsEquilibrium` (`equilibriumPost.mjs:100`)
    matches substrings against source identifiers and was written before a strategy arm could
    produce a number at all — a solver-derived card's id would sail through. It must also refuse a
    strategy-arm-derived value passed as `equilibrium`. See decision_flags[1] for why this is not
    optional.
