decision_flags:
  - |
    OPEN — WHICH ABSTENTION RULING IS THE HEADLINE FOR A PUBLISHED STRATEGY? The spec makes
    FALLBACK.ENGINE the default because it preserves the pairing property and because the
    covered-only figure comes free from `discordantN`. But ENGINE answers "what would this
    publication ADD to our engine", while the founder's framing — "what might we glean from each
    absorbed strategy" — is at least as much "how good is this strategy". That is POOL. The two
    can differ in SIGN for a narrow, strong rule: it can add real value where it applies (positive
    under ENGINE) while being a losing whole strategy (negative under POOL) because the pool
    plays the other 90% of decisions.
    RECOMMENDATION: report BOTH on every published card, with ENGINE as the headline because it
    is the actionable one, and treat the SIGN DISAGREEMENT between them as a flagged finding
    rather than a footnote. The founder should confirm which he wants quoted, because the two
    answer different questions and whichever is quoted first becomes "the number".
  - |
    OPEN — DOES A SOLVER-DERIVED CARD GET TO BE THE EQUILIBRIUM POST? The spec says NO and the
    argument is in DECLARED-ARM-SCORING-SPEC.md 8: a published solver output is defined over a
    small, non-random, tree-specific subset (particular stack depths, particular bet trees, usually
    two players), so a premium computed over it measures "money that exists because the pool
    differs from one solver's tree" while reading as "money the pool's mistakes are worth". That is
    FSA Finding F3's substitution, differing from the PREFLOP_CHARTS case only in being more
    plausible and therefore MORE dangerous. Scored as an ordinary strategy arm with `coveredShare`
    stamped it is a good number; promoted to EQUILIBRIUM_POST it is worse than having none.
    RECOMMENDATION: refuse, and extend the guard so the refusal is mechanical rather than
    remembered. This needs founder sign-off because it means the three-frame readout stays
    one frame short even after solver material is absorbed, and that will be disappointing.
  - |
    OPEN — DOES PREFLOP GET ITS OWN TICKET NOW OR LATER? Preflop charts are the most obvious
    published material to encode and a Strategy Card expresses one perfectly. But the hero-EV
    decision set is postflop-only AT BOTH ENDS: `heroPolicyAt` returns EMPTY_RANGE below
    `board.length < 3` (`heroPolicy.mjs:171`), and the mined behaviour policy has NO preflop cells
    at all (inspected `out/behavior-policy.json`: only flop/turn/river), so pi_pool — the
    denominator of every importance weight — does not exist there. Scoring a preflop chart requires
    widening the decision set AND re-mining the field AND re-deriving the leakage split: cost L,
    not M. RECOMMENDATION: separate ticket, filed now so the gap is visible, NOT folded into this
    one. Folding a large re-mining job into a small bridge is how the bridge stops shipping.
