status_note: |
  Premises re-verified against HEAD by reading the code.

  VERIFIED AS STATED:
    - `preflopAdvisor.js:431` — `else if (situation === 'facing_limpers') {`; `:432`
      `const limperCount = posContext?.limperCount || 1;`; `:435`
      `const bbSize = potSize > 0 ? potSize / 1.5 : 2; // Estimate BB from pot (SB+BB = 1.5bb)`.
    - `liveGameContext.js:30` destructures `blinds` from `liveHandState`; `:34-35` reads
      `const { sb, bb } = blinds;` and passes them to `calculateStartingPot`. The measured value is
      in scope at the caller, exactly as `do_not_file` states.
    - The 2.3x arithmetic: two limpers at $1/$2 gives a $7 pot; $7 / 1.5 = $4.67 vs a true $2.

  CORRECTED — THE IMPORTER CENSUS WAS INCOMPLETE, AND `:706` IS NOT WHAT THE RUN RECORD SAYS IT IS:
    - `do_not_file` states preflopAdvisor's "only non-test importers are useLiveActionAdvisor.js:31
      and decisionTreeBuilder.js:13". There is a THIRD: `src/utils/liveAdvisor/computeHelpers.js:28`
      imports `buildBaselineRange` and `computePreflopAdvice`. It does not change the conclusion —
      `computeHelpers` is imported only by `useLiveActionAdvisor.js:44`, so every route still
      terminates at the extension-fed `OnlineAnalysisContext` — but an importer census that misses a
      module is not evidence of unreachability, and the conclusion should rest on the complete one.
    - `do_not_file` describes `:706` as "the live-blinds-correct variant". It is not a variant and it
      does not read live blinds: `:706` is `const bbFirstIn = potSize > 0 ? potSize / 1.5 : 1;` —
      the IDENTICAL inference, applied in the first-in limp branch where its premise (pot = SB + BB)
      actually holds. The comment at `:700-704` says so in as many words: "the same estimate this
      file already uses to recover bbSize in the limped-pot branch". So the file does not contain a
      right way and a wrong way; it contains one estimate used twice, correct once by luck of context.
      That is a better argument for threading the measured value than the run record's version, since
      there is no correct local variant to copy.

  NOT RE-DERIVED: the claim that the error is "~11% at $1/$3" from the original lens finding is not
  reproduced here because it was refuted by the cross-critic and the arithmetic above supersedes it.
