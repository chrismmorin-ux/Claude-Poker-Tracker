description: |
  ExtensionPanel already consumes and renders isComputing (:67, :308); the live TableView does not
  — CommandStrip destructures advice only, and LiveAdviceBar reads the equity hook's different
  flag, with staleness logic that cannot fire on a within-street recompute. A turn check-raise
  leaves pre-raise advice on screen, unbadged, for the whole refinement window. Consume the
  analysis context's isComputing on the live surface and render the affordance the Online panel
  already has. Pairs with WS-470; note this is a UX-touching change — Gate 1/Gate 4 of the design
  lifecycle apply (small-scope, existing-pattern port).
accept_criteria: |
  - Recording a villain raise on the turn makes the advice bar visibly indicate recomputation, with
    the previous recommendation dimmed until the new one lands.
  - The indicator is driven by the game-tree compute's isComputing, not the equity hook's flag
    (asserted by test).
