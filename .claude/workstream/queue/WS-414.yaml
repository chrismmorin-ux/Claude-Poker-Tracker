status_note: |
  PROBLEM_CLASS NOTE. prog-design.yaml declares eight problem classes and none names a persona-cast
  gap; the nearest, "PROTO persona staleness", is about verifying personas that already exist.
  "JTBD domain unserved" is used because the JTBD half fits it exactly. The persona half has no
  declared home, which is itself a finding about the program's class list — per
  cwos-reconcile.js:749-754, a genuinely unclassifiable subject means the program's vocabulary is
  incomplete, and prog-design.yaml should gain a "Persona cast gap" class.

  PREMISES RE-VERIFIED AT HEAD by the Gate 2 facilitator, by reading the code and the artifact rather
  than trusting the lens digests:
    - personas/core/ contains exactly 16 files; none is a claim-recipient or a replicator.
    - holeMapHtml.mjs:143-155 — rowHtml emits nine cells, none carrying population, era or transfer
      status. denom.transferNote is present on every row of out/hole-map.json and is referenced
      nowhere in holeMapHtml.mjs.
    - out/hole-map.html — "transferred" x2, "ONLINE" x4, "2009" x2, "50NL" x3, all in prose bands.
    - study-block.md:51 — "Feel like work rather than study" is a stated anti-pattern.
    - presession-preparer.md:42 — three sub-variants, 5 / 15 / 30 minutes.
