decision_flags:
  - |
    OPEN — IS CLAIM-RECIPIENT A CORE PERSONA OR A PROPERTY OF THE OTHERS? Stage A asks who would USE
    the feature, and a claim-recipient receives its output rather than operating it. The roundtable
    overruled that objection because the repo's entire fault-register apparatus exists precisely
    because outputs travel beyond the surface that produced them — but the objection is real, and the
    founder may prefer to model this as an attribute carried by every reading persona. The design
    consequence (row-level provenance) is identical either way; what changes is whether the cast grows.
  - |
    OPEN — WHICH DOMAIN CODE. Gate 1 offered "extend DS-*" or "open a new FE/field-exploit domain".
    Stage B's reasoning favours a new domain because the same gap recurs for Views 1-6, but extending
    DS-* is cheaper today and the founder owns the atlas's shape.
