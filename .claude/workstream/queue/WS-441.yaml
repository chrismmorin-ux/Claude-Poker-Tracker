description: |
  Found in the 2026-07-31 founder-device pass: the ScaledContainer 0.95 scale factor means controls sized to 44 CSS px render below the 44px physical touch floor everywhere - nullifying the fix from AUDIT-2026-04-21-TV F8 that was believed shipped. Compounding (launch/sweep perf lens 2026-08-07): the target device identity is contradictory - CLAUDE.md says Galaxy A22 (1600x720) but WS-334 records the founder correction to Galaxy S22 (2340x1080), where the scale formula clamps to 1.0 - so the touch-floor math must be re-derived against the RESOLVED device, not assumed. Original ticket WS-316 overwritten; re-filed 2026-08-07.
accept_criteria: |
