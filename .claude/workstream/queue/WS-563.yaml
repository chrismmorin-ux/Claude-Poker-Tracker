description: |
  Reset Hand discards the entire hand's recorded actions in one tap. It sits adjacent to Reset
  Street (same dark treatment, similar size, non-destructive) and directly above the full-width gold
  Next Hand CTA, on a surface used one-handed under time pressure at a live table.

  time_to_detect: INSTANT. recoverability: NONE - re-entry is from memory, mid-session.

  THE SIZE ARGUMENT IS STRUCK, and the strike is recorded so it is not re-litigated:
  `tests/playwright/touch-floor.spec.js:48` pins Reset Hand at minToday 24 with reason
  "deliberately de-emphasized destructive action, 40 design px". The smallness is an INTENTIONAL
  mitigation, and a smaller target is HARDER to slip onto - the original argument cut against its own
  conclusion. DO NOT ENLARGE IT. What survives alone, at HIGH, is the missing confirmation.

  Design gate: `docs/design/audits/2026-07-31-entry-confirm-before-commit.md` already exists for this
  class. Check it per-control rather than assuming it closed the loop - it evidently did not cover
  this one.
