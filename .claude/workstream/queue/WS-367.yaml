decision_flags:
  - |
    OPEN — the engine's score is POSITION-CONDITIONED (`handStrengthTier(idx, position)`
    reads `strengthPercentiles(position)`), and the dev copy is not. Sharing the
    implementation therefore requires the dev scenario to name a position, which is a
    modelling choice it currently avoids. Decide which position the BTN scenarios imply, or
    whether an unconditioned percentile is the right shared primitive to expose.
