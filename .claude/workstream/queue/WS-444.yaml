description: |
  DEC-048 (system/decisions.md:925, founder-ratified app-wide 2026-08-01) promotes the layout
  paradigm from per-view to per-REGION: spatial regions (felt) scale via transform, interactive
  regions lay out in real CSS px. The doctrine doc (layout-doctrine.md L100) says this migration
  was "filed as WS-322" - but that ticket was NEVER written to disk on any branch, and the WS-322
  ID was reallocated on 2026-08-02 to the (now done) Standard of Record item. This item re-files
  the lost migration so it cannot be lost a second time (the same loss mode that ate WS-311).

  Scope: migrate the ~9 remaining ScaledContainer views to the per-region rule; TableView's own
  split (felt scales, command column real-px) is WS-439, not this item. ShowdownView's region
  classification was left OPEN by the doctrine (layout-doctrine.md L113) and must be decided here.

  The design artifacts live ONLY on integrate/orphans-20260807 (merge 9de247d1, not an ancestor
  of this branch): docs/design/surfaces/layout-doctrine.md, table-view-geometry.md, both
  2026-07-31 audits, and docs/design/evidence/2026-07-31-tvr-device-baseline/. Recover them onto
  the working branch before implementing.
accept_criteria: |
  Every view classified spatial/interactive/split per the doctrine; interactive regions render
  declared px sizes at device scale (44px touch floor actually met - closes the WS-441 defect
  class); ShowdownView classification decided and recorded; layout-doctrine.md + affected
  Gate 4 surface artifacts updated; viewScrollContainers.test.js shells still pass.
