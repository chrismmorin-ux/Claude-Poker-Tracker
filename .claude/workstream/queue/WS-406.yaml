decision_flags:
  - |
    OPEN — DOES THE RESULT CARD SCHEMA GAIN A SUPERSESSION RELATION? There is none today
    (`schemas.js:277-410`). The options are (a) a `supersededBy` field naming the replacement card,
    (b) a status field mirroring the fault register's `untested | partially-supported | confirmed |
    retired` vocabulary, or (c) no schema change, recording the supersession only in the fault
    register as a confirmed entry whose matcher catches the old card. (c) is free and is arguably
    where it belongs — "this card's estimand did not describe its treatment" is a FAULT, it has a
    mechanism, it has a falsifier, and confirming it would flag the card `suspect-pending-review`
    automatically. (a) is clearer to a human reading the cards directory. RECOMMENDATION: (c) first,
    because it uses machinery that already exists and already enforces evidence
    (`faultRegister.js:469-475`), and it makes the supersession searchable by the same mechanism
    that finds every other contaminated result. Revisit (a) only if a second card needs it.
  - |
    OPEN — IS THE RE-RUN WORTH IT BEFORE WS-402 LANDS? The blocking dependency is set to WS-402
    because a re-run at a 15.2% ESS reproduces the same uninformative intervals with a different
    engine commit, and the river slice at ESS 7.1 cannot be read either way. The counter-argument is
    that the card is wrong NOW and the correction should not wait on an unrelated engine fix. The
    middle option is to supersede the card immediately (cheap, no compute) and schedule the re-run
    after WS-402. RECOMMENDATION: the middle option. Correcting the record and producing a better
    number are two different jobs and only the second needs the ESS.
