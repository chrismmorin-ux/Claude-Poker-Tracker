status_note: |
  PREMISES RE-VERIFIED AGAINST HEAD (fe716f59), BY READING THE CARD, THE CODE, AND RECOMPUTING THE
  DATA.

  The card, read directly from `docs/standard-of-record/cards/RC-depth-ablation.json`:
    - `resultCardId` `RC-depth-ablation-1c560bcc-67e9e14e`.
    - `estimand` as quoted, including the trailing "NOT a per-decision increment, NOT a winrate, and
      NOT a keep/delete verdict on the depth-2 subsystem" — the card is already careful about three
      other misreadings and silent about this one.
    - `manifest.engineCommit` `67e9e14eb42318ccaa3d22ac1f7ba1a6a6fac144`.
    - `manifest.disclaimerRegisterVersion` `FR-1+e3867c10fc2a` — present, so the supersession
      mechanism has something to hang on.
    - The card has no status or supersession field; confirmed against `RESULT_CARD_FIELDS`
      (`schemas.js:277-410`), where the only related field is `disclaimerRegisterVersion` at
      `:365-366`.

  The street gates, read in place: `:1413` `riverPerCombo` (`street === 'river'`), `:1521`
  `callDepth2`, `:1552` `checkCheckDepth2`, `:1594` `betCallDepth2`, `:1679` `checkRaiseDepth2` (all
  `street !== 'river'`), `:1732` `depth3Barrel` (`flop` or `turn`). ONE CORRECTION TO THE AUDIT
  NOTE'S LINE LIST: `:1632` `raiseResponseDepth2` is gated on `{ enabled: enableDepth2Raise,
  raiseLikely: pRaise > 0.02 }`, not on street; it is street-gated only transitively, being nested
  inside the `betCallDepth2` block. The conclusion is unchanged — it too cannot run on the river —
  but the reason is indirect and a future reader checking `:1632` would not find a street test
  there.

  The data, recomputed from `out/depth-ablation.json` with a standalone reimplementation of
  `weightFor` / `wisValue` / `pairedDelta` that reproduces the shipped `report` block exactly where
  they overlap (ALL delta -0.4711, ALL ESS 39.5, `discordantN` 95):
    - The five-row street table above, every figure independently derived. All four street deltas
      quoted in the audit note verified to four decimal places.
    - `depthReachedMax` by street: river 45/45 at 1; flop 138/138 at 2; turn 74/77 at 3. This is the
      empirical confirmation of reason (a) — the river arm never left depth 1.
    - `report.divergence.byStreet.river`: 36 flips of 45 (`flipShare` 0.8) against flop 1/138 and
      turn 3/77. The divergence is as river-concentrated as the delta.
    - `report.admissibility`: 22 clusters, `minClustersForCI` 30, `absoluteArmsQuotable` false, with
      the standing `TOO_FEW_CLUSTERS_FOR_LEVELS` warning.
    - `run.runtimeMs` 6,219,107 over 260 decisions = 23.9 s per decision.

  The WS-378 commit is `d0a03e49` ("feat(backtest): the river flips are systematic, and the cause is
  omniscience not variance"), present in `git log` ahead of `67e9e14e`. The 0.7111 -> 0.2222 and
  34-of-34 figures are taken from that ticket's own record and were NOT independently re-derived
  here; they are attributed rather than asserted.

  PROGRAM-CAP HAZARD, RECORDED BECAUSE IT WILL SUPPRESS THIS ITEM. `methodology-integrity` declares
  `max_open_items: 3` with `priority_floor: 18` (`prog-methodology-integrity.yaml:200-201`) and was
  already at 11 open items before this cluster was filed; adding this item and WS-406 takes it to 13,
  a 4.33x breach. Per the standing behaviour a program over its cap has its whole backlog floored to
  `priority_floor`, so this item's P1 score of 26.0 will be read as 18 by `/next` and it will not
  compose. That is a pre-existing condition, not one this ticket created, and the fix is a cap
  decision rather than a re-filing — this item's subject is the SCORING vocabulary, not poker domain
  correctness, and moving it to `domain-correctness` (60-item cap, not breached) to dodge the floor
  would put it under a program whose problem classes do not describe it. Flagged for the founder.
