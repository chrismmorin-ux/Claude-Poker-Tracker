     arms.depth-2plus.shape.vsNActions: UNDERPOWERED

  DIAGNOSIS (added by hand 2026-08-16 — do NOT just re-run this bigger).
  The six UNDERPOWERED verdicts are not a sample-size complaint. The probe drew 200
  distinct RNG seeds (1000-1199, mulberry32) and got LITERALLY ZERO VARIATION:
  noiseSd = 0.0e+0 on all 8 nodes in BOTH arms, meanArgmaxStability = 1.0, and every
  reported "curse" is 1e-13 to 1e-15 — floating-point rounding, not signal.

  The quantity this probe exists to measure is E[max_a EVhat(a)] - max_a E[EVhat(a)],
  which is induced BY estimator sampling noise. With zero noise the estimand is
  identically zero by construction, so the run could not have produced an answer at any
  replicate count. More replicates is the one response guaranteed not to help.

  Two candidate mechanisms, and they need distinguishing before any re-run:
    (a) the seed never reaches the estimator's RNG — a wiring bug in the probe;
    (b) these 8 scenarios are evaluated by enumeration rather than Monte Carlo, so
        nothing downstream of the seed is stochastic.
  (a) is the more likely of the two: the standing note in engine test determinism is
  that FLOP equity is Monte Carlo and therefore flaky, which is why deterministic
  assertions need a river board plus a fixed equityFn stub. Five of the eight scenarios
  here are flop nodes and should have varied. That is a contradiction worth resolving
  first, and it is cheap: log the equity calculator's sample count and RNG identity for
  one node across two seeds. If the draws are identical, it is (a).

  Separately and regardless: n = 8 hand-picked scenarios gives 8 clusters, and every
  shape test reported informativeClusters = 0. Even with working noise injection, the
  scenario set is too small for the rho CIs to exclude anything. Both need fixing.

