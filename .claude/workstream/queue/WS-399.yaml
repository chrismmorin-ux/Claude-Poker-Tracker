id: "WS-399"
title: "The learned range channel is algebraically inert — buildRangeProfile learns ONE number per (position, action) and multiplies all 169 cells by it, and every downstream consumer normalizes that uniform factor away, so every non-showdown hand ever recorded contributes exactly nothing to the advice or to the scored EV"
