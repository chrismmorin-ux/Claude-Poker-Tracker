decision_flags:
  - |
    OPEN AND LOAD-BEARING — WHICH COORDINATE DOES THE RESHAPING HAPPEN IN: PIP SPACE, OR THE
    SEGMENTATION BUCKETS? PIPs are the ready-made option: `computeAllPips` / `computePipConfidence`
    already run on every profile (`rangeEngine/index.js:35-36`), they are per-position and
    per-category, and a 3-5 category deviation vector is exactly the 4-6 parameter budget the data
    supports. But a PIP is a DEVIATION-FROM-GTO coordinate, and the quantity candidate EVs are
    actually built from downstream is the SEGMENTATION BUCKETS. Reshaping in PIP space and assuming
    it lands usefully in bucket space is an unverified change of basis — the same class of
    assumption as narrowing by bucket label, which doctrine already forbids.
    RECOMMENDATION: reshape in PIP space, because the coordinate exists, is already computed on
    every profile, and is the one whose parameter count matches the identifiability ceiling — BUT
    make the first deliverable a measured Jacobian rather than a bet: perturb one PIP category by a
    known amount and report how much the segmentation buckets and the resulting candidate EVs move.
    If a full PIP unit moves the EV figure by less than the negative control's resolution, the
    answer is the buckets and the ticket should say so and re-scope. That check is cheap and it is
    the honest form of this decision.
  - |
    OPEN — HOW MANY PARAMETERS DO WE SPEND, GIVEN THE CEILING? The audit's recommendation is 4-6
    (one range-width percentile plus 3-5 category deviations), identifiable from ~50-150 preflop
    decisions. Fewer — say width alone — is EXACTLY WHAT WS-321 ALREADY MEASURED AND LOST, so the
    one-parameter option is not merely conservative, it is the option with a measured null against
    it. More — anything approaching per-cell freedom — is unidentifiable at 13 revealed decisions
    per player and will fit noise, and the failure mode is T1 moving while T2 degrades, which is
    the worst of the three outcomes.
    RECOMMENDATION: 4 parameters for v1 — the width percentile plus 3 category deviations (pairs /
    suited-broadway / offsuit-junk, the three that most change what a range does postflop) — with
    the hierarchical shrinkage doing the work of adding effective parameters only as n grows, so
    the count is a CEILING rather than a fixed spend. Expand to 6 only if T2 improves at 4 and the
    curve has not flattened.
  - |
    OPEN — DOES THE CONFIG-THREADING PREREQUISITE BECOME ITS OWN ITEM? The EV accept criterion
    cannot be met until `heroPolicyAt` and `runHeroEv`'s arm axis can carry an arbitrary engine
    constant. That is a small, self-contained, and broadly reusable change — every future
    range-side or constant-side EV question needs it, not just this one. Doing it inside this
    ticket keeps the item self-sufficient; splitting it makes it available sooner to the other
    items that will want it.
    RECOMMENDATION: split it. It is a prerequisite for a class of measurements, not for this
    measurement alone, and folding infrastructure into a domain ticket is how infrastructure ends
    up shaped by one caller. File it, then set this item's `blocked_by`.
source:
  type: code-review
  created_by: ai
  finding_id: "FIND-048"
  run_id: "run-domain-correctness-blindspot-2026-08-05"
created_at: "2026-08-05T12:00:00Z"
status_note: |
  EVERY file:line BELOW WAS RE-VERIFIED AGAINST HEAD BY READING THE CODE. Three claims in the
  briefing did not survive verification unchanged and are corrected in the description rather than
  propagated.

  VERIFIED AS STATED:
    - `rangeEngine/bayesianUpdater.js:155-185` — `updateScenarioRanges`. The single learned scalar
      at `:179` (`ratio = effectiveFreq / populationFreq`) and the uniform multiply at `:181-183`
      (`ranges[action][i] = Math.min(1.0, prior[i] * ratio)`). Read in place.
    - `bayesianUpdater.js:335-386` — `applyShowdownAnchor`: cell set to 1.0 at `:347`, alt-suit
      boost `:350-353`, adjacent pairs `:356-364`, adjacent kickers `:366-373`. ~4 cells touched.
    - `bayesianUpdater.js:241-311` — `updateSubclassRanges`, the genuinely per-cell hierarchical
      construction the fix should mirror; the propensity-not-distribution rule at `:270-278`; the
      `n_parent` denominator at `:266-267`.
    - `rangeEngine/crossRangeConstraints.js:41-46` — the per-cell renormalization, which binds only
      when the per-cell sum exceeds 1.0.
    - `pokerCore/rangeMatrix.js:278` — `enumerateCombos` emitting `weight: range[idx]`.
    - `scripts/backtest/heroPolicy.mjs:111-131` — `sampleCombos`: `total = Σ weight` at `:111`,
      `c.weight / total` at `:114`, `1 / k` at `:129`. The division that cancels the constant.
    - `scripts/backtest/heroPolicy.mjs:145-157` — `heroPolicyAt`'s full parameter list: `ctx`,
      `hand`, `rakeConfig`, `comboSamples`, `trials`, `refinementBudgetMs`. No config object.
    - `out/ws321-per-player-width-card.json` — every WS-321 figure quoted above was read out of the
      artifact, not recalled: -0.025167884, SE 0.008604, CI [-0.042031, -0.008305], 38 heldout
      players, 624 heldout decisions, population optimum 1.2252977, narrowing worth 0.1136601
      (SE 0.010906), median 13 revealed per player, 91 players total.
    - `scripts/backtest/rangeCalibrationProbe.mjs:1499` — `runPerPlayerWidthProbe`.

  CORRECTED — CLAIM 1, WRONG PATH. The briefing cited `postflopNarrower.js:1038` as living in
  `rangeEngine/`. It is in **`exploitEngine/postflopNarrower.js`**; there is no `postflopNarrower`
  in `rangeEngine/`. The LINE is right and the code at it is exactly as described
  (`result[idx] = range[idx] * (cellWeight[idx] / cellTotal[idx])`, `:1038`, inside the
  `:1032-1039` loop). Directory corrected; substance unaffected.

  CORRECTED — CLAIM 2, OVERSTATED AND MATERIALLY SO. The briefing states `computeAllPips` /
  `computePipConfidence` are "consumed by NOTHING." **They are consumed.** `rangeEngine/index.js:35-36`
  calls both and writes `profile.pips` / `profile.pipConfidence`; `analysisPipeline.js:125` and
  `:168` forward `pips` into exploit generation; `exploitEngine/modelAudit.js:290` reads it;
  `components/ui/RangeProvenance.jsx:338-339` renders it via `PipDeviations` (`:371`). The
  narrower true statements, which are what the ticket relies on: (a) `RangeProvenance.jsx:10`
  imports only `classifyHand` and `HAND_CATEGORIES` from `pipCalculator`, reading the precomputed
  values off the profile; (b) `rangeProfile.js` has NO `pips` field — grepped, zero hits — so the
  property is attached outside `createEmptyProfile` and persists only via the `...profile` spread at
  `serializeProfile:107-110`; (c) and the one that actually matters, PIPs feed DISPLAY and
  EXPLOIT-RULE paths and nothing that reaches the range grid or the game-tree EV figure. The
  coordinate is computed and read; what is missing is the FEEDBACK EDGE back into the grid. The
  ticket is argued on (c), not on the overstated version.

  REFINED — CLAIM 3, THE WS-321 HEADLINE. The briefing reports -0.0252 [-0.0420, -0.0083] as "the"
  result. The card is more specific and the distinction matters: `headlineArm` is
  `"unshrunk (k = 0)"` and those ARE its numbers, but `perPlayerMinusPopulationNatsPerDecision` is
  **0** with `chosenShrinkageK: "Infinity"` and `heldoutPlayersMovedOffPopulation: 0` — the
  calibration on the disjoint CALIB half chose to shrink every held-out player ALL THE WAY back to
  the population width. So the honest summary is stronger than the briefing's, not weaker: the
  unshrunk per-player fit LOST by a CI clear of zero, AND the calibrated version's own answer was
  to abandon per-player width entirely. Both are stated in the description.

  THE CHAIN WAS VERIFIED END TO END, NOT ASSUMED. The learned profile does reach the scored EV
  figure: `heroEvRunner.mjs:181` builds `trainProfile = buildRangeProfile(playerId, trainHands,
  USER_ID)` at each walk-forward checkpoint (`:172-186`) and passes it to `accumulateDecisions`
  (`:193`), which seeds `startingRange` from `rangeProfile.ranges[posCategory][rangeAction]`
  (`decisionAccumulator.js:292-294`) into `openHolding` (`:300-305`), surfacing as `rangeBefore`
  (`:372`) — which is exactly what `heroPolicyAt` reads as `ctx.rangeBefore`
  (`heroPolicy.mjs:161`) and hands to `sampleCombos` (`:166`). The cancellation therefore reaches
  the scored number; it is not confined to the UI path.

  THE CONFIG-THREADING BLOCKER: NO SUCH ITEM EXISTS. Searched the whole queue for `heroPolicyAt`,
  `comboSamples`, `paired-delta`/`pairedDelta`, "config object", and "threading". Hits were
  WS-316 (threading POSITION into the narrower — unrelated), WS-387 (threading a fold rate into a
  formula — unrelated), WS-388 (multiway threading — unrelated), and archived WS-086. **Nothing
  covers threading an arbitrary engine constant through `heroPolicyAt` / the `runHeroEv` depth-arm
  axis.** `blocked_by` is therefore left empty and the gap is raised as the third decision flag;
  it should be filed and linked when that decision is taken.

  WS-389 IS ADJACENT AND SHOULD BE SEQUENCED BEFORE THE EV MEASUREMENT, THOUGH IT IS NOT A HARD
  BLOCKER. It records that refinement depth is gated on wall-clock time, so the same hand scored
  twice can give a different top action. Any EV delta this item reports inherits that
  irreproducibility. T1/T2 are log-loss quantities and are unaffected; the EV accept criterion is
  affected.
