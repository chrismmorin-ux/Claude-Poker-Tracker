decision_flags:
  - |
    OPEN — WHICH WEIGHTING IS CORRECT FOR SERVING PRIORS. Restated here because it needs a
    founder answer and it is the reason the ticket exists. The source document already
    recommends player-weighted for live seeding and was never acted on. Declining the
    recommendation is a valid answer; leaving it unanswered for another two weeks is not.
  - |
    OPEN — WHETHER THE PLAYER-WEIGHTED AGGREGATE NEEDS A MINIMUM-HANDS FLOOR PER PLAYER.
    Averaging across players gives a 30-hand tourist the same weight as a 40,000-hand regular,
    which is the intended correction — but a player with 3 observed hands contributes a VPIP of
    0.00 or 1.00 and pure noise. Any floor is a choice about which population is being
    described and must be recorded with the weighting decision, not chosen inside the mining
    script.
