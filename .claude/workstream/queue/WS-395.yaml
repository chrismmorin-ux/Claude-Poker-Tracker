description: |
  TWO DETECTORS, BOTH SETTLEABLE BY PERMUTATION ON DATA THAT ALREADY EXISTS. Neither half needs new
  hands, a new corpus, or a new instrument. That is the reason this ranks above the rest of the
  live-path family: it is the only item here whose central claim can be settled this week from
  what is already on disk.

  ── HALF ONE: `computePositionAwareness` (`bucketQueryUtils.js:91-116`) ──

  The estimator is `spread = max(vpip_i) - min(vpip_i)` over positions clearing a minimum hand
  count, flagged when `spread > 0.15`, with
  `confidence = bayesianSampleConfidence(vpips.length * 5)` at `:114`.

  THE CONFIDENCE ARGUMENT IS THE NUMBER OF POSITION CATEGORIES, NOT HANDS. `vpips.length` counts how
  many positions qualified — at most five. A villain with 3 hands in each of 5 positions and a
  villain with 300 hands in each receive IDENTICAL confidence. The quantity has ZERO mutual
  information with sample size, which is the one thing a sample confidence exists to carry.

  THE NULL FIRE RATES, COMPUTED AT THE TWO REAL CALL SITES rather than at the function's defaults.
  Take a villain whose true VPIP is identically 25% in every position — no positional awareness at
  all — observed at exactly the minimum qualifying sample:

    `villainProfileBuilder.js:419`  { minHandsPerPosition: 5, minPositions: 2 }
      Observed rates are multiples of 1/5 = 0.20, so ANY difference at all exceeds the 0.15
      threshold. P(two independent Binomial(5, 0.25) counts differ) = 1 - Σ_k P(k)² = 1 - 0.2902
      = 0.710.  → FLAGGED ~71% OF THE TIME UNDER THE NULL.

    `villainObservations.js:879`    { minHandsPerPosition: 3, minPositions: 3 }
      Rates are multiples of 1/3 = 0.333, so again any spread clears 0.15. P(three independent
      Binomial(3, 0.25) counts are not all equal) = 1 - Σ_k P(k)³ = 1 - 0.1530 = 0.847.
      → FLAGGED ~85% OF THE TIME UNDER THE NULL.

  The mechanism is that the threshold is finer than the resolution of the estimate. At n=3 the
  smallest non-zero spread the data can express is 0.333; at n=5 it is 0.200. Both are larger than
  the 0.15 bar, so the bar is not a bar — it is satisfied by the first pixel of noise.

  WHERE IT GOES, STATED PRECISELY BECAUSE THE ROUNDTABLE OVERSTATED IT (see status_note): the noisy
  detector does NOT reach the game tree. It reaches `awareness.positionAware`
  (`villainProfileBuilder.js:420-421`), which feeds the profile classification at `:520`
  (`'position-aware'`) and two `thoughtCatalog` signature evaluators (`:40` and `:537-538`, the
  latter scaling a thought weight by `awareness.positionAware.confidence` — the quantity that has no
  relationship to sample size). It also drives an observation in `villainObservations.js:879` that
  renders in `ObservationPanel`.

  THE CORRECT ESTIMATOR IS ALREADY IN THE REPO, ALREADY WIRED, AND ALREADY REACHING EV.
  `src/utils/rangeEngine/traitDetector.js:44-53` — `probRateExceedsFactor`, exact Beta quadrature,
  no normal approximation — computes `traits.positionallyAware.posterior`, and THAT is what
  `generateExploits.js:60` and `postflopNarrower.js:785` consume, and what
  `villainProfileBuilder.js:353` uses for the trait label. So the repo runs TWO estimators of the
  same construct side by side: a correct Bayesian one on the EV path, and a noise-firing spread
  test on the display and thought-weight path, with no cross-reference between them.

  `traitDetector.js:22-25` even records the reason the correct one is regularized as hard as it is:
  "detecting a *difference* between two rates needs more regularization than estimating one rate,
  and concluding a player 'adjusts by position' warrants a meaningful per-position sample." That
  sentence is the general rule this half of the ticket is about, and it appears NOWHERE in
  POKER_THEORY.md.

  ── HALF TWO: the sizing-tell gates, and the one that reaches EV ──

  There are TWO gates on the same aggregate Pearson r, with DIFFERENT thresholds, and the run record
  found only the weaker-consequence one:

    (a) `weaknessDetector.js:405-407` — `|r| > 0.5` at `n >= 8`. Produces the `sit-sizing-tells`
        weakness. Under H0, t = r√(n-2)/√(1-r²) = 1.414 on 6 df ⇒ P(|r| > 0.5) ≈ 0.21.
        → fires ~21% of the time on a villain with no sizing tell at all.

    (b) `foldEquityCalculator.js:661-671` — `|r| > 0.3` at `n >= 8`, then
        `sizingMult = 1 + corr * 0.06 * confidence` and `estimate *= sizingMult`.
        Under H0, t = 0.770 on 6 df ⇒ P(|r| > 0.3) ≈ 0.47.
        → fires ~47% of the time under the null, AND IT MULTIPLIES THE FOLD ESTIMATE.

  (b) is the consequential one and it is the reason this ticket has a real EV delta rather than a
  display one. It runs on every path that computes a fold estimate — Ignition play, drills,
  `computeDepth2Plan`, `replayAnalysis`, AND THE CORPUS BACKTEST — so a coin-flip-frequency noise
  detector is currently perturbing the scored figure itself. The perturbation is small per firing
  (±0.06 × confidence, capped by the ±40-50% compound clamp at `:676`) but it is signed by a
  statistic that is pure noise half the time, so it adds variance to the very number the founder
  wants to optimize, in a direction that cannot be predicted.

  AND THE SAMPLE IS SHOWDOWN-SELECTED, SO EVEN THE SIGN IS UNIDENTIFIED. Samples are pushed only
  when the villain's hole cards were shown (`decisionAccumulator.js:584-598` requires
  `playerShowdown[0]`/`[1]` to parse). Villains are called more often at small sizings, so small-bet
  hands reach showdown at a higher rate than large-bet hands, and the correlation between bet
  fraction and shown strength is conditioned on a variable that depends on both. A correlation
  measured on a selected sample does not estimate the population correlation, and the selection here
  runs along exactly the axis being measured.

  ── ZERO MULTIPLICITY CONTROL ANYWHERE ──
  `grep -rniE 'bonferroni|falsediscovery|fdr' src/` returns nothing. Roughly fifteen candidate
  weaknesses are ranked per villain and the top one is surfaced. On a thin villain the surfaced
  weakness is, by construction, the noisiest estimate in the set — the maximum of fifteen noisy
  statistics is not a discovery, it is an order statistic.
accept_criteria: |
  - SETTLE BOTH HALVES BY PERMUTATION ON EXISTING DATA, AND REPORT THE EMPIRICAL NULL RATE BEFORE
    CHANGING ANY THRESHOLD. Shuffle the position label within each villain (destroying any real
    positional structure while preserving every marginal), re-run `computePositionAwareness` at BOTH
    production configs, and report the empirical fire rate. Do the same for the sizing tell by
    shuffling `strengthPct` against `betFraction` within villain. The analytic figures above are
    predictions; the permutation is the measurement. No new data is required and that must be stated
    in the ticket's closing note, because "we need more hands" is the reflex answer and it is wrong
    here.
  - THE CLAIM IS AN EV DELTA FOR THE SIZING-TELL HALF, MEASURED BY THE STANDARDIZED METHOD ON AN
    IDENTICAL DECISION SET. `foldEquityCalculator.js:667` multiplies the fold estimate on every
    scored decision, so the corrected gate has a measurable effect on the aggregate figure. Report
    it. Expected direction: the aggregate should move toward the no-adjustment baseline and the
    ACROSS-SEED VARIANCE of the figure should FALL — a noise multiplier firing on half of villains
    adds variance without adding signal, so the reproducibility gain may exceed the accuracy gain,
    and per the founder's redirect reproducibility outranks accuracy for this deliverable. Report
    both.
  - THE POSITION-AWARENESS HALF DECLARES ITS EV EXPOSURE HONESTLY. It does NOT reach the game tree
    today (verified — see status_note), so its EV delta on the scored figure is expected to be
    exactly ZERO and must be asserted as zero rather than claimed as positive. Its criterion is the
    permutation null rate falling to the nominal level, plus the thought-weight and classification
    outputs changing on villains where the flag was noise. If a future ticket routes it to EV, that
    ticket inherits the EV criterion.
  - THE TWO ESTIMATORS OF POSITIONAL AWARENESS ARE RECONCILED, NOT BOTH LEFT RUNNING. The repo has
    a correct Beta-quadrature estimator (`traitDetector.js:44-53`) already feeding the EV path and a
    noise-firing spread test feeding display and thought weights. Either `computePositionAwareness`
    delegates to the posterior form, or both files state in code why two estimators of one construct
    coexist and which is authoritative. Leaving them unreconciled is how the next reader picks the
    wrong one.
  - THE CONFIDENCE AT `bucketQueryUtils.js:114` IS A FUNCTION OF HANDS, OR IT IS DELETED. A
    confidence with zero mutual information with sample size is worse than no confidence, because it
    is consumed as a weight (`thoughtCatalog.js:538`). Assert with a test that two villains with the
    same positions and 10x different hand counts receive DIFFERENT confidences — this fails against
    HEAD, which is the point.
  - THE SHOWDOWN SELECTION IS RECORDED AS A LIMIT ON THE ESTIMAND, IN CODE. The sizing-tell
    correlation is measured on a showdown-conditioned sample, and `FAULT-showdown-selection` already
    exists in the fault register for exactly this shape. Whatever gate replaces `|r| > 0.3`, the
    quantity must be documented as "correlation among hands that reached showdown", not as
    "correlation between sizing and strength". Naming the estimand correctly is most of the fix.
  - THE ORPHANED PER-CONTEXT CORRELATION IS RESOLVED. `decisionAccumulator.js:635-637` computes
    `byContextAction[*].correlation` for every context and NOTHING reads it (verified: zero non-test
    consumers). It is either wired with a gate that survives permutation, or removed. It must not be
    left as a computed-and-unread quantity that a future reader wires up without re-deriving its
    null rate — which is precisely how the two gates above came to differ by 0.2 with no record of
    why.
  - MULTIPLICITY IS ADDRESSED OR EXPLICITLY DEFERRED WITH A REASON. ~15 candidate weaknesses are
    ranked per villain with no correction anywhere in the repo. A full FDR treatment is out of scope
    for this ticket; deciding that it is out of scope, and recording that the surfaced top weakness
    on a thin villain is an order statistic rather than a finding, is not.
