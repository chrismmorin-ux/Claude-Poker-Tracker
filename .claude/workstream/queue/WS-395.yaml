status_note: |
  Premises re-verified against HEAD by reading the code. THIS TICKET DIVERGES FROM THE RUN RECORD IN
  THREE PLACES, TWO OF THEM MAKING THE FINDING WORSE AND ONE MAKING IT NARROWER. All three are
  recorded here rather than propagated.

  CORRECTION 1 — THE NULL FIRE RATE IS HIGHER THAN RECORDED, BECAUSE THE RUN RECORD ANALYSED THE
  FUNCTION'S DEFAULTS AND NOT THE CALL SITES. The record states 62.4% at `minHandsPerPosition = 3`
  with 2 positions. Neither production call site uses that combination:
    - `villainProfileBuilder.js:419` passes `{ minHandsPerPosition: 5, minPositions: 2 }` → 71.0%
      (1 - Σ_k P(k)² for k ~ Binomial(5, 0.25); collision probability 0.2902).
    - `villainObservations.js:879` passes `{ minHandsPerPosition: 3, minPositions: 3 }` → 84.7%
      (1 - Σ_k P(k)³ for k ~ Binomial(3, 0.25); all-equal probability 0.1530).
  The 62.4% figure is arithmetically correct for the configuration it describes; that configuration
  is not shipped. Both figures above are for the MINIMUM qualifying sample, which is the case the
  gate admits and the case that matters — a villain with many hands per position will show a
  genuinely smaller spread under the null, so these are the worst-case-admissible rates, not the
  average over the population. The permutation test in the accept criteria is what produces the
  population figure.

  CORRECTION 2 — THE POSITION-AWARENESS DETECTOR DOES NOT ENTER THE GAME TREE. The run record states
  it "enters the ENGINE as a trait weight via `villainProfileBuilder.js:28`". `:28` is the IMPORT
  line. Tracing the value: `computePositionAwareness` is called at `:419` and its output is written
  to `result.positionAware.detected/.confidence` at `:420-421`. Consumers of
  `awareness.positionAware` are `villainProfileBuilder.js:513` and `:520` (profile classification
  string) and `thoughtCatalog.js:40`, `:537-538` (thought signature weights). The EV-bearing
  consumers — `generateExploits.js:60` and `postflopNarrower.js:785` — read
  `traits.positionallyAware.posterior`, which comes from `rangeEngine/traitDetector.js`, a DIFFERENT
  and correct estimator. So the noisy detector's blast radius is display, profile labelling and
  thought weights; it is not in the EV path. This narrows the finding and is the reason the
  position-awareness half is explicitly exempted from the EV-delta criterion above.

  CORRECTION 3 — "THE CORRECT ESTIMATOR EXISTS 200 LINES AWAY" IS FALSE, AND THE TRUTH IS SHARPER.
  `traitDetector.js` is at `src/utils/rangeEngine/`, a different module from
  `src/utils/exploitEngine/bucketQueryUtils.js`. It is not 200 lines away; it is in another engine.
  The sharper fact is that it is not merely available — it is ALREADY WIRED to the EV paths and
  running in parallel with the noisy detector on the same construct. `probRateExceedsFactor` is at
  `:44-53` (the run record said `:45-53`); the regularization rationale is at `:22-25` (the record
  said `:20-27`); `OPEN_RATE_PRIOR = { alpha: 6, beta: 24 }` at `:26`; `POS_AWARE_FACTOR = 1.5` at
  `:28`.

  CORRECTION 4 — THERE IS NO PER-CONTEXT SIZING-TELL DETECTOR FIRING AT n=5. The run record states
  "the per-context variant at n=5 fires ~39%". No such gate exists at HEAD. `decisionAccumulator.js`
  builds `sizingTells.byContextAction` (`:257`, `:595-598`) and computes a per-context Pearson r at
  `:635-637`, and a repo-wide grep for `byContextAction` returns FIVE hits, all five inside
  `decisionAccumulator.js` itself. The per-context correlation is computed and read by nothing. That
  is a different and cheaper defect than the one recorded, and it is filed above as its own accept
  criterion.

  ADDED, NOT IN THE RUN RECORD, AND IT IS THE HIGHEST-CONSEQUENCE HALF OF THIS TICKET:
  `foldEquityCalculator.js:661-671` gates the SAME aggregate correlation at `|r| > 0.3` — a LOWER
  bar than `weaknessDetector.js:406`'s 0.5, with no record anywhere of why the two differ — and it
  multiplies the fold estimate (`:666-667`). Under H0 at n=8 that gate fires ~47% of the time
  (t = 0.770 on 6 df). This one is EV-bearing and runs inside the corpus backtest, which is what
  gives this ticket a real EV delta and what lifts its priority above the rest of the live-path
  family. The run record found only the weakness-detector gate.

  VERIFIED AS STATED: `bucketQueryUtils.js:91` function start, `:92` the destructured defaults
  (3 / 2 / 0.15), `:112` `result.detected = result.spread > spreadThreshold`, `:114` the
  `vpips.length * 5` confidence. `weaknessDetector.js:405-407` the gate, `:419` the confidence.
  `decisionAccumulator.js:584-598` the showdown gating of samples (requires `playerShowdown[0..1]`
  to parse). `grep -rniE 'bonferroni|falsediscovery|fdr' src/` → zero hits.
