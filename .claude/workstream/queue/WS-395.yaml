decision_flags:
  - |
    OPEN — WHETHER THE SIZING-TELL FOLD MULTIPLIER SURVIVES AT ALL. Once the gate is corrected to a
    level that does not fire under the null, the question is whether ANY villain in the corpus clears
    it. If the honest gate is (say) a posterior probability of a real correlation exceeding 0.8, and
    no villain in the data reaches it, then `foldEquityCalculator.js:661-671` is dead code that has
    been perturbing the scored figure for its whole life and should be removed rather than
    re-thresholded. Measure the post-correction fire rate on real villains before deciding.
  - |
    OPEN — WHAT REPLACES A SPREAD TEST. `max - min` over 2-5 rates is the wrong statistic
    independently of its threshold: it is an order statistic, it ignores the sample size behind each
    rate, and it is monotonically increasing in the number of positions observed. The correct form is
    the one `traitDetector.js` already uses — a posterior probability that one rate exceeds another
    by a factor, with a firm prior. Adopting it wholesale means the "position aware" flag becomes
    LP-vs-EP specific rather than any-pair-of-positions, which is a narrower and probably more useful
    construct, but it is a change in what the flag MEANS and the founder should be told that rather
    than have it happen silently.
