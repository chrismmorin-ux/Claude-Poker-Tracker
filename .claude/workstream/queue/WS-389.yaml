finding_id: "FIND-051"
description: |
  FIND-051 FROM THE 2026-08-05 DOMAIN-CORRECTNESS BLIND-SPOT ROUNDTABLE. This is the highest-ranked
  item in the backtest-integrity family, and the reason is a rule rather than a magnitude: under the
  founder's 2026-08-05 redirect the deliverable is an OPTIMIZABLE scored figure with per-improvement
  deltas. REPRODUCIBILITY OUTRANKS ACCURACY for that deliverable. A stably-wrong figure still yields
  honest deltas — the error cancels between arms. A figure that changes when re-run yields nothing,
  because an improvement cannot be distinguished from machine load. Every other item in this family
  attacks the LEVEL of the figure. This one is the only one that attacks the DELTAS.

  THE MECHANISM.

    `gameTreeEvaluator.js:814`   refinementBudgetMs = 2000,
    `gameTreeEvaluator.js:822`   const startTime = Date.now();

  and the docstring immediately above, at `:803-808`, states plainly that this clock gates depth-2/3.
  Whether the engine returns a depth-1 answer, a partially-refined one, or a fully-refined one is
  therefore decided by how much CPU the machine had spare in the two seconds after the call. Identical
  inputs, different answer. Not probabilistically — deterministically, as a function of a variable
  nobody records.

  THIS IS ALREADY KNOWN TO CHANGE THE TOP ACTION, AND THE TEST SUITE SAYS SO IN PROSE.
  `foldEstimateComposition.test.js:65-77` carries a docblock that exists only because of this:

      "The budget here is deliberately LEFT AT THE DEFAULT, and that is load-bearing (WS-379).
       Pinning `refinementBudgetMs` high was tried and reverted: with refinement allowed to run
       to completion the engine recommends a raise where 'DEFECT: raising into an uncapped nutted
       range is not the top action' asserts it must not. So these assertions are calibrated against
       the SHIPPED budget, and changing it changes what they mean."

  Read that as a statement about the engine rather than about the test. The suite's assertions are
  calibrated to a WALL-CLOCK CONSTANT. The DEFECT assertion at `:228-238` — that hero must not raise
  3s3d into a half-nutted range — holds at 2000ms and fails when refinement is allowed to finish.
  The engine's answer to a poker question depends on a latency budget, and the suite has written that
  dependence down and lived with it rather than resolved it.

  THREE OPEN TICKETS ARE SYMPTOMS OF THIS ONE. WS-383: full refinement recommends the raise the suite
  classifies as a defect. WS-379: desktop and phone give different advice on identical inputs.
  WS-378: 80% of top-action flips are depth-1→depth-2, and 38 of 40 of them run toward passivity.
  That last figure is the one that makes this urgent rather than merely untidy — the depth the engine
  happens to reach is not a neutral quality dial. It has a DIRECTION. Getting less refinement makes
  the engine systematically more aggressive. So a scored run on a loaded machine is not a noisier
  version of a scored run on an idle one; it is a biased version, biased toward aggression, by an
  amount nobody measures.

  NEWLY MEASURED FOR THIS TICKET, AND WORSE THAN THE ROUNDTABLE REPORTED. Running
  `src/utils/postflopDrillContent/__tests__/computeDepth2Plan.test.js` at HEAD on an OTHERWISE QUIET
  machine: **5 of 19 tests fail with "Test timed out in 5000ms"**, suite duration 53.04s. The
  roundtable's brief described this as 8 timeouts under CPU load. It is 5 without any load at all.
  The test suite is not merely machine-dependent under contention — at HEAD, on an idle machine, a
  quarter of one suite does not finish. Whatever number that suite is protecting, it is not
  protecting it today.

  `onFastResult` HAS NO PRODUCTION CONSUMER. Verified by grep across `src/` and `scripts/`: the
  parameter is defined at `:815`, invoked internally at `:1392-1400`, documented in
  `exploitEngine/CLAUDE.md`, and consumed in exactly one place — `__tests__/depthReachability.test.js`.
  That test's own comment (`:226`) names the risk: "an optional parameter that could" ship correct
  and unreachable. It did. This is the `feedback_shipped_but_inert_capability` pattern again, and it
  matters here specifically: the two-phase design exists so the founder can get a fast answer at
  table speed and a refined one after. Nothing consumes the fast answer, so the two-phase machinery
  buys nothing today while the budget it introduced decides the advice.

  WHAT "NOT ASSERTED MONOTONE" MEANS AND WHY IT IS THE CRUX. Nobody has established that MORE
  refinement gives a BETTER answer. If refinement were monotone, a time budget would be a quality
  dial — cheap and honest, and the fix would be to record which depth you got. WS-383 is evidence
  against monotonicity: full refinement produces the answer the suite calls a defect. So the engine
  may be in the worse of the two worlds — an unrecorded, load-dependent, directionally-biased choice
  between two answers where the deeper one is not known to be the better one. Those are two separate
  questions and this ticket must not collapse them: (1) is a run reproducible, (2) is deeper better.
  Question 1 is answerable and is this ticket's job. Question 2 is WS-383's and needs question 1
  answered first, because it cannot be measured on a harness that returns different answers on
  re-run.
accept_criteria: |
  - A SCORED RUN IS REPRODUCIBLE, DEMONSTRATED BY RE-RUNNING IT. Two runs of the same harness over
    the same decision set with the same seeds must produce BIT-IDENTICAL aggregate figures and an
    identical per-decision top action. This is the primary criterion and it is testable today: run
    it twice, diff the output. Against HEAD this fails, which is the point. Demonstrate it failing
    before demonstrating it passing.
  - THE EV CRITERION IS STATED, AND ITS CIRCULARITY IS HANDLED HONESTLY RATHER THAN BY EXEMPTION.
    This item is a PREREQUISITE for measurement: its own EV delta cannot be trusted until it lands,
    because the two arms would be compared on a harness that does not return the same answer twice.
    So the claim this ticket makes is about the MEASUREMENT, not about EV: two runs on identical
    inputs now produce identical figures. THEN, immediately after, the EV delta becomes measurable
    and must be reported — specifically the aggregate EV difference between the depth the harness
    reached before this fix (variable) and the depth it is pinned to after (fixed), on an identical
    decision set. Expected direction, stated so it can be wrong: pinning to full refinement should
    move aggregate EV in the passive direction, following WS-378's 38-of-40 finding. The magnitude
    is UNMEASURED and stating it before the run would be the exact failure this family exists to fix.
  - REFINEMENT DEPTH IS RECORDED IN THE RESULT CARD MANIFEST, PER DECISION AND IN AGGREGATE. A card
    must say what depth its decisions actually reached — not "refinement ran" but the distribution
    of achieved depth across the decision set. `treeMetadata.latency` already distinguishes
    completed / partial / no-candidate / error / gated and carries `weightConsumed`, so the quantity
    exists and is not being carried onto the card. Per `exploitEngine/CLAUDE.md`, "`ran: true` at 3%
    and at 90% must never look the same again" — that principle currently stops at the engine
    boundary and must reach the card. Two cards that reached different depths are not comparable and
    a reader must be able to see that without having been present for the run.
  - MONOTONICITY IS EITHER ASSERTED OR EXPLICITLY DECLARED UNKNOWN, IN DATA. If deeper refinement is
    claimed to be better, there must be a test that fails when it is not — on a decision set where
    truth is available. If it cannot be asserted today, the card carries a field saying so, so that
    a reader of a figure knows whether the depth it reached is a quality level or an arbitrary
    branch. WS-383's finding means the honest answer today is probably "unknown", and writing that
    down is worth more than an assertion nobody can back.
  - THE HARNESS DOES NOT USE A WALL CLOCK AT ALL. Whatever replaces the budget must be a
    deterministic work counter — nodes evaluated, combos scored, strata visited — not `Date.now()`.
    A tighter or looser millisecond budget is the same defect with a different constant. The live
    app may legitimately keep a wall-clock budget for responsiveness on the founder's phone; the
    SCORING path may not, and the two must be distinguishable in code rather than by which caller
    happened to pass what.
  - THE `computeDepth2Plan.test.js` TIMEOUTS ARE RESOLVED OR EXPLAINED, NOT RE-BASELINED BY RAISING
    THE TIMEOUT. 5 of 19 fail on an idle machine at HEAD. Raising `testTimeout` makes them pass and
    changes nothing about the engine. Either the work genuinely takes that long — in which case say
    so and record what depth those calls reach in production on the founder's A22, where the same
    work is competing with React — or something is pathological. Note that WS-379's commit
    (fe716f59) already de-coupled two EV assertions from machine load; this is the residual.
  - `onFastResult` IS EITHER WIRED TO A PRODUCTION CONSUMER OR REMOVED, WITH THE REASON RECORDED.
    It has none today. If two-phase evaluation is the design, something must consume phase one; if
    it is not, the parameter and its `setTimeout(0)` yield are dead weight sitting in the middle of
    the code path this ticket is changing. Do not leave it ambiguous while touching the file — that
    ambiguity is how it survived.
  - COORDINATION, NOT DUPLICATION, WITH WS-383 / WS-378 / WS-379. All three are symptoms. This ticket
    does not resolve any of them and must not silently absorb them. It makes them measurable. Say in
    the completion note what each of the three can now do that it could not before.
