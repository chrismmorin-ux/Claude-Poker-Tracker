decision_flags:
  - |
    OPEN AND THE FOUNDER SHOULD DECIDE IT — DOES THE SCORING PATH RUN TO FULL DEPTH REGARDLESS OF
    COST? The clean fix for reproducibility is to remove the budget from the scoring path entirely
    and always refine fully. That is honest and it may be slow: `computeDepth2Plan.test.js` takes
    53 seconds for 19 calls at HEAD, and a corpus run is thousands of decisions. The alternative is a
    deterministic work budget — same answer every time, but a budget that still truncates, so the
    figure is "the engine's answer at N nodes" rather than "the engine's answer". Both are
    reproducible; they measure different things. The standing rule in memory
    (`feedback_never_delete_for_null_result`) is that latency is a constraint to engineer around and
    never a reason to ship a shallower answer — which argues for full depth on the scoring path and
    a separate, clearly-labelled budget for the live app. Confirm that reading before building it.
  - |
    OPEN — WHETHER THE LIVE PATH AND THE SCORING PATH SHOULD BE ALLOWED TO DIVERGE AT ALL. If scoring
    runs to full depth and the phone runs to 2000ms, then the EV figure the founder optimizes is not
    the EV of the advice he receives at the table — it is the EV of a deeper engine he only ever gets
    on a desktop. That gap is measurable (it is exactly the WS-379 desktop/phone difference) and it
    should be REPORTED as a number rather than allowed to sit unnamed between the two paths. Deciding
    to diverge is defensible; deciding to diverge without measuring the gap is how a scored figure
    stops describing the product.
