status_note: |
  Premises re-verified against HEAD by reading the code and by RUNNING the suite, not by trusting the
  roundtable record:
    - `src/utils/exploitEngine/gameTreeEvaluator.js:814` — `refinementBudgetMs = 2000`; `:815`
      `onFastResult = null`; `:822` `const startTime = Date.now();`; `:803-808` the docstring
      confirming the budget gates depth-2/3 and explaining why the old single clock was dead.
    - `onFastResult` consumers, by grep across `src/` and `scripts/`: definition `:815`, internal
      invocation `:1392-1400`, comments `:810` and `:1110`, `exploitEngine/CLAUDE.md:455-471`, and
      `__tests__/depthReachability.test.js:226,:235`. NO production consumer. Verified rather than
      quoted.
    - `foldEstimateComposition.test.js:65-77` — the docblock, quoted verbatim in the description;
      `:228-238` the DEFECT test (`expect(result.recommendations[0].action).not.toBe('raise')`).

  PROGRAM ASSIGNMENT, DECIDED AGAINST THE OBVIOUS ONE AND STATED BECAUSE IT IS ARGUABLE.
  `methodology-integrity` is the natural home by SUBJECT — this is about whether a measurement is
  reproducible — and WS-379, its closest sibling, sits there. It is filed under
  `domain-correctness` instead, for two reasons. First, the defect is in engine code
  (`gameTreeEvaluator.js`), squarely inside domain-correctness's scope, and the fix is an engine
  change rather than a process change. Second, and decisively: `methodology-integrity` is at 10/3
  open items (3.33x its cap) with `priority_floor: 18`, and per this repo's recorded failure mode
  (`feedback_cap_breach_distorts_composition`) a program over cap has its backlog clamped to that
  floor. Filing the family's highest-priority item there would clamp it to 18 — BELOW WS-387 (25)
  and WS-388 (24), which it is supposed to gate. That would invert the exact ordering this ticket
  exists to establish. `domain-correctness` is also over cap (73/60) with `priority_floor: 27`, so
  the item is clamped UP rather than down. Both caps are breached and both should be addressed; that
  is a separate concern and is reported rather than worked around further.

  ONE PREMISE DID NOT VERIFY, AND IT IS THE ONE THE BRIEF LEANED ON HARDEST. The brief states that
  `foldEstimateComposition.test.js:228-237` "documents a top-action flip between a 60000ms and the
  shipped 2000ms budget." THE NUMBER 60000 DOES NOT APPEAR ANYWHERE IN THAT FILE AT HEAD — grepped
  directly. What the file actually carries is the prose at `:65-77`: "Pinning `refinementBudgetMs`
  high was tried and reverted", with no budget value named. The flip is real and is recorded; the
  specific 60000ms figure is not a citable premise and has been removed from this ticket rather than
  propagated. The file's most recent change is commit fe716f59 (WS-379, "stop two EV assertions from
  measuring machine load"), which is likely where the earlier explicit budget was removed.

  ONE PREMISE VERIFIED AND FOUND TO BE UNDERSTATED, WHICH IS THE RARER DIRECTION. The brief reports
  8 timeouts in `computeDepth2Plan.test.js` "under CPU load". Ran at HEAD on an otherwise quiet
  machine (`npx vitest run src/utils/postflopDrillContent/__tests__/computeDepth2Plan.test.js`):
  **5 failed | 14 passed (19), duration 53.04s**, every failure reading "Test timed out in 5000ms"
  — including `:148` ('defaults decisionKind to "standard" when omitted') and `:155` ('attaches
  treeMetadata for diagnostic surfacing'). So the count is 5, not 8, and the load condition is not
  required. That is worse than reported, not better: the suite does not need contention to fail. The
  ticket cites the measured 5-on-idle rather than the reported 8-under-load.
