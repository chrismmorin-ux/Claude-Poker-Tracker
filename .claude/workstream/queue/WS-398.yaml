status_note: |
  Premises re-verified against HEAD by reading the code.

  VERIFIED AS STATED:
    - `villainObservations.js:72` — `blindDefendMax: 25,  // Below this % → over-folding blinds
      (MDF vs 2.5x open ~40%)`. Consumed at `:239` and `:243`.
    - `unexploitableFloor.js` exports: `blindSeededGeometry` `:112`, `deriveFloor` `:171`,
      `closureCost` `:265`, `rakeAsymmetry` `:292`, `floorVsAssertedConstant` `:310`.
      `rakeAsymmetry` is called internally once at `:200`.
    - Importer census by repo-wide grep: only `__tests__/unexploitableFloor.test.js:18` and
      `__tests__/rakeResolver.test.js:228`. Zero production consumers, as the run record states.
    - `unexploitableFloor.test.js:250-256` — the `floorVsAssertedConstant` describe block, with the
      comment "villainObservations.blindDefendMax = 25, commented 'MDF vs 2.5x open ~40%'" at `:252`
      and `asserted: 0.40, label: 'blindDefendMax'` at `:255`. The run record's `:252-255` is exact.

  CORRECTED — THE RUN RECORD'S LINE NUMBER, AND MORE IMPORTANTLY ITS CHARACTERISATION OF THE FIX:
    - The constant is at `villainObservations.js:72`, not `:69`. `:69` is the closing `*/` of the
      `T` docblock; the object opens at `:70` and `:71` is the `// -- Preflop --` divider. (The
      module header of `unexploitableFloor.js` cites the constants as living at
      `villainObservations.js:51-65`, which is also stale by the same drift.)
    - THE SUBSTANTIVE CORRECTION: `do_not_file` calls this a "two-line change". It is not. The
      docblock on `floorVsAssertedConstant` (`:303-308`) records a FOUNDER DECISION dated 2026-08-02
      that these constants are deliberately NOT replaced, because they drive live over-fold detection
      and swapping them would silently re-tune which villains get flagged — with this reporting
      function built precisely so the eventual replacement is "a decision with evidence attached
      rather than a leap". Filing a two-line constant swap would reverse a founder decision made
      three days before the roundtable ran, on the strength of a roundtable that did not open the
      docblock stating it. The ticket above is rewritten around producing the evidence that decision
      asked for and leaving the constant to the founder. This is the correction that matters most in
      this batch.

  ALSO NOTED: `unexploitableFloor.js:20-23` names two further hand-asserted sites
  (`anchorScenarioRunner.js:146`, `postflopDrillContent/planRules.js:42`) that neither the run record
  nor `do_not_file` mentions. They are counted, not fixed, by the accept criteria above.
