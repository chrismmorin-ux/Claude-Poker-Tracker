decision_flags:
  - |
    FOUNDER DECISION REQUIRED, AND IT IS THE POINT OF THE TICKET — DOES `blindDefendMax` MOVE FROM 25
    TO THE DERIVED FLOOR? The 2026-08-02 decision deferred exactly this and asked for evidence first.
    This ticket produces the evidence: the derived floor at the founder's stakes, the delta in
    percentage points, and the list of villains whose over-fold flag changes. The founder should see
    those three things and then decide. Moving it makes the detector theory-consistent and re-tunes
    live flagging; holding it keeps the flagging stable and keeps a constant 15pp below its own
    stated anchor. Neither is obviously right, which is why it was deferred once already.
  - |
    OPEN — WHETHER `rakeAsymmetry` SHOULD REACH EV AT ALL, OR STAY A DIAGNOSTIC. It quantifies a real
    and unmodelled asymmetry (no-flop-no-drop makes the successful steal untaxed while the defended
    pot pays a flop rake), and WS-333 already established that rake omission is worth ~4.8pp of
    required equity live. Wiring it changes EV on every preflop blind-defence decision, which is a
    large blast radius for a module with no consumers today; leaving it unwired leaves a measured
    effect out of the model on purpose. This is a genuine architectural call, not an oversight to
    close quietly.
