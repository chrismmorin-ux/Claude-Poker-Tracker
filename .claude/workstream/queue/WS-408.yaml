status_note: |
  PREMISES RE-VERIFIED AGAINST HEAD (fe716f59), EVERY SITE READ IN PLACE.

    - `gameTreeEvaluator.js:705` and `:719` — the depth-1 expression, quoted in the description
      verbatim from the file.
    - `gameTreeDepth2.js:737` — `export const computeBetCallDepth2EV = async ({`; `:873` —
      `export const computeRaiseResponseDepth2EV = async ({`; `:60` — `const narrowBranch = (...)`;
      `:16` — `tightenRatesForContinuation` in the import list. A grep for `narrowBranch` and
      `tightenRatesForContinuation` across `src/utils/exploitEngine/` returns hits in
      `gameTreeDepth2.js` ONLY (lines 16, 60, 751, 757-758, 889, 895-896, 1005, 1010-1011, 1094,
      1100-1101, 1104-1105, 1179), confirming capability 4's premise exactly.
    - `gameTreeEquity.js:1041` — `export const bestResponseToAggression = (heroEquityVsAggroRange,
      potBeforeAction, aggroBet, callCost, street, isIP, options = {})`, the single site where hero
      gets an extra decision at depth-1. The audit note cited `:1059-1109`; that range is INSIDE
      this function (the villain raise-model lookup at `:1060`, the multiway opponent loop at
      `:1105`), so the premise holds but the function's entry point is `:1041`.
    - `gameTreeEvaluator.js:1594` `betCallDepth2` gate; `:1632` `raiseResponseDepth2` gate, whose
      conditions are `{ enabled: enableDepth2Raise, raiseLikely: pRaise > 0.02 }` — NOT street, as
      the audit note's line list implied; it is street-gated only transitively, being nested inside
      the `betCallDepth2` block.
    - `:865` `buildHeroActions`, `:899` `const timeBudgetMs = refinementBudgetMs` — 34 lines apart,
      the mechanical proof that the candidate set is arm-invariant.
    - `heroActionBuilder.js:257` — the `check-raise` candidate.
    - `:1740-1741` — `depth3ComboLimit = street === 'turn' ? 1200 : 800` and the
      `segmentation.totalCombos <= depth3ComboLimit` qualifier, which is why triple barrel is
      WS-409 and not a sixth bullet here.

  MEASUREMENT, RUN BY ME ON HEAD via a temporary vitest probe (created, run, deleted): full 169-cell
  range, board A-spade 7-heart 2-diamond, hero A-heart K-heart, pot 60, `trials: 2000`, budgets
  0/2000/8000/30000 ms, on both a check node and a facing-bet node. `segmentation.totalCombos` 1081.
  Per-stage `weightConsumed` on the facing-bet node: `callDepth2` 0.248 / 0.872 / 1.000 and
  `betCallDepth2` 0.184 / 0.184 / 1.000 across 2000/8000/30000 ms.

  ONE PREMISE FROM THE AUDIT NOTE DID NOT REPRODUCE, AND IT IS THE DIRECTION DEMONSTRATION. The note
  offered, as evidence that the direction is demonstrated rather than assumed: "same OOP flop node,
  top action `check` at 2000 ms -> `bet` at 30000 ms, stated bet-EV 19.48 -> 20.55 -> 21.87." On my
  fixture the top action goes the OTHER way — `bet@120 = 62.61` at budget 0, then `check = 70.58` at
  2000 ms, `check = 69.83` at 8000 ms, `check = 69.90` at 30000 ms — so depth-2 moves this node from
  aggression to passivity and keeps it there at every budget. The bet candidate's stated EV DOES
  rise monotonically with budget (66.12 -> 66.21 -> 66.22) exactly as the note describes, but the
  check candidate rises further and the argmax never flips back.

  I could not reproduce the note's node, and the difference is almost certainly the fixture — a full
  169-cell range on one board versus a narrowed corpus range. But the honest reading is that the
  direction is NOT demonstrated: on the one node I could measure, and on the corpus as a whole (38
  of 40 flips toward passivity), depth-2 makes hero MORE passive, not less. That does not weaken the
  ticket. It sharpens it: the five capabilities are all reasons hero SHOULD be more aggressive than
  depth-1 says, and the measured net effect of depth-2 is the opposite, which means either the
  capabilities are being outweighed by something else in the refinement (the most likely candidate
  is `riverPerCombo`, which is the only stage that opens on the river, where 36 of the 45 flips
  occur) or they are not being reached. Both are answerable by the per-capability ablation this
  ticket specifies, and neither is answerable without it. The accept criteria state the predicted
  direction as positive per capability precisely so that this contradiction has somewhere to
  resolve.
