decision_flags:
  - |
    OPEN — IS THE FIVE-WAY ABLATION AFFORDABLE, AND IF NOT, WHICH TWO GET MEASURED? Measured compute
    is 23.9 s per decision for a TWO-arm pair on 260 decisions (1.7 machine-hours). Six arms — full
    plus five ablations — is roughly 5 machine-hours at the same scope, and that is before WS-407's
    realization arm and WS-409's depth-3 arm want space in the same run. Against that, at the current
    15.2% ESS most of the five will return nulls, so spending 5 hours to learn "we cannot tell" five
    times is a poor trade. The options are (a) run all five once at current scope and accept a table
    of nulls as a documented baseline, (b) run only the two with the largest predicted effect
    (double barrel and continuation-range narrowing) at a larger scope, or (c) wait for WS-402 to
    raise the ESS and then run all five. RECOMMENDATION: (c), with (b) as the interim if the founder
    wants a number sooner. Note that (a) is not worthless — a documented table of nulls is what
    stops the same five questions being asked again — but it should be labelled as a power
    demonstration, not as a result.
  - |
    OPEN — WHAT HAPPENS TO THESE CAPABILITIES ON THE RIVER? All five are street-gated off the river
    (see WS-406), which is correct for four of them — there is no next street to barrel into — but
    NOT obviously correct for capability 2, hero's own future decisions. On the river hero still has
    a decision after villain raises, and `bestResponseToAggression` still prices it, so the river is
    depth-1 by definition rather than by omission. Worth stating explicitly in the estimand
    vocabulary so that "depth-2 does nothing on the river" is recorded as a property of the game
    rather than as a gap in the engine.
