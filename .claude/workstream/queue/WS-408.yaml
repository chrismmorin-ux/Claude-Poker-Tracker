id: "WS-408"
title: "Five depth-2 valuation capabilities exist in code and cannot currently be priced individually — double barrel, hero's own future decisions, future-street fold equity, villain's next-street continuation range, and post-raise-call continuation — all absent at refinementBudgetMs=0, all biasing hero toward passivity, all reachable through one scheduler and one flag set"
