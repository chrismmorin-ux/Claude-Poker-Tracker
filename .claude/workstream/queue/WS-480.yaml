description: |
  Survey F1 (docs/research/engine-vocabulary-survey-2026-08-14.md). `recommendation.sizing.betFraction`
  is a pot fraction on the postflop bet path (heroActionBuilder.js:165+), increment/(pot+bet) on the
  raise path (:125,134,145), and a BIG-BLIND MULTIPLE on the preflop path (preflopAdvisor.js:424,496,
  596,631,691 — pinned by preflopAdvisor.test.js:315,347). Six UI components render it as `% pot`
  (LiveAdviceBar.jsx:262 et al.), replayAnalysis.js:434-435 builds an EV-vs-fraction curve mixing the
  units, and drillModeEngine.js:443,588 defaults a bb-multiple into a pot-fraction slot. The preflop
  recommendations reach the same array via computeHelpers.js:212 → useLiveActionAdvisor.js:283,330.
accept_criteria: |
  - The field is split by unit: `potFraction` (postflop bet/raise, with the raise-denominator
    convention stated) and `bbMultiple` (preflop), with `betFraction` kept as a deprecated alias
    carrying its CURRENT per-path meaning so no consumer breaks on day one.
  - One resolver converts between units given the game state; no consumer does its own division.
  - Every `% pot` render site reads potFraction only; preflop sizing renders as `Nx` (bb multiple).
  - drillModeEngine's fallback and replayAnalysis's EV-vs-sizing curve are unit-correct, with a test
    each pinning a preflop and a postflop case.
  - UX-visible copy change on primary advice controls → Design Gate 1 applies to the render half.
