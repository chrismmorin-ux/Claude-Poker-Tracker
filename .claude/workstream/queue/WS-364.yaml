decision_flags:
  - |
    OPEN — is measuring it worth the run? Option (b), deleting the claim, is cheap and honest
    and costs nothing the decision actually needs; DEC-036 stands on the reachability evidence
    without a full-refinement ceiling. Option (a) costs an unbounded-budget run but produces
    the number that will be needed anyway the first time `refinementBudgetMs` is tuned, and
    tuning it on the S22 is already an outstanding WS-334 item. Recommend (a) IF the S22 run
    is being done regardless — measure both in one pass — and (b) if not. Do not default to
    (c); a "not measured" marker is the right answer only if the number is wanted later and
    nobody is going to produce it now.
  - |
    NOTE — the 26s figure may be a misremembered relative of WS-301's measured 8.5s depth-2
    cost, or of an in-session observation never written down. Worth two minutes of history
    before measuring, because if a real run produced it, the run is the artifact to register
    and the ticket collapses to citing it.
