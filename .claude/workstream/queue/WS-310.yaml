status_note: |
  Filed at founder request 2026-07-30 after a design conversation during SPR-160.

  EMPIRICAL GROUNDING (already measured, docs/research/player-archetypes-empirical-2026-07-26.md):
  Finding 12 is a terminal-strength distribution by street over shown hands —

    action        n shown   air    draw    one pair   strong(2P+)
    c-bet flop    43,294    14.9%  16.0%   52.2%      16.9%
    barrel turn   71,154     4.1%  24.2%   31.7%      40.0%
    barrel river  60,047     6.1%   0.0%   27.7%      66.3%

  The draw column IS the window, and it empties by construction at the river. The mass
  redistributes rather than vanishing (pair 52.2 -> 31.7 while strong 16.9 -> 40.0), so
  the window's collapse and the betting line are coupled — which is the whole point.
  Finding 13 sizes the payoff: 52.2% of shown flop c-bets are exactly one pair, the
  category WS-278 identified as ambiguous between thin value and protection, and
  protection is DEFINED by terminal spread.

  All of the above are shown-hand conditionals and inherit that censoring: a bluff that
  works is never shown, and a folded draw is never shown, so both numerator and
  denominator are censored. Read as shape and bound, not level.

  NOT A CHARTER YET. If the gate confirms and the follow-up design is large, this should
  become a project file in .claude/projects/ rather than growing further as a ticket.
