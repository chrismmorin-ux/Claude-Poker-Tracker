decision_flags:
  - "Does this SUPERSEDE WS-303 or sit beneath it? Hypothesis (unmeasured): WS-303's finding that re-narrowing sharpens the range until depth 3 is worse than not narrowing is the SAME root cause — re-narrowing a hole-card grid street by street treats streets as independent filters and compounds error, where conditioning one terminal window does not. Test this cheaply before building either."
  - "Does Layer A ship as a new primitive, or as a replacement for the existing bucket taxonomy (nuts/strong/marginal/draw/air)? The data argues 'draw' is not a hand class but an UNRESOLVED STATE — the draw column runs 16.0% flop -> 24.2% turn -> 0.0% river by construction. A bucket label cannot express '9 outs to the nuts, 38 outs to nothing'."
