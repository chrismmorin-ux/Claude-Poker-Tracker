description: |
  Split out of WS-276 by explicit founder decision on 2026-07-30 (SPR-161). WS-276
  shipped all three ENGINE halves — hero range, perceived range, bluff:value
  construction — plus `exploitEngine/heroSelfObservation.js`, which produces
  range-level observations about hero's own play. Nothing reads it. This item is
  the surface.

  WHY IT WAS SEPARATED. It is the only part of WS-276 that introduces a
  user-facing surface, which triggers design Gates 1, 2 and 4 (entry scope +
  blind-spot roundtable + a surface artifact in docs/design/surfaces/). The engine
  work had no such gate and would have been held behind it for no reason. WS-276
  recorded a Gate 1 classification of GREEN/engine-internal for itself; the gate
  obligation travels here.

  WHAT ALREADY EXISTS (do not rebuild):
    - `observeHeroContinuationRate(decisionSummary, filter)` — k/n plus its
      conditioning set, never a bare number.
    - `observeHeroSituations(decisionSummary, minOccurrences)` — per-situation
      action frequencies with counts; thin cells are FLAGGED `sparse`, never
      dropped, because dropping them would quietly hide the spots hero knows least
      about.
    - `buildHeroTendencies(decisionSummary)` — the shape
      `liveGameContext.buildPerceivedHeroRangeForVillain` consumes.
    - `bluffValueConstruction.constructBluffValue(...)` — returns the balanced
      anchor and the deviated figure together, with `isBaseline: true`.

  THE BINDING CONSTRAINT ON THE DESIGN. Per the founder's standing position on
  owner-volunteered grading, this surface is OPT-IN and OBSERVATIONAL. It reports
  frequencies against the spot's requirement. It must not emit a grade, rank,
  tier, score, mastery level or streak, and must not rank situations by severity
  on hero's behalf — a consumer that wants an ordering supplies its own criterion.
  The engine layer already refuses to emit those fields and is asserted so by
  test; the surface must not reintroduce them at the presentation layer.

  SECOND CONSUMER, ALREADY WIRED AND CURRENTLY INERT. `buildHeroTendencies` feeds
  the per-villain perceived-range model: until something computes hero's
  decisionSummary and passes `heroTendencies` through, every perceived range sits
  on the population prior and the per-villain refinement never engages. That is
  correct-but-unused today. Shipping this item is what turns the observation
  channel on, which makes it worth more than a display feature.
accept_criteria: |
  - Gate 1 (Entry) completed: scope classification, personas, JTBD, gap analysis
    with a GREEN/YELLOW/RED verdict recorded.
  - Gate 2 (Blind-Spot Roundtable) run if Gate 1 is YELLOW or RED, or if the
    surface targets an underserved persona.
  - Gate 4: a surface artifact exists in docs/design/surfaces/ before any
    production code.
  - Surface is opt-in and presents observations, not grades. Asserted by test that
    the rendered payload carries no grade/rank/score/severity/tier/mastery field.
  - Every displayed frequency shows its numerator, denominator and conditioning
    set — no bare percentages.
  - Sparse situations are shown as sparse rather than omitted.
  - Bluff:value is displayed with the balanced anchor and the villain-licensed
    deviation side by side; the anchor is never rendered alone as advice
    (POKER_THEORY §12.4).
  - `heroTendencies` is threaded into the live advisor so the per-villain
    perceived-range refinement engages; a test shows two villains with different
    observation counts producing different predicted responses END TO END, not
    just at the builder.
  - Commit / PR references the audit-id or surface-id it implements.
