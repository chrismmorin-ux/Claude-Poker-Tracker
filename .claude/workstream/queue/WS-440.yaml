description: |
  Found in the 2026-07-31 founder-device pass (5ca7b298 made the app runnable without credentials): the rotate-device gate hard-blocks entry with no dismiss affordance and no recovery when the device rotates back - a phone that auto-rotates mid-session (pocket, table bump) can lock the founder out of hand entry entirely. Worse than any advice-quality defect because it removes the ability to act at all. Original ticket WS-315 was overwritten by an unrelated ticket; re-filed 2026-08-07 by launch/sweep. Premise re-verification is step 1: confirm the gate still hard-blocks at HEAD.
accept_criteria: |
  Verify current behavior at HEAD; make the hint dismissable and self-recovering on orientation change; add a test simulating rotate-away/rotate-back mid-entry.
