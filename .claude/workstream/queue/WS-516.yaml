status_note: |
  No existing item covers this. Checked WS-370 (dead export handler), WS-460 / FIND-122 (journal
  retention), FIND-083 (origin checks + captureId dedup), WS-358 (the capture-durability work
  this detector shipped alongside) — none of them touches the silence detector or the liveness
  path.

  All citations confirmed exactly as given: `:520` guard, `:359` increment, `:500-505` thresholds,
  counter never reset. `lastWsMessageAt` confirmed present at `:76`/`:460`/`:530` — the audit
  proposed comparing against it as a fix and did not know the comparison was already written and
  stranded behind the guard, which makes this materially smaller than filed.

  VERIFICATION HAZARD, applies to this ticket and WS-517 both: `ignition-poker-tracker/dist/` was
  last built 2026-08-04 and the source is two commits ahead. Anything checked against the
  currently loaded extension is testing 2026-08-04 code. Rebuild before verifying — see WS-517's
  status_note for the full detail.
