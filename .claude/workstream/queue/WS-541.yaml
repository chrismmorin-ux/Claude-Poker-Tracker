description: |
  FOUNDER RULING, 2026-08-18: "the goal is to play like a villain and document and learn and how
  losing of a player are they and study the surface of our most common villain and how it makes
  decisions."

  "How losing are they" is a NUMBER THIS REPO HAS NEVER PRODUCED, and it is the anchor the whole
  villain-model ladder is trying to match. Without it, `evFidelity.targetEdgeBB` has nothing to
  point at and the ladder can only say "this rung differs from the field by X", never "this rung
  earns what the villain earns".

  THE DENOMINATOR IS THE WHOLE DIFFICULTY, and the repo already warns about it in the
  ipsEstimator comment for `edgeBBPer100Decisions`:

      "The per-100-HANDS figure is a different quantity with a different denominator, and it is
       NOT this number times anything: see `handLedger.mjs` for the denominator and why hands
       dealt is not hands scored."

  So this cannot be produced by rescaling anything the hero-EV path already reports. Scored
  decisions are a filtered, action-conditional subset; hands dealt is the denominator a winrate
  needs. `handLedger.mjs` exists and owns that distinction.

  WHAT TO PRODUCE:
    - The field's realised result in bb/100 HANDS, over hands dealt, with rake handled
      explicitly (the harness carries a rakeConfig and a `netBBUnraked` alongside `netBB` —
      report BOTH, because "how losing are they" reads very differently before and after rake,
      and the rake share IS the answer to whether the pool is losing to each other or to the
      house).
    - The same figure PER STRATUM (see WS-542), because a 76.7%/23.3% blend describes nobody.
    - The spread across players, not just the mean. A pool mean hides whether it is a uniform
      slow bleed or a few large donors.

  CONDITIONING, BINDING: online 50NL July 2009. The founder plays live 9-handed 1/2-1/3. This
  figure is TRANSFERRED, not measured, for his game, and the card must say so.
accept_criteria: |
  - bb/100 HANDS over hands dealt, using handLedger's denominator, NOT a rescale of any
    per-decision figure. If the two disagree, the disagreement is reported, not reconciled away.
  - Raked and unraked both reported, with the rake share called out.
  - Per-player distribution reported (at minimum median and quartiles), not only the mean.
  - Result Card with manifest and disclaimerRegisterVersion.
  - Feeds `metrics.villain-model-card.evFidelity.targetEdgeBB` so the ladder has a target to
    match rather than a direction to maximise.
