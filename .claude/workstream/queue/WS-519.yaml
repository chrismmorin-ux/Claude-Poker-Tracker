  Filed alongside the guide-authority monitor rather than after it, deliberately: the monitor's
  INERT check names an owner and a date, and an alarm with no owner is not one.

  The decision flag is real and unresolved. It was raised on 2026-08-16 and the founder
  redirected to the program question before ruling on it. It does not block starting — the
  Guide can be emitted with the cell reported `unexamined` either way — but it determines
  whether the first Guide has any numbers in it at all.
