status_note: |
  Found independently by the game-theory and information lenses of the 2026-08-19 Conduct Card
  audit, and by three of the six blind primitive-generation agents in the same session — the
  blind agents reached it from the other direction, reporting that the instrument records the
  size of bets the villain FACES and never the size of bets he MAKES.

  Touches `src/utils/standardOfRecord/conductCard.js`, which is schema-versioned and
  additive-only; `schemas.test.js` pins a baseline and fails on any removal or retype. Add, never
  reshape.
