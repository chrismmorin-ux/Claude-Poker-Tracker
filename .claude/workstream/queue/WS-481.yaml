description: |
  Survey F3 (docs/research/engine-vocabulary-survey-2026-08-14.md). decisionAccumulator.js:487,496
  computes facingBetFraction = facingBetAmount / potBefore where potBefore is hand.gameState.potSize —
  documented as the FINAL total pot (phhAdapter.mjs:423-427). A pot-sized flop bet in a hand that
  reaches the river trains as ≈0.2 instead of 1.0. The fitted personalizedFoldCurve
  (villainDecisionModel.js:783 → villainModelData.js:542) is then evaluated at the true street-pot
  fraction (gameTreeEvaluator.js:706-716 via villainFacingFraction, foldEquityCalculator.js:450-459),
  and it OUTRANKS the population curve on the bet path (gameTreeEvaluator.js:704). Same defect on
  sizingTells samples (decisionAccumulator.js:579-580). exploitEngine/CLAUDE.md's rule ("do not
  evaluate a fitted curve on a variable it was not fitted on") guards consumption only.
accept_criteria: |
  - The timeline walk carries a running street pot; foldCurveData and sizingTells samples record the
    same betFraction definition villainFacingFraction evaluates at — one function defines the axis
    for both sides, imported by both.
  - A regression test constructs a multi-street hand and asserts the trained fraction for a flop
    pot-sized bet is 1.0, not final-pot-relative.
  - Impact is measured through the WS-273 villain-prediction harness (Brier/log-loss before/after)
    and reported per Standard of Record; the delta on advice is priced per Amendment 1 (an EV delta
    via the paired harness), not shipped blind.
  - The consumption-side guard is extended to the training side (the axis mismatch becomes
    structurally unrepresentable, not documented).
