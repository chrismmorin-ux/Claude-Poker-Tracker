description: |
  Stage 3 of the player-segmentation program (docs/research/player-segmentation-program.md).

  FOUNDER (2026-08-16): "corpus simulation might have -bb against a 'good' winning player [...]
  and may be hugely winning against half the pool who has negative EV behaviors. The more
  targeted segmentation can allow us to run our model against both types of players and see
  where the actual EV gains at the table are coming from (bad players, 3bp, in position,
  premium hands, hit draws, etc.)."

  THE DEFECT THIS REMOVES. Every EV figure this engine has ever produced is an average over an
  undifferentiated pool. If the pool contains a competent half and an exploitable half with
  different answers, the pooled figure is the mean of two distributions and describes neither.
  A strategy that is strongly +EV against the exploitable half and mildly -EV against the
  competent half shows up as "roughly break-even" and gets dropped. That is precisely the
  over-aggregation the founder named, and it is the same shape as the aggregate-null rule now
  written into separabilityVerdict.

  This is a PARTITION of an existing surface, not a new instrument: the Deal Book and Result
  Card machinery already support partitions, and the segments come from WS-508's measured
  behavior classes rather than from any hand-assigned label.

  DECOMPOSITION AXES the founder named, to be reported as cells rather than folded into one
  number: villain segment, 3-bet pots, in position vs out, premium holdings, draws that got
  there. The aggregate stays reported beside them — the point is that the decomposition is
  visible, not that the aggregate is discarded.
accept_criteria: |
  - Engine EV is reported PER SEGMENT against the same versioned Deal Book, with the pooled
    figure retained beside the per-segment figures.
  - Segments are defined by measured behavior (WS-508 output), never by a hand-assigned label.
  - Per-segment n and CI are reported. A segment too small to carry a verdict says so rather
    than reporting a point estimate — the three-outcome discipline, not two.
  - The decomposition cells (3-bet pots, position, holding class, draw completion) are reported
    per segment, and the report states which cells were UNDERPOWERED rather than omitting them.
  - Result Card with full replication manifest, stamping manifest.disclaimerRegisterVersion.
  - The card carries the ONLINE_2009_NOT_LIVE warning: the segments are online 2009 50NL
    (SRC-012) and the founder plays live 9-handed 1/2–1/3 (SRC-014). Segment composition is one
    of the things most likely to differ between those populations, so any live reading is
    transferred, not measured, and the card must say so.
