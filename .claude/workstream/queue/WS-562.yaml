description: |
  FIND-100, filed 2026-08-07, CRITICAL, open TWELVE DAYS, NO WORK ITEM. This item is the
  conversion, not a re-discovery.

  `src/contexts/AuthContext.jsx:294-296` calls only deleteUser(auth.currentUser). `clearAllData` has
  zero non-test callers outside `exportUtils.js:205` (import replace-mode). Re-read at HEAD by the
  security engineer (lines 260-303) and again by the cross-critic: no purge call exists in that
  function.

  Every IndexedDB store survives indefinitely - hands, sessions, players, ethnicity and physical-
  description fields, and unencrypted photo blobs used for table identification. The stronger
  facilitator finding from 08-07, re-confirmed: NO user-invocable purge path exists ANYWHERE in the
  product, even outside the deletion flow.

  time_to_detect: NEVER - nothing ever contradicts the toast. recoverability: YES, trivially - the
  data is still there; that is precisely the defect. This is a TRUST defect: a partner, a store
  reviewer, or one of the described players would read it as a data-protection failure on sight, and
  the physical-description fields make that reading worse.

  SEQUENCE AFTER WS-559 - the purge must enumerate from the same schema registry, or it will purge 3
  of 25 stores exactly as the backup does.
