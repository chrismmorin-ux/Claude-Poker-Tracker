description: |
  _Convergence: closes FIND-035 (structural fragility in the WS-235 segmented prior swap) — sweep run-sweep-2026-07-22_

  statRules.js:35-54 runWithStatPriors swaps a module-scoped activeStatPriors
  around the synchronous rule-evaluation body. Correctness under the
  Promise.all-over-players pattern (usePlayerTendencies.js:99-121) depends on
  an invisible invariant: nothing reachable from the wrapped closure ever
  awaits. If a future change adds an await, one villain's rules could silently
  evaluate under another villain's segmented priors — no error, subtly wrong
  exploit output. Convert the comment-level invariant into a structural one:
  guard that fn's return value is not a thenable; throw if it is.
  ("Prefer unrepresentable to validated" — fail loud beats silent corruption.)
accept_criteria: |
  - runWithStatPriors throws (with a descriptive message naming the invariant)
    when the wrapped fn returns a thenable/Promise.
  - Test asserts the throw for an async fn AND asserts normal passthrough +
    finally-restore for a synchronous fn (including when fn throws).
  - exploitEngine suite green; no behavior change for existing callers.
