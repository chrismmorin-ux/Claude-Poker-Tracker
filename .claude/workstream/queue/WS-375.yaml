decision_flags:
  - |
    OPEN — WHERE THE ENFORCEMENT LIVES. Three shapes, not equivalent. (a) A lint/invariant rule
    banning direct imports of the corpus artifacts from `scripts/backtest/` — cheap, catches the
    import, says nothing about what the module then does with it. (b) The reference modules
    refuse to hand out their table except through the guard — strongest, but they are also
    imported by the APP, which has no guard and no need of one, so the refusal would have to be
    scoped to the backtest context. (c) A runtime assertion in each entry point — weakest, since
    it is the thing being forgotten. Choose deliberately; (a) is the cheapest thing that is
    genuinely structural.
  - |
    OPEN — WHETHER THE ENTRY EVALUATOR SHOULD EVENTUALLY SCORE CORPUS HANDS. The natural next
    question after "what does the model say to open" is "what did the field actually do", and
    the corpus can answer it. If that is on the roadmap, this ticket is a prerequisite rather
    than hygiene, and its priority should rise accordingly. If it is not, P2 is right. The
    founder should say which.
