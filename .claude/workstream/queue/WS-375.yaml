status_note: |
  Premises re-verified against HEAD by reading code, not by trusting the commit message:
  `entryEvaluator.mjs:65` (`loader.load('/src/utils/exploitEngine/handhqReferencePool.js')`) and
  a grep of the whole file for `LeakageGuard`/`leakage` returning zero hits;
  `:81-84` and `:227` (the only two uses of the loaded table — a stake lookup and a `sourceId`
  stamp), `:74` (hand classes from the generated equity table, not from corpus hands),
  confirming the "no leak today" claim rather than repeating it;
  `leakageGuard.mjs:136-148` (constructor validates and re-exposes, with the sanctioned-channel
  comment), `:70-106` (`validateReferenceTable` returning `pool-train` or `disabled`);
  `leakageGuard.test.js:81` (bare construction throws);
  the five guarded entry points at `heroEvRunner.mjs:125`, `layerAblation.mjs:301`,
  `run-atoms.mjs:132`, `run-study-ladder.mjs:88`, `runner.mjs:485`;
  the two callers at `run-entry-map.mjs:83` and `run-entry-suit-pass.mjs:77`.

  Filed at P2 deliberately. The other four WS-325 findings all have a live consequence; this one
  has none today. It is filed because the failure mode it guards against is SILENT — a leaked
  backtest produces a scorecard indistinguishable from a clean one — and a silent failure with
  no live damage is exactly the kind that stays unfixed until it is expensive.
