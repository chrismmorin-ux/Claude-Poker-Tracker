id: "WS-418"
title: "The Hole Map artifact bakes its freshness verdict at generation time (checkedAt equals generatedAt), so an in-app view that renders it inherits a currency claim the CLI already knows to be false — and the artifact on disk today is dirty-source, meaning day one in-app is a full-width warning that its own columns are unattributable"
