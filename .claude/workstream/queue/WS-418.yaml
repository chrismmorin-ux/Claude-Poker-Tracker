decision_flags:
  - |
    OPEN — HOW DOES A BROWSER LEARN THE CURRENT ENGINE COMMIT? classifyFreshness is pure precisely so
    the app can import it, but the git questions live in holeMapGit.mjs and a browser cannot run git.
    The options are a build-time-injected commit (accurate at deploy, stale between deploys), a
    generated manifest fetched alongside the data, or accepting that the in-app verdict answers a
    weaker question than the CLI's ("is this artifact older than the deployed build" rather than "older
    than HEAD"). The third is honest if it is SAID; it is a silent downgrade if it is not.
  - |
    OPEN — WHETHER THE STALENESS TREATMENT IS LIFTED OR FORKED. Gate 1 recommends lifting
    PrintableRefresherView/StalenessBanner.jsx into src/components/ui/ as a generic component rather
    than forking it, on the grounds that a second forked treatment is how one design language becomes
    two. That is a Gate 4 design decision but it lands in this ticket's code.
