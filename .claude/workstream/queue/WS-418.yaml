    - scripts/__tests__/holeMapFreshness.test.js — the "module boundary" describe block asserting
      holeMapFreshness.mjs contains no `from 'node:` and no `require('node:`, with the two-banners
      rationale stated in the test's own comment.
    - out/hole-map.html — the decisionSource.degraded string ("No per-decision sidecar on disk...")
