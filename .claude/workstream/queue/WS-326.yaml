  - "Which game does the first tournament run in? ONLINE 6max -- where the corpus can actually measure and the agreement gate is meaningful -- or LIVE 9-handed, the founder's real game, where only the simulator can score and the population model is thin (founder estimate + sparse observed pool). Recommend online first: get one genuinely measured number before trusting anything, then treat live as the transfer question FSA is built to answer."
  - "Does the responsive field adapt within a session (observed frequencies over recent orbits) or across sessions (a persistent read on hero)? Live 9-handed regulars do the latter; online 2009 pools mostly did the former. This changes what exploitability means."
