status_note: |
  Filed 2026-08-02 after the founder asked to measure the stake before moving it. The
  measurement changed the recommended sequencing: the original plan was to build the
  population simulator (WS-326) next and get an independent number. The profile made that
  unnecessary as a first step — a 3.2% VPIP against a 28.8% pool is disqualifying on its
  face, and the cause is single and identified. Fixing the cause first yields TWO generations
  for one measurement build, and the fringe-migration instrument that ships idle today is
  exactly what compares them.
