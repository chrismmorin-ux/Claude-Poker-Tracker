decision_flags:
  - "Does CP-2 extend preflopFlopEV in place, or ship as a parallel policy module selected by id? In place is less code and keeps one path; parallel keeps CP-1 computable so the two generations can be re-run against each other after later engine changes, which is what makes the migration report durable rather than a one-shot. Recommend parallel."
  - "Do WS-314 (check-raise ranking) and WS-316 (check-back vs check pooling) get fixed inside this ticket or landed first as separate items? Landing them first gives two smaller verifiable steps but produces intermediate generations nobody will score; folding them in makes one large ticket with one clean observable."
  - "Should the limped-to-hero spot be added to the declared domain before or after CP-2? Adding it first means the migration report compares maps with different cell sets and needs a rebase; adding it after means the CP-2 comparison is clean but the coverage hole persists one generation longer. Recommend after, as its own item."
