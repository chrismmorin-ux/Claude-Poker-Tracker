decision_flags:
  - "Where do atoms physically live? Local disk outside the repo is simplest and matches the existing C:/Users/chris/data/phh-mining pattern, but is not backed up and is invisible to other fleet nodes. A content-addressed store that can be synced is more durable and more work. Recommend local-first with the hash recorded, so relocation later does not invalidate any Result Card."
