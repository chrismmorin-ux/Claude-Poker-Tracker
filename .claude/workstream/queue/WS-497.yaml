  ────────────────────────────────────────────────────────────────────────────
  REVIEWED 2026-08-19 (SPR-191). THE CARD IS SUPERSEDED. One verdict was wrong.
  ────────────────────────────────────────────────────────────────────────────

  RC-study-ladder-d908f09d was produced by the PRE-a60d4084 verdict path, which decided
  `separates` on z >= 3 against the BINOMIAL null while merely interpolating the control axis
  into the reason string. Fixed 2026-08-16 in a60d4084; the corrected code has never run.

  a60d4084 changed the VERDICT PATH ONLY — `separabilityVerdict`, the per-axis control map
  (`CONTROL_FOR`), and reporting. It did not change how chi2/df, z, df or split-half are
  computed, so the statistics recorded in this card remain valid and the corrected verdicts
  can be read off them directly. Recomputed 2026-08-19 against the fixed code:

    axis          control              shipped     CORRECTED            ratio   z(diff)  splitHalf
    limpRate      flopBetFreq          separates   separates            8.493   9246.7   0.864
    threeBetRate  flopBetFreq          separates   NOT-BEYOND-CONTROL   0.595   -474.7   0.436
    cbetRate      flopBetFreqNonPfa    separates   separates            1.111     78.8   0.672

  WHAT ACTUALLY CHANGED, and it is the answer to WS-320's question:

  - LIMPING IS THE REAL AXIS. 8.5x the control's between-player dispersion, SD ~14.7pp,
    split-half reliability 0.864. Nothing marginal about it.
  - 3-BET RATE EARNS NO CHANNEL AT THIS CONDITIONING. It is LESS dispersed between players
    than the control axis is — ratio 0.595, z(diff) -474.7 — so the heterogeneity it does
    carry against the binomial null is no more than players differ generally. Split-half
    reliability 0.436 says the same thing from the other direction. This is `not-beyond-
    control`, NOT `does-not-separate`: it forbids building a channel on the AGGREGATE,
    UNCONDITIONAL 3-bet rate and says nothing against the trait existing in sub-channels.
    It licenses deleting nothing.
  - C-BET RATE SURVIVES, but only against the DISJOINT control. Scored against `flopBetFreq`
    it is 1.034x — indistinguishable — and that comparison is invalid anyway, because every
    c-bet IS a flop bet, so the "control" contains the candidate. Against `flopBetFreqNonPfa`
    (flop bets by non-preflop-aggressors, which a c-bet cannot come from) it is 1.111x at
    z(diff) 78.8. Real, and much smaller than limping.

  ON THE OTHER TWO OF "three of five verdicts were wrong": the two CONTROL axes were passed
  through the candidate verdict path and compared against themselves, returning `separates` on
  a ratio of exactly 1.000. Tautologies occupying verdict slots, which read as corroboration.

  WHY A RE-RUN IS STILL REQUIRED, despite the answer being known. Under ADR-009 a comparative
