decision_flags:
  - "Option (b) — un-scaling the command column — changes the visual proportions of the surface and is a Gate 4 decision, not a bug fix. It should be decided INSIDE the redesign, not ahead of it. Only step 1 (measure) and step 3 (guard) are safe to do standalone."
  - "This finding invalidates the Gate 2 pre-commitment 'all action targets stay >=44px and equal-area' as literally written. Gate 4 must restate it in terms of RENDERED size."
  - "WS-317 (confirm-before-commit) is a THIRD strategy for this problem: it does not raise target size, it removes the need for precision by decoupling the commit point from the initial touch. For dense homogeneous grids that may beat both (a) and (b). Evaluate all three together at Gate 4 — not separately."
