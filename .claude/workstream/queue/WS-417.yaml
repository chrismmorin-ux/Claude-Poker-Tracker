id: "WS-417"
title: "The 20 bb/hour figure that justifies the Hole Map's whole bb/hour column is a founder assertion with no evidence behind it, it never appears on the page it justifies, and the 12.32 it is meant to be compared against is an incremental transferred ceiling while it is a total realized rate — same units, different axes, which is the thing ADR-009 exists to prevent"
