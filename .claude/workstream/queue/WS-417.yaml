decision_flags:
  - |
    OPEN AND FOR THE FOUNDER SPECIFICALLY — WHAT DID "20bb per hour" MEAN? The whole ticket turns on
    it. At 25 hands/hour it is 80 bb/100, which is not a credible win rate; as $40/hr at $1/$2 it is
    an ordinary strong-live-player figure. Nobody but the founder can settle which was meant, and the
    answer determines whether the bb/hour column keeps its justification, changes units, or loses it.
  - |
    OPEN — WHETHER A CEILING SHOULD BE DENOMINATED IN MONEY-PER-TIME AT ALL. The per-100-hands figure
    is the repo's own currency (POKER_THEORY §14.1) and carries no pace assumption; denom.transferNote
    says as much on every row. bb/hour exists only to satisfy the scale test. If the scale test is
    retired, the cleanest outcome may be that bb/hour goes with it — which would resolve the axis
    problem and the InsightsBand adjacency at the same time, at the cost of the founder's stated
    reason for wanting the readout.
