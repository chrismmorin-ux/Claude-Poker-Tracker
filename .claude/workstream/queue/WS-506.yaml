description: |
  FOUNDER DIRECTIVE (2026-08-16): segment the pool into winning and losing players, audit their
  decisions against each other and against the pool, and find where the EV actually comes from.
  Charter: docs/research/player-segmentation-program.md. This ticket is Stage 1a and everything
  else in the program depends on it.

  Every downstream stage needs one number the corpus does not currently give us: what each
  player won or lost on each hand. BOTH obvious sources were tested on 2026-08-16 and BOTH are
  unusable. This is measured, not assumed.

  1. THE `winnings` FIELD IS POPULATED ON ONLY 36.3% OF HANDS (34,918 scanned), and the absence
     is STRUCTURED — it rises monotonically with table size: 2-handed 0.0%, 3-handed 4.8%,
     4 21.0%, 5 33.8%, 6 42.4%, 7 46.2%, 8 49.9%, 9-handed 53.7%. Filtering to populated hands
     is a selection on table size, which correlates with everything this program measures.
     A hypothesis that it tracked showdown vs fold was pre-registered and REFUTED: zero-rates
     are 61% at showdown and 63% without.

  2. CROSS-HAND STACK DELTAS ARE CONTAMINATED BY REBUYS. Player-hand rows link to the next hand
     at the same table 96.3% of the time (30,716 of 31,899 over 155 tables / 5,976 hands), so
     the linkage itself is sound. But the deltas sum to +$5,744.55 over that sample. In a
     rake-taking game the sum across all players MUST be negative. Reloads are being read as
     winnings, which would label reloading LOSERS as WINNERS — inverting the exact
     classification this program exists to produce.

  THE INSTRUMENT TO BUILD: derive net won from each hand's own accounting — amount committed
  (already tracked in phhAdapter, see the totalCommitted/antes handling) against pot collected,
  with the winner recovered from the action sequence. Uncontested pots are fully determined by
  the folds; showdowns by the `sm` show actions.

  DO NOT respond to the two dead instruments by restricting the corpus to hands where one of
  them happens to work. That is shrinking the work to fit the instrument, and in this case the
  restriction is a biased sample by construction.
accept_criteria: |
  - A `netWonPerHand` derivation exists in scripts/backtest/, returning per-player net for every
    hand the adapter accepts, independent of the `winnings` field.
  - THE FALSIFIER, WHICH IS A KNOWN-ANSWER ANCHOR: summed across all players in a hand, net won
    equals −rake, to within a stated float tolerance. This is asserted in a test over a corpus
    sample, not spot-checked by eye.
  - The full-corpus pass reports how many hands FAIL that identity and why; a non-zero failure
    count is stated in the artifact rather than filtered out.
  - Rake is reported as its own quantity per hand, because §3 of the charter turns on it: rake
    is what makes "loses money" and "plays badly" different populations.
  - Rebuys/top-ups are detected and reported as a count, so the stack-delta contamination is
    visible rather than silently corrected.
  - No downstream segmentation work starts until the −rake identity passes.
