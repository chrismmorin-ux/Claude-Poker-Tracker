    is low-risk in mechanism; the risk is in blast radius, since every fleet repo would begin
    emitting `problem-class drift:` warnings on its next reconcile and some of those repos have
    findings nobody has looked at in months. RECOMMENDATION: (a), because the alternative is that a
    validator written specifically because a concurrent agent invented six class names gets deleted
    by the next routine upgrade — but the recommendation is a recommendation, and this ticket
    authorises nothing.
