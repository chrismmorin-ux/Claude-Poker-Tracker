status_note: |
  Found 2026-07-28 while validating WS-291. Scenario 3 in advisorAccuracy was fixed inline
  (it now builds a real tight range locally) so the WS-291 change could be verified against
  a correct premise; the shared fixtures were deliberately left alone, because rewriting
  them mid-ticket would have mixed "did the narrowing change break anything" with "were
  these tests ever testing what they claimed".

  A separate diagnostic now fires with correct inputs and is worth a look under this or a
  follow-up ticket: with a real tight range the engine recommends RAISING hero's 33 on
  QJT at 4% equity (raise EV 40.4 vs fold 0). The test logs it as a warning rather than
  failing. Against a range that folds rarely, that recommendation looks wrong.
