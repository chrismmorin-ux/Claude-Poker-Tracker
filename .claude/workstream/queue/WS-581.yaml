status_note: |
  Raised by the game-theory lens of the 2026-08-19 Conduct Card audit as the go/no-go for the
  configuration program, with the explicit note that the repo's own prior evidence points the
  wrong way and that saying so loudly is part of the item.

  Highest priority score of the eight because it is the cheapest item that can invalidate the most
  expensive ones. It is fully engine-independent — a spectrum of measured action frequencies at
  measured leaves, no EV model anywhere — which is exactly why it should run before anything is
  built on the configuration premise.
