description: |
  `src/hooks/useSyncBridge.js:238` and `ignition-poker-tracker/content/app-bridge.js:149` gate
  their window.postMessage handlers on event.source only. event.source === window is true for ANY
  script running in that document.

  `ignition-poker-tracker/content/ignition-capture.js:442-443` checks BOTH source and origin, with a
  comment naming the pattern ("RT-42: defense-in-depth origin check"). The codebase knows the right
  answer and applied it on one hop of two.

  THE CONSEQUENCE IS MODEL POISONING, NOT XSS - and that is worse here.
  `useSyncBridge.js:246-256` validates hand SHAPE (validateHandForRelay + validateHandRecord), which
  stops malformed data and does nothing about FABRICATED data. For a product whose entire value is
  Bayesian villain modelling built from recorded hands, a believable fake stream is more damaging
  than defacement, and it is silent: poisoned posteriors produce plausible advice.

  time_to_detect: UNBOUNDED. recoverability: POOR - fabricated hands are not separable from real
  ones after the fact.

  ALREADY DIAGNOSED as FIND-083 but MISFILED: `FIND-083.yaml:7` says program
  methodology-integrity while `:16` says "ROUTE: origin check to security". WS-514 covers only the
  captureId/dedup half. This half is unowned.
accept_criteria:
