description: |
  gameTreeContext.js:311-333 defaults heroEquity=0.5/foldPct=0 when a range is empty and emits
  full ranked recommendations indistinguishable from a measured 50/50; four bare-number sites in
  gameTreeDepth2 (`totalWeight > 0 ? totalEV/totalWeight : 0`) share the shape. No assertion
  enforces the never-zero doctrine at these boundaries, so a future narrowing regression would
  reactivate the fallback silently. Full mechanism: findings/FIND-120.yaml.
accept_criteria: |
  - The four innermost functions emit a distinct no-data signal; gameTreeContext flags
    zero-combo in treeMetadata; the engine refuses to rank rather than defaulting.
  - A reachability probe answers whether a real hand can hit totalCombos===0 (the finding's
    Unknown becomes a measurement).
  - Plain English: if the app has no idea what the opponent could hold, it says "no read"
    instead of showing a confident 50/50.
