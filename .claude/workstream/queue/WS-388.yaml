status_note: |
  Premises re-verified against HEAD by reading the code, not by trusting the roundtable record:
    - `src/utils/assumptionEngine/__backtest__/handStateReconstructor.js:19` — the header comment,
      quoted verbatim above; `:230` the `@param` documenting `{ effectiveStackBB: 100 }`; `:254` the
      resolution expression; `:330` the multiplication by `bb`; `:356` where it enters the returned
      state.
    - `src/reducers/gameReducer.js` — a case-insensitive grep for `stack` returns ZERO matches.
      Verified directly, because "the data model has no stacks" is the load-bearing claim and the
      roundtable asserted it without showing the grep.
    - `src/utils/exploitEngine/gameTreeContext.js:216` —
      `const spr = (effectiveStack != null && potSize > 0) ? effectiveStack / potSize : null;`
    - Callers of the `defaults.effectiveStackBB` override, by grep across `src/` and `scripts/`:
      `__tests__/dividendCalibrationBacktest.test.js:514` and
      `__tests__/handStateReconstructor.test.js:257`. Both are tests.

  ON THE `blocked_by: WS-389`. The stage-1 sweep in the first accept criterion is an EV comparison
  between arms, and on a wall-clock-gated harness the arms are not comparable — a stack-depth effect
  and a CPU-contention effect would arrive as the same number. The reducer work can start
  immediately; the measurement that closes the ticket cannot.

  DEPENDENCY NOT YET MACHINE-READABLE: the standardized-readout spec (defining the harness, the
  identical decision set, the baseline arm and the minimum detectable effect that accept criteria 1
  and 2 depend on) did not exist in `.claude/workstream/queue/` when this was filed — checked by
  grep. Wire its ID into `blocked_by` when it lands.

  TWO PREMISES CORRECTED. Both were overstatements in the roundtable record and both are stated
  correctly in the description above.

    1. "UNCONDITIONAL" is not literally true. `:254` honours a `defaults.effectiveStackBB` override.
       The correct and still-damning statement is that NO NON-TEST CALLER PASSES IT, so the value is
       100 in every scored run — verified by enumerating the override's call sites, which are two
       test files. The distinction matters for the fix: the sweep in accept criterion 1 is available
       today through an override that already exists, with no code change at all.

    2. "SPR IS A CONSTANT IN EVERY SCORED RUN" is wrong as written. SPR is `effectiveStack / potSize`
       and pot size is reconstructed from the real action sequence, so SPR varies within and across
       hands. What is constant is the STACK DEPTH — the numerator — which removes all between-hand,
       between-player and between-stake variation in the dimension. That is the accurate claim and it
       is the one the ticket is written on. Propagating "SPR is a constant" would have been a false
       premise that any reader could refute in one line, and refuting it would have discredited a
       finding that is real.
gate_resolution: |
  2026-08-20: gate re-pointed. WS-389 is status=dismissed with superseded_by: WS-432,
  and WS-432 is done — the reproducibility work this item waited on SHIPPED. The resolver
  only clears a blocker on status=='done', so a dismissed-and-superseded blocker never
