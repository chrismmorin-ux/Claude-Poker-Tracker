decision_flags:
  - |
    OPEN AND IT DECIDES THE SIZE OF THIS TICKET — WHAT "PER-SEAT STACK" MEANS AT A LIVE TABLE THE
    FOUNDER IS ENTERING BY HAND MID-HAND. He is playing 9-handed live and recording actions on a
    phone. Recording every seat's exact chip count every hand is not a data-model question, it is a
    data-ENTRY question, and it is the kind of burden that gets abandoned in week two. Realistic
    options, in ascending cost: (a) hero's own stack only, plus the villain at the decision node —
    which is all `effectiveStack` needs, since effective stack is a pairwise quantity; (b) a
    coarse per-seat bucket (short / standard / deep) set once when a player sits and adjusted on
    visible events; (c) full per-seat chip tracking derived from bet amounts plus an initial buy-in.
    Option (a) is probably enough for the engine and is a fraction of the entry cost of (c), and
    option (c) may be derivable for the ONLINE corpus at no entry cost at all — which would let the
    backtest get real stacks without the founder typing anything. Decide this before writing reducer
    code; it changes the schema, the UI and the entry burden.
  - |
    OPEN — WHETHER THE HISTORIC CORPUS CAN BE BACK-FILLED. The scored runs the founder wants are
    against the existing corpus, and that corpus is already recorded. If the source hand histories
    carry stack information that the import dropped, back-filling is a parsing change and the
    backtest gets real stacks immediately without waiting for a single new live hand. If they do not,
    every historic decision stays imputed forever and the imputed-fraction flag above is doing
    permanent work. Check the raw source before deciding; this is the difference between "the figure
    improves next month" and "the figure improves in a year".
