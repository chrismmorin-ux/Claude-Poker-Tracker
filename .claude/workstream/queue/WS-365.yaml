status_note: |
  Premises re-verified against HEAD before filing, all three application points confirmed by
  reading the code rather than trusting the commit message:
  `gameTreeContext.js:254` (hero cards dead in `segmentRange`), `:257` (`computeBlockerEffects`
  on that same segmentation), `:323-324` (`estimateFoldPct` on it);
  `foldEquityCalculator.js:625-637` (`blockerMult`, `estimate *= blockerMult`);
  `gameTreeEvaluator.js:534-548` and `:363-375` (`blockerBoost` added to `pFold`).
  The WS-315 scope-boundary comment at `gameTreeEvaluator.js:262-275` is the in-place record.

  WS-315 deliberately left the EV maths untouched — `blockerScore` has no EV path, and the
  fold-rate nudges were left EXACTLY as they were so that this ticket would inherit an
  unmodified subject. Do not treat their present constants as considered values.
