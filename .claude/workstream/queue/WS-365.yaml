decision_flags:
  - |
    OPEN — WHICH of the three survives. They are not interchangeable. (1) is structural and
    exact but only models REMOVAL, i.e. the change in villain's range composition; it says
    nothing about villain deciding differently. (2) and (3) are attempts to model the second
    effect, but both are keyed off `pctRemoved`, which is the FIRST effect's quantity — so
    as written they re-price removal rather than adding anything. If a genuine second effect
    is wanted, it needs its own quantity and its own justification, not a multiplier on the
    one already counted.
  - |
    OPEN — (2) and (3) read different buckets (nuts/strong/air vs nuts+strong) and WS-315
    established that the buckets they read are the wrong ones anyway: what buys fold equity
    is removing the hands that CONTINUE, which is not the same set as the hands that are
    nutted. `computeBlockerScore` already resolves continuation per combo through
    `comboCallFilter` composed with `villainRequiredEquity`. If any adjustment survives, it
    should read that, not a bucket label — bucket labels are range-level approximations and
    per-combo continuation is available here.
