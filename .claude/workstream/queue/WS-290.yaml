status_note: |
  Blocked on WS-289 (needs a curriculum to measure comprehension OF).

  The decision flag is the sharp one and should not be resolved casually. Feeding
  founder-vs-model divergences back as training signal risks the model converging on
  the founder's own habits and then confirming them — a self-licking loop that would
  read as improving accuracy while actually just learning to agree. If divergences do
  feed back, they need the same leave-one-out discipline POKER_THEORY 6.5a already
  requires of pool baselines.
