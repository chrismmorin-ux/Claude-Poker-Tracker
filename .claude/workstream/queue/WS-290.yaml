description: |
  Founder request, 2026-07-27: "we can start measuring my comprehension and ability
  to implement after learning/referencing the key elements and applying them."

  OWNER-VOLUNTEERED, WHICH IS WHAT MAKES IT PERMISSIBLE. This repo holds a standing
  refusal on system-imposed grading and mastery ranks. That refusal is not in play
  here: the founder asked to be measured, and opt-in assessment surfaces are
  explicitly allowed. The distinction must survive implementation — if this ever
  becomes something the app does TO the founder rather than something they ask it
  for, it has crossed back over the line.

  TWO DIFFERENT THINGS, AND THE SECOND IS THE REAL ONE:

  1. COMPREHENSION — can you recall and apply the concept when asked cold? Cheap to
     measure, and largely measures memorization.
  2. APPLICATION — do your decisions at a real table match what the model would
     recommend, and where they diverge, who was right? This is the one that matters,
     and the app is already positioned to measure it: it records the founder's actual
     hands, and the engine can evaluate the same spots.

  The gap between the two is the interesting signal. Knowing the concept and using it
  under time pressure with money live are different skills, and only the second pays.

  BUILD ON WHAT EXISTS. Skill assessment is established as a shared core competency
  (src/utils/skillAssessment/), not a per-feature one-off. The prediction-ledger and
  calibration machinery from PMC already scores predictions against outcomes — the
  same shape as scoring founder decisions against model recommendations. Reuse it.

  MEASURE THE MODEL TOO. When the founder diverges from the recommendation, that is
  not automatically a founder error. It may be a model error, and it is exactly the
  kind of live evidence the corpus cannot provide. Divergences should be reviewable
  in both directions — this is potentially the repo's only source of LIVE data with
  which to challenge an online-corpus-derived model.
accept_criteria: |
  - Comprehension surface is opt-in and founder-initiated. No unprompted assessment,
    no mastery rank surfaced as a rank.
  - Application measurement compares recorded founder decisions against engine
    recommendations on the same spots, using the existing calibration/prediction-ledger
    machinery rather than a parallel implementation.
  - Divergences are reviewable in BOTH directions, and a founder-was-right divergence
    can be promoted into a domain-correctness finding against the model.
  - Reuses src/utils/skillAssessment/ core.
  - Learning state is tracked as state, never surfaced as a tier or a rank.
  - Any in-app surface passes Design Program Gate 1 and Gate 4 before production code.
