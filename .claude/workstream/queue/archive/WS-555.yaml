description: |
  FOUNDER, 2026-08-18: "we need to make sure the foundation is the same as a hand history
  imported from ignition, or a player in the live app selected from tableview."
  
  WHAT IS ESTABLISHED. labelDecisions consumes a narrow, source-agnostic contract - handId,
  seatPlayers, and gameState.{actionSequence, dealerButtonSeat, blinds} plus board and showdown
  cards. That is the APP's own hand shape; phhAdapter exists solely to convert corpus hands INTO
  it. So a live-app player from tableview should already satisfy it by construction.
  
  WHAT IS NOT ESTABLISHED, and must not be assumed: the Ignition extension carries an
  actionSequence concept in shared/hand-format.js and shared/record-builder.js, but NOBODY HAS
  VERIFIED THE SHAPES MATCH. This item is that verification, and the adapter if they do not.
  
  Until it passes, "the foundation is the same" is a hypothesis.
accept_criteria: |
  - A Conduct Card built end-to-end from an Ignition-captured hand history.
  - A Conduct Card built from a live-app tableview player's recorded hands.
  - Any shape gap closed by an adapter that converts INTO the app shape - never by widening the
    labeler's contract, which would let three representations drift apart again.
  - A gate asserting the three sources produce identically-shaped decision rows.
