description: |
  `scripts/backtest/atomStore.mjs`'s `openAtomWriter` / `append` / `finalize` never check free disk
  space. A run that exhausts the drive throws inside `handle.write`, uncaught.

  The recovery path makes it worse rather than better: an atom set becomes READABLE only at
  `finalize()`, which is what writes the manifest. An interrupted run therefore has NO MANIFEST, so
  `resolveAtomSet` reports **`NOT_FOUND`** rather than `TRUNCATED` — even though `resolveAtomSet`'s
  closed reason enum (`atomStore.mjs:23-27`) HAS a truncated state, and the NDJSON rows are sitting
  right there on disk. The distinction between "this capture never happened" and "this capture is
  incomplete" is lost, and every atom written before the failure is unreachable.

  THIS IS NOT HYPOTHETICAL IN THIS REPO. `out/` already contains
  `hero-ev-KILLED-3players-inadmissible.json` and `hero-ev-44players-PARTIAL-650dec.json` — two runs
  that died mid-flight, both at lighter load than what WS-410 plans.

  THE COLLISION THAT MAKES IT URGENT. Measured this pass: the founder's C: drive has **42 GB free,
  91% used**, and `DEFAULT_ATOM_STORE_ROOT` (`atomStore.mjs:56`) points at the same drive.
  `beliefState` at full capture is estimated at 48-95 GB (WS-430), and `decisionRecord.mjs` costs
  10-15 KB per decision per arm — 4-6 GB for one arm at 400k decisions (WS-431). Meanwhile a
  properly-powered run is 3-7 days of wall clock (WS-433). **The current configuration can lose
  several days of compute to a disk-full condition and leave nothing recoverable.**

  Atom-set immutability (`atomStore.mjs:104-113` throws on reopening a finalized set) means this
  interacts with capture-shape mistakes too: the schema is additive-reversible, the DATA is not.
  Re-running is the only repair, and re-running is what costs days.
accept_criteria: |
  - `openAtomWriter` performs a disk-space PREFLIGHT: estimated bytes (rows x measured bytes/atom,
    from WS-430's real measurement) against available headroom at the resolved store root. It refuses
    to start a run that cannot finish, rather than discovering it hours in.
  - Periodic re-check during a long run, so a drive filling from elsewhere is caught early with the
    capture intact.
  - INCREMENTAL / RESUMABLE FINALIZATION: an interrupted set resolves as `TRUNCATED` with its rows
    readable, not `NOT_FOUND`. The reason enum already has the state; the writer needs to reach it —
    e.g. a provisional manifest written at open and updated periodically, superseded by the final one.
  - A test that kills a writer mid-append and asserts (a) the set resolves `TRUNCATED`, (b) the rows
    written before the kill are readable, (c) an aggregate computed over them is correctly labelled
    partial rather than silently treated as complete.
  - Coordinate with WS-430's `SOR_ATOM_STORE` relocation — the preflight must measure the RESOLVED
    root, not the default.
