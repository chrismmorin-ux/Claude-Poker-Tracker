description: |
  THE FINDING. `docs/standard-of-record/SCORED-READOUT-SPEC.md:171` defines the optimizable figure:

      overallEvBB100 = edgeBB x opportunitiesPerHand x 100

  and sources the second factor from "the COVERAGE CENSUS over the Deal Book".
  `src/utils/standardOfRecord/coverageCensus.js` HAS NO SUCH CONCEPT. It is a cell-examination-status
  ledger — `enumerated` / `exhaustive`, examined-vs-unexamined — not a per-hand decision-opportunity
  count. Repo-wide, the nearest working machinery is `bbPer100Decisions` / `bbPer100Hands` /
  `handsRepresented` in `scripts/backtest/evCost.mjs:203,248,259-260`, which is applied to villain
  fold-prediction regret and which the spec itself says "has never been connected to hero-EV".

  SO: the figure the founder has asked for repeatedly, and has never seen, CANNOT BE COMPUTED TODAY.
  The first factor (`estimateEdge`, `ipsEstimator.mjs:189`) is built, tested and running. The second
  does not exist. WS-410's headline framing — "most of this exists and needs assembling, not
  building" — is correct about the edge and wrong about the product.

  THE FAILURE MODE THIS TICKET EXISTS TO PREVENT, stated because it is the likely one. Whoever
  implements the readout under time pressure reaches for `n / handsRepresented` computed on the
  SCORED SUBSET. `SCORED-READOUT-SPEC.md` §3.3 names that substitution and refuses it — "otherwise
  the headline inherits every sampling limit of the harness" — but the refusal lives in prose, and
  NOTHING IN CODE BLOCKS IT. The harness has never completed a run at target scale (see WS-433), so
  the scored subset is exactly where sampling limits are worst. The result would be a headline that
  moves when the harness's decision cap moves, read as though the engine had improved.

  WHY THE DENOMINATOR MUST COME FROM THE DEAL BOOK, not the scored set: `opportunitiesPerHand` is a
  property of the GAME — how many decisions a hand presents to hero — not a property of how many the
  harness got around to scoring. Those two quantities diverge precisely when the harness is
  under-powered, which is its current state.
accept_criteria: |
  - `opportunitiesPerHand` is computed from the coverage census over the Deal Book, as a first-class
    exported function with its own unit tests. It is NOT derived from `n`, from `handsRepresented`,
    or from any quantity whose value depends on how many decisions the harness scored.
  - The census gains whatever field it needs to answer "how many hero decision opportunities does
    this Deal Book contain" — this is additive schema work, guarded by the existing
    `scripts/check-sor-additive.sh`.
  - A REFUSAL TEST: assert that `opportunitiesPerHand` computed over a Deal Book is INVARIANT to
    `--max-decisions`. Run the same Deal Book at two decision caps; the factor must not move. This is
    the structural guard that replaces the spec's prose refusal, and it is the acceptance criterion
    that actually matters — without it this ticket has not closed the failure mode, only documented
    it again.
  - `overallEvBB100` prints BOTH factors, never only their product (WS-410 Stage 2's own rule): a
    reader must be able to see whether a move came from the edge or from the opportunity count.
  - Any Result Card emitting `overallEvBB100` stamps `manifest.disclaimerRegisterVersion`
    (HC-010; `manifestProblems` already rejects a card without one — do not weaken it).
  - The figure states its population per HC-011: online 2009 corpus, transferred not measured for
    live 1/2-1/3.
