description: |
  `.claude/context/POKER_THEORY.md` §11.9 (header at line 1878, prose at ~1899 — note WS-410 cites
  line 1753, stale by ~146 lines) headlines:

      "A Fifteen-Number Rule Recovers ~56% of the Engine"

  and states in bold: "A rule a human can hold in their head recovers just over half the engine's
  narrowing edge."

  That reads as a performance/EV claim. **It is Delta-log against revealed hole cards**
  (`scripts/backtest/teachableArmsProbe.mjs:301`) and therefore prices NOTHING under Amendment 1.
  WS-410's own §8.2 says exactly this — but that caveat lives in a DIFFERENT, NEWER document (the
  Scored Readout spec), written after the table, and is not inline at the point a reader hits "56%".

  There is no code computing, asserting or guarding the percentage. A repo-wide grep for
  `share of the engine|shareOfEngine|engineEdge|edgeShare` returns exactly ONE hit: this prose. The
  15-number table is also not version-controlled as data — it derives from `out/teachable-arms-*.json`
  and `out/` is gitignored (`.gitignore:91`). It emits no Result Card and has no test.

  WHY THIS IS FILED AS ITS OWN TICKET RATHER THAN A DOC NIT. WS-410 D4 proposes publishing an
  engine-graded self-leak figure "labelled a diagnostic, never the headline" — and the whole safety
  of that plan rests on the assumption that a diagnostic label travels with its number. **This repo
  already contains one instance of that assumption failing**, in the document EVERY engine-touching
  session is required to read first (per CLAUDE.md's Poker Analysis Guardrail). The figure-cluster
  failure engineer searched `system/failures.md`, `.claude/failures/`, `system/decisions.md` and
  `system/context.md` for a recorded case of the founder acting on a caveated number as uncaveated
  and found NONE — stated plainly. But the design pattern is falsified regardless: the caveat did not
  travel past the first document boundary.

  Fix this instance BEFORE trusting the same mechanism for a newer and more dangerous figure.

  PER THE STANDING RULE, §11.9's Delta-log table STAYS. It answers a different, legitimate question,
  and deleting an instrument for reporting the wrong currency is forbidden. It is RELABELLED, not
  removed.
accept_criteria: |
  - The currency caveat is INLINE at the claim, not in a companion document: the §11.9 header and the
    bolded "recovers just over half" sentence both carry "(Delta-log against revealed hole cards —
    not an EV claim; see SCORED-READOUT-SPEC §8.2)".
  - The section is explicitly labelled a DIAGNOSTIC in its own heading, using the same vocabulary the
    Scored Readout will use, so one convention covers both.
  - The 15-number table becomes version-controlled DATA (out of gitignored `out/`), so the figure has
    a citable source rather than a regenerable artifact.
  - `teachableArmsProbe` emits a Result Card with `manifest.disclaimerRegisterVersion`, and gains a
    test. Its published numbers were verified this pass to reproduce bit-for-bit from committed code
    plus `out/teachable-arms-{ftp,ps}.json`, so this is formalising something already true.
  - The figure states its population per HC-011 (online 2009; transferred, not measured, for live).
  - GENERALISE THE FIX, or it recurs: any figure in `.claude/context/` or `docs/` that reads as a
    performance claim carries its currency inline. If a mechanism can enforce this (a lint over
    percentage-bearing headers, a checked vocabulary), prefer the mechanism — a document you are
    supposed to have read is not a control, and that lesson is already recorded in this repo.
