id: "WS-437"
title: "\"A Fifteen-Number Rule Recovers ~56% of the Engine\" is a Delta-log figure headlined as a performance claim in mandatory-read doctrine, with its caveat living in a different document — the labelled-diagnostic pattern failing in the exact repo about to rely on it"
