description: |
  _Convergence: founder direction 2026-07-22 — "the mass data analysis supports this [live/online distinctness] and we should look into bringing more mass data"_

  Investigation spike: how to bring larger external/mass population data into
  the empirical pool-baseline layer (poolBaseline.js) so per-segment priors
  are grounded in real distributions rather than only the founder's own
  accumulated sessions. Ratified context: live and online are permanently
  distinct reference populations (founder decision 2026-07-22, promoted into
  the domain spec) — any imported data must arrive pre-segmented (live vs
  online, and by stake) and must never blend across pools.

  Questions for the spike (deliverable = a short options memo, not code):
  - Sources: purchasable/free online hand-history corpora (e.g. HH archives),
    published population studies for live games, solver-adjacent population
    reports. Licensing + ToS constraints per source (flag legal-safety review
    if scraping or redistributed HH data is on the table).
  - Ingestion shape: pool baselines need only per-stat (k, n) count pairs per
    segment (STAT_COUNT_FIELDS in poolBaseline.js) — a mass import can be a
    tiny aggregate table, not full hand records. That keeps IndexedDB
    footprint trivial and sidesteps most licensing issues (aggregates vs raw
    hands).
  - Trust tier: external aggregates are Reference-class data (Exploit Model
    3-class doctrine) — they seed the founder-estimate tier or a new
    "imported reference pool" tier; they must NOT masquerade as the founder's
    own observed pool (provenance registry entry required, prog-data-provenance).
  - Segmentation fit: imported data must map onto segmentKey's target state
    (post-WS-260 canonicalization) — sequence this spike after or alongside
    WS-260.
  - Overdispersion: imported mass data is heterogeneous — cap/discount policy
    (POOL_PRIOR_MAX_PSEUDOCOUNT analog) for imported pseudocounts.
