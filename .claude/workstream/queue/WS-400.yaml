description: |
  FROM THE 2026-08-05 DOMAIN-CORRECTNESS BLIND-SPOT ROUNDTABLE, `backtest_contaminants` entry 7.
  Filed at P2 because nothing here is a known-wrong number; it is a number with no derivation
  standing in a place the whole system reads as if it had one.

  THE FUNCTION, AT `src/utils/pokerCore/betaMath.js:178-184`:

      export const bayesianSampleConfidence = (n) => {
        if (n <= 0) return 0;
        const tau = 12;
        const floor = 0.10;
        const ceiling = 0.83;
        return Math.min(0.95, floor + ceiling * (1 - Math.exp(-n / tau)));
      };

  It takes a sample size and nothing else. Not a rate, not a variance, not a prior — a count. It
  returns a number in [0, 0.95] that the product renders as "confidence". This quantity is a
  monotone relabelling of `n`: it carries exactly the information `n` carries, with a saturating
  curve laid over it, and no relation to any posterior, any credible interval, or any statement about
  a rate. Two villains with the same `n` and wildly different observed behaviour receive identical
  confidence, because behaviour is not an input.

  WHAT IT FEEDS. It is the confidence layer for most of the engine's non-EV output. Read from HEAD,
  nine non-test modules reference the symbol directly — `bayesianConfidence.js` (which re-exports it),
  `bucketQueryUtils.js`, `decisionAccumulator.js`, `villainDecisionModel.js`, `villainObservations.js`,
  `villainProfileBuilder.js`, `weaknessDetector.js`, `handAnalysis/replayAnalysis.js` and
  `rangeEngine/pipCalculator.js` — and THIRTEEN non-test modules import from the
  `exploitEngine/bayesianConfidence.js` re-export surface. Every weakness confidence and every bucket
  confidence in the system resolves through it, including the confidences that gate what the founder
  is shown.

  THE ANCHOR IS STATED, AND THAT IS WORSE THAN IT BEING ABSENT — THIS IS THE CORRECTION THAT MAKES
  THE TICKET. The roundtable reported the constants as having "no stated anchor of any kind." That
  is false. The docblock at `:157-177` states one:

      "Calibrated to approximate existing breakpoints:
         n=2 → ~0.23, n=5 → ~0.38, n=10 → ~0.57, n=20 → ~0.77, n=50 → ~0.92
       ...
       The slight reduction at low n is DESIRED — the old step function was too generous at n <= 5."

  So the curve is anchored — to a STEP FUNCTION THAT PREVIOUSLY OCCUPIED THE SAME SLOT. The
  breakpoints it reproduces were themselves hand-chosen. This is a calibration to a predecessor, and
  a predecessor's numbers are not evidence; they are the same judgement wearing a smoother shape. A
  reader auditing this function finds a docblock full of numbers and a stated rationale and concludes
  it was derived. It was fitted to a guess.

  The docblock also offers a second anchor — "the slow tau=12 saturation already embodies the §6.5
  prior weight (~10 observations before a read is confident)" — which is a real doctrinal reference
  and is worth taking seriously. But note what it does NOT say: it does not say that 12 is the value
  of tau for which the curve matches a Beta posterior at prior weight 10, nor that any such match was
  checked. It asserts a correspondence in prose. Per `exploitEngine/CLAUDE.md`, "when a comment states
  a fact the code could assert instead, assert it" — a rule written after three separate incidents in
  this repo of exactly this shape.

  THE GENERAL RULE THE ESTIMATION LENS PROPOSED, WHICH IS THE PART WORTH KEEPING. **Once this repo
  has MEASURED a distribution for a quantity, any literal standing in for that quantity must lie
  inside the measured support, or carry a recorded reason for sitting outside it.** That is a
  falsifiable, mechanical rule and it converts a class of "is this constant any good" arguments into
  a check. It is directly applicable here: PRIOR_WEIGHT=10 was VALIDATED on the WS-262 corpus (30M
  hands) in the same measurement that refuted the 200 cap, so a corresponding posterior curve at that
  prior weight is a measured object this function could be compared against.

  THE ENFORCEMENT MECHANISM ALREADY EXISTS, FOR EXACTLY ONE CONSTANT, AND IT ONLY REPORTS.
  `unexploitableFloor.js` derives a required-continuation floor from pot geometry, and
  `floorVsAssertedConstant` compares a derived value against a shipped literal.
  `__tests__/unexploitableFloor.test.js:250-257` exercises it against `villainObservations`'
  `blindDefendMax`, whose own comment states the anchor ("MDF vs 2.5x open ~40%"). So the pattern —
  derive the quantity independently, compare the shipped constant to it, report the gap in percentage
  points rather than silently replacing the constant — is built. See the status note for what that
  test does and does not actually assert; the answer changes what this ticket has to build.
accept_criteria: |
  - THE EV DELTA IS THE CLAIM, AND FOR THIS ITEM IT MAY BE SMALL AND MUST BE MEASURED ANYWAY.
    `bayesianSampleConfidence` gates and weights output; whether it moves aggregate EV depends on
    whether confidence enters any EV path. Re-run the standardized readout on an identical decision
    set with the curve replaced by a derived posterior-based confidence, and report the aggregate EV
    delta. Expected direction: UNKNOWN, and stated as unknown. If the delta is below the harness's
    minimum detectable effect, that is the finding — it would mean this constant shapes what the
    founder is SHOWN without changing what the engine DOES, which is a smaller defect than the
    roundtable implied and should be reported as such rather than dressed up.
  - THE CURVE IS COMPARED AGAINST A DERIVED QUANTITY AND THE GAP IS REPORTED IN THE UNITS THE OUTPUT
    USES. Derive, independently, what a Beta posterior at PRIOR_WEIGHT=10 actually implies about
    confidence as a function of `n`, and report the per-`n` gap against the shipped curve across the
    range the product actually sees. Do not silently replace the constants — the
    `floorVsAssertedConstant` precedent is to REPORT the divergence first, because a constant wrong by
    3 percentage points and one wrong by 30 warrant different responses and nobody knows which this
    is.
  - THE DOCBLOCK'S OWN CLAIM IS TESTED. It asserts that tau=12 "embodies the §6.5 prior weight (~10
    observations before a read is confident)". Either that correspondence holds numerically and a
    test asserts it, or it does not and the docblock is corrected to say the curve was fitted to the
    prior step function. Both outcomes are useful; leaving a prose claim of derivation over a fitted
    curve is the outcome this repo's doctrine specifically forbids.
  - THE GENERAL RULE IS ENCODED, NOT JUST STATED — AND ITS SCOPE IS BOUNDED HONESTLY. Add the rule
    ("a literal standing for a quantity with a measured distribution must lie inside the measured
    support or record why not") somewhere it binds: `exploitEngine/CLAUDE.md` alongside the existing
    anti-patterns, plus at least one mechanical check. Be explicit that the rule only bites where a
    distribution HAS been measured; asserting it over constants with no measured counterpart would
    make it unenforceable and it would be quietly dropped, which is worse than not having it.
  - A CENSUS OF WHICH CONSTANTS THE RULE APPLIES TO TODAY, INCLUDING THE ZEROS. Following the
    `groundTruthCoverage.test.js` pattern: list the load-bearing literals in the confidence and prior
    path, mark each as (a) checked against a derived quantity, (b) has a measured counterpart but is
    unchecked, or (c) has no measured counterpart. Assert the counts exactly, so the number can only
    move in a reviewed diff. Today (a) is at most one — see the status note — and a census reporting
    only the checked ones would be the flattering selection effect this repo has already caught
    itself in twice.
  - PSEUDOCOUNT IS OUT OF SCOPE AND MUST BE LEFT ALONE. `PSEUDOCOUNT = 10` in
    `villainDecisionModel.js` is the Dirichlet prior strength matched to PRIOR_WEIGHT=10 and was
    VALIDATED on the WS-262 corpus in the measurement that refuted the 200 cap. It is the one nearby
    constant that HAS an anchor. Changing it to fix a confidence display would un-validate a
    validated constant, which the roundtable explicitly warned against.
