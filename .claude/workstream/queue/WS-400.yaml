decision_flags:
  - |
    OPEN — WHETHER "CONFIDENCE" SHOULD BE A FUNCTION OF `n` ALONE AT ALL, WHICH IS THE REAL QUESTION
    UNDER THE CONSTANTS. A monotone function of the sample size cannot distinguish 20 observations of
    a consistent villain from 20 observations of an erratic one, yet the product uses the word
    "confidence" for both. The alternative is a posterior-width-based quantity that responds to the
    dispersion of what was observed, which the repo already computes elsewhere — `credibleInterval`
    exists (`tendencyCalculations.js:22`, `skillAssessment/shapeLanguage/betaPosterior.js:17`) and
    renders in two calibration panels, and the roundtable's confirmed finding is that NO EV or
    DECISION path consumes one. So the better quantity is built and unwired, which makes this less a
    "pick better constants" ticket and more a "there are two confidence notions in this codebase and
    only the weaker one is load-bearing" ticket. Deciding that changes the size of the work by an
    order of magnitude and the founder should see the choice.
  - |
    OPEN — WHETHER RE-DERIVING THE CURVE IS ALLOWED TO MOVE WHAT THE FOUNDER SEES TODAY. The shipped
    curve was explicitly fitted to be LESS generous than its predecessor at low n. A posterior-derived
    curve may be more generous, less generous, or differently shaped, and confidence values gate
    display in several surfaces. If the derived curve materially changes which weaknesses and reads
    surface at the founder's typical sample sizes, that is a product change riding inside a
    correctness fix, and it needs to be named as one before it ships rather than discovered at the
    table.
