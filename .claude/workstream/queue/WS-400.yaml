status_note: |
  ID NOTE: this item was drafted as WS-392 and re-targeted twice. A second agent filing the live-path
  findings from the same roundtable claimed WS-392 through WS-398 concurrently, so this landed at the
  next free ID. The backtest-integrity family is WS-387, WS-388, WS-389, WS-390, WS-391 and this
  item.

  Premises re-verified against HEAD by reading the code, not by trusting the roundtable record:
    - `src/utils/pokerCore/betaMath.js:178-184` — the function, quoted verbatim above; tau=12,
      floor=0.10, ceiling=0.83, cap 0.95. `:157-177` — the full docblock, also quoted.
    - Importers enumerated by two separate greps across `src/`, excluding tests.

  THE ROUNDTABLE'S HEADLINE CLAIM IS FALSE AS WRITTEN, AND THE TICKET IS REFRAMED AROUND WHAT IS
  ACTUALLY THERE. "No stated anchor of any kind" — the docblock at `:157-177` states two: a
  breakpoint table it was calibrated to reproduce, and a §6.5 prior-weight rationale for tau. Filing
  the claim as reported would have been refuted by anyone who opened the file, and the finding would
  have died with it. The accurate and still-serious version, which the description now carries, is
  that the stated anchor is SELF-REFERENTIAL — it calibrates to the hand-tuned step function this
  curve replaced — and that the §6.5 correspondence is asserted in prose and never checked. That is a
  narrower claim and a defensible one.

  THE IMPORTER COUNT IS AMBIGUOUS AND BOTH NUMBERS ARE GIVEN RATHER THAN PICKING THE FLATTERING ONE.
  The roundtable says "THIRTEEN importers". Measured: NINE non-test modules reference the symbol
  `bayesianSampleConfidence` (`bayesianConfidence.js`, `bucketQueryUtils.js`,
  `decisionAccumulator.js`, `villainDecisionModel.js`, `villainObservations.js`,
  `villainProfileBuilder.js`, `weaknessDetector.js`, `handAnalysis/replayAnalysis.js`,
  `rangeEngine/pipCalculator.js`); TWELVE files reference it including tests and the definition file;
  and THIRTEEN non-test modules import from `exploitEngine/bayesianConfidence.js`, the re-export
  surface, which is presumably where "thirteen" came from. The 13 is defensible with that
  denominator and is not the count of direct consumers of this symbol. Both are stated in the
  description so no reader has to guess which was meant.

  THE PRECEDENT IS WEAKER THAN THE BRIEF CLAIMED, AND THIS CHANGES ONE ACCEPT CRITERION. The brief
  says `unexploitableFloor.test.js:252-255` "asserts shipped `blindDefendMax` against a derived 0.40".
  Read at HEAD, the test (`:250-257`, in `describe('floorVsAssertedConstant — the divergence from
  hand-tuned thresholds')`) computes the derived floor, calls `floorVsAssertedConstant({ derived,
  asserted: 0.40, label: 'blindDefendMax' })`, and then asserts only:

      expect(gap.label).toBe('blindDefendMax');
      expect(typeof gap.deltaPp).toBe('number');

  It asserts the label and the TYPE of the delta. It does not assert any bound on the gap, so the
  shipped constant could diverge from the derived floor by any amount and the test would pass. The
  mechanism therefore EXISTS and is EXERCISED for exactly one constant, but it ENFORCES nothing —
  which is precisely the "a diagnostic that only logs is a comment with extra steps" pattern the
  engine's own doctrine names. That is why the census criterion above says (a) is "at most one"
  rather than "one", and why this ticket has to build enforcement rather than just extend a working
  precedent.

  ON THE `blocked_by: WS-389`. Weakest dependency in this family — this constant may not touch an EV
  path at all, which accept criterion 1 exists to determine. It is blocked because that determination
  is itself an EV comparison between two arms, and an arm-versus-arm comparison on a wall-clock-gated
  harness cannot distinguish a small real effect from machine load. If the measurement shows no EV
  path, this ticket becomes a display-honesty item and should be re-scoped and re-prioritised then.

  DEPENDENCY NOT YET MACHINE-READABLE: the standardized-readout spec (defining the harness, the
  identical decision set, the baseline arm and the minimum detectable effect that accept criterion 1
  depends on) did not exist in `.claude/workstream/queue/` when this was filed — checked by grep.
  Wire its ID into `blocked_by` when it lands.
gate_resolution: |
  2026-08-20: gate re-pointed. WS-389 is status=dismissed with superseded_by: WS-432,
  and WS-432 is done — the reproducibility work this item waited on SHIPPED. The resolver
  only clears a blocker on status=='done', so a dismissed-and-superseded blocker never
  resolves and its dependents stall forever. Second resolver gap, filed as WS-590.
