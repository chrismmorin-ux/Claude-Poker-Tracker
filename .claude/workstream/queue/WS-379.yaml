decision_flags:
  - |
    OPEN — IS THE WALL-CLOCK REFINEMENT BUDGET A TEST PROBLEM OR AN ENGINE PROBLEM? If the
    amount of refinement that runs depends on machine load, then the engine's answer depends
    on machine load, and the founder's phone is a slower machine than the desktop the 2000ms
    default was chosen on (WS-334 recorded that the S22 latency measurement was never taken).
    That is a product question hiding inside a test flake. Fixing the test does not answer it,
    and this ticket should not pretend it does — but it should NAME it, so it does not get
    closed as "flake fixed".
