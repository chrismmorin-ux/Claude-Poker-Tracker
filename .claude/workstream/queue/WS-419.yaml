decision_flags:
  - |
    OPEN — DOES THE CALIBRATION DASHBOARD SHIP, AND UNDER WHICH TIER? featureMap.js:50 puts it at
    TIERS.PRO. That was decided when the view was specified and has not been revisited since; the app's
    tier story has moved. Wiring it means accepting or re-deciding that gate, which is a founder call,
    not a cleanup.
  - |
    OPEN — WHICH NAV CHROME. The repo has three (Homebase tiles, CollapsibleSidebar, NavShell) and
    navigation-ia.md's tile-promotion rule says long-tail destinations stay off Homebase and live on
    the sidebar. Both of these surfaces are long-tail by that rule, which would make the sidebar the
    answer — but the sidebar is also where navigation-ia.md ALREADY claims Anchor Library lives, so the
    rule has been stated and not enforced. Whether the fix is "add the entries" or "the sidebar is not
    actually the long-tail home" is the decision.
