description: |
  Found 2026-08-16 while wiring the compute feeder.

  `ai-personal/nodes/scripts/repo-pull.ps1` declares `$Repos = @('ai-personal', 'homebase')`.
  claude-poker-tracker is NOT in that list, so node1's clone of the repo whose queue drives
  every compute job is refreshed only when somebody pulls it by hand. It was found on branch
  `ws-292-holding-knowledge` (switched to `main` as part of WS-493).

  This is the same class of fault repo-pull.ps1's own header documents: green-while-broken
  ran for eight days because a task reported success while pulling nothing. A compute node
  ranking a frozen queue would look perfectly healthy and would keep re-submitting whatever
  was top-ranked at the last manual pull.

  MITIGATED, NOT FIXED. `fleet\compute-feed.ps1` pulls before it feeds, so the feeder path is
  covered. Nothing else on node1 that reads this repo is.
accept_criteria: |
  - claude-poker-tracker added to repo-pull.ps1's $Repos, pinned to main.
  - repo-pull-status.json shows it on the next scheduled run.
  - The duplicate pull inside compute-feed.ps1 is either removed or documented as deliberate
    belt-and-braces — not left as an accident.
