accept_criteria: |
  - tier/reason reach the advice payload; a live surface visibly caveats when rake is unresolved.
  - A comparative (Result Card) figure computed at tier:'unknown' either refuses or stamps the
    tier into its manifest.
  - Test: unknown-tier and none-tier produce distinguishable outputs end-to-end.
