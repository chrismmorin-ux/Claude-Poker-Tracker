id: "WS-421"
title: "The Hole Map is built entirely on a CC-BY 4.0 corpus and neither the artifact nor the generator mentions the licence, the dataset or its authors anywhere — harmless while it is a local file, an attribution failure the moment either candidate delivery shape ships the derived data into the app"
