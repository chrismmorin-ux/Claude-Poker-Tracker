description: |
  TOP FINDING of the 2026-08-19 launch sweep. NEW - not among FIND-097..110.

  THE DEFECT. `src/hooks/usePersistence.js:211` is the ONLY production `saveHand` call site in the
  app (verified: grep saveHand across src/ excluding tests). Its catch at `:214-216` calls
  `logError`, which terminates at `console.error` (`src/utils/errorHandler.js:187-199`). The hook
  computes and returns `lastSavedAt` (`:241-244`); its sole production caller
  `src/hooks/useAppState.js:85-93` invokes it as a bare statement and captures nothing. Grep for
  lastSavedAt across src/ (non-test) returns three hits, all inside the hook itself.

  So every hand the founder records live passes through one debounced write (`DEBOUNCE_DELAY =
  1500`, `:26`) whose failure is invisible, and the value that would make it visible is computed,
  returned, TESTED (`usePersistence.test.js:283-299`) and dropped on the floor.

  SECOND HALF, same fix. The cleanup at `:226-233` flushes `pendingSaveRef` on React unmount only.
  Repo-wide grep for visibilitychange/pagehide/beforeunload in src/ (non-test) hits only
  `useSpeechCapture.js` and `useBuildVersion.js`. Phone lock, OS eviction of a backgrounded tab, or
  battery death mid-hand discards up to 1.5s of the most recent action - a river shove - with not
  even the console line, because the closure never runs. On the target device this is the most
  likely trigger of the whole class.

  time_to_detect: UNBOUNDED. recoverability: NONE. Per feedback_income_hand_specificity, the unit
  of reality is the specific hand that happened.

  Also instance #1 of three shipped-but-inert capabilities found in one audit - see WS-464.
