status_note: |
  DONE 2026-08-19. Verified in the browser and by anchored tests. Two corrections to the
  ticket as I wrote it, and one additional silent-loss defect found while writing the tests.

  CORRECTION 1 — THE PREMISE OF WS-557 IS FALSE, AND I CONFIRMED IT WRONGLY.
  The sweep's F2 said "no error sink exists anywhere in src/", and I verified it by re-running
  the cross-critic's grep for Sentry|captureException|window.onerror|unhandledrejection. Those
  are REMOTE/GLOBAL handlers. This repo already has a LOCAL one, which is the correct design
  for a local-first app and is essentially what WS-557 proposed building:
    - `src/utils/errorLog.js` — persisted on-device log (localStorage, 50 entries FIFO,
      BUILD_SHA-stamped), exportable.
    - `src/components/ui/HealthIndicator.jsx` — mounted app-root (`PokerTracker.jsx:156`),
      visible on EVERY view, silent when healthy.
    - `src/components/views/SettingsView/ErrorLogPanel.jsx` — view / clear / export.
    - `ErrorBoundary` + `ViewErrorBoundary` both feed it.
  I checked the claim instead of deriving the answer — the exact failure the cross-critic
  caught the phase-1 experts making on H2. WS-557 must be rewritten from "build a sink" to
  "wire the existing sink to the write paths and add the global handlers", which is far
  smaller. Its priority should drop accordingly.

  CORRECTION 2 — MY OWN ACCEPT CRITERION CONTRADICTED REPO DOCTRINE.
  I wrote "TableView renders a persistent save-state indicator". `HealthIndicator.jsx`'s own
  docblock cites `navigation-ia.md`: an operator/health signal EXTENDS HealthIndicator rather
  than growing a per-view widget, because "a per-view warning is invisible from the table,
  which is the one place it matters". I followed the doctrine instead of my criterion.

  WHAT THE DEFECT ACTUALLY WAS. The channel already existed and was wired ONLY to INIT
  failures (`usePersistence.js:115,122`). `HealthIndicator`'s HIGHEST-priority fault is
  already `'Not saving — data at risk'`, with the comment "Save failure outranks everything
  else... not saving costs you the session you are playing right now, and you would not find
  out until it was gone." Someone designed for precisely this defect. The auto-save catch just
  never called the function. A fourth shipped-but-inert instance, and the most pointed one.

  SECOND SILENT-LOSS DEFECT, FOUND BY WRITING THE TEST — not in the sweep, not in FIND-097..110.
  The save closure ended with an unconditional `pendingSaveRef.current = null`, on a ref shared
  across effect runs:
    1. state A changes            -> pendingSaveRef = saveA, timer_A(1500)
    2. state B changes before 1500 -> cleanup clears timer_A and calls saveA() (starts, awaits);
                                      new effect sets pendingSaveRef = saveB, timer_B(1500)
    3. saveA's awaits resolve; saveA nulls the ref, CLOBBERING saveB
    4. timer_B fires -> `pendingSaveRef.current?.()` is null -> NOTHING RUNS
  State B is never written, with no error and no log line, until some later change happens to
  save it. If B was the last action of the hand, that hand's final state is simply gone. Fixed
  by having the closure clear the ref only if it still owns it. The backgrounding test could
  not observe a pending write at all, which is how this surfaced.

  CHANGES
    - `src/hooks/usePersistence.js` — catch now calls `reportPersistenceFailure('hands', error)`
      + `logErrorObject(error, ERROR_CODES.SAVE_FAILED, ...)`; success calls
      `reportPersistenceHealthy('hands')`; `visibilitychange`->hidden and `pagehide` flush the
      pending write; pending-save ref clobber fixed.
    - `src/utils/persistenceHealth.js` — added `subscribePersistenceHealth`. The indicator
      polled at 60s, which was fine for INIT failures (they land at boot) and is not fine for
      WRITE failures: a minute at a live table is several decisions. Polling stays as backstop.
    - `src/components/ui/HealthIndicator.jsx` — subscribes for immediate update.
    - `src/components/ui/__tests__/HealthIndicator.test.jsx` — mock updated for the new export.

  VERIFICATION (measured)
    - 4 new anchored tests. EACH was confirmed to FAIL against the unfixed code and pass with
      it: reverting only the reporting lines fails the 2 reporting tests; reverting only the
      listeners fails the 2 flush tests. A test that passes both ways proves nothing.
    - Browser, live: driving `reportPersistenceFailure` on the app's own module instance made
      the pill read "Not saving — data at risk" within 400ms, against a 60s poll. Rendered
      184x36 CSS px. Screenshot `ws-556-not-saving-indicator.png`.
    - 2,370 tests pass across 126 files (hooks, ui, persistence, SettingsView). Build clean.

  TEST-HARNESS FINDING, worth knowing before trusting this file's older tests: the shared
  `createHook()` captures its params ONCE, so `rerender()` re-renders with the same objects and
  reassigning the outer `gameState` afterwards is invisible to the hook. The pre-existing test
  "auto-saves after debounce delay when state changes" therefore passes on the INITIAL save,
  not on any state change — it does not test what its name claims. My tests use a
  props-driven harness instead. Not fixed here (out of scope); flagged for whoever touches it.

  FALSE ALARM I RAISED AND RESOLVED, recorded so nobody re-runs it: driving the module by a
  bare dynamic import appeared to show the indicator NOT reacting. Cause was mine — Vite dev
  serves the module as `persistenceHealth.js?t=<hmr-stamp>`, so a bare-URL import is a
  SEPARATE instance with its own Map. `errorLog` masked it by reading localStorage, which is
  global. Importing the exact URL the app loaded showed correct behaviour. Dev-server artifact,
  not a defect; production bundles one instance.

  STILL OPEN, and it is the whole reason WS-565 exists: run the WS-565 check on the S22. It
  decides whether this fix was urgent or preventive.
