decision_flags:
  - "Is `d` KL or EV-difference? THE point of the ticket — resolve by measuring both on the same volume, not by argument. Pre-register the primary before running so the choice cannot be made after seeing which one flatters the prior finding."
  - "Does divergence volume weight situations by frequency or treat every situation equally? Frequency-weighted matches what a player actually faces; unweighted surfaces rare-but-severe divergence that frequency weighting would bury. These answer different questions and the Result Card must say which one it measured."
