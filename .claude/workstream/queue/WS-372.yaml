status_note: |
  Premises re-verified against HEAD by reading code:
  `poolBaseline.js:187` (`pids.length <= 6 ? 'sixMax' : 'full'`);
  `generate-handhq-reference.mjs:56` (the miner's `table_bucket(n)` transcription) and `:57-61`
  (the comment naming the mismatch), `:71-77` (`MINED_CORPUS` with `short` at 5,701,743 and
  `hu` at 2,977,180 against a corpus of 21,606,087);
  `handhqReferencePool.js:55-71` (`minedCorpusHands`, `excludedSeatBuckets`,
  `seatBucketDefinition: {"6max":"dealt-in == 6","full":"dealt-in >= 7"}`).

  The short-vs-6max VPIP/PFR figures (29.7/17.7 against 27.0/14.7) come from the WS-325 audit's
  own reconciliation against the 27 site x stake mining segments and are not restated in
  `docs/research/mass-pool-data-2026-07-25.md` — that document never mentions the `short`
  bucket at all, which is itself part of the finding. Re-derive them from the mining output
  before quoting them in a Result Card.

  WS-325 fixed the DECLARATION and left the BEHAVIOUR: the generator now asserts
  table + excluded == corpus and exits 1 on a perturbed input (verified non-inert), and zero
  data rows changed. Do not read the present bucket assignment as a considered value.
