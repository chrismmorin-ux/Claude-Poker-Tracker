decision_flags:
  - |
    OPEN — SERVE THE SHORT ROW, OR REFUSE TO SERVE 3-5 HANDED AT ALL. These are not equivalent
    and the choice depends on the re-mine being possible. Serving it is the better answer and
    costs a re-mine; refusing is cheap, honest, and leaves short-handed villains on the founder
    static prior. What is not acceptable is the status quo, which serves a wrong row with
    millions of hands of apparent authority behind it.
  - |
    OPEN — WHETHER `hu` SHOULD ALSO GET A ROW. It is excluded by design and that exclusion is
    defensible (heads-up is a different game with different correct play). But the service has
    no `hu` bucket at all, so a 2-handed table currently tallies as `sixMax` under
    `pids.length <= 6` — the same misrouting, one bucket further out. If the answer is that
    heads-up should not be served a prior, the service must say so explicitly rather than
    quietly routing it to 6max.
