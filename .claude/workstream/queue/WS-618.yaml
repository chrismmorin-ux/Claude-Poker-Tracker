status_note: |
  WS-492's claim was released by hand during this cleanup, so that specific item is back in the
  queue. This ticket is about the mechanism, not the instance — nothing prevents the next
  crashed session from fencing another item the same way.

  Worth checking as part of the fix: how many other items are currently claimed by sessions that
  are not live. One was found here, but the search was prompted by noticing WS-492 in a
  `by-status claimed` listing rather than by any check that exists.
