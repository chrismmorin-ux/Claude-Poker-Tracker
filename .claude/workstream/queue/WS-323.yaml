decision_flags:
  - "169 cells (rank-pair grid) or 1,326 (suit-aware)? 1,326 is the honest unit for blockers and suitedness but is 8x the compute and most cells are near-duplicates. Recommend 169 for the headline map with a suit-aware pass only on cells whose interval straddles zero — spend the compute where the answer is actually in doubt."
  - "Does the entry map's continuation policy default to the shipped engine, or to a declared simple Card? The engine gives the most realistic number; a declared Card makes the map self-contained and reproducible without the engine. This determines whether the map survives an engine upgrade unchanged."
