id: "WS-431"
title: "Three shapes now exist for one hero-EV decision — `decisionRecord.mjs` shipped after WS-410 was written, reproducing the exact WS-291 mechanism WS-410 exists to close, and extending the Decision Atom without reconciling it would make four"
