decision_flags:
  - |
    ONE PRODUCER WITH TWO CONSUMERS, OR RETIRE THE SIDECAR. Path (a) keeps every field
    `decisionRecord.mjs` already captures and adds governance to it — compliant with the standing
    rule against deleting an instrument, but leaves the heavier 10-15 KB/decision shape in the
    system and therefore in the storage budget. Path (b) is a smaller final system but risks
    dropping fields on the way, which is the thing the standing rule forbids. RECOMMENDATION: (a),
    with the packed encoding from WS-430 applied so the size difference stops mattering. The founder
    should rule because it decides what the durable record physically is for every future run.
