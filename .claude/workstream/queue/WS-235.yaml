status_note: "FIND-023 (HIGH). Origin answered 2026-06-19 (founder estimate). STEP 1 DONE 2026-06-19 — all 4 prior groups stamped 'founder estimate', comment-only, zero numeric change. STEP 2 DONE 2026-06-21 (SPR-142) — new src/utils/exploitEngine/poolBaseline.js derives a per-game-type empirical pool baseline (segmentKey by source+gameType: live/online never pooled), leave-one-out guard (excludePlayerId — villain never shrinks toward a baseline built from its own hands), sample-weighted hierarchical blend with the founder estimate (Beta(a0+k, b0+n-k); pseudocount capped at POOL_PRIOR_MAX_PSEUDOCOUNT=200 for between-player overdispersion, mean keeps converging). WIRED via analysisPipeline (memoized pool index keyed by hands ref) → derivePercentages intervals + generateExploits (runWithStatPriors swap covers statRules + rangeRules); opt-in by passing sessions, static-estimate fallback otherwise. usePlayerTendencies loads sessions + passes them. 16 new poolBaseline tests; full suite 12600 pass, build clean. Self-weighting → inert until a real pool accumulates. DEFERRED follow-ups: (a) range-grid + preflop fold/limp/open priors (populationPriors.js) stay founder-estimate — derivePercentages doesn't emit those splits; (b) useOnlineAnalysis HUD unwired — needs cross-session online-pool aggregation (single-session pool too thin). Core Step-2 accept criteria met."
