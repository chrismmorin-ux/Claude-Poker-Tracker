status_note: |
  RELATION TO FIND-083 (2026-08-07, open). FIND-083 named the *consequences* — "no cross-writer
  captureId dedup" and "captureId degrades to Date.now() on reconnect" — but not the cause. It
  did not identify that `buildHandForRelay` strips the field before it ever reaches a writer, so
  the dedup it asks for could not have worked even if implemented. This ticket is the cause under
  that finding; FIND-083 stays open for its origin-check half (`useSyncBridge.js:238` /
  `app-bridge.js:149` gate on `event.source` only), which is a security concern and a different
  fix. NOT a duplicate of WS-370 (dead export handler) or WS-460 (journal retention/purge).

  CITATION CORRECTIONS made while re-verifying against HEAD, recorded because the audits that
  produced this ticket got them slightly wrong:
    - The source audit cited the app-side dedup as `src/utils/.../handsStorage.js:549`. Real path
      is `src/utils/persistence/handsStorage.js`; line 549 is exact.
    - The integration test was cited as `tests/integration-pipeline.test.js:125-162`. Real path
      is `ignition-poker-tracker/shared/__tests__/integration-pipeline.test.js`, lines 126-162.
      Title and the missing assertion are exactly as described.
    - The audit read `app-bridge.js:234-248` as inserting "up to 500 duplicate rows per app page
      load". The `500` at `:248` is a MILLISECOND DELAY (`}, 500);`), not a row count. The 500-row
      bound is real but comes from `MAX_QUEUE = 500` at `storage-writer.js:28`, which caps the
      session queue the drain reads. The conclusion stands; the mechanism is one file over.
  Confirmed exactly as cited: `wire-schemas.js:200-232`, `useSyncBridge.js:121`,
  `storage-writer.js:248`, `:173-177`.
