description: |
  FOUND BY WS-369 ITSELF (commit bef34e31, 2026-08-05), which fixed the instance that was noticed
  and then made the residual COUNTABLE rather than leaving it to be rediscovered one entry at a
  time.

  WHAT WS-369 ESTABLISHED. `isLiveFacing` used to match on PROSE — a regex over a haystack built
  from the card's own text, firing on phrasing like "live … TRANSFERRED, not measured". So it fired
  on the WS-293 card precisely BECAUSE that card disclosed its own limitation, while a card leaning
  on the online-2009 corpus for live advice without saying so did not match at all. The detector
  was INVERTED with respect to the risk it exists to catch.

  That matters for a mechanical reason, not an aesthetic one: confirming a fault returns every card
  it contaminates flagged `suspect-pending-review`, so an under-matching matcher silently SHRINKS
  that list. The harm is invisible by construction.

  THE RULE THAT REPLACED IT. Match on what a card DEPENDS ON, which it already carries as structural
  fact: `cardPopulation` resolves `match.dealBookId`, `match.fieldId`, `manifest.fieldVersion` and
  `manifest.partition` against a declared anchors table into live / online / synthetic / unknown.
  `isLiveFacing` is now `cardPopulation(card) !== 'live'` (`faultRegister.js:668`) — a card is
  transferred unless it was MEASURED live, and `unknown` matches, because omission must not buy the
  exemption that deleting a sentence used to. Each entry declares `matchesOn` from a closed
  vocabulary, that declaration is bound to behaviour by a prose-invariance test, and it is HASHED
  into `canonicalRegisterBody` — so what a matcher can SEE is now part of what the register version
  means.

  FIVE MATCHERS REMAIN PROSE-BASED. They are declared rather than hidden, and counted by
  `proseMatchers()` (`faultRegister.js:1570-1580`), which filters entries whose `matchesOn` names a
  field in `PROSE_CARD_FIELDS = ['estimand', 'treatment']` (`:694`). Read from HEAD:

    1. FAULT-horizon-bias                (`:885`)
       matches: /one-decision|per-decision/          matchesOn: treatment, estimand, match.surfaceId
    2. FAULT-stat-definition-mismatch    (`:971`)
       matches: /foldto3bet|fold-to-3bet|preflop prior|3bet/
                                                     matchesOn: estimand, treatment, match.surfaceId, match.fieldId
    3. FAULT-masked-hole-cards           (`:1023`)
       matches: /range-marginalized|marginalized/    matchesOn: treatment, estimand
    4. FAULT-showdown-selection          (`:1143`)
       matches: /showdown|revealed|holding/          matchesOn: estimand, treatment
    5. FAULT-multiway-approximation      (`:1217`)
       matches: /multiway|3-way|three-way|multi-way/ matchesOn: estimand, treatment

  THE ONE THAT SHOULD DECIDE THE PRIORITY IS THE FIRST. `FAULT-horizon-bias` is the entry about a
  per-decision edge being read as a winrate — and its own stated mechanism says the fault FIRES
  precisely where a downstream reader DROPS the treatment string. The comment beside it records
  this without flinching (`:894-899`): "this entry's own mechanism says the fault FIRES where a
  downstream reader DROPS the treatment string — exactly the card this matcher cannot see." An
  entry whose matcher is blind to its own failure mode is not a partial detector; it is a detector
  pointed away from the thing.

  THE GENERIC DEFECT, IN THE REGISTER'S OWN WORDS (`:1559-1563`): "A prose matcher can be escaped by
  DELETING A SENTENCE, and it fires hardest on the most carefully-written card. That is invisible to
  both existing diagnostics: `registerSelfCheck` reports a matcher that matches nothing and a
  matcher that matches everything, and a matcher that matches THE WRONG CARDS looks healthy to
  both." That last clause is the whole problem. There is no diagnostic in the repo that can tell a
  correctly-aimed matcher from a mis-aimed one; only reading the matcher can.

  SOME OF THESE ARE IRREDUCIBLE TODAY RATHER THAN UNFIXED, AND THE TICKET MUST NOT PRETEND
  OTHERWISE. The register says so at `:1565-1568`: horizon, hole-card knowledge, showdown
  conditioning and player count are properties of the INSTRUMENT with no structural field on the
  Result Card to carry them, and making them structural is a card-schema change. That is a real
  constraint, not an excuse — but "no field exists" is a statement about the schema, and the schema
  is ours. The question this ticket forces is per-entry: is there no field, or has nobody added one?

  WHAT A STRUCTURAL BASIS WOULD LOOK LIKE, PER ENTRY — SKETCHES, NOT THE ANSWER.
    - horizon-bias: a horizon field on the card ('per-decision' | 'per-hand' | 'per-session'),
      written by the estimator that produced it rather than described in `treatment`.
    - stat-definition-mismatch: which stat KEYS a surface consumed. Note that `metrics.keys` is
      already an accepted structural basis used by four other entries (`:872`, `:925`, `:1130`,
      `:1280`), so this one may be the cheapest to convert.
    - masked-hole-cards: whether the instrument had hole cards — a boolean property of the Deal
      Book and the adapter, both of which are already identified on the card.
    - showdown-selection: whether the estimand conditions on reaching showdown — a property of the
      estimand's definition, expressible as a flag rather than inferred from the word "showdown".
    - multiway-approximation: the player count or player-count range the run covered, which the
      harness knows and does not record.
  Each of these is a card-schema addition. That is the cost, and it is why this is one ticket rather
  than five: the schema decision should be made once, across all five, not five times.
accept_criteria: |
  - EVERY ONE OF THE FIVE IS RESOLVED ONE WAY OR THE OTHER, WITH ITS REASON RECORDED IN CODE. Either
    it is given a structural basis, or it carries an explicit, recorded reason it cannot have one —
    naming the field that would be needed and why it is not being added. `proseMatchers()` already
    provides the declaration channel; what is missing is that an irreducible entry is currently
    indistinguishable from an unconverted one. After this ticket a reader must be able to tell those
    two apart from the data, not from a comment's tone.
  - `FAULT-horizon-bias` IS ADDRESSED FIRST AND EXPLICITLY. Its matcher is blind to its own stated
    failure mode. Whatever is decided, the resolution must state in one sentence what the matcher
    can now see that it could not, or state that it still cannot see the case its mechanism
    describes — which would be an honest and useful thing to have written down, and is arguably a
    `falsifierBlocker`-shaped fact rather than a comment.
  - A PROSE-INVARIANCE TEST FOR EVERY CONVERTED ENTRY, FAILING AGAINST HEAD (WS-309 rule). The shape
    WS-369 established: take a card that matches, rewrite its prose to remove the words the old
    regex keyed on while leaving every structural field identical, and assert it STILL matches. And
    the converse: a card whose prose contains the words but whose structural fields do not qualify
    must NOT match. Both fail today for the five, which is the point.
  - THE COUNT `proseMatchers()` RETURNS IS ASSERTED, NOT JUST PRINTED. Whatever number remains after
    this ticket — zero, or two irreducibles — must be pinned by an exact assertion, the same ratchet
    pattern `groundTruthCoverage.test.js` uses for estimator pins. A count that only logs enforces
    nothing; per `exploitEngine/CLAUDE.md`, a diagnostic that only logs is a comment with extra
    steps.
  - THE REGISTER VERSION MOVES, AND THE CONSEQUENCE IS STATED. `matchesOn` is hashed into
    `canonicalRegisterBody`, so changing any entry's declared basis bumps `registerVersion()`. That
    is intended behaviour — it is what lets a reader of an older Result Card tell it was stamped
    under a register that could see less. Report the before and after version strings, and confirm
    that prior stamps are left untouched rather than back-filled.
  - RE-RUN THE MATCH ACROSS ALL EXISTING RESULT CARDS AND REPORT THE DELTA, BOTH DIRECTIONS. WS-369
    moved matched cards from 6 of 7 to 7 of 7. A structural conversion can un-match a card as easily
    as match one, and an un-match is the direction that shrinks a `suspect-pending-review` list —
    the harm that is invisible by construction. Every card that CHANGES status must be named with
    the reason.
  - IF THE ANSWER IS A CARD-SCHEMA CHANGE, IT IS DECIDED ONCE FOR ALL FIVE. The five want five
    different fields but they want them for the same reason and at the same cost. Adding them one at
    a time means five register-version bumps and five migrations of the same kind.
