status_note: |
  Premises re-verified against HEAD by reading the code, not by trusting the commit message:
    - `src/utils/standardOfRecord/faultRegister.js:694` — `PROSE_CARD_FIELDS = ['estimand',
      'treatment']`; `:1570-1580` — `proseMatchers()` filtering on it and attaching the standing
      warning; `:1555-1568` — the docblock stating the generic defect and naming horizon, hole-card
      knowledge, showdown conditioning and player count as today-irreducible.
    - The five entries, each read in place: `:885` FAULT-horizon-bias (`matches`
      `/one-decision|per-decision/`, `matchesOn` at `:901`); `:971` FAULT-stat-definition-mismatch
      (`matchesOn` at `:983`); `:1023` FAULT-masked-hole-cards (`matchesOn` at `:1034`); `:1143`
      FAULT-showdown-selection (`matchesOn` at `:1155`); `:1217` FAULT-multiway-approximation
      (`matchesOn` at `:1228`). Exactly five entries name a prose field — the count was derived by
      reading every `matchesOn` in the file, not taken from the commit message.
    - `:894-899` — the comment on FAULT-horizon-bias recording that its own mechanism describes the
      case its matcher cannot see.
    - `:668` — `isLiveFacing` is now `cardPopulation(card) !== 'live'`, the structural form.
    - `:872`, `:925`, `:1130`, `:1280` — four entries already keyed on `metrics.keys`, which is why
      that is described above as an already-accepted structural basis rather than a proposal.
    - `:1736-1744` — the reasoning for hashing `matchesOn` rather than the matcher source, and the
      note that adding it moved `registerVersion()`.

  THE RELATED FACT THE BRIEF ASKED ABOUT, ANSWERED RATHER THAN FILED SEPARATELY. WS-369's change made
  `RC-depth-ablation-1c560bcc-67e9e14e` newly match, taking matched cards from 6 of 7 to 7 of 7. It
  was reported as a finding and not acted on.

  IT DOES NOT NEED SEPARATE REVIEW, AND HERE IS WHY. The new match is `isLiveFacing` firing
  structurally: that card was produced on the HandHQ online-2009 corpus, so `cardPopulation` resolves
  it to `online`, and under the new rule a card is live-facing unless it was MEASURED live. That is
  the matcher working exactly as designed, on a card that genuinely does carry the transfer
  limitation. It is not a new fact about the card — the depth-ablation card already discloses the
  online-2009 provenance, and WS-378, which is built on that card, states the transfer caveat in its
  own text.

  What it IS, is confirmation that the pre-WS-369 matcher was under-matching, since the same card
  was not flagged before and nothing about the card changed. That is the finding, and it is already
  recorded. No action is required unless and until `FAULT-population-mismatch` is CONFIRMED, at
  which point this card appears in the `suspect-pending-review` list — which is the correct outcome
  and the reason the matcher was fixed. Note that entry remains `untested` and unsettleable: it
  still carries 2 of 3 `falsifierBlockers`, and WS-368's fix cleared only the SRC-014 identity one.
