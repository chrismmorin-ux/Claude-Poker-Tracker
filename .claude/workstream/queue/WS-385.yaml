decision_flags:
  - |
    OPEN AND THE CENTRAL ONE — DOES THE RESULT CARD SCHEMA GROW? All five sketched bases are new
    card fields: horizon, consumed stat keys, hole-card visibility, showdown conditioning, player
    count. Adding them makes five matchers structural and makes every future card carry five more
    declarations, which is a real cost paid by every run. Not adding them means accepting five
    permanently prose-based matchers and saying so in data. The middle path — convert only
    `FAULT-stat-definition-mismatch`, which may fit the ALREADY-ACCEPTED `metrics.keys` basis with
    no schema change at all — is worth pricing first, because it may turn five into four for free
    and sharpen what the remaining four actually need.
  - |
    OPEN — WHETHER AN IRREDUCIBLE PROSE MATCHER SHOULD BE ALLOWED TO CONTRIBUTE TO A CONFIRMED
    ENTRY'S CONTAMINATION LIST AT ALL. Confirming an entry returns the cards it contaminates flagged
    `suspect-pending-review`. If a matcher is known to be escapable and known to be biased toward
    the most disclosing cards, then the list it produces is systematically wrong in a known
    direction. The options are to let it stand with a recorded caveat, or to make a prose-matched
    contamination list carry a distinct, weaker status than a structurally-matched one. The second
    is more honest and more machinery. The founder should decide, because it changes what a
    `suspect-pending-review` flag means.
