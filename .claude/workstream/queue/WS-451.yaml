description: |
  Four depth-2/3 stage sites subtract one flat estimateRake() from the blended fold+call+raise
  EV, taxing fold-branch mass in violation of POKER_THEORY §11.3 — while the river functions in
  the same file already do per-branch rake correctly. Depth-3's rake is additionally computed
  from potAfterFlopCall, the pot BEFORE the barrels it discounts. Open question to resolve
  in-ticket: :1707 raiseEV nets no rake at all. Full mechanism: findings/FIND-113.yaml.
  Structural half (S3): extract the river pattern into a shared rakeAdjustedBranchEV helper used
  by every EV site.
accept_criteria: |
  - All four stage-level sites use per-branch rake via the shared helper; no flat post-hoc
    subtraction remains.
  - Depth-3 rake computed on the pot actually reached after turn/river betting.
  - The :1707 raiseEV rake question is resolved (raked, or documented why not).
  - Invariance test: fold-branch EV is bit-identical with rake on and off.
  - Plain English: only pots that go to showdown lose money to the house; "opponent folds" is
    worth the same with rake on or off.
