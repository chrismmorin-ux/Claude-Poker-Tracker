decision_flags:
  - |
    OPEN AND PRIOR TO EVERYTHING ELSE — IS THE DEEP ANSWER RIGHT OR WRONG? Stated as an accept
    criterion because it is load-bearing, restated here because it needs a human decision and the
    two branches lead to opposite work. If raising air into a half-nutted range at full depth is
    CORRECT, then a test the repo has treated as a defect boundary has been encoding an intuition,
    and the interesting question becomes what else in the suite is calibrated the same way. If it
    is WRONG, then the shipped 2000ms budget is load-bearing for correctness by accident, and every
    surface that varies it — a slower device, a busier machine, a different spot's stage gating —
    is a surface that can produce the wrong recommendation. The second is the more expensive world
    and neither is currently excluded.
  - |
    OPEN — WHETHER `refinementBudgetMs` SHOULD BE A CORRECTNESS BOUNDARY AT ALL. A time budget is a
    performance control. If the engine's ANSWER depends on it, then it is silently also a
    correctness control, and the honest options diverge: make refinement produce a monotone
    improvement so more time can never make the answer worse, or make the engine report its
    achieved depth alongside its recommendation so a truncated answer is legible as one. The first
    is a real engineering constraint on every future stage; the second is a UI and contract change.
    This is the design question underneath WS-379 and it should be answered once, for all three
    tickets.
