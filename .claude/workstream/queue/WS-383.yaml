status_note: |
  Premises re-verified against HEAD by reading the code, not by trusting the commit message:
    - `src/utils/exploitEngine/__tests__/foldEstimateComposition.test.js:228` — the test name
      "DEFECT: raising into an uncapped nutted range is not the top action"; `:231`
      `expect(result.heroEquity).toBeLessThan(0.15)`; `:232`
      `expect(result.recommendations[0].action).not.toBe('raise')`; `:237`
      `expect(raiseEV).toBeLessThan(0)`.
    - `:56` `NUTTED_UNCAPPED = tightRange`; `:63` `CAPPED_WEAK`; `:78` the shared `SPOT`
      (potSize 100, villain bets 75, trials 2000); `:80-82` `evaluate` calling `evaluateGameTree`
      with board QJT and hero 33 — so the budget is NOT passed and the default applies.
    - `:65-77` — the docblock recording that pinning the budget was tried and reverted, and why.
      This is the direct evidence for the ticket's central claim; it is a contemporaneous record
      written by the session that observed it.
    - `:239-246` — the CONVERSE test, same hero hand raised vs `CAPPED_WEAK`, and `:248-255` the
      ordering test carrying the explicit 90000ms timeout.
    - `src/utils/exploitEngine/gameTreeEvaluator.js:814` — `refinementBudgetMs = 2000`, the shipped
      default; `:899` `const timeBudgetMs = refinementBudgetMs`.

  NOT RE-RUN AS PART OF FILING, AND DELIBERATELY SO. Reproducing the flip means pinning the budget
  to 60000 and running the engine, which would edit a file under `src/` while another agent holds
  the engine. The observation is taken from the contemporaneous record in the test file and the
  commit that wrote it, and reproducing it under a seed ladder is the FIRST accept criterion rather
  than a premise. If it does not reproduce, that is itself the finding and the ticket closes.

  Filed at P1 rather than P0: no measured wrong number is in circulation, and the shipped
  configuration currently produces the conservative answer. It is P1 rather than P2 because the
  suite's claim and the engine's deep behaviour disagree, and because the family it belongs to
  (WS-378, WS-379) is already large enough that treating this as an isolated flaky-test note would
  repeat the mistake WS-378 documented — attention on the cheap street.
