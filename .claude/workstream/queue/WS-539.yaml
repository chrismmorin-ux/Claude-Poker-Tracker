description: |
  FOUNDER, 2026-08-17: "I want this to be a lesson. Understanding the villain's strategy. It
  needs to be studyable. It needs to be drillable. 'Will xyz villain overcall you if you overbet
  the turn for value here? Will abc villain overfold to a pot sized cbet here?' Full axis
  understanding."

  THE STRUCTURAL INSIGHT THIS ITEM RESTS ON. A drill question and a strategy rule are THE SAME
  OBJECT READ FROM OPPOSITE SIDES. A rule says "in situation S, do A". A drill asks "in
  situation S, what will villain do?". The rule is only correct BECAUSE of the answer.

  The register already carries the hook. Every Strategy Card rule carries a Warrant, and the
  `read` warrant is defined as "the rule claims something about a POPULATION NUMBER... a `read`
  rule must name the claim it is making and can be scored against the corpus."

  So a `read`-warranted rule IS a drill question with an answer:

    RULE     overbet the turn for value here
    WARRANT  (read) this villain overcalls turn overbets at >= X%
    DRILL    "Will he overcall?" -> his rate | the pool's rate | the REQUIRED rate from pot
             geometry | n | his entropy ceiling
    SCORED   does the rule's edge survive when its warrant is checked against the corpus?

  Consequence worth stating: the study material CANNOT drift from the strategy, because they
  are one artifact. A rule whose warrant is falsified loses its drill card and its place in the
  ladder in the same move.

  FULL AXIS UNDERSTANDING means the drill enumerates street x facingAction x sizing x texture
  x SPR x position x hand class — and the CENSUS is load-bearing, not decoration. A drill that
  quizzes only where data is thick teaches a distorted game while reading as authoritative.
  `observed-zero`, `unexamined` and `dropped` stay distinct on every axis cell.

  MATERIAL THAT EXISTS: `holeMap.mjs` already computes required fold % from pot geometry
  (`s/(1+s)` for a bet, `R/(R+P+B)` for a raise) and measured predicted fold % from the
  hold-out half. That is two of the four numbers on every drill card, already built.

  FIELD FIRST, VILLAIN LATER, SAME SURFACE. Drills against the Field are buildable once WS-536
  produces warranted rules. Per-villain drills ("xyz villain" vs "abc villain") swap the Field
  slot for that villain's fitted policy and need WS-527. The surface does not change.

  GATES BIND. New user-facing surface: docs/design/LIFECYCLE.md Gate 1 (Entry: scope, personas,
  JTBD, gap analysis with GREEN/YELLOW/RED) before anything, Gate 4 surface artifact in
  docs/design/surfaces/ before production code. If Gate 1 is YELLOW or RED, Gate 2 roundtable
  runs — and per .claude/rules/engine-execution-fidelity.md a declared roundtable is executed
  by spawning those agents or not at all. Coordinate with WS-533, which owns the drill-score
  half (achieved accuracy vs entropy ceiling) and the live hand census.
accept_criteria: |
  - Every `read`-warranted rule compiles to a drill item automatically. A rule cannot ship a
    warrant that does not produce a scoreable question.
  - Each drill card carries four numbers, never fewer: villain's rate, pool's rate, REQUIRED
    rate from pot geometry, and n — plus the entropy ceiling for that cell.
  - Axis census rendered, with unexamined cells VISIBLE rather than omitted.
  - A falsified warrant removes its rule from the ladder and its drill from the deck, in the
    same change.
  - Gate 1 complete with a recorded verdict; Gate 4 surface artifact exists before any
    production code.
  - Any corpus-anchored figure is labelled TRANSFERRED, not measured.
