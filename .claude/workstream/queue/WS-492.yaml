status_note: |
  PREMISE CORRECTION (measured 2026-08-15, cm-node1 + G16 paired run). The title claim
  "every prior, policy, curve and reference table" is OVERSTATED. The shipped production
  Reference tier src/utils/exploitEngine/handhqReferencePool.js (SRC-011) carries all 7
  stake bands and 12,927,164 hands - it was mined during WS-262 while the corpus was fully
  materialised, BEFORE the sparse regression. It was never fitted on the slice. The
  full-corpus arm run today sums to exactly 12,927,164 hands with per-stake counts matching
  to the unit, which both proves the corpus is restored to the WS-262 state and clears the
  shipped table.

  Actually slice-fitted: out/pool-reference.json (stakesMined 50NLH only);
  out/fold-vs-sizing.json (files: 1756 - the 2-dir count exactly); out/behavior-policy.json
  (intends --stakes 50NLH but silently got 2 of the 3 sites carrying 50NLH, missing ABS).
  out/pole-priors.json and out/behavioral-features.json record NOTHING about their corpus
  and cannot be audited at all.

  DONE SO FAR: corpus materialised on cm-node1 (27 dirs / 21,782 files / 12.93M hands, 12.1x);
  paired pool-reference mine (2-dir arm on G16 in a clean worktree at 48bd185e reproduces the
  shipped artifact byte-identically, so it is the true baseline); scripts/backtest/corpus_stamp.py
  added and wired into mine-pool-reference.py so a manifest can no longer describe a 2-dir tree
  and a 27-dir tree identically.

  HEADLINE FINDING - the bias, not the variance. Every stat carries a large monotone stake
  gradient (6max 3-bet +57% from 25NLH to 1000NLH, PFR +31%; full-ring 3-bet +56%, PFR +40%;
  smallest cell still 138k hands). The founder plays live 1/2-1/3 = canonical 1-2 = 200NLH,
  while the backtest artifacts are fitted at 50NLH - a 4x stake mismatch. Full ring, fitted vs
  his stake: 3-bet UNDERSTATED 26.4%, PFR understated 16.2%, VPIP overstated 10.3%. Still a
  transferred claim for live play; the stake/site gap sits ON TOP of the online-vs-live gap.

  Full record: docs/research/ws-492-full-corpus-2026-08-15.md

  STILL OPEN: re-mine fold-vs-sizing / behavior-policy (with WS-490) / behavioral features /
  pole priors at full corpus with Result Cards; stamp the remaining miners; G16 corpus is
  still the 2-dir slice (28 GB free, 95% full - needs a founder call on disk); the
  DISCLAIMER-AND-FAULT-REGISTER entry for the stake/site population gap.

  Filed in place of a third item that did NOT survive checking: an apparent protobufjs
  postinstall tree difference between G16 and cm-node1 turned out to be an npm-version artifact
  (npm 11.6.2 has no approve-scripts command). Both trees carry protobufjs 7.5.4 with 77 files.
  Recorded here so the negative is not lost.

  This is the work cm-node1 was provisioned for. Compute is not the constraint — the full mine
  is minutes. The constraint was that nobody had looked at what the sparse checkout excluded.
