description: |
  Measured 2026-08-15, not inferred.

  C:/Users/chris/data/phh-dataset is a blobless sparse checkout of uoftcprg/phh-dataset
  (commit e47fbd58). `git ls-tree origin/main data/handhq/` lists 27 stake directories.
  `git sparse-checkout list` returns 2:
    data/handhq/FTP-2009-07-01_2009-07-23_50NLH_OBFU
    data/handhq/PS-2009-07-01_2009-07-23_50NLH_OBFU
  On disk: 1756 .phhs files. mine-pool-reference.py:30-33 states the full set is 21,783 files
  across 28 dirs and passes all of it in 278 s at 8 workers.

  So the corpus actually being mined is roughly 8% of the corpus already available, and the
  missing 92% is not merely "more of the same": the materialised pair is 50NLH only, from two
  sites. The unread directories span 25NLH through 1000NLH across ABS, FTP, IPN, ONG, PS and PTY.
  Every stake-dependent quantity in the system — SPR distributions, sizing tells, fold curves,
  the pool baseline, pole priors — is therefore estimated at one stake level and one price point,
  from two operators.

  This is not a compute-cost problem. The full mine is minutes, not hours. Nothing chose this
  slice on the evidence; it is the default a sparse checkout produces, and it has been silently
  bounding every result since.

  Two consequences that need separating:
  (a) VARIANCE — n is ~12x smaller than available, so intervals are wider than they need to be.
  (b) BIAS — a 50NLH-only, two-site fit is a different population from the full pool. This is a
      distinct transfer step ON TOP of the already-recorded online-2009-vs-live-9-handed transfer
      in DISCLAIMER-AND-FAULT-REGISTER §3. That register entry names one population gap; there
      are two, and only one is written down.
accept_criteria: |
  - Corpus materialised to all 27 directories on the machine(s) that mine (both G16 and cm-node1),
    with the resulting file count recorded. Sparse-checkout state is stamped into any manifest that
    currently records only the corpus root/commit — a commit hash does not describe a sparse tree.
  - Re-mine the artifacts that feed everything downstream, at full corpus, each emitting a Result
    Card: pool reference, behavior policy (coordinate with WS-490 — do not re-mine onto an
    unrecorded provenance), fold-vs-sizing curve, behavioral features, pole priors.
  - Report full-corpus vs 2-dir as a PAIRED comparison per stake band, not as a replacement. The
    delta is the finding. State per quantity whether it moved outside the old interval.
  - Stake-stratified reporting where a quantity is stake-dependent: do not average 25NLH and
    1000NLH into one number and call it the pool. Carry the conditioning set per the standing rule.
  - DISCLAIMER-AND-FAULT-REGISTER gains an entry for the stake/site restriction as a population
    gap distinct from the online-vs-live one, with a falsifier. If the full-corpus re-mine shows
    the quantities are stable across stakes, record that unhedged and retire the entry with the
    evidence attached.
  - Any committed Result Card produced against the 2-dir slice is annotated with what it was
    actually fitted on.
