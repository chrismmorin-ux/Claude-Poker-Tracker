decision_flags:
  - "Does a Strategy Card declare action DISTRIBUTIONS (mixed strategies) or single actions per state? Distributions match how the engine already emits advice and how pi_ours is built, but they are much harder for a human to execute at a table — and human-executability is the point of the curriculum work."
  - "Is `fear` a first-class warrant or a derived verdict? Declaring it invites honesty; deriving it (equity-warranted rule that deviates toward passive in the medium band with no arithmetic justification) catches authors who will not admit it. Recommend BOTH — declared, then audited against the derived test."
