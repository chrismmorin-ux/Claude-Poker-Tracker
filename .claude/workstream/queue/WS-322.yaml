  - "HomebaseView carries an explicit design note that it renders inside ScaledContainer BY DESIGN and that the fixed canvas is what letterboxes overlapping tiles away in portrait (HomebaseView.jsx:36-47, per surfaces/homebase-view.md). Un-scaling it re-opens that decision. Read the surface artifact before touching it — it may be a legitimate exception to the doctrine."
