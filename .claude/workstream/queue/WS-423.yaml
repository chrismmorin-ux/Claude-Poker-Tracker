status_note: |
  Every figure in the description was measured in-session against HEAD fe716f59, not carried from a
  commit message or a prior ticket. Reproduction paths:
    - Composition: block-level classification, coverage-asserted (0 unassigned, 0 overlapping
      lines). Classification method and the class/line-range map are in
      `docs/context-architecture.md` §1.1 and its appendix.
    - Citation sweep: 3,864 files (tracked + untracked-not-ignored), excluding POKER_THEORY.md
      itself. `POKER_THEORY[.md]` → `§N` adjacency with an intervening-token filter, plus chained
      refs, reverse form (`§7.3 of POKER_THEORY.md`), YAML `section:` form, and anchor form.
      REPORTABLE FIGURE IS 918. A naive sweep returns 934+ and is contaminated by `§N` references to
      SYSTEM_MODEL.md / VOCABULARY.md / design docs — do not quote the naive number.
    - Growth curve: `git log --reverse -- .claude/context/POKER_THEORY.md`, line count per commit.
    - Every contradiction in C1–C5 was verified by reading the file at the cited line.

  TWO PREMISES IN THE ORIGINATING BRIEF WERE CORRECTED BY THE MEASUREMENT, AND BOTH CORRECTIONS
  MATTER TO THE DESIGN.
    1. "§14/§15 declare binding rules on the Five-Surface Atlas which is Phase 1 of 5 and unbuilt."
       FSA Phase 3 LANDED on 2026-08-05 via WS-350 (`docs/standard-of-record/VOCABULARY.md:240`,
       "CLOSED by WS-350. FSA Phase 3 landed."). The bindings are not aimed at vapour. Only the
       phantom `§FSA` cross-reference is defective, and it is defective for a different reason —
       it names a section of POKER_THEORY.md that has never existed.
    2. The founder's framing that corrections-history is the drag. It is 12.5% of lines and is not
       the largest non-doctrine block. The measurement relocates the mechanism to accretion rate
       (40x, ten days, no ceiling) and to the digest/vocabulary distinction (§8 at zero citations;
       §16 at 1 citation and 151 vocabulary occurrences). The hypothesis about HOW context works
       survives intact and is in fact supported by the §7/CLAUDE.md:337 natural experiment — what
       changes is which content the remedy should target.

  WORKING-TREE STATE AT AUTHORING: `.claude/context/POKER_THEORY.md` carries an uncommitted +120
  lines (§11.1b, WS-402). All composition figures are HEAD; all `file:line` citations are
  working-tree, because that is what a reader opens. WS-402's §11.1b is itself a fresh instance of
  the "parameter transplanted across conditioning sets" family (wrong axis, wrong curve, wrong
  anchor for a raise), which is why that family is listed at "4+" rather than 4.

  NOT DONE BY THIS TICKET'S AUTHORING PASS, DELIBERATELY: POKER_THEORY.md was not rewritten. A
  rewrite of the most load-bearing document in the repo is its own change with its own review, and
  Part 1 exists so that review has numbers to argue against rather than an impression.
