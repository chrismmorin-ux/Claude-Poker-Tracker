decision_flags:
  - |
    OPEN AND THE CENTRAL ONE — IS THE LIGHT TIER ACTUALLY ALWAYS-LOADED, AND BY WHAT MECHANISM?
    The entire hypothesis rests on it being in context on every turn, and CLAUDE.md is the only
    file with that property today. Three options, with different costs. (a) INLINE into CLAUDE.md:
    genuinely always-loaded, but grows a 444-line file by ~250 and mixes poker doctrine into a
    CWOS-protocol document. (b) A SEPARATE FILE with a mandatory read at session start: honest
    separation, but "mandatory" is exactly the word POKER_THEORY.md already carries at CLAUDE.md:308
    while being explicitly skipped for four of six task types — so this option may reproduce the
    problem it is solving. (c) A HOOK that injects it, per the ADR-040 catch-state precedent:
    genuinely always-loaded and per-repo, but hooks are not installable by the kit today (CLAUDE.md
    records this) so it would be repo-local until plugins ship. The founder should decide, because
    the answer determines whether the falsifier is testing the light tier or testing whether anyone
    reads it — and those are different experiments with the same measurement.
  - |
    OPEN — DOES THE HEAVY TIER GET SMALLER, OR ONLY BETTER ORGANISED? This design as written does
    NOT shrink POKER_THEORY.md except for the changelog (46 lines) and the six test-closed
    corrections. §11 stays 700 lines at 15% doctrine. The argument for leaving it: the standing rule
    "never delete for a null result", and the fact that §11's measurement records are the evidence
    the six families rest on — deleting them would leave the families as assertions. The argument
    for splitting: §11 is 28% of a document whose front half is 89% doctrine, it is chronological
    rather than thematic, and a `POKER_THEORY-measurements.md` would let the doctrine sections be
    read without it. This is a real fork and it should not be decided inside the light-tier work.
  - |
    OPEN — WHETHER V2 SHOULD EVER BECOME A VIOLATION. It ships as a WARNING on the
    `validateFindingProblemClass` reasoning, which is sound today. But a warning that fires forever
    is a warning nobody reads, and the count of binding-sections-without-a-light-entry is exactly
    the kind of number that should ratchet rather than drift. The alternative is to pin the count
    with an exact assertion (the `groundTruthCoverage.test.js` pattern) so it can only go down —
    which enforces without removing the escape hatch the precedent argued for.
