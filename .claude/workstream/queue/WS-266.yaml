description: |
  Independent bug surfaced during WS-262 research
  (docs/research/mass-pool-data-2026-07-25.md, follow-up item 5):
  exportAllData does not include the anchorObservations store, so a
  full export/re-import cycle silently drops owner-captured anchor
  calibration judgments — data that cannot be re-derived from hands.

  Fix: add anchorObservations to the export manifest + import path;
  audit the export store list against the current IDB schema for any
  other stores added since the exporter was last touched (schema has
  advanced through v20+; exporter may lag on more than one store).
accept_criteria: |
  - exportAllData includes anchorObservations; import round-trips it.
  - Store-coverage audit: exporter store list reconciled against the
    live IDB schema, with a test asserting parity so future stores
    can't silently fall out of backups.
  - Round-trip test: export → clear → import → anchorObservations intact.
