description: |
  Phase 1 of the Five-Surface Atlas (.claude/projects/five-surface-atlas.md) and the
  keystone the exploit-model architecture charter §6 has named since 2026-06-18:
  "This must be unified and made the single join across GTO / Field / Read before
  triangulation is meaningful. This is the first build dependency."

  TWO DEFECTS, ONE FIX.

  1. THE KEY IS A POSITIONAL STRING WITH AD-HOC PARSERS.

       decisionAccumulator.js:189
       buildSituationKey = (street, texture, posCategory, isAgg, isIP, facingAction, contextAction)
         => `${street}:${texture}:${posCategory}:${isAgg}:${isIP}:${facingAction}:${contextAction}`

     Readers that parse it independently, by position:
       - villainDecisionModel.js:126   parseSituationKey
       - modelAudit.js:130             bucket.situationKey.split(':')
       - villainProfileBuilder.js:428  parts = bucket.situationKey.split(':')
       - villainDecisionModel.js:630   startsWith(st + ':')   [prefix match]

     Adding a dimension silently breaks every positional reader. This is the failure mode
     the engine CLAUDE.md already records three times — WS-285 (a comment asserting an
     unmeasured ordering), WS-291 (a doc the data refuted), WS-300 (a comment naming hands
     the indices did not encode). Same shape: a structure asserting something nothing checks.

  2. FOUR DIMENSIONS THE KEYSTONE REQUIRES AND THE KEY LACKS.

     Charter §6 defines a spot as street x position x board-texture x SPR band x action
     context x players-remaining. The key has neither SPR nor players-remaining.

       SPR BAND — engine doctrine treats SPR as a first-principles decision input; the
         founder's own maxim is that "afraid of getting stacked" is SPR, not a label. A spot
         definition without SPR groups together decisions the engine itself says differ.
       PLAYERS REMAINING — and per WS-274 the rule is WHO, not how many. Multiway already
         has a known gap (WS-277).
       SOURCE / PROVENANCE — the promoted registry's row-grain rule: source id must survive
         the join or composition reporting and scope-leak detection are impossible. Charter
         §6 states the keystone carries provenance THROUGH the join.
       POOL IDENTITY — stake AND venue class. Without it the three Field surfaces (HandHQ
         2009 online, Ignition current online, Wind Creek live 1/3) cannot be told apart,
         which is the entire comparison FSA exists to make.

  PRECEDENT, ALREADY IN THIS REPO. scripts/backtest/decisionGeometry.mjs: "Small on purpose,
  and shared on purpose. Deriving it three times would be three chances to disagree about
  what 'the pot' means at a node — and the pot convention is one of the details that
  silently corrupts every downstream number if it drifts." Identical argument, one scale up.

  NOT A REFACTOR FOR TIDINESS. Nothing in FSA — no divergence, no volume, no live-vs-online
  transfer answer — is computable until two surfaces can be expressed on one grid.

  ── SCOPE CORRECTION, 2026-07-31 (found while executing; the filed premise was wrong) ──

  The description above says FOUR modules. It is SIXTEEN parse sites across ELEVEN files, and
  there are TWO key formats, not one:

    VILLAIN  7 axes   decisionAccumulator.buildSituationKey
    HERO     8 axes   skillAssessment/deriveSituationKey.buildHeroSituationKey
                      (adds preflopAggressor; WS-146 / SPR-040)

  The hero key is the villain key plus one field — a superset, which is good news for
  unification but a trap for positional readers: a 7-axis reader pointed at an 8-axis key
  returns correct-looking values for axes 0-6 and silently ignores the rest.

  Sites: decisionAccumulator (x2), villainDecisionModel (x2), modelAudit, villainProfileBuilder,
  thoughtSignatureEvaluators, heroAnalysis, handSignificance (x4), solverBaselines, and five
  leakRules/ files sharing one identical matchesBucket pattern, one of which
  (heroPf3betOverfold.solverBaselineKey) performs a positional WRITE — `parts[4] = 'ip'`.

  ALSO: the key is PERSISTED. heroLeaks uses `keyPath: ['playerId', 'situationKey']` (IDB
  v22), so the string is part of a composite PRIMARY KEY. The wire format therefore cannot
  move without orphaning stored leaks — which settles decision flag 2: keep the serialized
  format byte-identical, change only who parses it. No migration required.

  AND: two of the sixteen were found by the guard test, not by grep — handSignificance.js
  used `hk`/`vk` rather than a variable named for the key. The guard is written on the SHAPE
  of a positional read, not on naming, for exactly that reason.

  A SEPARATE DEFECT SURFACED AND WAS NOT FIXED HERE: three sites destructure axis 3 (`isAgg`)
  while calling it the action type, producing a too-loose match and the user-visible string
  "in flop agg spots". Behaviour preserved under this ticket's bit-identity criterion; filed
  as WS-318.
accept_criteria: |
  - One structured key (an object with named fields), one builder, one parser. No module
    parses a situation key by split(), index position, or prefix match. Assert it: a test
    that greps the source for `split(':')` on a situation key and fails is legitimate here,
    because positional parsing is precisely the defect.
  - A dimension can be ADDED without editing any reader. Prove it by adding one in the same
    change and touching no consumer.
  - SPR band, players-remaining, source and pool are present. SPR banding must reuse the
    engine's existing SPR zone definitions, not invent a second set — a second banding is
    the same class of defect as a second situation key.
  - HIERARCHY_ORDER survives AS MEASURED. It is ['isAgg','isIP','texture','street',
    'posCategory'] and WS-285 measured that ordering against alternatives. Re-deriving or
    "tidying" it during migration would discard a measurement. Its test must still pass.
  - Source id survives an aggregation: build a mixed-source aggregate and assert it can
    report its own composition without external bookkeeping. This is the registry's
    row-grain rule made real, and it is the acceptance criterion prog-data-provenance cares
    about most.
  - Behaviour is UNCHANGED where the key did not gain a dimension. The villain model, model
    audit and profile builder must produce identical output on a fixed corpus slice before
    and after — a migration that moves numbers has done two things at once and neither is
    verifiable. Bit-identical, or a stated and measured reason.
  - Backtest and app agree: scripts/backtest/ and src/utils/ must key spots the same way, or
    the FSA comparison is between two coordinate systems rather than two surfaces.
