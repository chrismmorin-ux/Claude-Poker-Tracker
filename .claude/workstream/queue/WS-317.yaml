decision_flags:
  - "OVERLAPS WS-316. Confirm-before-commit is a THIRD strategy for the touch-floor problem, alongside scale-aware floors and un-scaling the command column. It does not raise target size — it removes the need for precision. For dense grids that may be the better answer. The three must be evaluated TOGETHER at Gate 4, not separately."
  - "Sequence INTO Gate 4 (WS-313), which is already open. This interacts with the touch floor, the pre-arm direction, and the roster rail — designing it after the surface artifact is written would mean rewriting the artifact."
  - "Option (a) would re-open AUDIT-2026-04-21-TV F9 (PotDisplay long-press), a shipped and owner-approved decision. Do not do that without an explicit founder call."
