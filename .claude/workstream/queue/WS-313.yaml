source:
  type: founder-request
  created_by: ai
  finding_id: ""
  run_id: "session-2026-07-31-tvr-kickoff"
created_at: "2026-07-31T00:00:00Z"
status_note: |
  UNBLOCKED 2026-07-31 — WS-312 (Gate 3) complete, Gate 2 re-run returned GREEN.

  BINDING INPUTS FROM GATE 3:
  - Design against `glance-return-chris`'s surface contract (positional stability
    within a street; change only at witnessed moments; settled on return).
  - Serve HE-22 (accept/override a proposal), HE-23 (orbit as unit of success),
    PM-16 (roster maintenance as a continuous job).
  - `ringmaster-in-hand` is REFUTED for the founder — do NOT cite it.
  - H-PLT02 one-handed reachability is NOT binding (founder uses two hands). Rail
    placement is free of the handedness argument, but target SIZE now carries all the
    accuracy weight — restate every size floor in RENDERED terms (WS-316).
  - Founder's framing, load-bearing on every tie-break: "I am the single source of
    persistent, non-human memory." Data integrity beats entry speed; rare events
    outrank common ones for capture priority.

  NEW INPUT 2026-07-31 — WS-317 CONFIRM-BEFORE-COMMIT (founder proposal). Must be
  designed WITH this artifact, not bolted on after: it interacts with the touch floor
  (WS-316), the pre-arm direction (HE-22) and the roster rail. Key points to carry:
    - The principle is FEEDBACK TIMING, not target size. Card-grid cells measure
      79x92 rendered px at device scale — they are ~2x the floor. The risk there is
      HOMOGENEITY (52 near-identical cells, confirmation arrives after the write).
    - The long-press vocabulary is ALREADY SPENT on "open a different control"
      (sizing editor, seat context menu, PotDisplay edit). Resolve the collision here.
    - Never on the primary action buttons: taxes HE-23, they are not confusable, and
      it would stack a confirmation on top of HE-22's pre-arm.
    - Tap must keep working (tap commits, hold magnifies). Cancellation is
      non-negotiable.

  NEW INPUT 2026-07-31 — ACTION/SIZING ENTRY EXPLORATION (founder concept):
  docs/design/explorations/action-entry-sizing.md. Founder proposed a funnel — tap Bet
  opens a slider snapping to common sizes, "wiggle" for precision around the node, one
  continuous gesture capturing progressive detail so a balk still records something.
  Measured budget: command column 313x500 rendered, preset row spans 288px of travel.
  Findings to carry into the artifact:
    - The gap is real: there is nothing between "one of four presets" (1 tap) and
      "open a keyboard" (3 taps + occlusion). Both keyboard-path controls are BELOW
      the touch floor (custom input 229x33, GO 45x33) — fix regardless of direction.
    - A plain linear slider breaks at large pots: 288px covers ~$12/px on a $2000 pot,
      i.e. +/-$60 at realistic finger precision. Progressive precision is a REQUIREMENT
      of the concept, not a refinement of it. The founder's instinct is arithmetically
      confirmed.
    - RECOMMENDED AMENDMENT: tap still commits (fast path untouched, protects HE-23);
      press-and-drag from a preset refines. Replace "wiggle" (a mode switch — no
      affordance, false-positives from tremor/jostle at a live table) with
      VELOCITY-ADAPTIVE GAIN: fast = coarse + snap, slow = fine. A wiggle IS a
      low-velocity movement, so this delivers what he described without a mode.
    - Early lift MUST commit the nearest snap node — never nothing (punishes the
      interruption the idea is designed for) and never the raw mid-drag value (silently
      records an arbitrary number). This is what makes it degrade gracefully into
      today's behaviour and satisfies glance-return-chris.
    - Learned presets (hero-scoped) are pre-arming applied to sizing. CAVEAT: presets
      record BOTH hero and villain actions; "my common sizes" is only correct for hero.
      A blended learned set would degrade both.
    - NOT on Fold/Call/Check (discrete, nothing to refine, taxes HE-23, collides with
      HE-22's pre-arm).

  SIZING-ENTRY AMENDMENT 2 (founder, 2026-07-31) — see exploration §10:
    - TAP-COMMITS RATIFIED. Long-press is only for precision. Settled, not open.
    - RATIO IS THE PRIMARY READOUT, dollars secondary. Rationale is a claim about human
      memory and it is correct: nobody remembers "$68", they remember "about two-thirds
      pot". The dollar figure is DERIVED from the ratio, not the other way round.
      SizingPresetsPanel.jsx:75-76 currently has this exactly backwards — amount at 20px,
      ratio label at 11px. The interface leads with the unit the user does not think in.
      The ratio unit must be CONTEXT-NATIVE: % pot postflop, x bb preflop open, x last
      raise for a 3-bet.
      DATA-QUALITY COROLLARY (the real prize): recording "~65% pot" faithfully is BETTER
      data than a confident-looking $137 that was a guess. A dollar-led UI invites false
      precision, and false precision in a read-building tracker is worse than coarse
      honesty because downstream models cannot distinguish the two.
      CONSIDERED AND REJECTED: an explicit confidence field on the sizing — captures the
      same information more expensively and adds a decision to every entry. Do not
      re-derive this at Gate 4.
    - OVERBETS: fixed TRAILING TAIL, not a mid-drag rescale. A rescale re-maps nodes under
      a moving finger and destroys the "node k is always at pixel k*96" property that is
      this design's best feature. The tail is compressed by construction, which is correct
      — overbets are rarer and remembered more coarsely, so precision follows frequency.
      Also rejected: a rolling window that slides nodes leftward; forfeits positional
      stability for the rare case in order to serve it.
    - ALL-IN IS A LATCH, NOT A SLIDER POSITION. The founder's own clause is the constraint:
      "that player has no more actions but others might" — a STATE consequence, not a
      magnitude one. The codebase already agrees: handleAllInSubmit records
      {allIn: true} as a FLAG (CommandStrip.jsx:581-596) and calculateSidePots depends on
      the flag, not on the amount being large. Place it past a deliberate dead gap at the
      track end so a fast drag cannot slide into it — all-in is the one sizing that cannot
      be corrected by a slightly different number later.
      STILL OPEN: an all-in CALL (short stack calls off for less) is a different case this
      track does not express; handleAllInSubmit already routes it via callAmount. Probably
      belongs on the Call control, not the sizing track.

  BLOCKED-ON-DATA INPUT: WS-318. The sizing defaults are hardcoded convention
  (potCalculator.js:456-459) and postflop collapses to ONE context
  (CommandStrip.jsx:509-515), so a flop c-bet, a turn probe and a river bluff share the
  same four buttons. WS-318 mines the pool distribution per street x line from the
  corpus. Until it reports, the non-linear track's NODE VALUES are guesses — and the
  entire argument for the non-linear track is that it spends pixels where the density
  actually is. Specify the track's mechanics now; leave the node values parameterised.

  CARRIED RISK: R7 timing unmeasured. Treat "the speed problem is postflop entry,
  player entry and legibility" as a stated assumption; validate before Gate 5.
  Project: .claude/projects/table-view-redesign-2026-07-31.md
