status_note: |
  Scored 33 — above WS-307's 31. It is the same failure family one level deeper: WS-307
  fixed a fold estimate that ignored the range, this fixes the equity that estimate is
  computed FROM. Every consumer of per-combo fold probability inherits it, so it also
  bounds how much any of the WS-307-adjacent numbers can be trusted.

  Founder framing worth preserving verbatim: "im skeptical that their entire range always
  sticks around, because that makes them price inflexible and we should be really sizing
  up with our value hands to exploit it." The scepticism was right, and the exploit
  instinct points at the gap noted at the end of the description.
