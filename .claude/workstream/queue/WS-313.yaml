description: |
  FOUNDER-ORIGINATED, then measured. Raised while reviewing WS-307: scepticism that any
  real range "cannot fold", and the observation that top set on QJT is not actually a
  comfortable hand — flush and straight completers are everywhere and it has only
  full-house outs. Both are correct, and the measurement below shows why.

  THE DEFECT. In `estimateFoldPct` (and the same shape in `comboActionProbabilities`),
  each villain combo's fold decision is priced from:

      const villainEq = 1 - combo.heroEquity;
      const eqRatio   = villainEq / potOdds;

  `combo.heroEquity` comes from `computeComboEquity(heroScore, vScore, heroCards,
  villainCards, board)` — hero's EXACT two cards against that EXACT villain combo. So
  `villainEq` is villain's equity against hero's actual holding. Villain is modelled as
  though they can see hero's hand. Every combo is then correctly told it is far ahead of
  3♠3♦, so nothing folds, and the aggregate fold estimate collapses to ~0.05.

  Villain does not know hero holds 33. Villain is choosing against hero's RAISING RANGE.

  MEASURED on QhJhTs (4,000 trials/hand). Hero raising range taken as
  AKs,AKo,QQ,JJ,TT,QJs,QJo,QTs,JTs,KQs,K9s,98s,AQs:

      hand          eq vs 3s3d (what the model uses)   eq vs raising range (reality)
      AA                      88.4%                              28.7%
      KK                      90.5%                              34.0%
      AQ (top pair)           88.2%                              19.9%
      QQ (top set)            94.8%                              56.5%
      TT (bottom set)         96.8%                              44.9%
      AK (nut straight)       93.6%                              71.3%

  CONSEQUENCES, in order of size:

  1. Roughly half that range SHOULD fold to a raise. AA/KK/AQ hold 20-34% against the
     range that actually raises here — they are near-drawing-dead to straights, sets and
     two pair. The model has them folding ~2%.
  2. The founder's read on top set is confirmed by the numbers: QQ is 56.5%, a genuine
     marginal continue with reverse implied odds, not the 94.8% lock the model sees.
     Bottom set is 44.9% — behind.
  3. So "a range that cannot fold" (the WS-307 framing, including its commit message and
     test names) is WRONG as a general claim. What is true is narrower: a range that
     cannot fold IF IT CAN SEE HERO'S HAND. That framing needs correcting wherever it
     was written down.
  4. WS-307's fix is still directionally right — it restored range-responsiveness and
     stopped RAISE being misfiled as FOLD — but the MAGNITUDE it produces (0.050 on the
     reported spot) is not trustworthy, because the equity feeding it is clairvoyant.

  DO NOT "FIX" THIS BY RAISING THE FLOOR. The number is wrong because its INPUT is
  wrong. Clamping the output to look plausible would hide the defect and re-create the
  WS-307 family (a number chosen to look right rather than derived from game state).

  SECOND-ORDER, MUST BE HANDLED TOGETHER. If AA/KK/AQ start folding, the CONTINUING
  range is sets and straights only — so hero's equity-when-called DROPS. The called
  branch must be recomputed against the continuing subset, not the full range, or the
  fix will make raises look better rather than worse. `computeEquityThresholdEquity`
  already exists for this shape.

  THE EXPLOIT THE FOUNDER NAMED, which the engine currently cannot express. If a villain
  genuinely does not fold, the counter is to SIZE UP with value, not to bluff — the
  codebase's own doctrine already says this ("DO NOT conflate calling station with cannot
  have strong hands ... value bet wider AND bigger, NOT bluff more", exploitEngine/
  CLAUDE.md). Today a low fold estimate only suppresses hero's bluffs; nothing routes it
  into wider/larger value sizing. Worth checking whether that is a separate gap.

  ── SCAN RESULTS (founder asked for a sweep of the same family) ───────────────

  THE LEAK IS NOT CONFINED TO THE FOLD ESTIMATE. Every per-combo villain action
  filter prices off `1 - combo.heroEquity`:

    gameTreeEquity.comboCallFilter      (:354)  villain's CALL probability
    gameTreeEquity.comboBetFilter       (:378)  villain's BET probability
    gameTreeEquity.comboCheckBackFilter (:388)  derived from comboBetFilter
    foldEquityCalculator.estimateFoldPct        villain's FOLD probability
    gameTreeDepth2.comboActionProbabilities     all three at depth 2/3

  These feed eqVsCallRange / eqVsBetRange / eqVsCheckBackRange, so the clairvoyance
  also biases WHICH combos are assumed to continue — and therefore hero's
  equity-when-called, everywhere, not just fold equity.

  THE INVARIANCE TEST THAT PROVES IT. Villain cannot see hero's cards, so villain's
  fold rate must be INVARIANT to hero's holding when villain's range and the board
  are fixed. Measured on QhJhTs, villain range identical in every row, only hero's
  hole cards changing:

      hero holds            model says villain folds to a raise
      33  (bottom pair)                 0.050
      97o (air)                         0.053
      QQ  (top set)                     0.619
      AK  (nut straight)                0.852

  A 17x swing driven entirely by cards villain cannot see. Against a wide villain
  range the same test gives 0.202 (hero 33) vs 0.912 (hero QQ).

  THE BIAS RUNS BACKWARDS FROM STRATEGY — this is the important part.
    hero weak   -> `1 - heroEquity` high for every combo -> villain "never folds"
                -> fold equity ~0 -> bluffs suppressed
    hero strong -> `1 - heroEquity` low for every combo  -> villain "folds a lot"
                -> fold equity inflated exactly where hero WANTS CALLS

  CONFIRMED LIVE ON THE VALUE SIDE. advisorAccuracy Scenario 1 (nut flush AsKs on
  Qs7s2s, hero equity 0.983) — the engine ranks CHECK (EV 112.0) ABOVE BET (EV 95.7).
  Cause measured directly: foldPct.bet = 0.950. The model believes betting the nut
  flush folds villain out 95% of the time, so checking to keep them in scores higher.
  The engine is recommending you do not bet the nuts because they will fold.

  That is the exact inverse of the founder's read — "if i know someone won't fold ...
  we should be really sizing up with our value hands" — and it is structural, not a
  tuning error. It also reaches SIZING: findOptimalBetSize takes foldPct as its base
  and scales it by the fold curve, so an inflated fold rate on strong hands steers
  sizing toward maximising folds rather than maximising called value.

  Scenario 1 has been logging this as a console.warn on every run while passing green
  — the second instance of the enforce-nothing diagnostic named in exploitEngine/
  CLAUDE.md (WS-307 converted the first, Scenario 3). It is deliberately NOT converted
  to an assertion yet because it would fail until this item lands; converting it is an
  accept criterion below.

  ── PERF BLOCKER RESOLVED (session 2) ────────────────────────────────────────

  The cost was never in the equity maths. `sampleCombos` ranked hero's range using
  `comboStrengthPercentile`, and that function RE-ENUMERATES EVERY LEGAL COMBO ON THE
  BOARD on each call — so ordering a ~200-combo hero range cost ~200 x 1081 hand
  evaluations, dwarfing everything else. Percentile is a monotone transform of raw made-
  hand score, and only the ORDER is load-bearing, so sorting by score gives the identical
  sample for one evaluation per combo.

      villain range        OFF        ON (before)     ON (after)
      tight (49 combos)     28 ms         506 ms          30 ms
      full  (1081 combos)  431 ms        4653 ms         417 ms

  155x on the wide case; the range-conditioned path now costs about what the clairvoyant
  one did. Fold estimate unchanged (0.326 vs 0.343/0.336 across runs — MC noise).
  Guarded by a RATIO assertion in heroPerceivedRange.test.js (machine-independent), which
  exists to catch a return to the 12x regime rather than police variance.

  TWO OPTIMISATIONS TRIED AND REJECTED ON ACCURACY, recorded so they are not retried:
    - Coarsening the memo key to the 5-way strength bucket moved the fold estimate
      0.343 -> 0.489, a 43% error. Buying speed by making the number wrong is the exact
      WS-307 family this item exists to fix.
    - Cutting runout samples 32 -> 8 barely moved the total, because the cost was not in
      the sampling. Kept anyway (DECISION_EQUITY_SAMPLES) since decision equity feeds a
      bounded logistic and is averaged over K hero combos, but it was not the fix.
  Also landed: runouts and hero scores hoisted to the distribution level so they are
  computed once rather than per villain combo, and memoization of equity-vs-range by
  exact made-hand score plus a redraw signature.

  `sampleCombos` now lives in pokerCore/rangeSampling.js and heroPolicy.mjs re-exports it,
  so the harness and the live engine cannot diverge on which hands represent a range.

  ── IMPLEMENTATION STATUS (SPR-162, session 1 of ~3) ─────────────────────────

  MECHANISM BUILT AND PROVEN, SHIPPED DARK. Flag `RANGE_CONDITIONED_VILLAIN_DECISIONS`
  in engineFlags.js, default OFF, overridable per call so the delta harness can score
  both arms in one process. Flag-off is a verified no-op (2648 exploitEngine tests
  unchanged).

  Invariance restored — villain range and board identical, only hero's cards changing:
      OFF: 0.050 / 0.628 / 0.867  = 17.3x swing   (the defect)
      ON:  0.379 / 0.352 / 0.482  =  1.4x swing   (card removal only)
  Hero's own equity still computed from hero's real cards (0.053 / 0.584 / 0.714), so
  the rule holds: hero's EV math sees hero's hand, villain's decision model does not.

  The ON level lands between the two known-wrong anchors (0.4291 range-blind, 0.0500
  clairvoyant) and is DERIVED, not tuned. Pinned by heroPerceivedRange.test.js (7 tests),
  which drives the flag explicitly so it keeps testing intent after the default flips.

  ── TWO THINGS FOUND DURING IMPLEMENTATION, BOTH STILL OPEN ──────────────────

  1. PER-ACTION NARROWING IS REQUIRED FOR CORRECTNESS, and is not yet wired.
     Hero's range must be narrowed by the action being EVALUATED. Measured:
        hero range unnarrowed (open):       fold 0.093
        hero range narrowed by 'raise':     fold 0.379
     Both are "invariant" and only the second is right — villain folds to a RAISING
     range, not to hero's whole opening range. So `foldPct.bet` and `foldPct.raise`
     need different hero range samples, which today's single per-context sample cannot
     express. Naively building both doubles an already-blocked cost (see 2).

  2. PERF EXCEEDS BUDGET AND BLOCKS THE DEFAULT FLIP. Measured, 5-run average:
        villain range          OFF        ON
        tight (49 combos)      31 ms      506 ms
        full range            377 ms    4653 ms
     Budget is 150 ms for the WHOLE evaluation (gameTreeEvaluator timeBudgetMs). ON is
     3.4x over on a tight range and 31x over on a full one. Note OFF is already over
     budget at full width (377 ms) — consistent with WS-301, which measures the same
     engine at 8.5 s for one depth-2 call.

     Cause is structural, not incidental: cost is K samples x villain combos rollouts,
     so it scales with villain range width. Lowering K trades accuracy linearly and does
     not fix the scaling.

     PROPOSED FIX, NOT YET IMPLEMENTED — stratify by villain hand strength instead of
     per combo. Equity-vs-hero-range is a smooth function of board-relative strength, so
     compute it once per strength stratum (~10-20 strata) and assign combos by lookup.
     Cost becomes K x strata, INDEPENDENT of villain range width. The machinery already
     exists: `comboStrengthPercentile` and `computeBoardStrengthTable` are both already
     computed in this path. Needs a stated approximation error, measured against the
     per-combo result, before it can be trusted.

  DEPTH-2 NOT YET ROUTED. `comboActionProbabilities` accepts the new `villainDecisionEq`
  parameter and falls back cleanly, but gameTreeDepth2's own per-combo loop still computes
  its equity against hero's exact cards on the next-street board. Deliberately left until
  the perf shape above is settled — depth-2 is the hot loop and is already the subject of
  WS-301.

  ── PER-ACTION NARROWING LANDED (session 2) ──────────────────────────────────

  Villain now responds to the ACTION, not just to hero. gameTreeContext builds one hero
  range per candidate action ('bet' / 'raise' / 'check'), all sharing ONE runout set, so
  the extra actions cost almost nothing. Measured on QhJhTs, villain range and board
  fixed, only hero's cards changing:

      hero            foldBet   foldRaise
      33 bottom pair   0.103      0.318
      QQ top set       0.078      0.317
      AK straight      0.113      0.458

  Both estimates invariant to hero's cards (spread 0.04 and 0.14 against a pre-fix 0.817),
  and foldRaise is ~3x foldBet — villain folds far more to a raise because hero's raising
  range is much stronger. Before this, both numbers came from ONE sample and were nearly
  identical, which is why the earlier measurement showed 0.093 unnarrowed vs 0.379 narrowed.

  WS-307 spot with the flag on: FOLD still ranks first (correct), and the raise improves
  from -113.5 to -17.6 — it should, because there IS real fold equity against a raising
  range. It stays negative, so the original defect does not return.

  ── THE NUT-FLUSH CRITERION NEEDS FOUNDER JUDGEMENT, NOT A CODE FIX ──────────

  The clairvoyance IS fixed there: foldPct.bet drops 0.950 -> 0.714 and is now invariant
  to hero's holding. But CHECK (111.1) still outranks BET (78.7) on Qs7s2s, so the accept
  criterion as written is NOT met, and it should not be forced.

  The reason changed, and the new one may be legitimate. On a MONOTONE board hero's
  perceived betting range is genuinely strong — `narrowByBoard` keeps only 44% of hero's
  range mass when hero bets — so villain folding ~71% is a defensible estimate, and
  against a range that folds that often, checking to induce can beat betting. Several
  strong players do check the nut flush on a monotone board for exactly this reason.

  BUT THERE IS A REAL MODELLING GAP BEHIND IT, and it should be settled before the
  criterion is either met or dropped. `narrowByBoard` was built to INFER a villain's
  strength from an action they took; it shifts weight toward strong hands. Used to
  CONSTRUCT hero's betting range it therefore produces a range with no bluffs, so villain
  is told to fold more than a balanced bettor deserves. A hero betting range on a
  monotone board should contain semi-bluffs and air; this one does not.

  Two candidate resolutions, founder's call:
    (a) Give hero's perceived betting range a bluff component (a balanced construction
        rather than a strength-narrowed one). Most correct, and it would likely restore
        BET above CHECK on its own.
    (b) Accept check-to-induce as the right answer here and rewrite the criterion, on the
        grounds that a 71% folding range genuinely does make betting the nuts worse than
        inducing. Requires being satisfied that 0.714 is a good estimate, which (a) says
        it is not.
  Also unverified either way: whether the check branch prices the board-pairing risk — a
  set filling up beats the nut flush, which argues against checking.

  ── BLUFF COMPONENT LANDED (session 3, founder-approved) ─────────────────────

  Hero's aggressive ranges now carry a bluff tail. Share is not a taste parameter — §6.1
  fixes it at alpha = f/(1+f), so a three-quarter-pot bet is 0.43 bluffs. Measured 0.40
  against that target on Qs7s2s.

  Candidates are weak-at-showdown hands weighted by NUT-blocking, per the founder's
  framing: holding the ace of the flush suit removes the nut flush from villain's range,
  so hero can credibly represent it and villain is left with weaker suited holdings.

  Effect on the nut-flush spot: foldPct.bet 0.950 (clairvoyant) -> 0.714 (range-conditioned,
  no bluffs) -> 0.384 (with the bluff tail). Villain now folds a plausible amount to hero's
  betting range instead of over-folding against a pure-value construction.

  TWO IMPLEMENTATION ERRORS FOUND AND FIXED WHILE BUILDING IT, both worth remembering:
    - `rangeIndex` takes RANKS and a suited flag, not encoded cards. Passing cards put
      the bluff weight on arbitrary grid cells. (rank = card >> 2, suit = card & 3.)
    - Blocker weight must come from the 'nuts' bucket ONLY and be weighted by how many
      nut combos a card appears in. Including 'very-strong' made every card of the suit a
      "blocker" on a monotone board, so 9s6h scored like As2h.
    - Aggregation must AVERAGE per combo, not sum: an offsuit cell holds 12 combos and a
      suited cell 4, so summing handed the tail to offsuit junk on combo count alone.

  ── SCENARIO 1 IS NOT BLOCKED HERE — SEE WS-314 ──────────────────────────────

  With the fold estimate corrected, BET still loses to CHECK, and the cause is now
  isolated and is NOT in this item. Branch breakdown with the nut flush (equity 0.983):

      flag OFF   fold(pct=0.90 ev=100.0)  call(pct=0.07 ev=74.5)  raise(pct=0.03 ev=-1.3)
      flag ON    fold(pct=0.45 ev=100.0)  call(pct=0.40 ev=71.9)  raise(pct=0.15 ev= 5.3)

  The CALL branch is ~72-75 in BOTH arms — pre-existing, untouched by this work. It should
  be ~170: hero holds a hand that beats every calling hand, so being called must be worth
  more than the 100 hero collects when villain folds. Betting only looked healthy before
  because a fake 0.90 fold rate contributed 90 of its 95.6; correcting the fold estimate
  removed the prop and exposed the defect underneath.

  Filed as WS-314 (P0, scored 32) and marked `enables: WS-313` — the Scenario 1 accept
  criterion cannot be met until the called branch is priced correctly, and forcing it from
  this side would mean tuning the fold estimate to compensate for a different bug.

  Also filed WS-315 from the founder's line-planning framing (hero's range decomposes into
  LINES — check-call / check-raise / bet-3bet-fold — not single actions), blocked on both
  this item and WS-314.

accept_criteria: |
  - Villain's fold/call/raise decision is priced against hero's PERCEIVED range, not
    hero's actual cards. Where hero's range is unavailable, the substitute must be
    stated and defensible — not silently hero's real hand.
  - On the QJT spot: AA/KK/AQ show materially non-trivial fold probability while
    AK/QQ stay near zero. Per-combo, not just in aggregate.
  - Hero's equity-when-called is computed against the CONTINUING range, so the fold
    fix cannot inflate raise EV.
  - Aggregate fold estimate for the WS-307 spot lands between the two known-wrong
    anchors (0.4291 pre-WS-307, range-blind; 0.0500 post-WS-307, clairvoyant), with
    the value DERIVED, not tuned to sit in the middle.
  - WS-307's "a range that cannot fold" language is corrected in
    rangeConditionedFoldEquity.test.js and anywhere else it was asserted.
  - Villain's fold rate is INVARIANT to hero's hole cards when villain's range and
    board are held fixed — asserted by test. This is the cleanest single guarantee
    and it is what the 17x swing above violates. Small residual variation from card
    removal is expected and acceptable; a 17x swing is not.
  - The same fix is applied to comboCallFilter / comboBetFilter / comboCheckBackFilter
    and comboActionProbabilities, not only to estimateFoldPct — otherwise
    equity-when-called stays clairvoyant while fold equity is corrected.
  - MOVED TO WS-314. advisorAccuracy Scenario 1 ranking BET above CHECK is blocked by a
    pre-existing called-branch mispricing (call branch 72 where it should be ~170),
    measured identical in both arms of this item's flag. It cannot be satisfied from the
    fold-estimate side without tuning one bug to hide another.
  - Sizing check: with a strong hand, optimal sizing is driven by called-value, not by
    an inflated fold rate. Record a before/after sizing for one value spot.
  - Behavioural test that fails against the current engine.
  - FIND-029 guard still holds: a genuine over-folder still yields a +EV bluff-raise.
