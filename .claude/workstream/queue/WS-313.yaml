status_note: |
  UNBLOCKED 2026-07-31 — WS-312 (Gate 3) complete, Gate 2 re-run returned GREEN.

  BINDING INPUTS FROM GATE 3:
  - Design against `glance-return-chris`'s surface contract (positional stability
    within a street; change only at witnessed moments; settled on return).
  - Serve HE-22 (accept/override a proposal), HE-23 (orbit as unit of success),
    PM-16 (roster maintenance as a continuous job).
  - `ringmaster-in-hand` is REFUTED for the founder — do NOT cite it.
  - H-PLT02 one-handed reachability is NOT binding (founder uses two hands). Rail
    placement is free of the handedness argument, but target SIZE now carries all the
    accuracy weight — restate every size floor in RENDERED terms (WS-316).
  - Founder's framing, load-bearing on every tie-break: "I am the single source of
    persistent, non-human memory." Data integrity beats entry speed; rare events
    outrank common ones for capture priority.

  NEW INPUT 2026-07-31 — WS-317 CONFIRM-BEFORE-COMMIT (founder proposal). Must be
  designed WITH this artifact, not bolted on after: it interacts with the touch floor
  (WS-316), the pre-arm direction (HE-22) and the roster rail. Key points to carry:
    - The principle is FEEDBACK TIMING, not target size. Card-grid cells measure
      79x92 rendered px at device scale — they are ~2x the floor. The risk there is
      HOMOGENEITY (52 near-identical cells, confirmation arrives after the write).
    - The long-press vocabulary is ALREADY SPENT on "open a different control"
      (sizing editor, seat context menu, PotDisplay edit). Resolve the collision here.
    - Never on the primary action buttons: taxes HE-23, they are not confusable, and
      it would stack a confirmation on top of HE-22's pre-arm.
    - Tap must keep working (tap commits, hold magnifies). Cancellation is
      non-negotiable.

  CARRIED RISK: R7 timing unmeasured. Treat "the speed problem is postflop entry,
  player entry and legibility" as a stated assumption; validate before Gate 5.
  Project: .claude/projects/table-view-redesign-2026-07-31.md
