status_note: |
  Filed 2026-08-05 out of WS-284's closeout. WS-284's commit message names this residual
  explicitly: "The value dies one step later ... Style is the only route those six scalars
  have into buildVillainDecisionModel, so the scored distribution could not move no matter
  what the prior said." WS-284 fixed the harness and left the engine, on the stated ground
  that an engine behaviour change needs its own measurement rather than riding along in a
  backtest fix. That was the right split; this ticket owns the half that was left.

  Premise re-verified against HEAD before filing: `tendencyCalculations.js:287` (classifyStyle
  on raw vpip/pfr/af), `:308-364` (derivePercentages returning point estimates plus an
  additive `intervals`), and `analysisPipeline.js:87-88` running the pair on the production
  path.
