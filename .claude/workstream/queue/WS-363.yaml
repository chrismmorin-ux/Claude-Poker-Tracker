decision_flags:
  - |
    OPEN — WHERE the shrunk value should live. Two shapes, not equivalent. (a) `classifyStyle`
    reads shrunk rates: smallest diff, but it silently changes what every existing style
    consumer means, and `af` has no interval today so it would shrink on a different basis
    than the other five. (b) The six scalars reach `buildVillainDecisionModel` directly rather
    than through the style bottleneck: larger change, but it removes the bottleneck that made
    this bug possible — six numbers collapsing into one label before they reach the model is
    itself the mechanism. Choose deliberately; (a) is a patch on (b)'s cause.
  - |
    OPEN — should the raw point estimate remain available? Display surfaces that show "VPIP
    31% (13 hands)" are reporting an OBSERVATION and should probably keep reporting the raw
    count, while the MODEL should read the belief. If both are kept, they must be named so
    they cannot be confused at a call site — the failure here was exactly that two different
    quantities shared one field name's neighbourhood.
