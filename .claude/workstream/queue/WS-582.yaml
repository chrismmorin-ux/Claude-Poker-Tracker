status_note: |
  The most blocked item of the eight, deliberately. It depends on relational coordinates (WS-576,
  or the funnel is unexpressible), the pulse (WS-577, or there is no rate to multiply lift by),
  sizing (WS-578, or the environment cannot step), the hand-conditional policy (WS-580, or every
  villain plays every holding identically), and the rank test (WS-581, or the premise is untested).

  Running it earlier than that produces a confident number from a simulator that cannot represent
  the effect being searched for — which is worse than not running it, because the null would be
  believed.
