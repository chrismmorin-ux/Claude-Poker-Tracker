decision_flags:
  - "Is this analysis-only or a live surface? A live path needs it fast enough for the table; an analysis primitive can be slow. The answer changes the implementation, so measure the cost before choosing."
  - "What is ε for the neutral zone — an absolute bb threshold, or a fraction of the pot? Pot-relative is more transportable across stack depths; absolute is easier to explain. This is a product decision about what 'close enough to indifferent' means."
