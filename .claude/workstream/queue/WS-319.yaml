decision_flags:
  - "Option (b) ends the single-uniform-canvas model that every view in this app currently shares (ShowdownView, HandReplayView and the drills all use ScaledContainer). Decide whether the geometry change is TableView-only or app-wide. TableView-only is cheaper but creates two layout idioms in one product — which is the kind of drift sidebar-shell-spec.md exists to prevent."
  - "If (b) is chosen, WS-311 should be closed BY this work rather than fixed separately — fixing it first would be work done twice."
