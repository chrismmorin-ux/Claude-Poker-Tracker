status_note: |
  Blocked by WS-578 because a conditional over actions with no sizes cannot produce a playable
  policy — the environment still could not step even with a perfect hand-conditional action mix.

  POKER_THEORY 15.1 names `comboStrengthPercentile` as the canonical strength axis and it is
  board-conditional and comparable across boards, which makes it the obvious candidate for the
  holding class. The decision flag stands because the made-hand and draw dimensions are separate
  by founder ruling and a single percentile ladder has to lie about one of them.
