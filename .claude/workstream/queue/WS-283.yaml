description: |
  MEASURED, THREE INDEPENDENT WAYS, SAME SIGN AND MAGNITUDE. The engine thinks
  villains fold to bets less often than they actually do.

    - WS-262 corpus mining (2026-07-25): STAT_PRIORS foldToCbet low by 5-10pp.
    - WS-273 smoke backtest (2026-07-26): -5 to -10pp across four of five SPR
      zones, 331 applicable nodes.
    - WS-273 POOL-reference run (2026-07-26): -13.3pp on 2,073 nodes at the
      33-66% sizing bucket. 45.43 bb/100 hands of regret.
      (docs/research/engine-backtest-run-2026-07-26-pool-reference.md)

  THE ERROR IS NOT A FLAT OFFSET. The same run shows the sign FLIPPING by bet
  size:

    bet|0-33     n=1022   predicted 45.5%   actual 41.5%   +4.0pp  (over-estimates)
    bet|33-66    n=2073   predicted 44.7%   actual 58.0%  -13.3pp  (under-estimates)
    bet|66-100   n=26     predicted 48.7%   actual 84.6%  -36.0pp  (thin)

  A base-rate correction cannot fix a sign flip. The model predicts a nearly
  FLAT ~45% fold rate across every sizing bucket while the population's actual
  fold rate climbs steeply with size (41.5% -> 58.0% -> 84.6%). That is a
  FOLD CURVE defect: `logisticFoldResponse`'s maxDelta is too small and/or its
  midpoint sits wrong, so bet sizing barely moves the predicted fold rate.

  CONSEQUENCE, DIRECTIONAL. Under-estimating folds means under-estimating fold
  equity, which means the engine under-bluffs and under-sizes exactly where
  bigger bets would print. The regret is realised when the error flips the
  bluff/no-bluff decision across breakeven (POKER_THEORY 6.3).

  RELATED. WS-263 imported the HandHQ Reference tier; the same corpus run showed
  overall lift DROPPING 2.9% -> 1.7% once that tier was enabled, though that
  comparison is confounded with a 10x sample increase. De-confounding it is a
  cheap prerequisite (one ~8-minute run) and may implicate the reference import
  rather than the curve.
accept_criteria: |
  - Root cause distinguished by evidence: fold-curve shape (maxDelta / midpoint /
    steepness) vs base rate vs Reference-tier import. Not assumed.
  - The de-confounding run (`--reference none` on the same 1,756-file corpus)
    completed and reported before any parameter is changed.
  - Fold curve refit against the corpus per sizing bucket; predicted fold rate
    must track the observed 41.5 / 58.0 / 84.6 gradient rather than staying flat.
  - Re-run WS-273: the bet|33-66 error closes materially and OVERALL lift does
    not regress. Both numbers reported, not just the favourable one.
  - Any parameter change carries its measured before/after, per the
    validation-as-quality-signal rule.
  - POKER_THEORY 11.1 (personalized fold-curve hierarchy) updated if the fitted
    shape changes.
