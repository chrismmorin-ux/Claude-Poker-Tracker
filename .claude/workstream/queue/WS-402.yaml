id: "WS-402"
title: "Facing aggression the engine raises 91.9% of the time against a pool that raises 12.5% and a hero who raised 10.5% — a 79-point over-raise that depth-2 closes only 8 points of, so it lives in depth-1 valuation, and it is what collapses importance weights to a 15% ESS and makes every arm comparison read a seventh of its own sample"
