status_note: |
  PREMISES RE-VERIFIED AGAINST HEAD (fe716f59) BY READING THE CODE AND RECOMPUTING THE DATA, NOT BY
  TRUSTING THE AUDIT NOTE.

  Code, read in place:
    - `gameTreeEvaluator.js:705` — `callBranchEV = eqVsCallRange * (potAfterCall - rakeOnBetCall) * realization - heroInvestment`.
    - `:719` — `let ev = pFold * foldEV + pCall * callBranchEV + pRaise * raiseBranchEV`.
    - `:865` — `buildHeroActions(...)`; `:899` — `const timeBudgetMs = refinementBudgetMs`. The
      candidate set is therefore constructed 34 lines BEFORE the budget is read, which is the
      mechanical proof that both arms consider the identical candidate set and that no hero action
      is ever missing at depth-1. Every gap between the arms is VALUATION, not GENERATION.
    - `heroActionBuilder.js:257` — the `check-raise` candidate is pushed unconditionally of depth.
    - `ipsEstimator.mjs:76-94` — `weightFor` is `pi_ours(observed) / pi_pool(observed)`, capped at
      `DEFAULT_WEIGHT_CAP = 20` (`:58`); `:134` — `clusterBootstrapCI` resamples PLAYERS.

  Data, recomputed from `out/depth-ablation.json` (570 KB, 2026-08-05 03:36, 260 decisions carrying
  `piOursByArm` for both arms) with a standalone reimplementation of `weightFor` / `wisValue` /
  `pairedDelta`, which reproduces the shipped `report` block exactly where they overlap (ALL delta
  -0.4711, ALL depth-1 ESS 39.5) — so the recomputation is validated against the run's own output:
    - facing-aggression n=86 (`facingAction` bet=78 plus raise=8); all four rows in the table above
      are mine, and the depth-1 row reproduces the audit's figures exactly.
    - Per-street ESS and paired deltas as tabulated.
    - `run.runtimeMs` 6,219,107 / 260 = 23.9 s per decision.
    - `report.admissibility`: 22 clusters, `minClustersForCI` 30, `absoluteArmsQuotable` false.

  ONE PREMISE FROM THE AUDIT NOTE DID NOT VERIFY AND IS CORRECTED ABOVE. The note stated "depth-2
  moves the raise frequency by 0.7 points". The measured move is 8.2 points (91.9% to 83.7% on
  n=86; 9.0 points on the bet-only n=78 subset; 2.7 points across all 260 decisions). I could not
  reproduce 0.7 under any slicing tried. The correction does not change the ticket's direction —
  depth-2 closes roughly a tenth of a 79-point gap, so the defect is still overwhelmingly in
  depth-1 — but it does mean depth-2 is measurably helping here, which is one more reason the
  founder's ruling is the right one and one less reason to reach for the depth knob.
