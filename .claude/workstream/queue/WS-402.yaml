decision_flags:
  - |
    OPEN — WHAT IS THE RIGHT TARGET FOR THE RAISE SHARE, GIVEN THAT MATCHING THE POOL IS EXPLICITLY
    WRONG? An exploitative engine is supposed to deviate from population frequencies; that is its
    entire purpose. So "91.9% is broken" is obvious but "X% is correct" is not derivable from the
    pool row alone. The options are (a) anchor to the pool's own best-response frequency — what a
    maximally exploitative strategy against THIS pool's measured fold curve would raise at, which
    `out/fold-vs-sizing.json` can now answer; or (b) leave the frequency free and gate only on the
    EV delta, accepting whatever share falls out. (a) gives a falsifiable target and risks anchoring
    to a fold curve that is itself estimated; (b) is cleaner in principle but leaves nothing to
    assert in a regression test, which is how this defect survived unnoticed in the first place.
    RECOMMENDATION: (a), with the derived target recorded as data next to the assertion, so that a
    later correction to the fold curve moves the target visibly rather than silently.
