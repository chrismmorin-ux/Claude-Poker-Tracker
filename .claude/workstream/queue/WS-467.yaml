description: |
  The replay/hindsight coach (handAnalysis/) uses its own copy of the pot-odds formula — correct
  only by accident of an undocumented pot convention — and ignores rake entirely, while the live
  engine rakes every showdown branch. The same real decision can be graded "should have called" in
  review and "fold was right" live; at 1/2-1/3 rake is a material share of small pots. Route
  heroAnalysis.js/hindsightAnalysis.js through villainRequiredEquity; thread resolved rakeConfig
  into computeCallEV and the hindsight path; add handAnalysis/ to the seam gate ROOTS; build a
  live-vs-replay agreement harness (facilitator S3): scripted (pot, bet, equity, rakeConfig) grid
  plus a replay of stored hands through both paths, reporting verdict flips and mean EV gap.
accept_criteria: |
  - A real borderline called hand shows the SAME verdict in replay and via the live advisor under
    the same rake setting, and the replay screen states which rake it used.
  - The test suite contains a live-vs-replay agreement check that fails if the two paths ever
    diverge on the scripted grid.
  - The U-4 measurement is reported once: verdict-flip count and mean EV gap at 1/2 and 1/3 rake
    over the stored-hand replay.
