status_note: |
  PREMISES RE-VERIFIED AGAINST HEAD (fe716f59).

    - `heroPolicy.mjs:83-93` — `toPrimitive`, with `case 'check-raise': return PRIMITIVE_ACTIONS.CHECK;`
      at `:85`; the justifying comment at `:78-82`, quoted verbatim in the description because it is
      the reason this is a vocabulary problem and not a bug.
    - `ipsEstimator.mjs:76-94` — `weightFor` divides `pi_ours(observedAction)` by
      `pi_pool(observedAction)`, so a change confined to a collapsed pair cannot move the weight.
    - `depthAblationReport.mjs:251-252` — `discordant` counts rows where `Math.abs(r.wA - r.wB) > 1e-12`,
      i.e. it counts WEIGHT differences, which is why a collapsed flip cannot enter it.
    - `out/depth-ablation.json` `report.divergence`, read directly: `n` 260, `topActionFlips` 40,
      `flipPairs` = { bet->check 30, raise->call 2, raise->fold 6, fold->call 1, call->fold 1 } —
      no pair involving check-raise, as the mechanism predicts. `report.delta.discordantN` 95.
    - `gameTreeEvaluator.js:1679` — the `checkRaiseDepth2` gate; `gameTreeDepth2.js:873` —
      `computeRaiseResponseDepth2EV`; `heroActionBuilder.js:257` — the `check-raise` candidate is
      built, unconditionally of depth.
    - MEASURED ON HEAD, not inferred: a temporary probe (created, run, deleted) on a full-range OOP
      flop check node showed `checkRaiseDepth2` in `ranStages` with `weightConsumed = 1` at a 30000 ms
      budget, and `blockedBy: ['budget']` at 2000 and 8000 ms. The stage works; it is only ever
      dropped for time, and when it runs its effect is invisible to the scorer.

  TWO FALSIFIED HYPOTHESES RECORDED SO A FUTURE SESSION DOES NOT RE-DERIVE THEM. Depth-1 does not
  lack the check-raise action — it is built at `heroActionBuilder.js:257` and fully valued in both
  arms, because the candidate set is constructed at `gameTreeEvaluator.js:865`, 34 lines before
  `refinementBudgetMs` is first read at `:899`. And depth-1 does not overfold; it under-folds by
  48.8 points (see WS-402). Every gap between the arms is VALUATION, never GENERATION.

  PROGRAM-CAP HAZARD, RECORDED BECAUSE IT WILL SUPPRESS THIS ITEM. `methodology-integrity` declares
  `max_open_items: 3` with `priority_floor: 18` (`prog-methodology-integrity.yaml:200-201`) and was
  already at 11 open items before this cluster was filed; adding this item and WS-406 takes it to 13,
  a 4.33x breach. Per the standing behaviour a program over its cap has its whole backlog floored to
  `priority_floor`, so this item's P1 score of 26.0 will be read as 18 by `/next` and it will not
  compose. That is a pre-existing condition, not one this ticket created, and the fix is a cap
  decision rather than a re-filing — this item's subject is the SCORING vocabulary, not poker domain
  correctness, and moving it to `domain-correctness` (60-item cap, not breached) to dodge the floor
  would put it under a program whose problem classes do not describe it. Flagged for the founder.
