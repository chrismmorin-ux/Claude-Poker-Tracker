id: "WS-405"
title: "Check-raise is the one capability the founder named that the scoring vocabulary cannot price at all — mapping it to CHECK is correct, and the consequence is that a check-raise flip never moves the argmax, never moves the IPS weight, and contributes exactly zero to every paired delta ever computed"
