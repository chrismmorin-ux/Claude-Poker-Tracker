finding_id: ""
description: |
  THIS IS A DESIGN ITEM. It states the problem and the options with their costs. It does not pick,
  because the choice changes what a scored decision MEANS, and that is the founder's to settle.

  THE MAPPING, AND WHY IT IS RIGHT. `heroPolicy.mjs:85` maps `check-raise` to
  `PRIMITIVE_ACTIONS.CHECK`. The comment above it (`:79-81`) gives the correct reason, verbatim:
  "`check-raise` is the one that matters: it is a plan, not an immediate action, and the action
  taken right now is a check. Recording it as a raise would compare our advice against an action the
  hand history could not contain." That is not a defect and this ticket does not propose reversing
  it. A hand history records what happened at this decision node, and what happens at this node is a
  check.

  THE CONSEQUENCE, WHICH IS A DEFECT. The estimator's weight is
  `pi_ours(observed) / pi_pool(observed)` (`ipsEstimator.mjs:76-94`). If the engine's top action
  flips from `check` to `check-raise`, `toPrimitive` collapses both to `CHECK`, `pi_ours(observed)`
  is unchanged, the weight is unchanged, the paired delta contribution is exactly zero, and the
  divergence census records no flip. So:
    - `report.divergence.topActionFlips` (40 of 260, with `flipPairs` bet->check 30, raise->call 2,
      raise->fold 6, fold->call 1, call->fold 1) CANNOT contain a check-raise flip by construction.
    - `pairedDelta`'s `discordantN` (95 of 260) CANNOT count one either, since `wA` and `wB` are
      computed from the collapsed distribution.
    - The `checkRaiseDepth2` stage exists (`gameTreeEvaluator.js:1679`), is implemented
      (`computeRaiseResponseDepth2EV`, `gameTreeDepth2.js:873`), and — measured on HEAD — runs on a
      flop check node at 30000 ms with `weightConsumed = 1`. It is fully functional and completely
      unpriceable.

  THE ASYMMETRY THAT MAKES THIS URGENT RATHER THAN TIDY. Everything the engine does to make hero
  MORE aggressive at a check node is invisible to the instrument, while everything it does to make
  hero LESS aggressive shows up as a `bet -> check` flip and is scored. 30 of the 40 measured flips
  are `bet -> check`. We are measuring the passivity-increasing half of depth-2's behaviour and
  blind to the aggression-increasing half. Any conclusion of the form "depth-2 makes hero more
  passive" is therefore partly an artefact of the vocabulary, and that conclusion has already been
  drawn once (the WS-378 34-of-34 passive bias, since fixed for a different reason).

  THE OPTIONS, WITH THEIR COSTS.

  A. PLAN-CONDITIONED PRIMITIVES. Keep `toPrimitive` mapping to CHECK for the propensity ratio, but
     carry the PLAN as a second field on the decision record, and compute a second delta over
     (primitive, plan) pairs. Cost: the second delta is not an IPS estimate of anything, because the
     pool has no observed plan to divide by — it is a divergence statistic, not a value estimate. It
     answers "how often does depth-2 change the plan" and never "what is that worth".

  B. SEQUENCE-LEVEL SCORING. Score the check-raise against what actually happened NEXT in the hand:
     if hero checked and then raised, the plan was executed and the outcome is attributable. Cost:
     this leaves the one-decision horizon, which is the horizon the entire estimator is built on and
     which `FAULT-horizon-bias` exists to police. It also conditions on villain having bet, which is
     a selection the pool policy does not model. Highest fidelity, largest blast radius.

  C. TREAT THE CHECK-RAISE PLAN AS A MIXED CHECK. Represent `check-raise` as CHECK with a recorded
     continuation intent, and price it only through its effect on the check candidate's EV — which
     is already what `gameTreeEvaluator` does internally, since `checkRaiseDepth2` refines a
     candidate whose primitive is a check. Cost: zero instrument change, and it concedes that the
     capability's value is measurable only as part of the check's value, never on its own. This is
     the honest minimum and should be priced first, because it may be enough.

  D. A THIRD ARM. Ablate `enableCheckRaiseDepth2` (WS-404) and difference. The flip itself remains
     invisible, but the EV consequence of the whole stage is not: turning the stage off changes the
     CHECK candidate's EV, which changes the argmax against BET, which IS scored. Cost: it measures
     the stage, not the action, and it confounds with budget reallocation (`claimStageBudget`).
     Cheapest real number available and available as soon as WS-404 lands.

  WHAT IS NOT AN OPTION. Mapping `check-raise` to RAISE. It compares advice against an action the
  hand history cannot contain, and it would silently inflate the raise share that WS-402 exists to
  reduce.
accept_criteria: |
  - THIS ITEM IS EXEMPT FROM THE STANDING EV-DELTA ACCEPT CRITERION, AND THE REASON IS THE TICKET'S
    SUBJECT: an EV delta on check-raise is precisely the thing that cannot currently be computed.
    Requiring one as an entry condition would be circular. What it must demonstrate instead is
    stated in the next three criteria.
  - THE ZERO IS DEMONSTRATED, NOT ASSERTED. Before any design is chosen, produce a decision on which
    the engine's top action is `check-raise` in one arm and `check` in the other, and show that its
    paired-delta contribution and its weight difference are both exactly zero, and that it appears
    in neither `topActionFlips` nor `discordantN`. Per the WS-309 rule this is the failing
    demonstration that justifies the ticket, and it must exist before the fix.
  - THE FOUNDER CHOOSES AMONG A/B/C/D, AND THE CHOICE IS RECORDED WITH ITS COST. Whichever is
    picked, the ticket writes down what a scored decision now means, because every option except D
    changes it. If the answer is C — the capability is priced only through the check candidate — say
    so explicitly in the estimand vocabulary rather than leaving it implicit, because "we chose not
    to measure this separately" and "we forgot this was unmeasurable" look identical in six months.
  - OPTION D IS RUN REGARDLESS, AS THE FLOOR. Once WS-404 lands, ablate `enableCheckRaiseDepth2` on
    the identical 260-decision set and report the paired delta with its interval and its ESS.
    Direction stated in advance: POSITIVE, i.e. the stage should be worth something. A null is a
    legitimate and reportable outcome at this ESS; a clearly negative delta would mean the
    check-raise refinement is actively costing EV, which would be a domain finding and would want
    its own ticket rather than closing this one.
  - `docs/standard-of-record/VOCABULARY.md` GAINS THE PLAN-VS-PRIMITIVE DISTINCTION, WHATEVER IS
    CHOSEN. The terms already exist for surfaces, cards, and atoms; there is no term for "an advice
    whose immediate primitive under-describes it". Per the repo rule, do not invent a name in code
    before the vocabulary has one.
