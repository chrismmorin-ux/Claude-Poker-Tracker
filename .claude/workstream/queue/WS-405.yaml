decision_flags:
  - |
    OPEN AND THE CENTRAL ONE — WHICH OF A / B / C / D, AND DOES THE ONE-DECISION HORIZON HOLD? B is
    the only option that prices the check-raise as an action rather than as a component of a check,
    and it is the only one that abandons the one-decision horizon the whole estimator rests on.
    `FAULT-horizon-bias` is a live register entry about exactly that boundary. The founder named
    check-raise specifically as a capability he wants priced, so "it cannot be priced" is not an
    acceptable resting place — but "it is priced as part of the check, and here is what that
    excludes" might be. RECOMMENDATION: run D immediately as the floor, adopt C as the standing
    vocabulary, and treat B as a separate programme with its own charter rather than a change made
    inside this ticket. Do not adopt A: a divergence statistic that looks like an EV number beside
    real EV numbers is the failure mode the Standard of Record exists to prevent.
  - |
    OPEN — HOW MANY OTHER ACTIONS HAVE THIS PROPERTY? `toPrimitive` (`heroPolicy.mjs:83-93`) maps
    six engine actions onto five primitives, and `check-raise` is the only collapse. But the same
    argument applies to any future candidate that is a PLAN rather than an immediate action — a
    delayed barrel, a probe-then-fold line, a donk-and-fold. Deciding this case in isolation means
    deciding it again each time. Worth settling as a rule about the vocabulary rather than as a
    ruling about one action.
