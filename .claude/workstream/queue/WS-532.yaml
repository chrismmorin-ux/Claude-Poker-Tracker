description: |
  Found while authoring docs/standard-of-record/FIELD-STRATEGY-CARD-50NL-ONLINE-2009.md
  on 2026-08-17.

  docs/standard-of-record/data/teachable-arms-{ps,ftp}.json carry a3Table, a4Table, arms
  scores and counts — but NO Result Card and no replication manifest. Keys are exactly:
  handsRead, nPlayersPool, nPlayersEval, nMinedDecisions, nScoredDecisions, a3Table, a4Table,
  arms. scripts/backtest/teachableArmsProbe.mjs imports buildResultCard, so a card is
  producible; none is committed.

  WHY THIS MATTERS RATHER THAN BEING TIDINESS. These figures are now load-bearing in two
  places — the villain Strategy Card §1/§4, and WS-529's F5 bar (A3 recovers 53.3%/54.9% of
  the engine's narrowing gain). Under ADR-009 a comparative claim about model quality
  resolves to a Result Card or it is not a claim. Both documents currently cite provenance
  with no manifest, and both say so explicitly rather than implying otherwise.

  Without a card there is also no disclaimerRegisterVersion stamp, which is the mechanism
  that lets a fault confirmed tomorrow find the results that depended on it yesterday.
accept_criteria: |
  - Result Card emitted for both PS and FTP arms, with full replication manifest: engine
    commit, Deal Book hash, partition, every seed, every load-bearing constant.
  - manifest.disclaimerRegisterVersion stamped (registerVersion() from faultRegister.js).
  - Estimand states the showdown conditioning and the ACTION-DEPENDENT selection explicitly.
  - Committed figures reproduce the existing JSON, or the difference is explained.
  - The two citing documents updated to reference the card.
