compute_job:
  # Six arms, one step each, so a single arm failing does not lose the others. Board count is
  # 60 rather than WS-574's 40: `drawBoards` is seeded, so the first 40 are the SAME boards and
  # 60 is a strict superset — more curve for the same comparability.
  maxJobHours: 8
  steps:
    - name: coverage-budget-2000
      cmd: node
      args: ["scripts/backtest/probe-depth2-coverage.mjs", "--boards", "60", "--budget", "2000", "--out", "out/depth2-coverage-02000.json"]
      expectFiles: ["out/depth2-coverage-02000.json"]
      maxAttempts: 2
    - name: coverage-budget-8000
      cmd: node
      args: ["scripts/backtest/probe-depth2-coverage.mjs", "--boards", "60", "--budget", "8000", "--out", "out/depth2-coverage-08000.json"]
      expectFiles: ["out/depth2-coverage-08000.json"]
      maxAttempts: 2
    - name: coverage-budget-12000
      cmd: node
      args: ["scripts/backtest/probe-depth2-coverage.mjs", "--boards", "60", "--budget", "12000", "--out", "out/depth2-coverage-12000.json"]
      expectFiles: ["out/depth2-coverage-12000.json"]
      maxAttempts: 2
    - name: coverage-budget-16000
      cmd: node
      args: ["scripts/backtest/probe-depth2-coverage.mjs", "--boards", "60", "--budget", "16000", "--out", "out/depth2-coverage-16000.json"]
      expectFiles: ["out/depth2-coverage-16000.json"]
      maxAttempts: 2
    - name: coverage-budget-20000
      cmd: node
      args: ["scripts/backtest/probe-depth2-coverage.mjs", "--boards", "60", "--budget", "20000", "--out", "out/depth2-coverage-20000.json"]
      expectFiles: ["out/depth2-coverage-20000.json"]
      maxAttempts: 2
    # The bracket arm. If 40000 still gates a stage, the budget is not the only constraint and
    # the hardcoded sample counts are implicated — a different fix, so it must not be silently
    # absorbed into "pick the biggest number that finished".
    - name: coverage-budget-40000
      cmd: node
      args: ["scripts/backtest/probe-depth2-coverage.mjs", "--boards", "60", "--budget", "40000", "--out", "out/depth2-coverage-40000.json"]
      expectFiles: ["out/depth2-coverage-40000.json"]
      maxAttempts: 2
  artifacts:
    - "out/depth2-coverage-02000.json"
    - "out/depth2-coverage-08000.json"
    - "out/depth2-coverage-12000.json"
    - "out/depth2-coverage-16000.json"
    - "out/depth2-coverage-20000.json"
    - "out/depth2-coverage-40000.json"
