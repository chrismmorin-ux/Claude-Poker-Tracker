id: "WS-409"
title: "Triple barrel is unreachable on the flop at every budget — depth3Barrel is disqualified by an 800-combo range-width gate against a measured flop range of 1081 combos, not by time, which is why depthReachedMax is 2 on 138 of 138 flop decisions and 3 on 74 of 77 turn decisions"
