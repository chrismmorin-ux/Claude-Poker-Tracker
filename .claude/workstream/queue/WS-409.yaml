status_note: |
  PREMISES RE-VERIFIED AGAINST HEAD (fe716f59), AND THE MECHANISM IDENTIFIED BY MEASUREMENT RATHER
  THAN INHERITED FROM THE AUDIT NOTE — WHICH ATTRIBUTED THIS TO BUDGET.

    - `gameTreeEvaluator.js:1732` — `if (gateStage('depth3Barrel', { street: street === 'flop' ||
      street === 'turn', betDepth2Ran: !!betDepth2 }))`.
    - `:1740` — `const depth3ComboLimit = street === 'turn' ? 1200 : 800;`
    - `:1741` — `if (topBetCandidate && segmentation.totalCombos <= depth3ComboLimit && (!checkCandidate
      || topBetCandidate.ev > checkCandidate.ev))`, with the `else` branch ending
      `endStage('depth3Barrel', 'no-candidate')` and its comment naming the three situations that
      outcome conflates.
    - `:967-983` — `gateStage` records `blockedBy` from failing condition keys plus `'budget'`,
      which is why the range-width disqualification appears as an EMPTY `blockedBy` with outcome
      `no-candidate` and is invisible until the budget stops masking it.

  MEASURED ON HEAD, via a temporary vitest probe (created, run, deleted) using the fixture from
  `depthReachability.test.js`: full 169-cell villain range, board A-spade 7-heart 2-diamond, hero
  A-heart K-heart, pot 60, `trials: 2000`, budgets 0/2000/8000/30000 ms, both a check node and a
  facing-bet node. `segmentation.totalCombos` was 1081 in every configuration. `depth3Barrel`
  reported `blockedBy: ['budget']` at 2000 and 8000 ms and `no-candidate` with an empty `blockedBy`
  at 30000 ms, where `budgetSkipped` was empty and every other running stage had reached
  `weightConsumed = 1`. That is the direct evidence that the flop blocker is range width, not time.

  Corpus census recomputed from `out/depth-ablation.json` (`evStats.depthReachedMax` by
  `slices.street`): flop 138/138 at depth 2 and 0 at depth 3; turn 74/77 at depth 3 and 3/77 at
  depth 2; river 45/45 at depth 1. The audit note's "reached on 74/77 turn decisions, 0/138 flop"
  verified exactly.

  Street-decomposed paired deltas, also recomputed (reimplementation of `weightFor` / `wisValue` /
  `pairedDelta` validated against the shipped `report` block): flop +0.6725 [-0.07, +1.69] on n=138,
  turn +0.0110 [-1.30, +1.05] on n=77, river -3.9349 [-26.11, +2.47] on n=45. Flop depth-1 ESS is
  21.0 of 138 (15.2%), so a flop-restricted contrast is reading a 21-decision sample — which is why
  WS-402 is upstream of any strong conclusion here, and why this ticket's `blocked_by` names the
  instrument items rather than pretending the number is available today. Reaching a plus-or-minus
  0.5 bb interval on the flop needs roughly 433 decisions at the current ESS, and measured compute
  is 23.9 s per decision for a two-arm pair.
