decision_flags:
  - |
    OPEN — RAISE THE LIMIT, SAMPLE THE RANGE, OR NARROW BEFORE MEASURING? (a) Raising
    `depth3ComboLimit` from 800 is the direct fix and pays the full enumeration cost on the widest
    ranges, which are also the slowest — the cost curve is worst exactly where the limit currently
    bites. (b) Sampling the range to a fixed combo budget makes the cost constant and the result
    stochastic, which collides with the standing determinism rule for engine EV assertions and with
    the memory entry that advice must not vary with machine conditions. (c) Applying the limit to
    the NARROWED range rather than the raw one — `narrowedRange` already exists at this point in
    the function and is what the depth-2 stages consume — may bring typical flop nodes under 800
    with no compute increase and no new mechanism at all. RECOMMENDATION: price (c) first, because
    if it works it is free and it is arguably what the limit was always meant to test. Fall back to
    (a) with a measured cost curve. Do not adopt (b) without an explicit founder ruling on
    determinism.
  - |
    OPEN — SHOULD THE FLOP LIMIT BE HIGHER THAN THE TURN LIMIT RATHER THAN LOWER? The current
    asymmetry (flop 800, turn 1200) follows compute: two future streets cost more than one. But the
    VALUE asymmetry runs the other way — a three-barrel plan is a flop decision, and the flop is
    where the plan is worth knowing. If the limits are ordered by cost alone, the capability is
    cheapest exactly where it is least useful. This may be the right trade; it should be a decision
    rather than a side effect.
