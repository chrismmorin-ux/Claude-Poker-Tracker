finding_id: ""
description: |
  SCOPED BY THE FOUNDER'S RULING: depth-2 is correct and required, and where it is not good enough
  that is ours to fix. This is the depth-3 half of that, split from WS-408 because its blocker is
  different in kind from the other five capabilities and is independently shippable.

  THE CAPABILITY. Triple barrel — the value of betting a third time, two streets from now. It is
  implemented (`computeDepth3BarrelEV`, reached through the `depth3Barrel` stage at
  `gameTreeEvaluator.js:1732`), and on the turn it works: `depthReachedMax` is 3 on 74 of 77 turn
  decisions in the scored run. On the flop it has never run: 0 of 138.

  THE BLOCKER IS NOT TIME. This is the finding, and it inverts the obvious hypothesis. The gate at
  `:1732` is `{ street: 'flop' || 'turn', betDepth2Ran: !!betDepth2 }` and it OPENS. What
  disqualifies the node is the condition inside, at `:1740-1741`:

      const depth3ComboLimit = street === 'turn' ? 1200 : 800;
      if (topBetCandidate && segmentation.totalCombos <= depth3ComboLimit && ...)

  Measured on HEAD with a temporary probe: a full-range OOP flop node has
  `segmentation.totalCombos = 1081`. 1081 > 800, so the branch falls to the `else` and the ledger
  records `endStage('depth3Barrel', 'no-candidate')` with an EMPTY `blockedBy`. At 2000 and 8000 ms
  the stage reports `blockedBy: ['budget']` and the range-width disqualification is never reached —
  which is exactly why this looked like a budget problem. At 30000 ms, with `budgetSkipped` empty
  and every other stage at `weightConsumed = 1`, `depth3Barrel` still does not run, and now the
  ledger says why.

  A flop range of 1081 combos is not unusual; it is close to typical for a villain who has not yet
  narrowed. The limit of 800 therefore excludes most real flop nodes by construction, and the turn
  limit of 1200 admits most turn nodes — which is precisely the pattern the corpus census shows.
  The asymmetry is deliberate and the comment says why: "Turn depth-3 is simpler (1 future street vs
  2), so allow larger ranges." The reasoning is sound; the consequence — that the flop, the street
  with the most decisions (138 of 260) and the most branching future, is the one street that never
  gets depth-3 — was probably not the intent.

  WHY IT MATTERS MOST ON THE FLOP, IN POKER TERMS. A three-barrel line is a flop decision. Deciding
  whether to fire the first barrel without any model of the third is exactly the situation the
  capability exists for: the flop bet's value depends on hero's ability to keep betting, and on the
  flop there are two more streets of fold equity to collect. On the turn, where depth-3 does run, it
  models a single future street and the decision it informs is already half-committed. The
  capability is reachable precisely where it is worth least.

  THE MEASURED DIRECTION, STATED HONESTLY. The flop is also the one street where depth-2's paired
  delta is positive and its interval nearly excludes zero: +0.6725 bb [-0.07, +1.69] on 138
  decisions, against turn +0.0110 and river -3.9349. So the flop is where depth already pays, which
  is a reason to expect more depth to pay more — and it is a prediction this ticket must test rather
  than assume.
accept_criteria: |
  - EV-DELTA ACCEPT CRITERION, DIRECTION STATED IN ADVANCE. On the IDENTICAL 260-decision set from
    `out/depth-ablation.json`, restricted to the 138 FLOP decisions, the arm with depth-3 reachable
    must be POSITIVE against the arm without it, holding the refinement budget constant across both.
    The flop is the correct slice because it is the only street where the capability changes:
    the turn already reaches depth-3 on 74 of 77 decisions and the river never can. Report the turn
    and river slices as unchanged controls — if either moves, the change reached somewhere it should
    not have and the measurement is invalid before it is interpreted.
  - THE COMPUTE COST IS MEASURED AND STATED BEFORE THE LIMIT IS CHANGED. The 800-combo limit exists
    to bound compute on a two-future-street enumeration, and that reason is real. Report the
    measured wall-clock of `computeDepth3BarrelEV` on flop nodes at 800, 1100 and 1400 combos before
    proposing a new value. A limit raised without that number is a limit moved from one arbitrary
    place to another.
  - THE FIX IS NOT NECESSARILY A LARGER NUMBER, AND THE TICKET MUST CONSIDER THE ALTERNATIVES. Three
    are open (see the decision flag): raise the limit, sample the range rather than enumerate it, or
    narrow the range before the limit is applied. Only the third is free. Whichever is chosen, the
    accept criterion is the EV delta above, not the reachability alone — a stage that runs and
    changes nothing has cost compute and bought nothing.
  - REACHABILITY IS DEMONSTRATED AND PINNED. A test must show `depth3Barrel` in `ranStages` on a
    flop node with a realistic range, and assert it. Today the corpus census is 0 of 138 and the
    only reason anyone knows is that `depthReachedMax` was recomputed by hand from a 570 KB run
    artefact. Per `exploitEngine/CLAUDE.md`, a diagnostic that only logs is a comment with extra
    steps.
  - THE `no-candidate` OUTCOME IS DISAMBIGUATED IN THE LEDGER. `endStage('depth3Barrel',
    'no-candidate')` (`:1795`) currently covers three distinct situations that the comment above it
    names: no depth-2-refined bet to extend, a range too wide for the combo limit, or a check that
    already beats the bet. Those are not the same fact and only one of them is this ticket. The
    ledger must say which, so that the next person to ask "why did depth-3 not run" reads the answer
    instead of deriving it.
  - THE WS-309 RULE APPLIES: the reachability assertion must be demonstrated FAILING against HEAD
    before the fix is written. It will — 1081 > 800 on the probe fixture.
