description: |
  Once a bankroll utility layer exists (WS-297), tournaments have TWO concave
  corrections live at once: the ICM risk premium beta (POKER_THEORY §10.3,
  `computeCommittedIcmTax`) and the bankroll lambda. Applied naively both discount
  the same at-risk chips and the engine folds everything.

  THE RESOLUTION, ALREADY STATED IN §12. They act on different variables in a
  chain, not on the same variable twice:

      chips --[ ICM: beta ]--> $EV --[ Kelly: lambda ]--> utility

  beta converts tournament chips into prize equity; lambda prices the risk to
  that prize equity against the rest of the founder's poker life. In cash the
  first map is the identity, which is why cash is unaffected by beta today.

  THE SPECIFIC HAZARD. `computeCommittedIcmTax` returns a chip-EV PENALTY, not a
  transformed $EV. Chaining lambda onto a penalized chip-EV is not the same
  operation as applying lambda to the $EV distribution, and the difference is not
  second-order near the bubble. The composition has to be done on the
  distribution, not on the point estimate — which is also the reason WS-297
  integrates the utility exactly rather than using mean-variance.

  A SECOND, SMALLER HAZARD. `computeCommittedIcmTax` is gated to committed
  heads-up stack-offs because its symmetric form is exact only when winChips ~=
  riskChips. The bankroll utility has no such restriction. So there is a régime —
  partial-pot tournament bets — where lambda applies and beta does not, and the
  engine must not silently read that as "no ICM pressure here."
accept_criteria: |
  - Composition implemented on the outcome DISTRIBUTION (chips -> $EV -> utility),
    never as two penalties subtracted from one point estimate.
  - Cash path provably unchanged: no icmContext => identity, asserted by test.
  - Tournament path with lambda unset => bit-identical to today's beta-only
    behaviour, asserted by test.
  - The partial-pot tournament régime (lambda applies, beta gated off) is handled
    explicitly and does not present as "no ICM pressure".
  - A near-bubble fixture shows the composed correction is NOT the sum of the two
    corrections applied separately, with the divergence quantified.
  - §12.5 updated with the measured behaviour if it differs from the derivation.
