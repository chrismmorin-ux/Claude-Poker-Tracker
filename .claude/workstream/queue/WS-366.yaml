decision_flags:
  - |
    OPEN — WHERE the fix belongs. `softContinuationWeights` is WS-291's shared primitive and
    is used postflop as well as here, where `targetMean` is a villain's continuation rate
    rather than a range width. Changing `tauFraction` globally re-decides a postflop
    calibration that was measured separately. The narrower move is to pass an explicit
    sharpness from `withEquitySupport` (the primitive already takes an options object with
    `floor` and `tauFraction`), leaving the postflop caller on its measured value. Choose
    deliberately and say which callers are in scope.
  - |
    OPEN — is the SHARPNESS the whole story, or is the carve's apportionment also implicated?
    `share ∝ splitPost_sub · prior_sub(i)` divides by the sibling sum, so at LATE, where
    `limpReraise` takes 0.06 against `cold3Bet` 0.60, the ratio between two near-equal shapes
    decides the cell. A flattened shape and a small split compound. Establish which term
    dominates before changing either — measured, not reasoned.
