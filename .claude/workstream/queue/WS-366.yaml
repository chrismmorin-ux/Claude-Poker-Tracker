status_note: |
  Premise verified at HEAD by computing the carve directly from `getPopulationPrior` and the
  `SUBCLASS_SPLIT` table, reproducing `updateSubclassRanges`' arithmetic at zero observations.
  The numbers in the description are that run, not the WS-304 commit's prose. The commit
  named the AQ/88 band and QQ; the measurement confirms it and localises it to LATE, where
  the subclass split is thinnest — a detail the original note did not carry.
