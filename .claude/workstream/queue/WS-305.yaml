status_note: |
  Filed 2026-07-29 as P0 of the GUT Range charter. Scored P1 rather than P0
  deliberately: the live defect it ultimately serves is real and measured (hero
  over-folds to 3-bets because the 3-bet grid holds 1.0-1.5% of combos while its
  own declared frequency claims 6-12% — see charter §1), but THIS ticket does
  not fix that defect, it unblocks the work that does. Scoring an enabler as if
  it were the fix is how enabler tickets end up over-ranked.

  Premise verified by direct code read on 2026-07-29 per
  feedback_verify_ticket_premise_at_composition: the NotImplementedError is real
  and at preflopEquity.js:508; equityDecomposition.js is real and hand-vs-hand
  only; the MC generator's non-determinism is documented in its own docblock.
