status_note: |
  Premises re-verified against HEAD by reading the code.

  VERIFIED AS STATED:
    - `villainDecisionModel.js:36` `const PSEUDOCOUNT = 10;` with the comment "Prior strength — at
      n=10, prior and data are weighted equally"; `:352` records the pairing with `PRIOR_WEIGHT = 10`.
    - The four emitted source strings and their sites: `:508`, `:524`, `:558` `'prior'`;
      `:537` `` `shrinkage-L${deepestLevel + 1}` ``; `:550` `` `level-${i + 1}` ``. No `model`.
    - `effectiveN` constructions at `:325`, `:445`, `:739`, `:746`, all `+ PSEUDOCOUNT` or bare
      `PSEUDOCOUNT`. Floor of 10 confirmed.
    - `:445` returns `evidenceN` alongside `effectiveN`; `:518` destructures it; `:535` uses it for
      `bayesianSampleConfidence`; the returned object at `:530-536` does NOT include it. Confirmed
      as "already computed, simply not carried forward".
    - `gameTreeEvaluator.js:332`, `:517`, `:757` — three identical `villainPrediction` literals.
    - `actionClassifier.js:296-304` — `confidenceSuffix`; `:301` the DATA-equivalent branch requiring
      `source.includes('model')`; `:302` the `` ` (${effectiveN} obs)` `` string.
    - `stats-engine.js:25-28` thresholds, `:34` `sampleQualityTier`, `:44-48` colors with the
      "mirror LiveAdviceBar" comment.
    - `LiveAdviceBar.test.jsx:30` `'model_blended'`, `:66` `'population'`, `:78` `'blended'`.

  CORRECTED — the run record's file path for the badge was wrong:
    - The run record and the digest both cite "LiveAdviceBar.jsx:256" without a directory, and one
      lens implied `src/components/ui/`. At HEAD the file is
      `src/components/views/TableView/LiveAdviceBar.jsx`. There is no `src/components/ui/LiveAdviceBar.jsx`.
      `ConfidenceBadge` is a LOCAL component defined at `:68` in that same file — it is not exported
      and there is no separate `ConfidenceBadge` module anywhere in the repo. That matters for the
      shared-implementation decision flag above: there is no existing shared component to point at.
    - Line references `:181` (the `useGameTree` definition) and `:256` (the badge render) verified
      exactly as stated.

  NOT RE-DERIVED: the claim that `PSEUDOCOUNT = 10` was validated on the WS-262 corpus "in the same
  measurement that refuted the 200 cap" is taken from the run record and from the comment at `:352`.
  It has not been re-run for this ticket. It is load-bearing only as a reason NOT to change the
  constant, which is the conservative direction.
