decision_flags:
  - |
    OPEN — WHICH DIRECTION THE SHARED TIER FUNCTION FLOWS. `sampleQualityTier` lives in
    `ignition-poker-tracker/shared/`, outside the app's module graph, and the app currently imports
    nothing from the extension. Options: lift the function into `src/utils/` and have the extension
    import it (crosses the extension boundary the other way), duplicate it with a test asserting the
    two stay identical, or leave them separate with declared divergence. The first is cleanest and
    the most invasive; the second is the pattern this repo has used before for the wire schemas.
