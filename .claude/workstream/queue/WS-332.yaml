decision_flags:
  - "When strands disagree, does the composition step pick a winner or emit a MIXED action? Picking is legible and matches how a human plays a decision; mixing is closer to how the structure strand actually reasons (a bluff slot is a frequency, not a hand). Recommend picking at the hand level while the structure strand's frequency claim is carried as metadata, so the two are never silently averaged."
  - "Do strands see each other's verdicts before returning? Blind strands are genuinely independent and their agreement is real evidence; sighted strands can build on each other but their agreement becomes correlated and worth less. Recommend blind, with composition as the only place they meet."
