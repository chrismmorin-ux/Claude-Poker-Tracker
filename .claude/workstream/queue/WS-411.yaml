decision_flags:
  - |
    OPEN AND LOAD-BEARING — WHAT REPLACES THE MILLISECOND. A raw node count is deterministic but
    device-blind: the same count is 200ms on the desktop and 4s on the A22, and the A22 is where the
    founder actually is. A per-device calibration (measure once, convert to nodes, record the node
    count) keeps determinism AND respects the phone, at the cost of a calibration step and a device
    profile that has to live somewhere. A third option is to keep the clock for LIVE use and use a
    work budget for MEASUREMENT only — which is honest, cheap, and means the thing measured is not
    quite the thing shipped. The founder should pick, because the third option trades away exactly
    the property WS-393's baseline was run to establish.
