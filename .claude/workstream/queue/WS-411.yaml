status_note: |
  Premises verified by reading HEAD, not by trusting a prior audit:
    - `gameTreeEvaluator.js:900-907` — `refinementStart = Date.now()` and `isTimeBudgetExceeded`.
    - `:930-936` — `claimStageBudget()` and `MAX_STAGE_SHARE = 0.4`.
    - `:1314-1350` — `treeMetadata.latency` already carries `overBudget`, `budgetSkipped`,
      `ranStages`, `errored`, `noCandidate`, `incomplete`. The ledger needed to diagnose this is
      already there; what is missing is determinism, not observability.
    - The `overBudget: true` / 3-stages-dropped reading above is from a live WS-393 smoke run on
      this machine at `--refinement-ms 2000`, captured in the decision-level sidecar, not inferred.

  DELIBERATELY NOT BLOCKING THE WS-393 BASELINE RUN. The founder's ruling on 2026-08-05 is that
  depth-2 is the correct configuration and its shortcomings are ours to fix rather than to route
  around — so the baseline runs WITH depth-2 and WITH this defect, and the runbook
  (`docs/runbooks/baseline-ev-run.md` §9) states plainly that the achieved depth is
  machine-dependent. The per-decision record WS-393 added carries `depthReached` and the full stage
  ledger for every evaluation, so the baseline can diagnose its own variance from this cause
  afterwards rather than needing another night to discover it.
dismissed_at: "2026-08-07"
