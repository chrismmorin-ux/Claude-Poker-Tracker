description: |
  decisionRecord.mjs close() swallows JSONL parse failures (catch { continue; }) and hashes
  whatever survived — a crash mid-write yields a contentHash that presents as a complete,
  verified record to Result Card consumers. The sibling atomStore.mjs (WS-438) already
  implements the correct refusal discipline. Highest risk-reduction-per-effort item in the
  2026-08-13 sweep. Full mechanism: findings/FIND-118.yaml.
accept_criteria: |
  - A parse failure at close() surfaces as an error state (TRUNCATED-equivalent), never a
    silent drop; rowCount/contentHash are only emitted for a fully-parsed file.
  - Test: an artificially torn last line makes validation refuse, not pass with a clean hash.
  - Plain English: if a scoring run is interrupted, the record it leaves behind refuses to
    validate instead of looking complete.
