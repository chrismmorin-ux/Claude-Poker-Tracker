status_note: |
  Filed out of WS-352's closeout, which flagged this for the founder rather than patching it
  because inverting a matcher is a judgement about what the register is FOR, not a typo.

  Premises re-verified against HEAD before filing, by reading the code:
  `faultRegister.js:370-378` (`haystack` reads identity and prose only — `estimand`, `treatment`,
  `manifest.partition`, `manifest.fieldVersion`, and the three `match.*` ids), `:381`
  (`onOnlineCorpus`, same prose basis), `:384` (`isLiveFacing` regex `/\blive\b|1\/2|1\/3|9-handed/`),
  `:411` and `:578` (its two consumers), `:1146-1152` (the documented reason `matches` is excluded),
  `:1154-1175` (`canonicalRegisterBody` — `matches` absent, `falsifierBlockers` present), `:1186-1189`
  (`registerVersion` hashes only that body).

  The WS-293 trigger confirmed at source, not inferred: `RANGE_CALIBRATION_TREATMENT`
  (`scripts/backtest/rangeCalibrationReport.mjs:98-104`) contains "any claim about live 9-handed
  1/2-1/3 is TRANSFERRED, not measured", and `treatment` is a haystack field. The same sentence
  appears at `:334-335` in the rendered warnings and at `:64-69` in the module header — the file
  states plainly that it is repeated three times so a reader cannot skip it.
