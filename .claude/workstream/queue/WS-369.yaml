decision_flags:
  - |
    OPEN — DOES `matches` BELONG IN THE CONTENT HASH? Posed, not answered. The exclusion is
    documented and reasoned (`faultRegister.js:1146-1152`); `falsifierBlockers` was INCLUDED on
    reasoning that arguably applies to `matches` too (`:1170-1173`). A change in what the register
    can SEE and a change in what it can SETTLE are the same kind of claim about an old card's
    screening. Whichever way this goes, it is a founder-visible decision about what a version stamp
    promises.
  - |
    OPEN — WHAT A CORRECT MATCH MEANS FOR A DISCLOSING CARD. If matching keys on structural
    provenance, the WS-293 card still matches — correctly, because it genuinely is a corpus-anchored
    card. The question is whether the register should then DISTINGUISH "contaminated and says so"
    from "contaminated and silent", since only the second is a reporting failure. That distinction
    is real and is not currently representable; adding it is a change to what a match MEANS, not
    just to what matches.
