status_note: |
  PREMISE HANDED IN WAS PARTLY WRONG, AND THE CORRECTION IS THE REASON FOR THE PRIORITY. The
  filing brief repeated WS-283's "test-reachable only" and asked for it to be checked. It holds
  for the default parameter at `gameTreeEquity.js:1119` and does NOT hold for the constant, which
  reaches production twice more.

  Verified against HEAD by reading the code:
    - `gameTreeEquity.js:1119` — the default `betFraction = 0.75`.
    - Every caller of `multiwayFoldPct` in `src/`, enumerated: `gameTreeEvaluator.js:605` (passes
      `heroBetFraction`, computed at `:603` with a `0.75` fallback) and
      `drillModeEngine.js:808-814` (passes the literal `0.75`). Everything else that names it is a
      test file, a comment, or a docblock. So the DEFAULT is genuinely test-only.
    - `drillModeEngine.js` is production: `computeBucketEVsV2` is imported by
      `src/components/views/PostflopDrillsView/BucketEVPanelV2.jsx:21`, and
      `panels/ConfidenceDisclosure.jsx:86` names `multiwayFoldPct` in the displayed disclosure.
    - `villainModelData.js:255` — `POPULATION_CURVE.midpoint: 0.35`; `:252-254` the asymmetric
      steepness pair (`steepnessUp: 6.5`, `steepnessDown: 0.75`); `:290` the style midpoint derived
      as `POPULATION_CURVE.midpoint * clamp(inverseFoldRatio * 0.9, 0.6, 1.2)`; `:307`
      `default: POPULATION_CURVE`. So no style midpoint exceeds 0.42 and 0.75 is off-anchor
      everywhere.
    - `gameTreeEquity.js:1141-1149` — the `logisticFoldResponse` call inside `multiwayFoldPct`,
      taking `curve.midpoint * mod.midpointMult`, with `betFraction` as the evaluated fraction.
    - `gameTreeEquity.js:1152` — `allFoldPct *= clamp(oppFold, 0.10, 0.90)`, the product that
      compounds the bias across opponents.
    - `foldEquityCalculator.js:261` — the stale `[params.midpoint=0.75]` docblock.

  Not verified and deliberately not claimed: the SIZE of the error at any real drill spot. The
  asymmetric curve is nearly flat above the midpoint, so it could be small. Measuring it is an
  accept criterion rather than a premise.
