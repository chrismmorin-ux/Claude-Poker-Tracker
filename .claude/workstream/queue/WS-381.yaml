decision_flags:
  - |
    OPEN — WHAT "NO SIZING INFORMATION" SHOULD MEAN AT ALL. Substituting the midpoint makes the
    curve a no-op at those sites, which is honest: with no bet size known, the unconditional base
    rate IS the best estimate, and the midpoint is by construction the fraction at which the curve
    returns it. The alternative reading is that a site with no bet size should not be calling a
    SIZING-CONDITIONED function in the first place, and should call the base rate directly — which
    is clearer but changes the call graph. The first is a one-line change with the right semantics;
    the second states the semantics in the code's shape. Decide rather than default.
  - |
    OPEN AND ADJACENT — THE DRILL'S STYLE KEY DOES NOT MATCH THE TABLE. `drillModeEngine.js:811`
    passes `{ playerStats: { style: 'reg' } }` in lowercase, while `STYLE_PRIORS`
    (`villainModelData.js:99-149`) and `FOLD_CURVE_PARAMS` (`:300-308`) are keyed `'Reg'`
    capitalised. So the lookup misses and BOTH the base fold rate and the curve silently fall
    through to the population defaults. That may be harmless — `Reg` is close to population by
    construction — but it means the drill's comment describing a "reg" opponent does not describe
    what the code does, and a future style change would not reach it. NOT fixed as part of this
    ticket without a decision, because "make the lookup hit" is a behaviour change to a displayed
    number and deserves its own before/after.
