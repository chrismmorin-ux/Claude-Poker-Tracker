description: |
  Scoped (not implemented) under WS-250 (FIND-032): timing tells require data the
  model does not currently record. Hand timelines store the action and amount per
  entry but NOT how long the player took to act ("time-to-act"). Without that field,
  no timing-tell calibration is possible.

  SCOPE (the data-model change this ticket owns):
  - Capture point: the action-recording path (where each timeline entry is built).
    A monotonic timestamp delta from when it became the seat's turn to when the
    action was dispatched yields `timeToActMs` per action entry.
  - Storage: add an optional `timeToActMs` field on the action/timeline entry shape.
    Rides in the existing actionSequence — no IDB migration if added as an optional
    field (mirror the all-in flag precedent, WS-251/1aee9c7).
  - Consumer (later, separate ticket): a timing-tell evaluator analogous to the
    sizing-tell correlation — e.g. snap-action vs tank correlated with shown
    strength, surfaced in buildAwareness like sizingTells.
  - First-principles guard: any timing read is a DERIVED tell, gated by sample size +
    confidence; it must not become a free-floating label (POKER_THEORY §7).

  This ticket delivers ONLY the data-model capture + storage. The evaluator/surface
  is a downstream follow-up once data accrues. Live-only vs replay availability of
  reliable timing must be assessed (manual hand entry has no real timing).
accept_criteria: |
  - `timeToActMs` (optional) captured per action where a reliable turn-start exists
    (live/online capture), null otherwise (manual entry).
  - Persists with no IDB migration (optional field on the existing entry shape).
  - No behavior change to any existing read path when the field is absent.
  - Documented capture-availability matrix (live/online vs manual replay).
