decision_flags:
  - |
    OPEN — WHETHER `MAX_JOURNAL` SHOULD EXIST AT ALL ONCE `unlimitedStorage` IS GRANTED. It was
    sized by WS-358 for a delivery-recovery mirror, where 5000 un-ACKed hands is a pathological
    backlog. It is now also the de facto archive (WS-370 makes it the export source), and for an
    archive an oldest-first eviction at any N is a silent data ceiling on the founder's corpus.
    Removing the cap entirely is the improvement-default answer; keeping it means naming a number
    of live hands the project is willing to destroy. That is the founder's call, not the AI's.
