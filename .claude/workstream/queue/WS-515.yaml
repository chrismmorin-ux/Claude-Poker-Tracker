status_note: |
  NOT A DUPLICATE OF WS-460 / FIND-122, and they should be read together. WS-460 is the opposite
  concern about the same store: the journal keeps money-hand data on disk TOO LONG (no TTL, no
  purge, no user control) after WS-358 widened the trust boundary from `storage.session` to
  `storage.local`. This ticket is that the journal loses hands too EARLY and lies about it.
  Anything WS-460 ships that bounds retention interacts directly with the ceiling here, so
  sequencing matters: fixing WS-460 with a TTL would incidentally relieve the quota pressure
  while leaving the silent-failure defect fully intact, which would look like a fix and would not
  be one. Cross-referenced, not merged.

  ALSO RELATED, NOT DUPLICATED: WS-370's second decision flag already asks whether `MAX_JOURNAL`
  is the right cap for an archive. That question is real and is carried here as a decision flag,
  because WS-370's answer to it changes nothing about the quota arriving 1,400 hands sooner.

  All citations confirmed exactly as given: `storage-writer.js:59`, `:93-95`, `:219`,
  `manifest.json` permissions array. The `frame-capture.js` shared-quota interaction and the
  `dropped`-counter bypass were found during verification and are additions to the original
  audit, not part of it.
