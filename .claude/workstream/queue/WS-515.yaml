description: |
  FOUND 2026-08-16 by two independent source audits of the Ignition capture extension. Every
  file:line re-verified against HEAD.

  THE CEILING IS NOT THE ONE THE CODE THINKS IT IS. `shared/storage-writer.js:59` sets
  `export const MAX_JOURNAL = 5000;` and the comment above the eviction branch (`:82-83`) reads
  "Cap breach here IS permanent loss — count it so it can be surfaced instead of vanishing.
  5000 hands is many sessions of headroom." That reasoning is sound and it is about the wrong
  limit. `chrome.storage.local` has a 10MB quota, and `ignition-poker-tracker/manifest.json`
  requests exactly two permissions:

      "permissions": [ "storage", "sidePanel" ],

  `unlimitedStorage` appears NOWHERE in the extension — a repo-wide grep over every `.json`,
  `.js` and `.mjs` returns zero hits. A measured realistic 9-handed showdown record is ~2,932
  bytes. 10 × 1024 × 1024 ÷ 2,932 = ~3,576 records. So the quota arrives first, by roughly 1,400
  hands, and `MAX_JOURNAL = 5000` is unreachable — the eviction branch and its counter are dead
  code in practice.

  AND IT IS WORSE THAN 3,576, BECAUSE THE JOURNAL DOES NOT OWN THE QUOTA ALONE.
  `shared/frame-capture.js:29` sets `const DEFAULT_MAX_BYTES = 4_500_000;` with the comment
  "~4.5MB per context; chrome.storage.local default quota is 10MB" — a second writer to the same
  10MB, reserving 4.5MB PER CONTEXT whenever the `capture.rawFrames` flag is on. With frame
  capture enabled in one context the journal's usable share is ~5.5MB, i.e. ~1,876 hands.
  Two contexts and there is nothing left. Note that `frame-capture.js:103` already HANDLES the
  quota case ("Likely quota — drop the oldest 90% and retry once so capture survives"). The
  codebase knows this failure mode. The journal is the one writer that ignores it.

  WHAT HAPPENS AT THE CEILING — THE PART THAT MAKES THIS P0 RATHER THAN A CAPACITY NOTE.
  `chrome.storage.local.set` at `storage-writer.js:92` throws. It is caught three lines later:

      } catch (e) {                                           (:93-95)
        errors.report('storage', e, { op: 'journalAppend' });
      }

  That path does NOT increment `dropped`. The `HAND_JOURNAL_DROPPED` counter — the entire
  mechanism built so that loss "can be surfaced instead of vanishing" — lives in the eviction
  branch above (`:84-86`), which never runs. So the failure that actually happens is the one
  failure the counter cannot see.

  Then `enqueueHand` carries on. The `await journalAppend(handRecord)` at `:217` can never
  reject, because the catch swallows, so control reaches `:219`:

      return { success: true, queueLength: queue.length };

  The badge increments. The side panel says a hand was captured. The `dropped` counter stays at
  zero. The hand's only durable copy was never written. The founder's evidence that capture is
  working is generated by the same call that lost the hand.

  COMBINED WITH WS-514 THIS IS NOT HYPOTHETICAL. `journalPrune` (`:248`) is the only path that
  removes a journal entry, and WS-514 establishes that it never fires because `captureId` is
  stripped on the wire and the app can therefore never ACK. So the journal is currently
  append-only for the life of the install. It does not drain, it only fills. ~3,576 hands is not
  a distant ceiling under those conditions; it is a countdown, and the founder's live-hand corpus
  goes permanently and silently lossy on the day it is reached.

  CONTAMINATES SCORED FIGURE: Yes. Hands lost this way are absent from the corpus with no marker
  — not a smaller sample but a sample truncated by a mechanism correlated with volume, i.e. the
  founder's heaviest sessions are the ones that lose hands.
accept_criteria:
  - "The extension requests `unlimitedStorage` in `manifest.json`, removing the 10MB ceiling rather than budgeting under it. This is the fix; a smaller `MAX_JOURNAL`, a tighter record, or a retention window are all the same trade of hands for headroom and none of them is acceptable when the hands ARE the product."
  - "A quota failure is LOUD. `journalAppend`'s catch distinguishes a quota error from any other storage error, increments a dedicated counter, and the founder sees it — badge state or side-panel banner, not only `errors.report`."
  - "`enqueueHand` STOPS RETURNING `success: true` when the durable write failed. The return distinguishes 'queued and journalled' from 'queued only, durable copy lost'. The current comment at `:213-216` argues the live path must not block on a journal problem — that stays true; reporting success for a hand with no durable copy is a separate and wrong decision."
  - "A test that fills the journal past the quota and asserts BOTH: the failure counter increments, and `enqueueHand` does not report unqualified success. Against HEAD both assertions fail. `chrome.storage.local` is mockable — `shared/__tests__/frame-capture.test.js:124-129` already throws a synthetic `'QUOTA_BYTES quota exceeded'` to test exactly this, so the pattern exists in-repo and needs no invention."
  - "The real per-record size is MEASURED, not estimated, and recorded in the ticket: serialize N actual captured 9-handed showdown records and report mean and p95 bytes. The ~2,932-byte figure driving this ticket is one measurement and the ceiling it implies is only as good as it is."
  - "The journal's total byte usage and the implied remaining headroom are readable from a surface the founder sees — `chrome.storage.local.getBytesInUse` exists. A ceiling nobody can observe approaching is the same defect one layer up."
  - "Coexistence with `frame-capture.js`'s 4.5MB-per-context reservation is resolved explicitly, not left to whoever hits it first. With `unlimitedStorage` granted this is no longer a contention, but the shared-quota assumption is written into `frame-capture.js:29`'s comment and must be corrected there or it will be reasoned from again."
  - "Verified by a real fill, not only by unit tests: drive the journal to the ceiling with the extension loaded and confirm the founder-visible signal fires. This defect's whole character is that it is invisible; the proof of the fix is seeing it."
