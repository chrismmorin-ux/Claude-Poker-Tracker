id: "WS-515"
title: "The hand journal fills against a 10MB quota at ~3,576 hands — well before `MAX_JOURNAL = 5000` — and the quota throw is caught into a report that never increments `dropped`, so `enqueueHand` returns `success: true` while the hand is permanently gone"
