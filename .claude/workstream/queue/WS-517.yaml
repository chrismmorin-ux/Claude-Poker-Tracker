id: "WS-517"
title: "A dead capture is visually identical to a live one — `buildStatusBar` returns LIVE on a cumulative hand count with no recency term, the 30s escalation is hard-gated on `handCount === 0`, and the panel's only freshness readout is hidden the instant hands exist"
