description: |
  FOUND 2026-08-16 by two independent source audits of the Ignition capture extension. Every
  file:line re-verified against HEAD.

  THREE INDEPENDENT MECHANISMS, ALL KEYED OFF COUNTERS THAT ONLY EVER INCREASE, AND THEY
  COMPOSE INTO A SINGLE BLINDNESS.

  1. THE STATUS BAR IS STICKY-LIVE. `side-panel/render-orchestrator.js` — `buildStatusBar` is
     declared at `:1465` and returns at `:1477-1478`:

         } else if (handCount > 0) {
           return { tier: STATUS_TIERS.LIVE, text: `${handCount} hands captured` };

     There is no recency term anywhere in the function. The branch above it at `:1475-1476`
     (`tableCount > 0 && handCount > 0`) is equally recency-free. `handCount` is cumulative, so
     once one hand has ever been captured the panel reads LIVE for the rest of the session,
     forever, regardless of whether anything has arrived in the last second or the last hour.

  2. THE ESCALATION CAN NEVER RE-ARM. `side-panel/render-coordinator.js:1247`:

         const inWaitingState = !!connected && tableCount > 0 && handCount === 0;

     The strict `=== 0` is deliberate and documented at `:1236-1239` (null distinguishes a boot
     race). It is correct for the problem it was written for and it means the 30s escalation is
     available exactly once, before the first hand, and is permanently unavailable afterwards.

  3. THE ONE FRESHNESS READOUT IS HIDDEN WHEN IT BECOMES RELEVANT. The panel does compute
     recency, in two places, and both live inside `#pipeline-health`:

         side-panel/side-panel.js:996  — `Last hand: ${handAge}s ago · ${d.handCompletedCount || 0} total`
         side-panel/side-panel.js:949  — `ctx: ${...} (${ctxAge} ago) · hands: ${...}`

     And `side-panel.js:1867` — inside the `else` of `if (!snap.hasTableHands)` at `:1861` —
     runs `hideEl($('pipeline-health'));`. So the moment `hasTableHands` becomes true, the only
     display in the entire panel that shows how long it has been since the last hand is hidden.
     The freshness indicator is visible exactly while there is nothing to be fresh, and hidden
     from the first hand onward.

  THE COMPOSITE. Capture dies mid-session and: the status bar still says LIVE with a hand count
  that stops climbing, the escalation cannot fire because a hand has been seen, the freshness
  readout that would show `Last hand: 2400s ago` is hidden because hands exist, and — per
  WS-516 — the content script's silence detector has permanently disarmed for the same reason.
  Four mechanisms, one shared cause: every one of them decides liveness from a monotonically
  increasing count rather than from a timestamp. NOTHING IN THE SYSTEM CAN TELL THE FOUNDER
  CAPTURE STOPPED. He finds out by noticing, hours later, that a number did not move.

  WHY THIS IS A DATA TICKET AND NOT A UI TICKET. The corpus is the product. A session that
  captures for twenty minutes and then dies enters the dataset as a complete short session — no
  gap marker, no truncation flag, no way after the fact to know which hands are missing or that
  any are. Every villain frequency computed over it is conditioned on "the part of the session
  where the extension was still alive", a selection nobody chose and nobody can correct for. The
  status bar reading LIVE is what makes it unrecoverable: the founder had the one opportunity to
  notice, in the moment, and the surface told him everything was fine.

  THE FIX. `buildStatusBar` takes a recency term sourced from `pipeline_diagnostics.lastHandCompletedAt`
  — which already exists, since `side-panel.js:996` computes `handAge` from it. LIVE requires
  both a hand count and a recent hand; past a threshold the tier degrades to a STALE/dead state
  with the age on its face. That single change also makes the hidden `#pipeline-health` readout
  non-load-bearing, because the fact it carried is promoted into the surface that is always
  visible.
accept_criteria:
  - "`buildStatusBar` cannot return LIVE without a recent hand. The tier is a function of `lastHandCompletedAt` as well as `handCount`, and past a threshold it degrades to an explicit stale/dead tier that states the age — 'no hand for 12 min', not a silent downgrade."
  - "The age is on the ALWAYS-VISIBLE surface. Promoting recency into the status bar is the fix; leaving it in `#pipeline-health` and merely un-hiding that panel moves the defect rather than removing it, because the panel is diagnostic chrome the founder is not watching mid-hand."
  - "`side-panel.js:1867` no longer hides the only freshness readout on the transition that makes freshness matter. Either the hide condition is corrected, or the readout it hides is no longer the only one — one of those must be true, and which one is chosen is stated."
  - "The 30s escalation re-arms. `render-coordinator.js:1247`'s `handCount === 0` gate is replaced by a recency condition, preserving the documented boot-race distinction at `:1236-1239` — that null-vs-zero handling is correct and must survive the change."
  - "Rendering tests assert the dead state: given a snapshot with `handCount = 40` and `lastHandCompletedAt` well in the past, `buildStatusBar` does NOT return LIVE. Against HEAD that assertion fails. Add it for both the `handCount > 0` branch (`:1477`) and the `tableCount > 0 && handCount > 0` branch (`:1475`) — fixing one and not the other leaves a live path to a false LIVE."
  - "Verified VISUALLY, in the harness and in a real side panel — `npm run harness` serves 16 scenarios on localhost:3333 and a dead-capture scenario is added to it. Per CLAUDE.md, visual verification is mandatory for sidebar changes and a status-tier claim is never made from code alone. Screenshot the live state and the dead state side by side; if they are not obviously different to a founder glancing at a phone, the fix is not done."
  - "The gap is RECORDED as well as displayed. When capture is detected dead and later resumes, the session record carries the dead interval, so a truncated session is identifiable in the corpus after the fact rather than only in the moment. A banner the founder missed leaves no evidence; the whole cost of this defect is unrecoverable retrospective ambiguity."
  - "Verified against a REBUILT extension. `dist/` is 11 days stale (see status_note) — running `npm run build` in `ignition-poker-tracker/` before loading is part of this ticket's verification, not an incidental step."
