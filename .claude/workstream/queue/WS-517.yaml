status_note: |
  No existing item covers this. Checked WS-370, WS-460 / FIND-122, FIND-083, WS-358 — none touch
  the status bar, the escalation gate, or `#pipeline-health` visibility. Paired with WS-516: same
  root shape (liveness decided by a monotonic counter), different files, separable fixes, and
  neither alone closes the blindness.

  CITATION CORRECTIONS made while re-verifying against HEAD:
    - `render-orchestrator.js:1465` is the `buildStatusBar` SIGNATURE; the recency-free LIVE
      return is at `:1477-1478`. Also flagged during verification: `:1475-1476` is a second
      recency-free branch the audit did not mention, and it must be fixed in the same change.
    - `ctx: N (Xs ago)` is at `side-panel.js:949`, not `:948` (`:948` computes `ctxAge`).
    Confirmed exactly as cited: `render-coordinator.js:1247`, `side-panel.js:996`, `:1867`.

  BUILD STALENESS — RECORDED HERE BECAUSE THIS IS THE TICKET THAT REQUIRES LOADING THE EXTENSION.
  `ignition-poker-tracker/dist/` was built 2026-08-04 15:15:34 (uniform mtime across the whole
  tree) and the source is two commits ahead: `0457b9a3` (2026-08-07) and `0d011fbe` (2026-08-13).
  Newest source files on disk are 2026-08-15/16. So the loaded extension is running 2026-08-04
  code, and any observation made against it — for this ticket, WS-516, WS-514 or WS-515 — is an
  observation about a build eleven days behind the source being read.

  Two things make that hard to notice. `dist/` carries NO build stamp: no `buildTime`, `builtAt`
  or equivalent token anywhere in the tree, and `dist/manifest.json` shows only the static
  `"version": "0.9.0"`, unchanged since before the drift. And `dist/` is gitignored
  (`ignition-poker-tracker/.gitignore:1`), so nothing in version control tracks its freshness.

  A related claim from the source audits is CORRECTED here rather than filed. The audits reported
  that "the repo root cannot load as an unpacked extension" because `background/service-worker.js:12-17`
  uses ESM `import` while `manifest.json` declares no `"type": "module"`. There is no repo-root
  `background/` or `manifest.json` at all — `git ls-files` returns nothing for either. The
  construct is real one directory down: `ignition-poker-tracker/background/service-worker.js:12-17`
  is six ESM imports, and `ignition-poker-tracker/manifest.json`'s background block is
  `{ "service_worker": "background/service-worker.js" }` with no `type`. But this is NOT a defect:
  `build.mjs` bundles the service worker, and `dist/background/service-worker.js` opens `(() => {`
  with esbuild's `__esm`/`__export` shims and contains zero import statements. The source tree was
  never intended to load unpacked; `dist/` is the load target and it works. The only real problem
  in this area is the staleness above, which `npm run build` fixes in seconds.

  WORTH FILING SEPARATELY IF IT RECURS: a build stamp in `dist/` plus a freshness check would make
  "am I testing current code?" answerable instead of requiring an mtime comparison. Not filed as
  its own ticket yet — it is one line of `build.mjs` and belongs to whoever touches this next.
