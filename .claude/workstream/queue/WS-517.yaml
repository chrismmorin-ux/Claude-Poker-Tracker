decision_flags:
  - |
    OPEN — WHAT THRESHOLD MAKES A CAPTURE "DEAD", AND IT IS A POKER QUESTION NOT A UI ONE. At a
    live 9-handed table the founder is observing, the gap between completed hands is minutes, and
    it varies with table speed, breaks, and his own absence from the table. Too tight and the bar
    cries dead during a normal orbit, which trains him to ignore it — the failure mode that
    retired the last alarm. Too loose and a dead capture reads LIVE for a quarter of an hour.
    `SILENCE_THRESHOLDS` (`ignition-capture.js:500-505`) already encodes an escalation ladder for
    the WebSocket layer; whether the panel reuses that ladder, derives one from observed
    inter-hand intervals in already-captured sessions, or takes a founder-declared number should
    be decided rather than defaulted. Deriving it from real captured data is the improvement-
    default answer and is cheap — the inter-hand intervals are already in the corpus.
