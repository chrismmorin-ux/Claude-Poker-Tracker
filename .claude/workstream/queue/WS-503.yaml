compute_job:
  # G16 measured 2026-08-16: 320 players / 1160 decisions in ~25 min at 12 workers on a
  # 20-core machine. cm-node1 is a Surface Pro 8 with 8 logical cores, so ~4 workers and
  # roughly 3-4x slower per player. 1200 players therefore projects to ~4-5 h. The cap is
  # set above a pessimistic multiple of that rather than at the number it "should" take.
  maxJobHours: 8
  steps:
    - name: hero-ev-c3-1200
      cmd: node
      args:
        - "scripts/backtest/run-hero-ev.mjs"
        - "--reference"
        - "none"
        - "--behavior-policy"
        - "out/behavior-policy.json"
        - "--sites"
        - "FTP,PS"
        - "--stakes"
        - "50NLH"
        - "--max-files"
        - "60"
        - "--max-decisions"
        - "40000"
        - "--max-decisions-per-player"
        - "4"
        - "--target-contributing-players"
        - "1200"
        - "--wave-size"
        - "16"
        - "--workers"
        - "4"
        - "--power-gate"
        - "warn"
        - "--power-override"
        - "C3 continuation to k=1200 on the pinned 50NLH FTP+PS population. Re-baseline at k=308 read edge 2.2669 CI [-1.1685,+5.5626]; ~679 clusters are needed to exclude zero at that edge. NOT an attempt at the 0.20bb WS-410 target."
        - "--out"
        - "out/hero-ev-c3-1200.json"
        - "--card"
        - "out/hero-ev-c3-1200.card.json"
      expectFiles:
        - "out/hero-ev-c3-1200.json"
        - "out/hero-ev-c3-1200.card.json"
      maxAttempts: 2
  artifacts:
    - "out/hero-ev-c3-1200.json"
    - "out/hero-ev-c3-1200.card.json"
