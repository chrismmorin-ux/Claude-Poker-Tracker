  - "Contributing players >= 679 (target 1200); artifact + Result Card written."
  - "Deal Book covers exactly the two 50NLH directories FTP + PS — same population as the 2026-08-16 row."
  - "Outcome recorded to scorecard via `--record --from`, INCLUDING disclaimerRegisterVersion, whether it passes or fails."
  - "If it fails at k >= 1200, that is written up as the answer — not as a request for more data."
