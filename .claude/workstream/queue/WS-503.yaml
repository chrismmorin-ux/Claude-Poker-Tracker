description: |
  GATE CRITERION C3. Founder decision 2026-08-16: close C3/C4/C5/C6 now.

  WHAT THE RE-BASELINE FOUND, AND WHY IT MATTERS MORE THAN THE FAILURE ITSELF.
  On a clean tree at c5b8beaf, with corrected rake arithmetic and SORTED corpus
  discovery, hero-EV read:

      edge 2.2669   CI [-1.1685, +5.5626]   308 contributing players
      admissible: true · complete: true · engineDirty: false

  The prior run everyone was quoting (out/hero-ev-300p.json, 2026-08-07) read
  edge 5.2623 / CI low +2.1323 at 278 players and was treated as a C3 PASS. It was
  not one. It ran on a DIRTY tree, on UNSORTED corpus discovery, and — the load-bearing
  part — under fault register FR-1+746d7b4aaea4, which predates
  FAULT-untaxed-fold-branch (confirmed 2026-08-15: "the fold branch of every postflop
  EV paid an unraked pot"). The corrected run at MORE clusters more than halved the
  edge. C3 was never honestly passing; the pass was fault-inflated.

  So this is not "the run failed, try again". It is: the honest estimate is smaller
  than we thought, and the question is whether it is distinguishable from zero.

  THE n THAT RESOLVES IT — stated in advance, per improvement-default.
  Half-width is 3.366 at k=308 and scales as 1/sqrt(k). To get ciLow > 0 at
  edge 2.2669 needs half-width < 2.2669, i.e.

      k >= 308 * (3.366 / 2.2669)^2  ~=  679 contributing players

  Target 1200 for margin, because the EDGE ESTIMATE itself moves with k and may
  drift down as easily as the interval tightens. A run that lands edge 1.4 at
  k=1200 still fails, and that would be a real answer rather than a shortfall.

  PRE-REGISTERED FALSIFIER (record the outcome unhedged either way):
    PASS  -> ciLow > 0 at k >= 679. C3 closes on honest evidence.
    FAIL  -> ciLow <= 0 at k >= 1200. Then the engine's advice is NOT measurably
             better than the pool on this population, and that is the finding —
             it must NOT be reported as "needs more data" a third time.

  WHY THE SAME POPULATION, PINNED EXPLICITLY.
  G16 holds only two corpus directories, both 50NLH:
    FTP-2009-07-01_2009-07-23_50NLH_OBFU · PS-2009-07-01_2009-07-23_50NLH_OBFU
  cm-node1 holds all 27 (25NLH-1000NLH, six sites). Running unfiltered there would
  measure a DIFFERENT population and would not be comparable to the recorded
  2026-08-16 row. `--sites FTP,PS --stakes 50NLH` reproduces G16's two directories
  exactly, so this is a continuation at higher n and nothing else.

  The broader-population question is real and separate — see WS-504, which must be
  built before it can be asked honestly (`--max-files` slices a SORTED list, so any
  capped multi-stake run is stake-biased by directory name).

  DO NOT quote the resulting edge as a live-game figure. Corpus is online July 2009,
  50NLH; the founder's game is live 9-handed 1/2-1/3. Transferred, not measured.
accept_criteria:
  - "Run completes with admissible: true, complete: true, engineDirty: false at HEAD."
  - "Contributing players >= 679 (target 1200); artifact + Result Card written."
  # AMENDED 2026-08-17 when WS-504 shipped. The second clause was FALSE and had to go: the
  # 2026-08-16 row is FTP-only (4,640 `FTP:` / 0 `PS:`), so "same population" named a sample
  # that never existed. This run is the FIRST two-site measurement, not a higher-n repeat.
  - "Deal Book `realisedComposition` covers BOTH 50NLH directories with a non-zero count from each."
  - "The comparison is stated as being to a SUPERSEDED, re-labelled FTP-only row — not to the same population at lower n. The Deal Book hash will differ from 4555adb4; that is correct."
  - "Outcome recorded to scorecard via `--record --from`, INCLUDING disclaimerRegisterVersion, whether it passes or fails."
  - "If it fails at k >= 1200, that is written up as the answer — not as a request for more data."
