description: |
  ENGINE_VERSION = 'v123' has never changed (one commit in its git history) while the engine's
  math changed three times in eleven days (WS-436/450/451). predictionAuditWriter composes
  modelVersion from it specifically to separate engine eras; every prediction record before and
  after the wave carries an identical version string. The damage is retroactive and grows daily —
  the only defect in the 2026-08-13 challenge run whose harm cannot be repaired after the fact.
  Bump now; add a CI gate failing any commit touching src/utils/exploitEngine/, src/utils/rangeEngine/
  or src/utils/handAnalysis/ without changing the constant; document that the app/engine
  co-versioning premise stopped holding.
accept_criteria: |
  - Two prediction records — one pre-2026-08-13, one after the next engine change — carry different
    version strings.
  - Deliberately editing an engine file without bumping the version makes the test run FAIL with a
    message naming the constant.
  - runtimeVersions.js documents the broken co-versioning premise and (optional, founder call) a
    "version unknown, recorded before 2026-08-13" backfill marker is defined for historical records.
