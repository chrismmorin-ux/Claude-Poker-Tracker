accept_criteria: |
  - A per-cell decomposition of every axis rung, with per-cell n and MDE. An aggregate null is
    never reported without it.
  - Coarse-bin proxy arms scored against the fine-grained encoding. If a proxy wins, that IS the
    finding about how the villain simplifies.
  - Behavioural coverage reported beside EV for every axis arm.
  - The retraction above stays recorded in the ladder spec. A future reader must not re-derive
    "the pool does not read SPR" from a run that could not have shown it.
  - If SPR genuinely does not appear in ANY cell at adequate power, that is stated with the per-
    cell power that supports it -- not inferred from an aggregate.
