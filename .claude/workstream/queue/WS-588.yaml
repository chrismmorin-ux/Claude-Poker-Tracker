description: |
  THE HALF THAT MAKES WS-587 REAL. A Lesson without a Recovery score is a suggestion, and
  the whole reason for the session lock is that suggestions get re-read in the light of what
  happened. This item is the reading that is fixed in advance.

  RECOVERY. The realized EV change at the Lesson's spot, measured as Divergence between
  hero's Conduct Card at the time the Lesson was written and the next one, RESTRICTED TO
  THAT SPOT. Divergence is unsigned by rule, so the direction comes from the time ordering -
  the same construction WS-554 uses for archetype torsion, applied to hero.

  THE CONFOUND WS-554 ALREADY NAMED, AND IT BITES HARDER HERE. "You cannot measure drift in
  the player if the instrument also drifts." If the two hero cards are built by different
  inducers, "hero improved" is confounded with "the inducer changed". Hero's cards must be
  re-inducible under the current inducer, and a card built by a superseded one is REFUSED for
  comparison, not silently compared. This item does not get to assume WS-554 solved it for
  villains only.

  THE SECOND CONFOUND, WHICH IS NEW AND SPECIFIC TO HERO. Hero chose which Lesson to work on.
  Whatever he worked on is also what he was thinking about at the table, so a measured
  improvement at the Lesson's spot is contaminated by attention, not only by the drill. Two
  consequences, both required: the score reports the change at the Lesson's spot AND at
  spots the Lesson did not name (an in-hero control), and a Lesson that improves everything
  equally has learned nothing specific and says so.

  THE N PROBLEM DOMINATES AND THE HONEST OUTCOME IS USUALLY "NOT YET". One session does not
  produce enough decisions at one spot to move a Wilson interval. Recovery is therefore
  evaluated on an accumulating window with a stated minimum, and reports `unexamined` with a
  reason until it clears - never a point estimate dressed as a verdict. A Ledger where most
  rows read "not yet scoreable" is the CORRECT early state, and the surface must show it that
  way rather than hiding empty rows.

  WHAT THE LEDGER THEN ANSWERS. Over a season: does our own advice make money. Same question
  the hero-EV instrument asks of the engine, pointed at the founder. That number is a
  comparative claim and resolves to a Result Card like any other.

  THE REVEALED-PREFERENCE PRIOR APPLIES. If Recovery reports that working on a line
  results-tracking winning players demonstrably use made hero WORSE, the leading hypothesis
  is that the model of the line is wrong, not that the study was wrong.
accept_criteria: |
  - Recovery computes as Divergence between two hero Conduct Cards restricted to the
    Lesson's spot, direction taken from time ordering.
  - Cards built by a superseded inducer are refused for comparison, with the refusal named.
  - An in-hero control is reported alongside: change at spots the Lesson did not name.
  - Reports `unexamined` with a reason from a closed enum until the accumulating window
    clears its stated minimum n; never a point estimate before that.
  - Each Ledger row shows its falsifier as written at lock time, and whether it fired.
  - Season-level "did our advice make money" resolves to a Result Card with a declared
    `metrics` variant.
  - A Lesson whose measured improvement is indistinguishable from its control is recorded as
    such and is not counted as a success.
