description: |
  Follow-up to WS-250 (FIND-032). The sizing-tell read (Pearson r over bet-fraction
  vs shown-hand strength) is now COMPUTED (decisionAccumulator.sizingTells) and
  SURFACED (villainProfileBuilder.buildAwareness → AwarenessPanel + decision-model
  description, direction-aware). WS-250 deliberately stopped at surface-only so a
  noisy small-sample correlation could never flip a live EV decision.

  This ticket wires the confirmed sizing tell into the live game-tree bluff-catch
  decision (gameTreeDepth2 / gameTreeEquity bluff-catch thresholds): a POSITIVE
  correlation should shade toward folding marginal hands to large bets and calling
  small bets; an INVERSE correlation the opposite. Must be a bounded nudge behind a
  strict sample-size + confidence gate — never a hard override (consequence-weighted
  confidence, exploitEngine/CLAUDE.md §2).

  Also owns the PER-STREET refinement: today's correlation pools all streets, which
  can be spurious because bet sizes naturally grow across streets while strength
  evolves. Per-street splitting matters most once it drives EV — and needs more
  samples than the surface display does, so it lives here, not in WS-250.
accept_criteria: |
  - Sizing-tell correlation feeds bluff-catch call/fold thresholds, gated by both
    sample count and bayesianSampleConfidence; bounded magnitude, no hard override.
  - Direction-aware (positive vs inverse correlation produce opposite shades).
  - Per-street correlation computed + gated independently; pooled-street correlation
    no longer drives EV once per-street is available.
  - Tests: EV decision flips only above the gate; below gate, behavior unchanged.
