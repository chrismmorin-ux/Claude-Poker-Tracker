description: |
  gameTreeDepth2.js computes required equity with the bluffer's breakeven bet/(pot+bet) at four
  sites (:445, :639, :1549, :1656) where the caller's pot odds bet/(pot+2*bet) belong; the file
  contradicts its own EV formula three lines apart (:639 vs :644). foldEquityCalculator.js:378-400
  already implements villainRequiredEquity correctly and is not imported here. A fifth,
  previously-documented site exists in gameTreeEvaluator (exploitEngine/CLAUDE.md:484-496).
  At half-pot: 0.333 computed vs 0.250 correct. This code runs in the depth-2/3 arm only, so
  WS-378's headline "38 of 40 river flips toward passivity" (RC-depth-ablation) was measured
  THROUGH this defect — the depth-validation question (WS-361) reopens after the fix.
  Full mechanism: findings/FIND-112.yaml. Structural half (S2): CI grep rule banning new inline
  pot-odds arithmetic in exploitEngine/.
accept_criteria: |
  - All five sites route through villainRequiredEquity (or an equivalently shared seam); zero
    inline bet/(pot+bet) threshold arithmetic remains in exploitEngine/.
  - Closed-form known-answer tests pin the caller threshold at 1/3-pot, 1/2-pot, and pot sizings
    (0.20, 0.25, 0.333).
  - CI grep gate rejects reintroduction of the inline pattern.
  - The depth ablation re-runs and re-issues its Result Card; the WS-378 passivity result is
    re-stated (confirmed, reversed, or attenuated) against the fixed formula.
  - Plain English: on a $100 pot with a $100 bet, the app says the opponent needs 33% equity to
    call, not 50%.
