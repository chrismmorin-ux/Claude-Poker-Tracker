status_note: |
  Written after the fix, from a live founder report during a money session — not composed
  from the queue. Filed so the three defects and the two open decisions above are on the
  record rather than living only in commit history.

  NOT VERIFIED AGAINST A LIVE TABLE. Build passes and the full extension suite is green
  (2387 tests, 84 files, +12 new), but nothing here was exercised against a real Ignition
  session — the founder was mid-session and reloading the extension would have cost live
  capture. First real-table session should confirm the hand count advances end-to-end.
