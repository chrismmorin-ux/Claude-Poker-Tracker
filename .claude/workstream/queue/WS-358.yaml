decision_flags:
  - |
    RECORDED — the durable journal lives in chrome.storage.local, not .session.
    chrome.storage.session defaults to TRUSTED_CONTEXTS, so content scripts cannot read
    it; .local has no equivalent control, so our own ISOLATED-world content scripts on the
    casino origin can read the journal. Casino PAGE scripts still cannot — chrome.storage
    is not exposed to page JS at all. Traded that narrow widening for durability of
    money-hand data. Revisit if the threat model changes.
  - |
    RECORDED — auto-opening a tab is an unprompted side effect. Guarded to one attempt per
    SW lifetime, opened with active:false so it never steals focus from the table. The
    alternative (keep asking the founder) is what caused the incident.
  - |
    OPEN — MAX_QUEUE raised 100 → 500 and MAX_JOURNAL set to 5000. Both are guesses, not
    measurements. Nobody has characterised the founder's real session length in hands, so
    the headroom is unvalidated. Worth deriving from actual session data once the journal
    has accumulated some.
  - |
    OPEN — the popup was removed from the toolbar-icon path (default_popup deleted so
    openPanelOnActionClick works). Its counters and Export Hands moved behind the options
    page. If Export turns out to be something the founder reaches for often, it needs a
    home on the sidebar rather than two clicks into Settings.
