decision_flags:
  - |
    OPEN — DOES WS-361 WIDEN OR DOES THIS TICKET STAND AS ITS SIBLING? WS-361's status note
    already recommends widening its own scope to `riverPerCombo`; its accept criteria have
    not been rewritten. Widening keeps one owner for "the refinement stages disagree with
    depth-1" but buries a P0 river question inside a ticket about `E[max(...)]` optimism on
    the flop and turn. Splitting keeps the river visible but risks the two drifting. The
    founder's call. Whichever way it goes, ONE ticket must name the river as in scope.
  - |
    OPEN — IS THE PASSIVITY A CORRECTION RATHER THAN A DEFECT? Depth-1 has no per-combo
    model of what actually beats hero at showdown, so it can over-value thin river value
    bets, and a per-combo river evaluation checking those back would be RIGHT. This is the
    same shape as WS-361's DEFECT 2 (checking back AA on A72). The question is not "does
    the engine prefer checking" but "is the MARGIN by which it prefers checking produced by
    the showdown-outcome distribution or by a haircut term that does not belong on a
    complete board". Answer that before changing any EV.
