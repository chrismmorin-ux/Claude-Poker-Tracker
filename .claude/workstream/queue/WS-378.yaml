status_note: |
  Premises re-verified against HEAD by reading the code, not by trusting the commit message:
    - `gameTreeEvaluator.js:537` — `needsDepth2: street !== 'river'`, and it is the ONLY
      construction of that flag in `src/utils/exploitEngine/`. The river genuinely cannot
      reach depth-2.
    - `gameTreeEvaluator.js:1409` — `gateStage('riverPerCombo', { street: street === 'river' })`.
      WS-361's note cites 1327; that is line drift since WS-356/WS-357 landed, not a changed
      mechanism.
    - `gameTreeEvaluator.js:1419` `computeRiverCheckEV`, `:1457` `computeRiverBetEV`,
      `:1479-1490` the inline call pricing — three separate estimators, all writing
      `candidate.ev` wholesale, all compared against each other afterwards.
    - `docs/standard-of-record/DEPTH-ABLATION-2026-08-05.md` exists.

  The founder's standing rule that makes this a P0 rather than a curiosity: a null or
  surprising result measured on an unverified substrate is a statement about the substrate.
  The depth ablation returned a CI that includes zero on the quantity it set out to measure,
  and in doing so pointed at a different stage entirely. `riverPerCombo` is now the substrate
  under test.

  Source: commit 0fa91d23, "feat(backtest): depth-2's accuracy delta, and the flips are on a
  street depth-2 never runs (WS-334 AC5)".
