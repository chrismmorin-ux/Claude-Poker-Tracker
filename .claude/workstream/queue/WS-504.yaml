description: |
  FOUND 2026-08-16 while routing the C3 continuation (WS-503) to cm-node1.

  THE DEFECT. `discoverCorpusFiles` returns a SORTED file list (6d785025 made it sorted,
  correctly — before that it was filesystem-ordered and irreproducible across machines).
  `--max-files N` then takes the first N of that sorted list. Directory names lead with
  the site code, so on cm-node1's 27-directory corpus the first 60 files are ALL from
  `ABS-2009-07-01_2009-07-23_1000NLH_OBFU`.

  A run invoked as "full corpus, capped at 60 files for cost" therefore measures ONE SITE
  AT ONE STAKE, and says nothing about it. Nothing in the artifact reveals this: the Deal
  Book is named `handhq-allsites-allstakes-<hash>` because that is the discovery filter,
  not the realised sample.

  WHY IT MATTERS RIGHT NOW, WITH A NUMBER. WS-492 measured a monotone stake gradient
  across this corpus — 6-max 3-bet +57% from 25NLH to 1000NLH, PFR +31%. A sample that
  silently collapses onto one stake is not a smaller version of the corpus; it is a
  different population. This is the same class of error as WS-492's own finding that the
  shipped tables were fitted 4x below the founder's stake.

  It did NOT corrupt anything measured so far, because G16 holds only two directories and
  both are 50NLH — the bias had nothing to express. It becomes live the moment a capped
  run executes on cm-node1, which is exactly what the fleet compute feeder now routes
  there. WS-503 is pinned with `--sites FTP,PS --stakes 50NLH` to sidestep it, and that
  pin is a workaround, not the fix.

  ── CORRECTION 2026-08-17 (measured, while fixing WS-513). ────────────────────────────
  THE TWO PARAGRAPHS ABOVE ARE WRONG ON BOTH COUNTS, and in the same way.

  "It did NOT corrupt anything measured so far" is false. The STAKE bias had nothing to
  express on G16 — that part holds. The SITE bias expressed fully and always has.
  `discoverCorpusFiles({sites:['FTP','PS'],stakes:['50NLH']})` returns 1756 files sorted:
  FTP 525, then PS 1231. The first PS file sits at index 525. So on G16, with its two
  directories, ANY `--max-files <= 525` is 100% FTP and 0% PS.

  The C3 re-baseline is affected. out/hero-ev-c3-20260816.json ran `--max-files 60` and
  contains 4,640 occurrences of `FTP:` and ZERO of `PS:`. The row quoted everywhere as
  "edge 2.2669, CI [-1.1685,+5.5626], 308 clusters, the pinned 50NLH FTP+PS population"
  is a ONE-SITE measurement. Every artifact naming that population is mis-labelled the
  same way the Deal Book hash is: the name records the discovery filter, not the sample.

  "WS-503 is pinned with `--sites FTP,PS` to sidestep it" is also false, and it is the
  more dangerous sentence because it reads as reassurance. The site pin selects which
  directories are DISCOVERED; the sorted prefix then decides which are READ. A filter
  upstream of a prefix cannot correct the prefix. There is no value of `--max-files`
  that yields a two-site sample here — raising the cap while
  `--target-contributing-players` binds just stops the run earlier inside the FTP block.
  Stratification is not the preferred fix among several. It is the only one.

  CONSEQUENCE: this ticket is now a hard prerequisite of WS-503 (recorded in its
  `blocked_by`), and closing it should also re-run or explicitly re-label the C3 row.
  ──────────────────────────────────────────────────────────────────────────────────────

  THE FIX — build the instrument, do not shrink the question.
  1. Add stratified selection: `--max-files` should draw PROPORTIONALLY (or round-robin)
     across the discovered directories rather than taking a sorted prefix. Deterministic
     and seeded, so it stays reproducible.
  2. Make the realised sample self-describing: the Deal Book / replication stamp must
     record the per-directory file counts actually used, so "allsites-allstakes" can never
     again name a single-stake sample.
  3. Refuse-or-warn when a cap collapses the sample onto fewer directories than were
     discovered — the artifact should say so rather than the reader having to notice.

  Until (1) and (2) exist, the broad-population hero-EV question (does the engine's edge
  hold across 25NLH-1000NLH, not just 50NLH?) cannot be asked honestly, because any
  affordable capped run answers a different question than it appears to.
accept_criteria:
  - "`--max-files N` over multiple directories yields a sample spanning them, deterministically and reproducibly."
  - "Replication stamp / Deal Book records per-directory file counts of the REALISED sample, not just the filter."
  - "A cap that collapses the sample onto a strict subset of discovered directories is reported in the artifact."
  - "Regression test: capped discovery over >=3 synthetic directories draws from all of them."
  # AC5 AMENDED 2026-08-17 AT CLOSING TIME, because as written it is unsatisfiable and closing
  # it unamended would mean asserting something this ticket's own CORRECTION section refutes.
  # It asked that WS-503's pinned invocation "still reproduce the identical two-directory 50NLH
  # sample". That sample HAS NEVER EXISTED — the site pin chose what was DISCOVERED and the
  # sorted prefix then chose what was READ, so every pinned run was one directory. Split into
  # the two invariants it was reaching for; both are asserted in corpusFiles.test.js.
  - "AC5a: an UNCAPPED draw returns the same array identity, so nothing pre-WS-504 moves."
  - "AC5b: `--file-selection prefix` reproduces a published sample bit-identically. Measured on the real 1,756-file 50NLH slice (525 FTP / 1231 PS): prefix at 300 files yields contentHash sha256:1c560bcc8ba77b640… — IDENTICAL to the published handhq-allsites-50NLH-1c560bcc — with only the NAME moving to handhq-FTP-50NLH-1c560bcc. Proportional yields 90/210 as handhq-FTP+PS-50NLH-ae2172f5."
