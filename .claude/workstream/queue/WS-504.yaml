  ── CLOSING NOTE 2026-08-17 ───────────────────────────────────────────────────────────
  THE BLAST RADIUS IS WIDER THAN THIS TICKET DESCRIBED, and that is the main finding.
  The C3 row is not the exception; it is the one that got noticed. Measured:
  `handhq-allsites-50NLH-1c560bcc` — the Deal Book behind RC-depth-ablation.json and BOTH
  RC-river-flip-replicate cards, and quoted in DEPTH-ABLATION-2026-08-05.md,
  SCORED-READOUT-SPEC.md and POKER_THEORY.md — is 300 of 300 Full Tilt files. Siblings:
  ...-aa3f0447 (RC-layer-divergence), ...-790a6ffd (per-player-width), ...-38f96a38,
  ...-c0043f8b, ...-24302c8e. Handled by FAULT-prefix-corpus-selection (confirmed), which
  matches structurally on manifest.fileSelection rather than by editing published cards.

  ALSO CORRECTED: this ticket says the C3 run was "the pinned 50NLH FTP+PS population".
  It was not pinned at all — its sliceSpec is {sites: null, stakes: null, maxFiles: 60}.

  THE DEFECT THAT WAS STILL LIVE when this was picked up. Stratified selection was already
  written and uncommitted, with 32 green tests — and `buildReplicationManifest` destructured
  a FIXED KEY LIST and rebuilt the object, so the `fileSelection` that schemas.js registered
  and replicationStamp.mjs produced was dropped before it reached the Result Card. The
  schema advertised a field the builder could not deliver. The builder is now driven by
  MANIFEST_SCHEMA, so a registered field cannot be silently dropped again, and an
  UNregistered one still cannot get in.

  NOT DONE HERE, WITH OWNERS (see WS-504-followon items):
    - Five reports share the admissibility shape and still need their runner to thread
      fileSelection into buildStampInput: depthAblationReport, rangeCalibrationReport,
      studyLadderReport, teachableArmsProbe, layerAblation. sampleAdmissibility.mjs makes
      each a two-line change; the work is in the runners.
    - verify-ws433-determinism.mjs discovers with NO site/stake filter and N_FILES defaults
      to 3, so on cm-node1's 27 directories it reports collapsed on 24 of 27. Separate item.
    - The k>=679 hero-EV question: WS-503, unblocked by this ticket.
