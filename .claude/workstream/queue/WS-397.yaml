status_note: |
  Premises re-verified against HEAD by reading the code.

  VERIFIED AS STATED:
    - `useActionAdvisor.js:2-11` — the header docblock; `:7-8` "This is DISTINCT from
      useLiveActionAdvisor, which runs automatically during live Ignition play via the extension's
      hand state feed"; `:10` the `@see` pointing at `useLiveActionAdvisor` in `OnlineAnalysisContext`.
    - `:37-40` — the WS-333 comment asserting "this advisor serves the MANUAL live table — the
      founder's actual 1/2 game"; `:41` `rakeConfig = null`.
    - Importer census by repo-wide grep: `PlayerAnalysisPanel.jsx:14` (import) and `:39` (call site)
      are the ONLY non-test references. Every other hit is in
      `src/hooks/__tests__/useActionAdvisor.test.js`. Confirmed single non-test importer.
    - The live table's advice path is independent: `CommandStrip.jsx:88` reads
      `useAnalysisContext()`, whose producer is `OnlineAnalysisContext.jsx:57`, fed by
      `useSyncBridge.js:329` (extension-only). `useActionAdvisor` is nowhere on that path.
    - The harm claim is verifiable in this repo's own record: the roundtable's `digest_corrections`
      entry for the cto-agent lens is ruled `WRONG_AND_HARMFUL` on exactly this basis, and
      `useActionAdvisor.js:59-70` does in fact pass neither `numOpponents` nor `opponentModels` nor
      `effectiveStack` (defaults at `gameTreeEvaluator.js:791-793`).

  NOTHING IN THIS TICKET REQUIRED CORRECTION. The run record's account of FIND-054 is accurate at
  HEAD, including both line ranges. It was produced by the cross-critic and by no lens, which is
  consistent with its content: it is a fact about two parts of one file disagreeing, visible only to
  a reader holding both.
