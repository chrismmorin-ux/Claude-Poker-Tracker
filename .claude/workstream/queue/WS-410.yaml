decision_flags:
  - |
    WHICH SINGLE NUMBER IS *THE* OPTIMIZABLE FIGURE. Two candidates, and they fail in opposite
    directions. `overallEvBB100` (= `edgeBB x opportunitiesPerHand x 100`) is interpretable and moves
    when the engine improves — but it also moves when the decision mix or the rake model moves.
    Exploitation efficiency (`strategyPosition.mjs:80-91`) is bounded and INVARIANT TO ENGINE UPGRADE
    by construction, because both pier posts are defined by the population rather than by us — but
    its denominator `EV(PBR) - EV(Field)` is re-fit whenever the Field is re-mined, so it is NOT
    invariant to corpus change. RECOMMENDATION: optimize `overallEvBB100` and report efficiency
    beside it, using the pair to tell a better engine from a differently-mined pool. The founder
    should confirm, because it decides what "the figure" means in every future report.
  - |
    HOW MUCH DOES THE RECORD OVER-CAPTURE, AND AT WHAT STORAGE COST. `atomStore.mjs:11-13` sizes an
    atom at ~1-2 KB with ~4 decisions per hand; 100k hands is therefore ~600 MB raw, materially less
    gzipped, and the additions in Stage 1 are small scalars. The one genuinely heavy field is
    `beliefState` (a per-opponent range grid), which can be orders of magnitude larger.
    RECOMMENDATION: full core row ALWAYS, `beliefState` under `fullSampleRate` — which is already an
    atom-set manifest field (`atomsSelfCheck.mjs:37`), so partial capture of expensive fields is
    anticipated by the existing design. Never sample the core row, because a sampled core row cannot
    reconstruct an aggregate. This is the founder's call because it is a standing disk cost on his
    machine traded against never re-running for a new question.
  - |
    ARM-FLAG DISCIPLINE ON EVERY EV-BEARING FIX, OR CROSS-RUN JOIN. `depthArms` varies a runtime
    PARAMETER; the founder's optimization loop varies CODE. Option A: every EV-bearing fix ships
    behind an arm flag so both behaviours exist in one process and pairing is draw-for-draw — the
    only way to GUARANTEE an identical decision set, at the cost of flag discipline on every fix plus
    a retirement policy for flags. Option B: join two runs on `(dealBookHash, playerId, handId,
    order)` — cheaper per fix, correct only once Stage 3 delivers bit-reproducibility, and unable to
    detect a decision set that silently changed. RECOMMENDATION: A primary, B as the retroactive path
    for already-merged changes (the only way to price WS-378, which is already in HEAD). This is the
    founder's call because option A imposes a recurring tax on every future fix.
  - |
    IS THE ENGINE-GRADED SELF-LEAK FIGURE PUBLISHED AT ALL. "Which players leak the most EV" has two
    definitions. Exploitable edge (`estimateEdge` restricted to a stratum) is realized-chips
    anchored, but with a villain-agnostic policy it measures the POOL'S CONTRIBUTION rather than our
    exploitation. Self-leak (`EV(best) - EV(taken)` under our model) is closer to what the founder
    literally asked for and is `FAULT-self-grading-circularity` in its purest form — the engine
    grading the pool with the engine's own arithmetic. RECOMMENDATION: publish it, labelled a
    diagnostic, never as the headline, and stamp it — suppressing it entirely loses the founder's
    actual question, and the standing rule forbids deleting an instrument for being wrong. The
    founder should rule because it decides whether a number he will want to act on carries a
    permanent asterisk.
  - |
    DOES THE RESULT CARD `metrics` BLOCK GET A DECLARED SCHEMA. Declaring it makes every future run
    carry more structure and makes a producer's convenient one-off shape illegal. Not declaring it
    leaves `metrics` as the one place in the Standard of Record where two numbers are never forced
    onto the same axis — which is the failure ADR-009 exists to prevent, occurring inside its own
    artefact. RECOMMENDATION: declare it; it IS the readout, and the additive-only guard already
    exists. Flagged anyway because it is the schema decision with the widest blast radius and, once
    made, is expensive to reverse.
  - |
    WHICH AXES GET STRATA, AND HOW MANY. The measured evidence supports `limpRate` (SD 14.5pp,
    reliability 0.83 — the strongest behavioural axis this repo has measured), `cbetRate` (SD 12.6pp,
    reliability 0.62, and NOT merely aggression re-expressed — r = 0.180 against the DISJOINT
    control), and the k=2 looseness/stickiness pole. It does NOT support `threeBetRate` (2.1pp
    spread, reliability 0.33). RECOMMENDATION: those three axes, quintiles, no named archetypes.
    Flagged because the founder has a strong prior that sub-archetypes exist as TYPES, and the
    measured answer is a continuum with one dominant axis — he should see that disagreement and rule
    on it rather than have it resolved silently in a schema.
  - |
    SPEND THE RUN BUDGET ON N OR ON BREADTH. The existing calibration point says a half-big-blind
    effect is not separable at n=260 / 22 players. Raising `--max-decisions` and `--max-players`
    buys power on the figures already defined; adding views buys coverage on figures that will be
    underpowered. RECOMMENDATION: N first — an underpowered readout is worse than none, because it
    produces confident-looking rows that cannot fail, and the corpus (59,848 player-site rows) can
    carry far more than the harness currently asks of it.
