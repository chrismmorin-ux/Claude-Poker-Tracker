description: |
  SPEC: `docs/standard-of-record/SCORED-READOUT-SPEC.md` (authored 2026-08-05, verified against HEAD
  `fe716f59`). New vocabulary registered in `docs/standard-of-record/VOCABULARY.md` per that file's
  own standing rule. READ THE SPEC BEFORE ESTIMATING — this ticket is the implementation of it and
  does not restate its arithmetic.

  THE DIRECTIVE. Founder, 2026-08-05: "I want the engine to start giving out accurate fully scored
  runs against the data sets and see what the improvements are doing to expected EV and to the
  ranges. The goal is to optimize this figure, and I have not seen this figure." Plus two binding
  amendments delivered mid-design:

    AMENDMENT 1 — EV IS THE UNIVERSAL UNIT. "Everything should be tied closely to an EV change,
    measured by our standardized method." Said about a real, replicated, carded result
    (`RC-river-flip-replicate-1c560bcc-fe716f59`, systematic flip share 0.7111 -> 0.2222 over 8
    seeded replicates) and still called insufficient — correctly, because a flip count treats a
    marginal check/bet flip and a stack-off flip as the same event, and only an EV denomination
    distinguishes them. Flip counts, rate changes, chi2/df, log-loss and divergence in nats are
    DIAGNOSTICS; the claim is the EV delta. The PER-IMPROVEMENT DELTA outranks the absolute level.

    AMENDMENT 2 — THE RECORD IS THE PRODUCT. "The shape of the thing we spend hours computing on
    must be computed such that we can get extremely detailed information like this." A run costing
    hours must persist a record whose SHAPE admits questions nobody asked when it was designed. The
    aggregate is a VIEW over that record, never the product of it. If a new decomposition question
    requires re-running, the record was the wrong shape.

  THE HEADLINE FINDING, AND IT IS GOOD NEWS. Most of this exists and needs assembling, not building.
  Verified at HEAD by reading the code:
    - The EV edge of our play over the pool IS `estimateEdge` (`ipsEstimator.mjs:189`,
      `edge = wisValue - poolValue` at `:224-227`). The founder's "edge = frame 2 minus frame 3" and
      the shipped arithmetic are the same object. It is outcome-anchored (realized chips `R_d`,
      `heroEvRunner.mjs:211-216`), not self-graded, and its CI clusters over players
      (`ipsEstimator.mjs:134-157`) per POKER_THEORY 14.3.
    - The paired EV delta on an identical decision set EXISTS and cards:
      `depthAblationReport.pairedDelta` (`:203-268`) differences both arms INSIDE one bootstrap draw
      (`:237-241`) and emits `discordantN` (`:250-251`). The identical-decision-set guarantee is
      structural — a decision survives only if EVERY arm produced a policy
      (`heroEvRunner.mjs:234-251`).
    - Archetype separability EXISTS, is tested (26 `it()` blocks), and has a committed card:
      `separability.mjs` + `.artifacts/study-ladder.card.json`. Its verdict is THREE-way —
      `separates` / `underpowered` / `does-not-separate` (`:450-484`) — so it refuses to read a
      weak-power null as absence.
    - Determinism under a frozen clock EXISTS in one runner: `run-river-flip-replicate.mjs:83-87`
      freezes `Date.now` and seeds mulberry32, achieving depth-2 argmax stability 1.000.
    - The Decision Atom schema, its append-only content-addressed store, the census and the
      atoms-self-check ALL EXIST (`schemas.js:100-153`, `atomStore.mjs`, `coverageCensus.js`,
      `atomsSelfCheck.mjs`).

  THE TWO THINGS THAT DO NOT EXIST.

    (1) A DECLARED SHAPE FOR WHAT A RUN REPORTS. `RESULT_CARD_FIELDS` declares `metrics` as
    `{type:'object', note:'The figures themselves.'}` (`schemas.js:286`) and `resultCardProblems`
    NEVER INSPECTS IT (`resultCard.js:119-160`). Every producer invents its own metrics shape. That
    is the exact mechanism ADR-009 exists to prevent — nothing forces two numbers onto the same axis
    — reproduced one level down, INSIDE the object built to stop it. Two cards on disk already
    disagree on the name of the same constant (`REFINEMENT_BUDGET_MS_DEPTH1/DEPTH2` in
    `RC-depth-ablation.json` vs `..._FAST/_FULL` in `RC-layer-divergence.json`).

    (2) THE HERO-EV PATH DOES NOT EMIT ATOMS AT ALL. This is the ticket's centre under Amendment 2.
    `run-hero-ev.mjs` -> `heroEvReport.mjs` is the ONE fully-wired instrument in the repo (stamp +
    Deal Book + leakage guard + Result Card, per `BASELINE-2026-08-04.md`). It builds its own private
    row (`heroEvRunner.mjs:263-301`: `playerId, handId, order, observedAction, netBB, netBBUnraked,
    piOurs, evStats, piOursByArm, piPool, poolEvidenceN, piPbr, piPbrBySweep, slices`) — rich in
    exactly the fields Amendment 2 demands — AND NEVER PERSISTS IT. It lives in memory, is
    aggregated, and is discarded. Meanwhile the Decision Atom, which is schema'd, versioned, hashed,
    stored and additive-guarded, has ONE production producer (`layerAblation.mjs`) and carries none
    of the IPS quantities.

    THAT IS THE WS-291 MECHANISM AT THE RECORD LEVEL: two shapes for the same object, neither forced
    onto the other's axis. The rich one is ephemeral; the durable one is thin. Every hour spent on a
    hero-EV run today produces an aggregate and throws the record away.

  THE DOCTRINE IS ALREADY WRITTEN — SEVEN WEEKS BEFORE THE FOUNDER SAID IT. `schemas.js:101`: "A
  DECISION ATOM — one row per decision. Aggregates are VIEWS over atoms, never the record."
  `schemas.js:131-134`: "over-capture by design. Every field below ships with the FUTURE QUESTION it
  answers, because a field that cannot name its question is speculation rather than instrumentation."
  So `Decision Atom` IS the right noun and must be extended, not paralleled. What the existing shape
  lacks, each with the question it forecloses (spec 4.3): stable player identity (hero AND villain —
  `actorSeat`/`actorRole` exist at `schemas.js:145,147` but `layerAblation.mjs:383` hashes
  `{playerId,handId,order}` ONE-WAY into `atomId` and discards the parts); `handId`/`order` (the
  cross-run join key); the IPS quartet stored SEPARATELY and never pre-multiplied (so a reader can
  tell a big weight from a big outcome); per-action EVs (`alternativeScores` exists at `:135` but its
  only producer fills it with action PROBABILITIES — `predictionAudit/atomize.js:73-84`); achieved
  refinement depth (`evStats.depthReachedMax` is computed at `heroPolicy.mjs:368` and never stamped);
  `budgetBound`; raw per-player observation counts; a top-level `street` (bolted into `carried` as an
  UNDECLARED key by `layerAblation.mjs:395`, legal only because `checkAgainstSchema` ignores unknown
  fields at `schemas.js:444-445`).

  WHY THE RECORD IS THE STRONGEST ARGUMENT, IN THE FOUNDER'S OWN CONSTRAINT. An archetype must PROVE
  it separates before it gets a channel — and that proof may not exist when the run happens. A record
  carrying raw per-player identity and counts lets archetypes be DEFINED NEXT MONTH AND APPLIED TO
  RUNS COMPLETED TODAY. Without identity on the row, every archetype hypothesis costs a full re-run.
  Same for the branch ledger: with atoms keyed identically it is a JOIN
  (`(dealBookHash, playerId, handId, order)`), seconds over runs that each cost hours.

  THREE FRAMES: ONE DOES NOT EXIST, AND MUST BE REPORTED AS ABSENT. The founder's frames are not new
  nouns — they are three of the four surface kinds already in VOCABULARY.md. Frame 2 (`Read`/
  `Declared`) and frame 3 (`Field`, `behaviorPolicy.mjs`) exist. FRAME 1, the equilibrium anchor,
  DOES NOT: `equilibriumPost.mjs:54` `EQUILIBRIUM_POST = null`, and substitution is blocked by a
  THROW (`EquilibriumSubstitutionError`, `:110`) against a blacklist at `:72-79`. Consequence:
  exploitation premium is permanently `null` — "how much money exists specifically because the pool
  is bad" is unanswerable — and a strategy can be located below the PBR ceiling but not above the
  equilibrium floor.

  A FINDING THAT CONTRADICTS PART OF THE PREMISE, AND MUST NOT BE SOFTENED. The founder wrote "I
  still think there are sub-archetypes, not every player plays the same." He is right that players
  differ; the SHAPE is not what "sub-archetypes" implies. k-means on 1,390 players over six canonical
  stats finds `bestK = 2` with silhouette 0.343 — TWICE as good as any other k, inertia falling
  smoothly with no elbow (`out/player-clusters.json`,
  `docs/research/player-archetypes-empirical-2026-07-26.md:33-58`). That is a CONTINUUM with one
  dominant axis (looseness-and-stickiness), not a set of discrete types. The authored six-label
  partition has cluster purity 0.63 and 0.44; TAG is 54% of the pool and spans both poles; 21% of
  players fall through all six buckets into `Unknown`; and `classifyStyle`'s `vpip > 40` Fish
  threshold cuts through a loose-cluster centroid of 40.5%. So the readout reports STRATA on measured
  axes (quintiles of `limpRate`, `cbetRate`, the k=2 looseness pole), never named archetypes. And
  `threeBetRate` gets NO channel: overdispersed (z = +81.2) but only 2.1pp of between-player spread
  with split-half reliability 0.33 — the same magnitude 11.8 assigned to the NON-separating slowplay
  conditional. Significance is not size.

  THE LANDMINE TO DEFUSE FIRST. `ipsEstimator.mjs:253` emits `edgeBBPer100 = edge * 100` — a bare
  rescale with NO denominator change, which is precisely the winrate misreading the same file warns
  against forty lines earlier (`:21-27`), pre-computed and waiting. It has zero consumers today. It
  must be deprecated before any readout exists that a reader might scan for a "per 100" figure.
  Cheapest item here, worst failure mode.

  WHAT THE HONEST FIRST ANSWER LOOKS LIKE. `RC-depth-ablation-1c560bcc-67e9e14e` reports
  `depthDeltaBB: -0.4711` with CI [-2.7653, +1.3290] at n=260 decisions and 22 players, and
  `DEPTH-ABLATION-2026-08-05.md:162-164` says it plainly: "At 260 decisions and 22 players the
  instrument cannot separate a half-big-blind effect from nothing." NOTHING IN THE DIFF PATH COMPUTES
  AN MDE — the repo's only one is `classifyPlayerSignal` (`rangeCalibrationProbe.mjs:1151-1206`),
  elsewhere. Extrapolating from that single point (half-width ~2.05bb at P=22, scaling 1/sqrt(P)),
  detecting a 0.20bb effect needs on the order of 2,300 contributing players. The corpus holds 59,848
  player-site rows, so THE CORPUS IS NOT THE BINDING CONSTRAINT — the harness's decision cap is. That
  is the encouraging finding and it should be stated as one.
accept_criteria: |
  Staged. Each stage lands independently and is separately valuable; do not batch them into one PR.

  - STAGE 0 — DEPRECATE `edgeBBPer100` (`ipsEstimator.mjs:253`). Additive-only: keep the field, mark
    it `deprecated`, and add a test asserting no consumer reads it. One line of real change. It goes
    first because every later stage produces a document a reader will scan for a "per 100" figure.

  - STAGE 1 — DECISION ATOM v3, AND `heroEvRunner` EMITS ATOMS. This is the ticket's centre and the
    stage everything else queries. Additive-only, guarded by the EXISTING
    `scripts/check-sor-additive.sh` against `scripts/standardOfRecord/schema-baseline.json`.
    Every new field ships with (a) the future question it answers, in the schema note, per the v2
    convention already established at `schemas.js:131-134`, and (b) a registered reader, enforced by
    the EXISTING schema-diff mechanism in `atomsSelfCheck.mjs` — add a field without a reader and the
    next run fails. Minimum set from spec 4.3: hero AND villain stable identity; `handId`; `order`;
    `piOurs`/`piPool`/`w_d` (UNCLIPPED, with the cap as a stamped constant)/`R_d` stored SEPARATELY
    and never pre-multiplied; per-action EVs in `alternativeScores` (its own note already promises
    this and its only producer does not honour it); achieved refinement depth; `budgetBound`; raw
    per-player observation counts; top-level `street`; `situationKey` on the hero-EV path (the
    accumulator already emits it at `decisionAccumulator.js:424` and `heroEvRunner` never reads it).
    `playersRemaining` is populated as WHO, per its own documented contract at `situationKey.js:109`,
    or an explicit reason is recorded for why it stays null.
    ASSERT THE INVERSION: a test must show that `estimateEdge`'s headline number is REDERIVABLE from
    the persisted atoms alone, to within the stated tolerance. If the aggregate cannot be recomputed
    from the record, the record is not yet the product and this stage is not done.

  - STAGE 2 — DECLARE THE `metrics` SCHEMA and make `resultCardProblems` validate it. Additive-only.
    Every figure carries its units and its conditioning set; the `{k, n, rate, conditional}` shape
    already in use (`atomsSelfCheck.mjs:107,119,150,172,189,198,212`) is the pattern, including the
    INVERSE conditional wherever the two readings support opposite reads. `overallEvBB100` prints
    BOTH factors of the 14.2 decomposition (`opportunitiesPerHand` and the per-decision edge), never
    only their product, and `opportunitiesPerHand` comes from the COVERAGE CENSUS over the Deal Book,
    not from `n/handsRepresented` on the scored subset — otherwise the headline inherits every
    sampling limit of the harness.

  - STAGE 3 — REPRODUCIBILITY. Blocks the branch ledger entirely and is why it is separate.
    (a) Stamp the ACHIEVED refinement depth on every atom, not only the requested budget — a budget
        does not tell you what ran, and `evStats.depthReachedMax` is already computed at
        `heroPolicy.mjs:368`. Highest-value single line in the ticket.
    (b) Add `REFINEMENT_BUDGET_MS` and `MAX_STAGE_SHARE` to `REQUIRED_CONSTANTS`
        (`manifest.js:33-37`) under ONE canonical key — which forces `MAX_STAGE_SHARE` out of module
        scope (`gameTreeEvaluator.js:929`), where it currently cannot be stamped at all and is
        recorded only as a `knownDivergence` with `agrees: null`.
    (c) Promote the freeze/seed pattern from `run-river-flip-replicate.mjs:83-87` into the shared
        harness. This is a PROMOTION, not an invention — that runner already demonstrates depth-2
        argmax stability 1.000 across 8 replicates.
    (d) `anchorGeneration` passed on the hero-EV card (`heroEvReport.mjs:202-233`). Three of the four
        cards on disk currently cannot enter a Ladder (`ladder.mjs:118-123` throws on a null
        generation), which blocks run-over-run comparison outright.
    (e) Either ASSERT refinement monotonicity or DISCLOSE its absence in the card. WS-378 saw depth-2
        move 38 of 40 flips toward passivity, so this is not assumable. Until it is settled the
        ledger pins depth as a CONTROLLED variable and any change that alters depth is measured at
        both depths or not at all.

  - STAGE 4 — VIEWS 3 AND 4 (moneymakers, spot decomposition). Cheapest real stage: pure reporting
    over data ALREADY CAPTURED — `slices` is written at `heroEvRunner.mjs:292-300` and a grep of
    `heroEvReport.mjs` for `slices` returns ZERO hits. Group atoms, run the SAME `estimateEdge`
    within each group (never a re-implementation — `heroEvReport.mjs:286-294` already documents why),
    rank by CONTRIBUTION not by mean, and ASSERT that the contributions SUM to the headline. The
    power gate `MIN_CLUSTERS_FOR_CI = 30` applies PER GROUP; a group below it reports a point
    estimate with no interval, is excluded from the ranking, is still counted in the total, and THE
    RESIDUAL IS PRINTED — otherwise the rows silently stop summing.

  - STAGE 5 — VIEW 6, THE BRANCH LEDGER. Branch = `street x facingAction x isIP`, a PROJECTION of the
    situation key rather than a parallel taxonomy; cell = the full `situationKey` + carried geometry,
    carried on every atom and reported only when it clears the power gate. Report NET and GROSS
    together and REFUSE NET WITHOUT GROSS: `GROSS/|NET|` near 1 means the change moved the tree one
    way, and a large ratio means it REDISTRIBUTED, so a NET near zero is a cancellation rather than
    an absence of effect. That is the failure the founder named ("a fix that helps rivers and hurts
    turns cannot net to zero invisibly") and it is one line given the partition. Implement the ledger
    as a JOIN over two persisted atom sets on `(dealBookHash, playerId, handId, order)` — NOT a
    re-run. Keep `atomId` as the key AND store its parts, per the raw-over-derived rule.

  - STAGE 6 — MDE PRE-FLIGHT. The readout emits a minimum detectable effect BEFORE the run, not a
    post-hoc CI. Without it a null result is unreadable — indistinguishable between "the fix did
    nothing" and "the instrument had no power". `classifyPlayerSignal`
    (`rangeCalibrationProbe.mjs:1151-1206`) is the shape to follow; its docblock already states the
    rule ("THE SEPARATOR IS POWER, NOT SAMPLE SIZE"). Compute it properly from the bootstrap rather
    than extrapolating the single point quoted in the description.

  - STAGE 7 — VIEW 2, SUB-ARCHETYPE. v1 = stratify the existing edge by villain stratum, which
    Stage 1's identity field makes possible with NO policy change. STATE PLAINLY WHAT v1 MEASURES:
    the pool's contribution, not our exploitation of it, because `heroPolicy.mjs:186-190,232` pins
    the villain at population baseline (`villainModel: null`) and `heroEvReport.mjs:471-476` states
    the posterior width is constant by design. EVERY STRATUM ROW CARRIES ITS SEPARABILITY EVIDENCE
    FROM THE SAME RUN — chi2/df against a same-run control, between-player SD, split-half
    reliability, disjoint-control cross-correlation — or it gets NO ROW. Not greyed, not caveated: no
    row. chi2/df is never quoted across runs (it scales with observations per player); the comparable
    quantity is between-player SD. Per-player leak appears ONLY as a posterior shrunk toward its
    stratum with an interval, never as a bare ranking — at 35-51 observations per player a ranking of
    measured leak is a ranking of noise, and reporting its top tail is the exact circularity 11.8
    dissected. If an engine-graded self-leak figure ships, it is labelled a DIAGNOSTIC beside the
    realized-chips figure, never the headline.

  - STAGE 8 — VIEW 5, TRANSCRIPTION INTERFACE (may be deferred to its own ticket; the INTERFACE must
    be specified here either way). The transcription produces a `Declared` surface — a Strategy Card
    — and the readout scores it THROUGH THE SAME ARM SLOT with the SAME `estimateEdge` as every other
    surface. Both halves already exist: `heroEvReport.mjs:502-532` is an array of arms including an
    always-fold baseline and a pool-against-itself control that must return exactly 0, and
    `loadStrategyCard`/`evaluateCard` already load and evaluate a Card from a CLI. Verified for this
    ticket: 11.9's harness DOES exist and its published numbers reproduce bit-for-bit from committed
    code plus `out/teachable-arms-{ftp,ps}.json`. Its four gaps: it scores in Delta-log against hole
    cards (`teachableArmsProbe.mjs:301`) and therefore prices NOTHING under Amendment 1; "share of
    the engine's edge" IS NOT CODE (repo-wide grep returns one hit, the prose at
    `POKER_THEORY.md:1753` — the percentages are a manual transform); the 15-number table is NOT
    version-controlled as data (`out/` is gitignored at `.gitignore:91`); and it emits no Result Card
    and has no test. 11.9's Delta-log table STAYS — it answers a different, legitimate question, and
    deleting an instrument for reporting the wrong currency is forbidden by standing rule. It is
    relabelled a diagnostic.

  - THE WORKED EXAMPLE IS AN ACCEPT CRITERION, NOT AN ILLUSTRATION. Price the already-merged WS-378
    river-omniscience fix. Arms: pre-`d0a03e49` behaviour vs HEAD, BOTH AT A PINNED DEPTH WITH THE
    CLOCK FROZEN (the fix is a river-path change and the river is exactly where refinement decides
    the top action — `RC-depth-ablation.json` `flipShareByStreet.river = 0.80`; not pinning depth
    confounds the two). Baseline: the Field, via `estimateEdge` — not always-fold, not the
    equilibrium. Output: `deltaBB` with a player-clustered paired CI, decomposed by branch, with NET
    and GROSS. AN HONEST "INDISTINGUISHABLE FROM ZERO AT THIS N" IS A PASS, provided the MDE from
    Stage 6 is reported beside it. A number without its MDE is not.

  - EVERY FIGURE THE READOUT PUBLISHES STATES ITS POPULATION. Online 2009 vs live 9-handed 1/2-1/3:
    transferred, not measured. Register rank 1, breadth 0.90, falsifier currently BLOCKED because
    SRC-014 lives in browser IndexedDB with no export path.

  - NO STAGE SHIPS A RESULT CARD WITHOUT `manifest.disclaimerRegisterVersion`. `manifestProblems`
    already rejects one; do not weaken it.
