  ## ALSO STALE: the row-construction block cited at `:263-301` is now at `:394-447` (drift of
  ##   120-165 lines). `gameTreeEvaluator.js` citations `:814`/`:899-907`/`:929-936` are now
  ##   `:868`/`:954-961`/`:983-990`. `POKER_THEORY.md:1753` is now ~`:1899`. Citations into
