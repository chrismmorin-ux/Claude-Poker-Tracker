description: |
  MEASURED DEFECT, LIVE PATH. `narrowByBoard` (postflopNarrower.js:696) sorts combos by
  equity, keeps the top `continuationRate` fraction, and ZEROES everything below. Applied
  once per street, so eliminations compound geometrically.

  Scored against 8,996 revealed showdown hands across two independent sites
  (docs/research/range-calibration-2026-07-28.md):

    coverage — does the inferred range give the TRUE hand non-zero probability?
      flop  89.1% (FTP) / 86.7% (PS)
      turn  71.4%       / 69.2%
      river 55.7%       / 56.7%

  A model that assigns probability ZERO to an event that occurred is falsified, not
  merely miscalibrated. And where it does contain the truth it barely beats uniform —
  by the river it is WORSE than uniform (delta log -0.021 / -0.026).

  TWO SPECIFIC CONSEQUENCES.

  1. THE ENGINE CANNOT REPRESENT A BLUFF-RAISE. Facing a raise it retains 10.8% of
     combos and misses the true hand 38-45% of the time. A bluff-raise IS a bottom-equity
     combo, so "keep the top N% by equity" cannot hold one. Directional consequence,
     always the same way: the engine believes raising ranges are near-pure value, so hero
     OVER-FOLDS to raises. POKER_THEORY 4.2 makes bluff-catching depend entirely on
     villain's bluff frequency in exactly that spot.

  2. DEPTH-2/3 RE-APPLIES THE CUT. gameTreeDepth2 chains it inside a single evaluation
     (flopCallRange -> turnRange -> turnCallRange). Coverage 72.0% -> 57.8% -> 46.9%: the
     deep branches that produce the multi-street plan evaluate against a range that
     excludes villain's hand MORE OFTEN THAN IT CONTAINS IT.

  ROOT CAUSE IS AN ANTI-PATTERN ALREADY NAMED TWICE IN THIS REPO. exploitEngine/CLAUDE.md:
  "DO NOT use bucket labels when per-combo equity is available - use the logistic" and
  "DO NOT resolve context with a threshold ... Let the posterior self-weight." WS-285 found
  and fixed this exact shape in the villain model's context hierarchy and logged it as an
  overturn. POKER_THEORY 6.5 states the correct form, P(hand|action) ~ P(action|hand) x
  P(hand); the code implements P(action|hand) as a hard 1/0 indicator instead of a
  probability.

  FIX. Make P(action|combo) an actual probability — a logistic of per-combo equity — so an
  unlikely combo is DOWN-WEIGHTED, never eliminated. Preserve the calibrated aggregate
  continuation rate (it comes from real observations). Keep the check branch's
  bottom-plus-traps intent, expressed as a smooth score rather than a two-piece cut.

  NOT A BACKTEST-ONLY FIX: liveAdvisor/computeHelpers.js narrows through the same
  function, so this changes what the founder sees at the table.
accept_criteria: |
  - No combo in a live range is ever assigned exactly zero weight by narrowing. A range
    may make a holding very unlikely; it may not declare it impossible.
  - Coverage measured by WS-293's instrument reaches ~100% at every street, on both sites.
  - The DISCRIMINATION metric (mean log P of the true hand vs uniform) is POSITIVE overall
    and at every street — this is the real bar once coverage is trivially satisfied.
    Recorded prediction before the change: delta log moves from -3.744 to roughly
    +0.05..+0.15, since conditional-on-covered discrimination is already +0.089.
  - The aggregate continuation rate is preserved: the mean per-combo continuation weight
    matches the `continuationRate` input, so a rate derived from villain observations is
    not silently rescaled.
  - Chained narrowing degrades gracefully: coverage after 3 successive narrowings stays
    ~100% and discrimination does not go negative (currently -0.181 at depth 3).
  - exploitEngine test suite green; no regression in villain-prediction accuracy/log-loss
    through the WS-273 harness (narrowByBoard feeds decisionAccumulator, so the villain
    model is downstream of this change and MUST be re-scored).
  - POKER_THEORY updated with the rule that a range never assigns zero, and why.
