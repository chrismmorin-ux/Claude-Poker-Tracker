status_note: |
  Filed 2026-07-28 after the WS-287 hero-EV build surfaced it. The founder's objection is
  what found this: scoring hero decisions had been designed AROUND the absence of hole
  cards, and the instruction to go a layer deeper rather than smooth over missing data
  turned up 40% of decisions with revealed cards sitting unused — and, once used, a
  falsified range model underneath everything.

  This is upstream of WS-287: hero-EV marginalizes advice over exactly these ranges.

progress_notes: |
  SHIPPED 2026-07-28 (structural fix). `narrowByBoard` now computes P(action|combo) as a
  logistic of per-combo equity; nothing is zeroed. Validated on 2 sites:

    acting seat coverage   flop 89.1->94.0  turn 71.4->94.2  river 55.7->93.9
    villain seat (gametree) 63.8 -> 87.4
    chained x1/x2/x3        72.0/57.8/46.9 -> 87.4/87.4/87.4  (decay eliminated)
    unconditional dlog      acting -3.744 -> -0.910; villain -5.272 -> -1.800

  BOTH tuning parameters measured, not chosen: TAU_FRACTION=0.3, MIN_CONTINUATION_WEIGHT=0.05.
  POKER_THEORY 11.6 written. 81/81 narrower tests green; exploitEngine 2631 pass (1 known-MC
  flake per run, different test each run, reproduced on a clean tree).

  TWO BUGS FOUND EN ROUTE:
    - the trap term was scaled by IQR and could never lift the top above the middle, so the
      check branch could not represent a slowplay at all. Fixed (TRAP_LIFT).
    - engine test range fixtures are INVERTED -> filed as WS-300.

  ACCEPT CRITERIA NOT YET MET, honestly:
    - "coverage ~100% at every street" -> 94%. The function never zeros; the residual comes
      from PREFLOP ranges that never contained the hand. Narrowing is no longer the binding
      constraint - the preflop action-range assignment is. Needs a follow-up ticket.
    - "dlog POSITIVE overall and at every street" -> NOT met (-0.910, up from -3.744). The
      recorded prediction of +0.05..+0.15 FAILED. Cause is the same residual preflop zeros,
      which dominate a log metric. Recording the failed prediction rather than restating the
      bar around the result.
    - villain-prediction re-score through the WS-273 harness NOT yet run (narrowByBoard feeds
      decisionAccumulator, so the villain model is downstream of this change and must be
      re-scored before this closes).
