description: |
  FOUND BY GATE 2 for the Hole Map study surface
  (docs/design/roundtables/2026-08-05-hole-map-study-surface.md, Stage A finding A1, ranked #2 of the
  roundtable's eight follow-ups).

  WHAT THE ROW SAYS AND WHAT IT OMITS. Verified at HEAD, scripts/backtest/holeMapHtml.mjs:143-155.
  Each row emits nine cells: label, required fold%, measured fold% + n, gap in pp, bb/occurrence,
  rate/100 + n, bb/100, bb/hour, pool frequency + n. The top row reads:

    bet 33% pot — flop, first in (pool checks 58% here) | 24.8% | 55.2% | +30.4pp | 2.43 | 8.56 |
    20.773 | 5.19 | 13.04%

  There is no population marker, no era, and not the word "transferred" anywhere in the row.

  THE CAVEAT ALREADY EXISTS IN THE DATA. Every row of out/hole-map.json carries denom.transferNote:
  "bb/hour assumes 25 hands/hour (live 9-handed). The corpus is ONLINE, where table pace is several
  multiples faster, so the RATE transfers worse than the per-occurrence gap. The per-100-hands figure
  beside it is the repo's own currency (POKER_THEORY §14.1) and carries no pace assumption."
  holeMapHtml.mjs never references it. The renderer drops a field the generator deliberately wrote.

  WHERE THE CAVEATS DO LIVE. In out/hole-map.html, "transferred" occurs twice, "ONLINE" four times,
  "2009" twice and "50NL" three times — all of them in prose bands above and below the table, none in
  a row. So the caveats survive exactly one delivery mode: reading the whole page in order.

  WHY THAT IS A DEFECT AND NOT A STYLE PREFERENCE. Three ordinary, non-abusive delivery modes strip
  every one of them: a screenshot of the table, a paste of a row into chat, a voice memo quoting a
  figure. CLAUDE.md instructs "Before quoting any figure from this system, read
  docs/standard-of-record/DISCLAIMER-AND-FAULT-REGISTER.md §1" — an instruction that presumes a
  quoting act and therefore a recipient. The whole ADR-009 apparatus (disclaimerRegisterVersion
  stamps, faultRegister.matches(card), confirmFault returning suspect-pending-review over prior
  cards) exists because outputs travel beyond the surface that produced them. This row does not.

  THE TOP-RANKED FAULT REGISTER ENTRY IS EXACTLY THIS TRANSFER. Per CLAUDE.md and
  DISCLAIMER-AND-FAULT-REGISTER.md §3, the highest-ranked entry is that the founder's game is live
  9-handed 1/2-1/3 while the corpus is online 2009, so any live claim anchored on it is TRANSFERRED,
  not measured — and the standing rule is "say so when reporting one". The row does not say so.

  THIS IS THE ESTIMATE OWNER'S PROBLEM, NOT THE VIEW'S. Fixing it only in the eventual React surface
  would leave the static HTML — which is what actually gets screenshotted today — unfixed, and would
  put the claim apparatus in the renderer rather than beside the number. The row is where it belongs.
accept_criteria: |
  - EVERY ROW CARRIES ITS POPULATION AND ERA IN THE ROW, in both the static HTML and any future
    in-app rendering, such that a crop of a single row still says what it was measured on. The
    minimum is the population (online 2009 HandHQ, 25NL-1000NL) and the transfer status; the form is
    open — a compact per-row chip, a footnote marker bound to the row, or a column.
  - THE FIX READS denom.transferNote RATHER THAN RESTATING IT. The generator already writes the
    caveat per row; a second copy in the renderer is a two-renderer defect of exactly the kind
    WS-420 exists to prevent. If the note is too long for a row, the row carries a short marker
    derived from structured fields, not a hand-written abbreviation of the prose.
  - A TEST ASSERTS THE ROW CANNOT LOSE IT. Take a rendered row in isolation and assert it contains a
    population identifier. This must fail against HEAD, which is the point.
  - THE PER-OCCURRENCE AND PER-RATE COLUMNS ARE DISTINGUISHED, because transferNote itself says they
    transfer differently: the per-occurrence gap transfers better than the rate, and bb/100 carries
    no pace assumption while bb/hour does. A single blanket caveat on the row would flatten a
    distinction the generator took care to make.
  - REPORT WHETHER ANY OTHER out/*.html READOUT HAS THE SAME SHAPE. The Hole Map is View 7; Views 1-6
    will want the same treatment, and the roundtable found the missing JTBD domain has the same
    seven-surface scope. Name them; do not fix them in this ticket unless the fix is shared code.
