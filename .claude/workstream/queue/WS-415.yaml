decision_flags:
  - |
    OPEN — HOW MUCH FITS IN A ROW. The honest caveat is two sentences and the row has nine columns
    already, with H-ML01's 640x360 viewport floor in play (Gate 2 Stage E). The candidates are a
    compact population chip ("online 2009"), a per-row footnote marker, or a persistent table-level
    header that survives cropping. The roundtable did not pick one because that is a Gate 4 design
    decision; what it binds is that SOMETHING population-identifying must ride the row.
