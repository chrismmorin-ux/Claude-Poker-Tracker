description: |
  check-required-equity-seam.mjs is a single-line regex defeated by member access, swapped addends,
  or an intermediate variable; its ALLOW comment strings disable the check unverified; ROOTS
  excludes handAnalysis/ (which holds a live second copy of the formula); no self-test fixture.
  Replace with an AST check + mandatory known-bad fixtures (the checker must FAIL on them to pass);
  every ALLOW annotation must name a test pinning that line's value; ROOTS extended to every
  decision-arithmetic module. Then generate check-rake-seam from the same machinery (facilitator
  D6: never clone the defeatable version) and unify gameTreeDepth2.js's two rake idioms
  (rakedShowdownPot at 487/491/639/652 vs inline pot - estimateRake at 1555/1607/1706/1712) onto
  the seam. Facilitator S2: the toolkit makes every future seam gate configuration, not new code.
accept_criteria: |
  - The banned formula written three ways (dotted receiver, swapped addends, intermediate variable)
    in a scratch file fails the check all three times.
  - A false ALLOW annotation (naming no pinning test) also fails the run.
  - handAnalysis/ is inside ROOTS; check-rake-seam exists and gates raw estimateRake usage outside
    the seam; gameTreeDepth2.js has one rake idiom (verified by the new gate itself).
