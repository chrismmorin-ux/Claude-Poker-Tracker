description: |
  Follow-up #3 from WS-262 (docs/research/mass-pool-data-2026-07-25.md).
  Founder-named model gap: the engine advises bluff-catching and value
  sizing but has no first-class "when to bluff" guidance. Maxim II
  (pool under-bluffs big river bets ~5x vs equilibrium; fold rates run
  12-16pp past bluff-breakeven vs big sizings) is the Field-frame basis:
  the pool's over-folding vs large river sizings is a directly minable
  bluff-trigger signal.

  Scope for this ticket: design/research phase only — define the trigger
  taxonomy (fold-vs-size curves per street, stickiest cells, barrel-funnel
  exits) and where it surfaces (live advice bar vs hand replay vs study).
  First-principles guard applies: triggers derive from fold-response
  curves + pot odds + range composition, never from labels.
