status_note: |
  Blocked on WS-286 by design. Writing it earlier would document a moving target and
  guarantee a rewrite — the same waste the readiness gate exists to prevent for the
  founder's study time.

  Material already banked: the WS-285 bake-off (10 arms, paired), the ablation, the
  W sweep, the level-restricted analysis, the fallback-level selection-effect finding,
  and one failed prediction. docs/research/engine-backtest-run-2026-07-26-pool-reference.md
  is the current best template for the tone this report should hold.
