decision_flags:
  - |
    OPEN — is a bounded-but-partial depth-3 answer better than no depth-3 answer? A river
    loop cut short samples fewer rivers, which biases toward whichever rivers the
    stratified sampler drew first. That may be worse than depth-2, not better. The
    alternative is to make the whole depth-3 attempt all-or-nothing: check the budget
    BEFORE entering, and skip cleanly if the remaining budget cannot cover it. Cheaper to
    reason about and it keeps the blend honest.
