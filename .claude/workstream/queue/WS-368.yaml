status_note: |
  SCOPE DECISION — THE SECOND WS-352 BLOCKER IS DELIBERATELY OUT OF THIS TICKET. WS-352 recorded
  three blockers on the live arm. The second is that SRC-014 is UNREACHABLE BY THE HARNESS: it
  lives in browser IndexedDB on the founder's device with no export path in the repo, while
  SRC-012 is scored by node scripts over an on-disk corpus root, so no harness reads both arms
  (`faultRegister.js:433-437`).

  It is NOT in scope here, for two reasons.

  (1) SEQUENCING. Export is downstream of identity — you cannot export a subset you cannot select.
  Until `getHandsBySource('live')` returns something, there is nothing for an export path to
  address. Bundling them would mean designing the export against a selector that does not yet work.

  (2) DIFFERENT FAILURE CLASS AND DIFFERENT PROGRAM. This ticket is a persistence data-model change
  with a schema migration (data-quality). The export blocker is a Deal Book / harness-pipeline
  change — turning live hands into something `scripts/backtest` can score against a versioned Deal
  Book under ADR-009 — which is strategy-of-record work with its own accept criteria about
  manifests and hashing.

  Nothing is lost by leaving it: WS-352 already recorded it as a HASHED `falsifierBlocker` in the
  register, so it is machine-readable state rather than prose someone has to remember, and the
  register's own rule forbids confirming or retiring a blocked entry. It should be filed as its own
  ticket when this one lands — at which point its shape is knowable, because the stamp this ticket
  chooses determines what the export carries. The third blocker (no stated volume floor per spot
  class) belongs with the export ticket or with WS-352 itself, not here.

  Premises re-verified against HEAD before filing, by reading the code rather than trusting the
  commit message: `handsStorage.js:445` (`source: 'ignition'` in `saveOnlineHand`), `:63-71`
  (`saveHand` record literal with no source), `:481-493` + `:477` (`getHandsBySource` filters
  `h.source === source` while documenting `'live'`), `exportUtils.js:226-232` (import calls
  `saveHand`, no stamp), `validation.js:23-70` (no `source` check), `database.js:50`
  (`DB_VERSION = 27`), `sessionsStorage.js:471` and `sessionsFilter.js:33` (same absence-as-identity
  at session level), `faultRegister.js:427-432` (the blocker) and `:1170-1173` (blockers are hashed).
  One drift noted: the blocker text cites `handsStorage.js:444`; at HEAD the stamp is at `:445`.
