decision_flags:
  - |
    OPEN — WHAT THE EXISTING UNSTAMPED ROWS BECOME. Stated as an accept criterion above because it
    is load-bearing, restated here because it needs a human answer. They are genuinely ambiguous.
    Treating them as live is the convenient reading and it is the one that would quietly
    manufacture the population the falsifier is meant to measure.
  - |
    OPEN — WHETHER THE STAMP IS ONE FIELD OR A SMALL OBJECT. A single `source: 'live'` string
    cannot carry venue and stake, and encoding them into the string ("live-windcreek-1_3") makes
    every future consumer parse prose. The registry's own language is "a positive stamp INCLUDING
    VENUE AND STAKE", which reads as structure. Decide before the migration, because a schema
    version is expensive to spend twice.
