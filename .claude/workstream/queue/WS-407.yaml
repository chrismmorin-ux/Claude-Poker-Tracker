decision_flags:
  - |
    OPEN — WHAT IS THE HAND-DEPENDENT FACTOR A FUNCTION OF? Three candidates, all computable from
    what the engine already has. (a) The SHAPE of the hand's equity distribution across runouts —
    variance and skew, not just the mean — which is the direct expression of "can this hand continue
    profitably". (b) Equity against the range that CONTINUES after a bet, versus equity against the
    current range; the ratio of those two is close to a definition of realization and needs no new
    concept. (c) A forward-looking estimate from the depth-2 machinery itself, which already models
    the next street. (c) is the most correct and the most expensive, and it would make realization
    a function of the refinement budget — reintroducing at the valuation layer the non-determinism
    the standing memory entry already flags in the scheduler. RECOMMENDATION: (b). It is a ratio of
    two quantities the engine computes today, it needs no new sampling, and it degrades gracefully
    to something close to the current constants when the continuing range equals the full range.
  - |
    OPEN — DOES THE MULTIWAY DIMENSION SURVIVE? `adjustedRealization` takes `numOpponents` and
    `opponentModels`, and the two call sites pass them differently: `gameTreeEvaluator.js:703`
    passes `(street, isIP, spr, numOpponents, opponentModels, boardTexture)` while
    `gameTreeEquity.js:1044` passes only `(street, isIP, spr, numOpponents)` — so the same node's
    realization already differs between the two branches by whether texture is applied. That
    inconsistency is not the subject of this ticket but it is in its blast radius and should not be
    left unexamined while the function is being rewritten.
