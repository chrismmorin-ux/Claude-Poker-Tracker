id: "WS-407"
title: "Equity realization is hand-independent — a nut flush draw and a gutshot in the same seat at the same SPR both take the identical 30% haircut, which over-values dominated draws and under-values nutted ones on 215 of 260 scored decisions, and its ablation arm costs zero additional compute"
