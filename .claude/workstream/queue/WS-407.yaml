status_note: |
  PREMISES RE-VERIFIED AGAINST HEAD (fe716f59), READ IN PLACE.

    - `gameTreeConstants.js:35-48` — `REALIZATION_TABLE`, keyed street -> ip/oop -> SPR zone, values
      read directly: flop oop high = 0.70, flop ip high = 0.85, turn oop high = 0.82, river all
      1.00 across both positions and all five zones (`:44-47`). Confirmed hand-independent: the
      object has exactly three levels of keys and none of them is a holding.
    - `gameTreeConstants.js:53-57` — `TEXTURE_REALIZATION` = { wet: {ip 0.97, oop 0.92}, dry: {ip
      1.02, oop 1.05}, paired: 0.97 }. CORRECTION TO THE AUDIT NOTE, which cited `:52-56`: the
      export begins at `:53`.
    - `gameTreeEvaluator.js:703` — `const realization = adjustedRealization(street, isIP, spr,
      numOpponents, opponentModels, boardTexture);` feeding `callBranchEV` at `:705`.
    - `gameTreeEquity.js:1041` — `export const bestResponseToAggression = (...)`; `:1044` — its own
      `adjustedRealization(street, isIP, spr, numOpponents)` call, WITHOUT texture or opponent
      models. The asymmetry between the two call sites is noted in the second decision flag.
    - `gameTreeEvaluator.js:1308` — `perCombo: comboDistribution?.perCombo || null` on the returned
      object, confirming the per-combo equity distribution is computed and surfaced today.

  Blast radius recomputed from `out/depth-ablation.json` rather than quoted: 138 flop + 77 turn =
  215 of 260 scored decisions carry a realization factor below 1.0; the 45 river decisions carry
  1.00. The audit note's "215 of 260" figure verified exactly.

  ON THE ZERO-COMPUTE CLAIM. Verified structurally rather than by timing: `realizationOverride`
  replaces a table lookup with a constant inside expressions that run regardless, so it changes no
  control flow and triggers no additional sampling. This is what distinguishes it from every stage
  ablation in WS-408, each of which changes how much of the tree is explored. It is therefore the
  cheapest arm available once WS-404 lands, and the right one to use as WS-404's own end-to-end
  demonstration.
