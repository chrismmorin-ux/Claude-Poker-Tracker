decision_flags:
  - |
    OPEN — WHETHER AN ERROR BUDGET WITH FOUR UNMEASURED TERMS SHOULD BE SHOWN TO THE FOUNDER AT ALL,
    OR WHETHER THE FIGURE SHOULD SHIP WITH NO INTERVAL UNTIL THE TERMS ARE MEASURED. The roundtable's
    argument for showing it is that a reader with no disclosure knows he does not know, which is
    safer than a narrow wrong interval — but that argument cuts both ways, and a budget listing four
    `unmeasured` terms may read as rigour and be treated as one. The third option, and probably the
    right one: show the terms, and refuse to print a single ± number at all until every dominant term
    is at least BOUNDED. A list of named unmeasured terms cannot be mistaken for an interval; a
    number with a ± can.
