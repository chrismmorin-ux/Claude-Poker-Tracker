status_note: |
  THE FILING DECISION, MADE EXPLICITLY BECAUSE THE BRIEF ASKED FOR IT. The instruction was to read
  WS-384 and file nothing if this is fully covered. It is NOT fully covered, and the boundary is
  clean enough to state in one sentence: WS-384 changes the coverage denominator; this ticket governs
  what a figure may claim while the denominator is whatever it is. Concretely, WS-384 contains no
  accept criterion touching any rendered uncertainty, no reference to `ConfidenceDisclosure.jsx`, no
  requirement that a Result Card record its estimator-coverage denominator, and no error-budget
  concept at all — it is scoped, deliberately and correctly, to measuring four estimators against
  enumerated truth and forbidden from scope creep into fixing them. The overlap is one shared fact
  (the 2-of-6 census), which this ticket cites and does not re-derive.

  Premises re-verified against HEAD by reading the code:
    - `src/utils/exploitEngine/__tests__/groundTruthCoverage.test.js:43-50` — the six-entry
      `ESTIMATORS` array; `:59` `const PINNED_COUNT = 2` with the comment that it may only be
      lowered with a recorded reason.
    - `src/components/views/PostflopDrillsView/panels/ConfidenceDisclosure.jsx:70-72` — the MC-trials
      line and `(± rough CI = 1/√trials)`, read in place; `:82-88` — the `cascadingFoldProbability`
      block naming "multiwayFoldPct, independent multiplication per villain" with no bet fraction
      stated.

  ONE THING NOT INDEPENDENTLY VERIFIED HERE, AND RESOLVED BY A NEIGHBOUR RATHER THAN LEFT OPEN. The
  claim that the value shown by that panel comes from `multiwayFoldPct(..., 0.75)` passed
  positionally was carried from FIND-053 and NOT re-checked at that line in this pass. WS-396, filed
  concurrently against the same finding, cites it at `drillModeEngine.js:814` — one line off the
  roundtable's `:813`. Since WS-396 owns the panel and cites the line it verified, that ticket is the
  authority on the value; this one no longer depends on it. Recorded rather than dropped, because
  "roundtable said :813, filer found :814" is exactly the drift this repo's premise-verification rule
  exists to catch.

  SCOPE RENEGOTIATED MID-FILING, AND SAID SO RATHER THAN QUIETLY TRIMMED. This ticket was drafted
  with an accept criterion that widened `ConfidenceDisclosure.jsx` directly. WS-396 was filed
  concurrently by another agent against FIND-053 with that exact scope, at P3. The panel criterion
  was replaced with an integration criterion. The remaining content — the error-budget structure, the
  Result Card coverage denominator, the assert-don't-print ratchet — is not in WS-396 and is what
  this ticket is for. If a reviewer judges the residue too thin to stand alone, the honest merge is
  into WS-396 rather than into WS-384, and this note is the argument for whichever call is made.

  ON THE `blocked_by: WS-389`. An error budget whose largest term is "the answer depends on how busy
  the machine was" is not a budget worth publishing, and refinement-depth variability is listed as
  one of the terms. WS-384 is deliberately NOT a blocker: this ticket is about declaring the
  denominator, which is possible at 2 of 6 and at 6 of 6 alike.
