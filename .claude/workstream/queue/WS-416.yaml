decision_flags:
  - |
    OPEN AND THE CENTRAL ONE — IS THE PORTFOLIO CEILING THE RIGHT AGGREGATE AT ALL? The Gate 2
    external lens noted that the mechanism the instrument rejected — NODE-LOCKING (lock the villain
    frequencies, re-solve, read one EV) — automatically accounts for hero's whole range, "which is
    exactly why a portfolio ceiling had to be invented". If the concentration and the selection
    effect are both properties of summing per-branch gaps, the honest fix may be a different
    aggregate rather than a better-disclosed one. That is larger than this ticket; the founder should
    decide whether to open it. This ticket assumes the ceiling stays.
  - |
    OPEN — WHETHER A RARITY FLAG SHOULD AFFECT SORT ORDER. Disclosure alone leaves the two 200%-pot
    rows at positions 2 and 3 of the default sort, which is where the roundtable's Gate 4 constraint
    AP-01 (preserve the artifact's order) puts them. Sorting them down is a filter by another name and
    all three lenses refused filters. Flagging them in place is the conservative option and is what
    this ticket assumes.
