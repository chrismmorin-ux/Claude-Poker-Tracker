title: "Sixty percent of the Hole Map's portfolio ceiling is two rows the pool takes 0.7% and 0.3% of the time, and the fold rate those rows are priced on is conditioned on the range that chose that sizing — the instrument is weakest exactly where its claim is largest, which is an inversion and not a caveat"
