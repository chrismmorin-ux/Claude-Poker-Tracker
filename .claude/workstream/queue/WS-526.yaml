description: |
  THE GATE ON THE WHOLE VILLAIN-INFERENCE PROGRAM. Nothing downstream (WS-527..WS-531) is
  funded until this returns.

  Design record: docs/research/villain-strategy-inference-2026-08-17.md §5.2, §6 (F1).

  The claim under test — and it is currently UNCHECKED REASONING, not a measurement:

    A villain's policy pi(a | s, h) is identifiable from corpus action data even though
    holdings are revealed only at showdown, because (a) P(h) at the root is exact
    combinatorics, (b) the full action sequence and board are observed for EVERY hand
    including folded ones, so only the HOLDING is missing, (c) branch ranges partition the
    parent range at every node, so the folding branch is identified by subtraction, and
    (d) behaviorPolicy.mjs already supplies unbiased P(fold | s) as a hard constraint.

  METHOD. Self-play a KNOWN rule-based villain policy through the hand generator, producing
  synthetic histories with the same observability as the corpus (holdings hidden except at
  showdown). Fit the EM. Compare the recovered policy to the known one, PER BRANCH, with the
  fold branch reported separately from the continue branches.

  src/utils/anchorLibrary/__sim__/syntheticVillains.js already holds 4 fully-specified
  known-ground-truth policies and anchorScenarioRunner.js drives them. Start there rather
  than authoring a fifth generator.

  This is a known-answer anchor. Per reference_ai_error_shape_study, a load-bearing claim
  without an executable falsifier or known-answer anchor is below standard here.
accept_criteria: |
  - Recovered vs known policy reported per branch, with the FOLD branch called out separately.
  - A stated tolerance, declared BEFORE the run, not chosen after seeing the result.
  - If the fold branch is NOT recovered: recorded unhedged as F1 FAILED, and the finding is
    that fold composition needs a showdown-independent channel (sizing, timing). Do not
    quietly shrink the claim to the branches that did recover.
  - Result Card emitted with a replication manifest and disclaimerRegisterVersion.
  - Sweep at least two n levels so the answer is "identified at n>=X", not a single point.
