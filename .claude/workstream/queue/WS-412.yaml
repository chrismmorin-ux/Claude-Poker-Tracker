  - |
    OPEN — SEED, ENUMERATE, OR SPEND. Seeding is free and freezes a bias. Enumerating is exact and
    only available off the flop. Raising `trials` is honest and costs the wall clock of every future
    run, which is the scarcest resource in this whole programme. The replicate floor decides which
    of these is worth paying for, which is why this ticket refuses to pick before it exists.
