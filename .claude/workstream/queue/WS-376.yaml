status_note: |
  Filed 2026-08-05 out of WS-371's closeout. WS-371's commit message names both residuals
  explicitly and states why they were not fixed there: "a threshold change is a behaviour
  change that needs its own measurement (WS-325 rule)". Same split as WS-284 -> WS-363.

  PREMISES RE-VERIFIED AGAINST HEAD (0cf1b915) BY READING CODE AND DATA, NOT BY TRUSTING THE
  COMMIT MESSAGE:
    - `villainObservations.js:78` `foldToCbetMin: 55` with the "MDF ~57% vs 2/3 pot" annotation;
      `:444-456` the rule, denominator `facedCbet`, numerator `foldedToCbet`, severity
      `clamp((foldPct - 45) / 45, 0, 1)`, heroContext F1.
    - `villainObservations.js:63` `threeBetMin: 3` with the "typical: 4-8%" annotation;
      `:231-243` the rule, denominator `rawStats.facedRaisePreflop`, numerator `threeBetCount`,
      fires BELOW, flat severity 0.6, heroContext P1.
    - `actionClassifier.js:429` consumes `V-FP-FOLDS-TO-CBET` — the observation is live, not
      inert.
    - `populationBaselineSelfTrip.test.js:149-171` — the ratchet, its two entries, and its
      instruction not to extend the list. The hand-weighted figures quoted above (53.63%,
      4.45%, and the four full-ring cells) are read from that block, which WS-371 computed
      from `handhqReferencePool.js` at runtime.

  THE BETWEEN-PLAYER FIGURES IN THE DESCRIPTION WERE COMPUTED FRESH FOR THIS TICKET, NOT
  COPIED. Source: the WS-262 per-site mining output at `C:\Users\chris\data\phh-mining\out\`
  (`SITE-<stake>.json`, `<bucket>.overdispersion.<stat>` = `{players, mean, sd_between, avg_n}`
  over players at n >= 30), pooled by the law of total variance weighted by player count —
  the identical method `generate-handhq-reference.mjs:236-243` uses. VALIDATION THAT THE
  METHOD MATCHES: running it over `overdispersion.foldTo3Bet` reproduces WS-371's published
  bar inputs exactly — 6max 72.95% +/- 14.15pp, full 79.80% +/- 13.36pp, 105,640 players.
  Same routine, same inputs, so the `threeBet` and `foldToCbet` figures below are on the same
  footing:

      threeBet     6max  4.75% +/- 3.90pp  (61,043 players, 24 segs)
                   full  3.24% +/- 3.19pp  (44,597 players, 23 segs)
      foldToCbet   6max 52.13% +/- 10.53pp (12,486 players, 23 segs)
                   full 55.86% +/- 11.19pp ( 6,533 players, 20 segs)

  These are INDICATIVE and must be regenerated through the generator during the work, not
  pasted from here — a constant that cannot be regenerated from its source is the failure mode
  the register in `preflopFoldQuantities.js` exists to prevent.

  NOTE ON SAMPLE DEPTH: the `foldToCbet` spread rests on far fewer players (6,533 full ring)
  than the fold-vs-preflop-raise spread (44,597), because a flop-c-bet-faced n >= 30 gate is
  much harder to clear than a preflop one. The sd is correspondingly less well determined.
  That is a reason to state the player count beside the bar, not a reason to prefer the
  hand-weighted table, which answers a different question entirely.
