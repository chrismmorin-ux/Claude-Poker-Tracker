decision_flags:
  - |
    OPEN — THE SD MULTIPLE FOR `foldToCbet`, WHICH THE SUPPORT DOES NOT DECIDE. Unlike WS-371,
    +2sd exists here (73.18% 6max / 78.24% full). 1sd flags the top ~sixth of players; 2sd the
    top ~2.5%. The choice is a statement about how rare a "leak" should be before the surface
    names it, and it should be made once, consciously, and then applied to every rule of this
    family rather than re-argued per rule. WS-371 never had to make it because the bound made
    it for them.
  - |
    OPEN — WHETHER `V-PF-3BET-ONLY-PREMIUMS` SURVIVES AT ALL. On a right-skewed quantity
    pressed against 0, the between-player derivation pushes the bar to ~0.04% (full ring),
    which is "has never 3-bet in the observed sample" — arguably a real and different
    observation, but not the one the rule claims. The honest outcomes are: retire it; replace
    it with a never-3-bet observation on raw counts with an explicit n gate; or re-found it on
    a quantity that actually supports a composition claim. Choosing "keep 3" requires an
    argument that survives the field measurement, not the current annotation, which contradicts
    its own constant.
