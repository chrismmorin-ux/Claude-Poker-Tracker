status_note: |
  Premises re-verified against HEAD by reading the code, not by trusting the commit message:
    - `src/utils/exploitEngine/__tests__/groundTruthCoverage.test.js:43-50` — the `ESTIMATORS` array,
      six entries, exactly as listed above; `:59` `const PINNED_COUNT = 2`; `:118-123` the exact
      assertion and the comment explaining why it is exact rather than a floor; `:124-125` the gap
      assertion tying the two numbers together; `:34-41` the inclusion rule; `:70-73`
      `groundTruthConsumers` matching on an import of `helpers/groundTruth`; `:75-96` `importedNames`,
      which matches IMPORTS rather than prose — its docblock records that the first version counted a
      comment and reported `miniRolloutEquity` as pinned when it was not.
    - `src/utils/exploitEngine/__tests__/helpers/groundTruth.js` exists.
    - The six estimators exist at the lines cited: `gameTreeEquity.js:134`, `:166`, `:192`, `:639`,
      `:685`, and `gameTreeSampling.js:315`.
    - `src/utils/exploitEngine/CLAUDE.md:36-40` (both error families, and why `mae` alone is
      insufficient for a shared-runout estimator), `:42-44` (the harness self-verifies first),
      `:45-51` (the ratchet, and the 2-of-6 figure stated in the doctrine file itself), `:52-60`
      (why the instrument exists, and the reintroduce-the-defect tolerance rule).

  ONE THING FOUND WHILE VERIFYING THAT THE BRIEF DID NOT CONTAIN, recorded in the description rather
  than left out: `approximateCheckBackRangeEquity` exists at `gameTreeEquity.js:218`, is the same
  shape as the three listed `approximate*` functions, and is absent from `ESTIMATORS`. So the census
  may be 2 of 7 rather than 2 of 6. It is raised as a question with an accept criterion rather than
  asserted as a defect, because there may be a reason — but if there is, it is not written anywhere.

  Filed at P2. Nothing here is a known wrong number; it is the absence of a measurement that would
  reveal one. The urgency it does carry is borrowed from WS-378, which is P0 and whose central
  question is whether three river estimators sit on one scale — a question one of these four
  estimators is directly part of.
