decision_flags:
  - |
    OPEN — WHETHER TO PIN ALL FOUR OR STOP AFTER THE FIRST FINDING. The three
    `approximate*RangeEquity` functions share a construction (base equity plus bucket anchors plus a
    rate table), so a bias found in one is likely present in all three, and pinning them
    individually may be three measurements of one defect. The alternative is to pin
    `approximateSubRangeEquity` first as the family representative and decide from its result
    whether the other two are separate quantities or the same one wearing different rate tables.
    Cheaper, and it risks missing a per-function defect. The founder or the implementer should
    choose deliberately rather than defaulting to "do all four".
  - |
    OPEN — WHAT HAPPENS IF `computeVillainEquityVsPerceived` IS FINE. That is a real possible
    outcome and it is worth something: it removes a candidate mechanism from WS-378's list by
    evidence, which is exactly what a null result is for. The decision it forces is whether the
    remaining three gaps still justify the effort once the urgent one is closed, or whether they
    drop to background. Say so at that point rather than finishing the sweep by momentum.
