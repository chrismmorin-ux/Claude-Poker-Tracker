decision_flags:
  - |
    OPEN AND LOAD-BEARING — WHAT "HERO" MEANS ON A CORPUS WITH NO HERO. Three answers, and they
    are not variations on one another. (a) EVERY SEAT IN TURN: maximal coverage, no selection on
    outcome, but hole cards are masked for anyone who folded before showdown, so the engine is
    advising a hand it cannot see — `FAULT-masked-hole-cards` applies directly. (b) SHOWDOWN SEATS
    ONLY: hole cards are real, but conditioning on reaching showdown selects for exactly the hands
    that continued, which is `FAULT-showdown-selection` by name, and the founder's standing rule
    on numbers carrying their conditional binds every figure produced this way. (c) NOT MEASURABLE
    HERE: honest, cheap, and it closes the question rather than leaving it open — but it means
    accepting that half the declared atom domain has no corpus behind it and saying so on every
    surface that implies otherwise. The founder should choose; the census is the same either way.
  - |
    OPEN — WHETHER THE DECLARED DOMAIN SHOULD SHRINK IF (c) IS CHOSEN. If hero-side is not
    measurable on this Deal Book, then declaring 200 contexts and permanently marking 95 of them
    unexamined is truthful but reports a 50% coverage gap forever. The alternative is to declare
    hero contexts UNREACHABLE for this Deal Book specifically — the same status `preflop × bet`
    already carries — which is a different and stronger claim: not "we did not look" but "this
    instrument cannot look here." That is arguably the accurate word, and it changes the headline
    coverage number, which is why it needs a decision rather than an edit.
