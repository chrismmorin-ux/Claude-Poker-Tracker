status_note: |
  Premises re-verified against HEAD by reading the code, not by trusting the commit message:
    - `scripts/backtest/phhAdapter.mjs:413` — `mySeat: null,  // corpus hands have no hero`, inside
      the `gameState` the adapter hands to the engine.
    - `scripts/backtest/run-atoms.mjs:50-59` — the four declared axes, `actorRole` first with
      levels `['hero', 'villain']`. 2 × 4 × 5 × 5 = 200.
    - `run-atoms.mjs:237-241` — the `unreachable` map, `preflop × bet` only, 10 cells. 200 - 10 = 190.
    - `run-atoms.mjs:242-246` — `examined` filtered to `c.coords.actorRole === 'villain'`, which is
      what makes all 95 reachable hero cells `unexamined` rather than `observed-zero`.
    - `run-atoms.mjs:260-268` — the `declareExamination` call carrying
      `UNEXAMINED_REASONS.INSTRUMENT_CANNOT_EVALUATE` and the `mySeat = null` basis string.
    - `src/utils/standardOfRecord/coverageCensus.js:185-190` — an unexamined cell without a valid
      reason throws; `:62` the status enum. The 95 genuinely cannot be silently reported as zeros.
    - `src/utils/standardOfRecord/faultRegister.js` — `FAULT-masked-hole-cards` and
      `FAULT-showdown-selection` both exist as registered entries, so the bias any fix introduces
      already has a name in the register.

  The 95/190 = 50% figure reconciles exactly with the axis arithmetic above, so it is not being
  taken on the commit message's word.

  Filed at P1, not P0. There is no wrong number in circulation — the census records the gap
  correctly and refuses to present it as an absence, which is precisely the protection WS-328 was
  built for. What is at stake is that half the declared measurement domain has no data path, and a
  recorded `answerable: false` with no ticket behind it is the kind of fact that has to be
  rediscovered from a commit message. It was.
