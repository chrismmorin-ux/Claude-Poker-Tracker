status_note: |
  Premises re-verified against HEAD by reading the code, not by trusting the run record.

  VERIFIED AS STATED:
    - `CommandStrip.jsx:653-665` — the `actionAdvice` useMemo; `:660` `eq >= 0.55 → VALUE`;
      `:663` `eq < 0.40 && fp !== null && fp >= 0.40 → BLUFF`; `:664` else CHECK.
    - `CommandStrip.jsx:88` — `const { advice: gameTreeAdvice } = useAnalysisContext();`
    - `useLiveEquity.js:167` — `estimateFoldPct(seg, 'bet')`, exactly two arguments.
    - `foldEquityCalculator.js:418` — six-parameter signature, NO bet-size argument; `:443` the
      villain-model branch gated on `villainModel?._buckets`; `:468` the observed branch gated on
      `foldToCbet` + `foldToCbetSampleSize`; `:482` the per-combo branch gated on
      `comboDistribution?.perCombo?.length > 0`, with `villainRequiredEquity` called at `:483`
      inside it. All four are unreachable from a two-argument call.

  CORRECTED — the run record's line references drifted, and one scope claim was loose:
    - The run record cites `useLiveEquity.js:154` for the all-in equity. At HEAD the equity call is
      `:152` (`(computeEquity || handVsRangeDirect)(heroEncoded, range, boardEncoded, { trials: 2000 })`)
      and `:155` is `setEquity(result.equity)`. The substance is unchanged: it is all-in equity
      against the range returned by `getVillainRange` at `:138`, i.e. villain's FULL range for that
      (position, actionKey), with no filtering to callers.
    - The brief states that `potInfo` and `currentBet` are "already in scope at CommandStrip.jsx:83".
      Only `potInfo` is destructured at `:83`. `currentBet` is DERIVED at `:495` from
      `actionSequence` (which is at `:83`) via `getCurrentBet`, with `effectiveBet` at `:496`. Both
      sit above the `actionAdvice` useMemo at `:653`, so the conclusion — the breakeven is computable
      without adding an input — holds; the mechanism is derivation, not destructuring.
    - The rule at `:663` includes a `fp !== null` guard the run record omits. It is load-bearing and
      correct (against an all-in villain `useLiveEquity.js:162` sets fold% to exactly 0, and `:159`
      sets it to null when HERO is all-in), and it must survive any rewrite.

  NOT RE-DERIVED HERE, AND FLAGGED AS SUCH: the Q♠J♠ = 0.4929 figure is quoted from
  `exploitEngine/CLAUDE.md`, which reports it as a WS-312 measurement against a top-25% range. It has
  not been re-measured for this ticket. The accept criterion asks for it to be asserted, which will
  re-derive it.
