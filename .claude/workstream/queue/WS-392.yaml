decision_flags:
  - |
    OPEN — DOES THE LIVE RULE STAY A RULE, OR DOES IT BECOME A CHEAP EV COMPUTATION? The §11.9 arm
    score answers this with a number rather than an argument. If a corrected three-or-four-literal
    rule recovers most of the engine's edge on the identical decision set, the wiring project
    (WS-393) is a large investment for a small residual and should be re-priced. If it recovers
    little, the wiring project is justified and this ticket is an interim. The founder should see
    the arm score before either is committed to.
  - |
    OPEN — WHETHER THE VALUE BAR ITSELF (0.55) SURVIVES RE-BASING. The 0.55 was calibrated against
    all-in equity vs the full range. Re-pointing the test at a realised-value RATIO changes the
    scale, and `exploitEngine/CLAUDE.md` warns explicitly against carrying a floor across that
    change: "the ladder's floors are calibrated for 'chance of winning the pot', and re-pointing
    them at a current-strength scale re-tiers hands for reasons unrelated to the bug." The new bar
    must be derived or measured, not transcribed.
