decision_flags:
  - |
    OPEN — WHETHER PER-STREET IS THE RIGHT GRANULARITY OR PER-ACTION IS. Per-street is cheap and
    covers SPR at every street's first decision, which is where the founder's doctrine puts the
    weight. Per-action covers multiway pots where a seat's stack changes between two villains'
    decisions on the SAME street — which is precisely the 9-handed live case this corpus exists
    to model, so per-street may under-serve the target population. The state machine writes stacks
    at five sites already, so per-action may be nearly free; measure the record-size cost before
    choosing, and do not default to the smaller one because it is easier to store.
