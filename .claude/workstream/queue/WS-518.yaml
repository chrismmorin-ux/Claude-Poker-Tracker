status_note: |
  NOT A DUPLICATE OF WS-388, and the distinction is load-bearing: WS-388 is the live hand-entry
  path (`gameReducer.js`, effort L, blocked by WS-389, with an open decision flag about founder
  data-entry burden). This is the captured path, where the data already arrives from the client
  and is discarded. Cross-referenced in both directions; this ticket is listed as enabling WS-388
  because captured hands are the only near-term source of real stack-depth variance for the
  measurement WS-388 wants to make.

  CITATION CORRECTION made while re-verifying against HEAD: the overwrite sites were cited as
  `:285, 327, 354, 383, 404`. Two drift by one line — `:355` and `:405` are the assignments;
  `:354` and `:404` are the enclosing `for (const [seat, stack] of Object.entries(event.stacks))`
  headers, i.e. the same statements. `:285`, `:327`, `:383` and the `:663` snapshot are exact.
  Also confirmed during verification and not in the original audit: `:514` passes the live
  `this.stacks` reference UNSPREAD into a separate call, so that consumer sees a mutating object
  rather than a snapshot — check it as part of this work.

  VERIFICATION HAZARD: `ignition-poker-tracker/dist/` was built 2026-08-04 and the source is two
  commits ahead. Rebuild (`npm run build`) before verifying anything against the loaded
  extension. Full detail in WS-517's status_note.
