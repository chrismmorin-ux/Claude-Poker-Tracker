description: |
  MEASURED, NOT INFERRED. Found while executing WS-300 (SPR-160) once the test fixtures
  were corrected. Reproduces on every run.

  THE SPOT. Hero 3s3d on QhJhTs, facing a 75-into-100 bet. Villain's range is
  AA,KK,QQ,JJ,TT,AKs,AKo,AQs,AQo. The engine ranks RAISE first at EV 40.7 against
  fold EV 0, with hero equity 0.056.

  WHY IT IS WRONG. On QJT that range is essentially all overpairs, sets, two pair and
  strong draws — QQ/JJ/TT are sets, AKs/AKo have the nut straight draw or better, AQ has
  top pair plus a gutshot. There is almost nothing in it that folds to a raise. The raise
  is being priced on fold equity that does not exist against THIS range, and hero holds
  the second-worst possible pair with 6% equity and no meaningful redraw.

  WHERE TO LOOK FIRST. The raise branch's fold-equity term. Two candidates, both cheap
  to distinguish:
    (1) The fold estimate is being taken from a population/style prior rather than from
        the actual narrowed range's composition — i.e. "villains fold to raises ~X%" is
        being applied to a range that structurally cannot fold. Note FIND-029 (fixed by
        WS-247) removed a heroEquity >= 0.65 gate on raiseEV specifically so that
        +EV bluff-raises vs over-folders would surface; the gate removal is correct, but
        it means nothing downstream now suppresses a raise when fold equity is absent.
    (2) `bestResponseToAggression` / the raise EV path is not conditioning fold% on the
        range it was handed.

  This is the second defect in this family: an EV term computed from a prior instead of
  from the game state in front of it. Compare FIND-040 (preflopFoldResolver tier 1
  discarding observed counts) from the 2026-07-30 delta run.

  DO NOT fix this by reinstating an equity gate on raises. That was FIND-029 and it
  suppressed genuinely profitable bluff-raises. The fold estimate itself is what must
  respond to the range.
accept_criteria: |
  - Against the tight range above on QhJhTs, hero 3s3d: RAISE is no longer ranked first,
    and the raise EV reflects a fold rate consistent with a range that cannot fold.
  - The fix changes the FOLD ESTIMATE's dependence on the narrowed range, not a
    hero-equity gate on whether raises are considered (FIND-029 regression guard).
  - Behavioural test asserting the above, using the shared `__tests__/fixtures/ranges.js`
    fixtures — and it must FAIL against the pre-fix engine.
  - Verify the converse still holds: against a genuinely over-folding villain, a +EV
    bluff-raise with low equity IS still recommended (do not re-break FIND-029).
  - `advisorAccuracy` Scenario 3's `console.warn` diagnostic is converted into a real
    assertion, or removed — a warning in a passing test enforces nothing.
