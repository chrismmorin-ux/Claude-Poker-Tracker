description: |
  MEASURED, NOT INFERRED. Found while executing WS-300 (SPR-160) once the test fixtures
  were corrected. Reproduces on every run.

  RETITLED AND RE-DIAGNOSED 2026-07-30 after founder challenge. The first version of this
  ticket called the raise itself wrong. That framing was incorrect and would have led an
  implementer to the wrong fix — see "WHY RAISING IS A LEGITIMATE CANDIDATE" below. The
  defect is real but it is in the FOLD ESTIMATE, not in the decision to consider a raise.

  THE SPOT. Hero 3♠3♦ on Q♥J♥T♠, facing a 75-into-100 bet. Villain's range is
  AA,KK,QQ,JJ,TT,AKs,AKo,AQs,AQo. The engine ranks RAISE first at EV 40.7 against fold
  EV 0, with hero equity 0.056.

  WHY RAISING IS A LEGITIMATE CANDIDATE (founder, 2026-07-30 — and the measurement agrees).
  Hero's showdown value against this range is EXACTLY ZERO — 0 of 49 combos, verified by
  enumeration:

      villain hand   combos   hero beats
      AA                  6            0     overpair
      KK                  6            0     overpair
      QQ / JJ / TT        9            0     sets
      AKs / AKo          16            0     BROADWAY — the nuts
      AQs / AQo          12            0     top pair + gutshot
      TOTAL              49            0

  A hand that wins 0% at showdown sacrifices NOTHING by bluffing: there are no worse
  hands to fold out, because there are no worse hands. This is the classic
  bluff-candidate criterion, and it is the founder's point — a made hand with no
  showdown value is often a BETTER bluff than a drawing hand, because the draw still has
  equity to realise and the made hand has none. Bottom pair here is pure air wearing a
  pair, and treating it as "a made hand, therefore not a bluff" is the error the engine
  must not make.

  So the engine is RIGHT to rank a raise as a candidate. What it is wrong about is the
  price.

  WHY THIS PARTICULAR RANGE DEFEATS IT. A bluff needs a range that CAN fold. This one
  largely cannot:

      never folds   AK (16) + sets (9)   = 25 / 49  = 51%   (AK is the nuts and re-raises)
      may fold      AA, KK (12)          = 24%             (but hold gutshots/backdoors)
      may fold      AQ (12)              = 24%             (top pair + gutshot, often calls)

  More than half the range never folds and a third of it is the STONE NUTS. The "better
  pairs that would otherwise have just shown down" — the fold-out target the bluff is
  priced on — are only AA/KK, 12 of 49 combos, and they are not obviously folding to a
  raise on a board where they hold an overpair plus backdoors.

  This is a textbook case of the CAPPED-VS-UNCAPPED rule already in
  exploitEngine/CLAUDE.md §5: this range is definitively uncapped — it contains the nuts
  at 33% frequency. Bluff-raising into it is not a marginal error, and an EV of 40.7
  implies a fold rate the composition cannot produce.

  THE DEFECT, PRECISELY. The raise branch's fold estimate is not conditioned on the
  composition of the range in front of it. Two candidates, cheap to distinguish:
    (1) the fold rate comes from a population/style prior rather than from the narrowed
        range's actual composition — "villains fold to raises ~X%" applied to a range
        that structurally cannot;
    (2) `bestResponseToAggression` / the raise-EV path never asks the range how much of
        it is nutted.

  Same family as FIND-040 from the 2026-07-30 delta run: an EV term computed from a
  prior instead of from the game state in front of it.

  DO NOT FIX WITH AN EQUITY GATE. Two independent reasons, and the second is the
  founder's:
    - FIND-029: a `heroEquity >= 0.65` gate on raiseEV was REMOVED by WS-247 precisely
      because it suppressed all +EV bluff-raises against over-folders.
    - A gate on hero equity would suppress exactly the hands that make the BEST bluffs —
      zero-showdown-value made hands. It would encode the inverse of the correct
      principle.
  The fold estimate is what must respond to the range.
accept_criteria: |
  - Against this range on Q♥J♥T♠ with hero 3♠3♦: the raise is no longer ranked first, and
    its EV reflects a fold rate consistent with a range that is 51% never-folding and 33%
    nuts.
  - The change is to how the FOLD ESTIMATE reads range composition — NOT a hero-equity
    gate on whether raises are generated (FIND-029 regression guard, and the
    bluff-selection principle below).
  - CONVERSE MUST STILL HOLD, asserted by test: against a genuinely over-folding villain
    with a CAPPED range, hero's zero-showdown-value bottom pair IS still raised. This is
    the founder's case and the fix must not break it. A fix that suppresses both spots
    has encoded "don't bluff with made hands", which is wrong.
  - Behavioural test for both directions, using the shared `__tests__/fixtures/ranges.js`
    fixtures, failing against the pre-fix engine.
  - DOCTRINE GAP (verified absent 2026-07-30): POKER_THEORY.md documents fold equity,
    MDF and the auto-profit threshold but says nothing about WHICH hands to select as
    bluffs. Add it — a hand's bluff suitability falls as its showdown value rises, so a
    zero-showdown-value made hand is a premium bluff candidate while a marginal made hand
    that beats part of the range is a poor one (bluffing it folds out the hands it beats).
    Note the interaction with capped/uncapped: the candidate's suitability is hero-side,
    the bluff's PROFITABILITY is villain-range-side, and both must clear.
  - `advisorAccuracy` Scenario 3's `console.warn` becomes a real assertion or is removed.
