  Only 2 of the 27 corpus directories are present on this machine; the rest are on node1. The
  nine-handed share of the FULL corpus is therefore unmeasured and may be higher or lower than
  15%. Re-measure on node1 before quoting a corpus-wide figure.

  `docs/villain-archetype/CONTINUATION.md` currently states as a standing fact that both profiled
  villains are six-max and that this is "a format gap as well as a population gap". That sentence
  needs updating when this lands — it is accurate about the subjects and has been read as a
  statement about the corpus.
