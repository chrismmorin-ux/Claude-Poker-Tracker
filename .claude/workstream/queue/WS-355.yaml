decision_flags:
  - |
    OPEN — do the stratification weights apply to the runout average? `stratifiedSample`
    computes a per-card probability weight so a sampled category represents its true deck
    share. `perceivedEquityWithRunouts` averages runouts uniformly and discards that
    weight. Unweighted stratified sampling over-represents guaranteed-coverage categories
    (each non-empty category gets at least one draw regardless of its deck share), which
    biases toward flush-completing and pairing cards on wet boards. Fixing the object bug
    without deciding this leaves a smaller version of the same error.
