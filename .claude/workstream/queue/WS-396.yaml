status_note: |
  Premises re-verified against HEAD by reading the code.

  VERIFIED AS STATED:
    - `ConfidenceDisclosure.jsx:70-72` — the MC trials row with `(± rough CI = 1/√trials)`.
    - `:82-88` — the `hasCFP` block rendering `cascadingFoldProbability`, with the method annotation
      "— multiwayFoldPct, independent multiplication per villain" at `:86`. The bet fraction is
      indeed absent from the rendered text.
    - `gameTreeEquity.js:1119` — `multiwayFoldPct(primaryFoldPct, opponentModels, street, texture,
      posCategory, betFraction = 0.75)`. The sixth positional argument is confirmed to be the bet
      fraction.

  CORRECTED — line drift on the `0.75`:
    - The run record cites `drillModeEngine.js:813` for `multiwayFoldPct(..., 0.75)`. At HEAD the
      call spans `:808-815` and the `0.75` literal is on `:814`; `:813` is the `'*'` posCategory
      argument. The same `:813` reference appears in the run record's FIND-046 discussion of the
      WS-283 escape route, so if that ticket is written it should use `:814` for the constant and
      `:808` for the call.

  NOT RE-DERIVED HERE: the style-midpoint range `[0.21, 0.42]` cited from `villainModelData.js:255,
  :290`, and the fault-register rank-1 / breadth-0.90 figures. Both are quoted from the run record
  and the register respectively; neither is load-bearing for the fix, which is to disclose rather
  than to quantify.
