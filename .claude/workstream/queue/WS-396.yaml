decision_flags:
  - |
    OPEN — WHETHER THIS PANEL BECOMES THE PATTERN OR STAYS A ONE-OFF. It is currently the only
    uncertainty disclosure in the product, and the same three omitted terms apply to every EV figure
    the app shows, not just to drills. Making it a reusable component with a declared error-budget
    shape would let the same disclosure attach to the live advice bar and the Ignition side panel;
    keeping it local keeps the change small. The founder should decide, because the first option
    implies a visible change to surfaces he uses at the table.
