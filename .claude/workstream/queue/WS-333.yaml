decision_flags:
  - "MAY SPLIT AT DESIGN TIME. Parts A-C (the derived floor) and Part D (geometry normalization) are separable builds that were framed as one emergent idea by the founder and are genuinely coupled — the floor is DEFINED per geometry cell. Recommend designing them together and splitting execution only if the geometry key turns out to need WS-317 migration work of its own."
  - "Does the floor target MDF (deny the bettor an auto-profitable bluff) or full best-response indifference? MDF is cheap, closed-form, and a true FLOOR but is known to be a crude approximation solvers do not literally play. Best-response indifference is the honest quantity but needs the game tree. Recommend MDF as the declared floor with its approximation error measured against the game tree on a sample, so the gap is a known number rather than a known caveat."
