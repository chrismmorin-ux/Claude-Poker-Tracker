status_note: |
  Filed 2026-08-02. Founder tied the unexploitable floor to the pot-odds origin created by the
  blinds, and observed the SB/BB inversion. Analysis confirmed the observation, located its
  mechanism in realization and action-closure rather than price, and established that the
  geometry-normalization half is likely the fix for the statistical-power constraint binding
  every other instrument in this program.
