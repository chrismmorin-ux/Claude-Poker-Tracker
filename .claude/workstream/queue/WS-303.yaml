description: |
  Two residuals WS-291 measured and did not fix. Both are about DISCRIMINATION — whether the
  range says anything useful — rather than coverage, which WS-291 did fix.

  Metric: Δlog|cov, the mean log probability the range assigns to the hand actually held,
  minus uniform, over decisions where the range contains it. Positive = the range beats
  "every combo equally likely". Measured on revealed showdown hands, two independent sites,
  400 files / 600 players each (FTP n=7,793 · PS n=6,194 villain decisions, 2026-07-28).

  1. THE CHECK BRANCH IS WORSE THAN UNIFORM.

       action    coverage (FTP/PS)      Δlog|cov (FTP/PS)
       raise     92.9% / 92.7%          +0.821 / +0.827
       call      93.9% / 90.2%          +0.474 / +0.333
       bet       90.5% / 91.1%          +0.383 / +0.387
       check     84.2% / 86.3%          -0.082 / -0.095     <-- worse than uniform

     A check is the MOST COMMON action in the sample (3,913 of 7,793 FTP decisions, 3,383
     of 6,194 PS). So the single most frequent thing villain does is the one the engine
     reads worst, and it reads it worse than not reading it at all. It is also the branch
     with the LOWEST coverage, on both sites — the two failures point the same way.

     WS-291 did improve the check branch's coverage (60.5% -> ~86%) by making the two-slice
     "bottom N% plus a 10% trap slice" into a continuous U-shape. It did not make it
     INFORMATIVE. The baseline already suspected this — lift 1.21 against random
     elimination — and the suspicion is now confirmed with the sign attached.

     HYPOTHESIS, TO BE TESTED NOT ASSUMED. The U-shape is scored on equity alone, and a
     check is the action LEAST determined by equity: villain checks with air, with medium
     hands controlling the pot, with monsters trapping, and — mostly — because it is their
     default when nothing suggests otherwise. Equity may simply be close to independent of
     checking, in which case the honest model is a much flatter likelihood for check than
     for the aggressive actions, and the current U-shape is confidently wrong rather than
     humbly uninformative.

  2. RE-NARROWING SHARPENS UNTIL IT HURTS.

       successive narrowings   1        2        3
       Δlog|cov (FTP)        +0.245   +0.135   -0.074
       Δlog|cov (PS)         +0.159   +0.010   -0.239

     Coverage no longer decays (WS-291 fixed that — it is now flat ~89% at every depth), but
     each application multiplies the likelihood in again, so the distribution keeps
     concentrating on high-equity combos. By the third application the range is sharper than
     the evidence supports and is worse than uniform. `gameTreeDepth2` chains exactly this
     way inside a single evaluation (flopCallRange -> turnRange -> turnCallRange), so the
     deep branches that produce the multi-street plan are the ones affected.

     HYPOTHESIS. Repeatedly applying a likelihood that is only approximately right compounds
     its error, and applying the SAME likelihood to a range it already conditioned on
     double-counts the evidence. Candidate treatments, to be measured against each other:
     temper the likelihood by depth (raise to a power < 1); narrow once from the ORIGINAL
     prior against the full observed action sequence instead of iteratively; or carry the
     un-narrowed prior plus the sequence and condition once.
accept_criteria: |
  - Δlog|cov for the check branch is POSITIVE on both sites, or — if the measurement says a
    check genuinely carries little information about villain's holding — the check
    likelihood is deliberately flattened toward uninformative and that is RECORDED in
    POKER_THEORY as a finding rather than hidden as a tuning choice. Confidently wrong is
    the failure mode; humbly uninformative is an acceptable answer.
  - Discrimination does not go negative with chaining depth: depth-3 Δlog|cov >= 0 on both
    sites, ideally monotonically non-increasing rather than sign-flipping.
  - Whatever changes is chosen by sweep against the WS-293 probe, on the SAME decisions
    across arms, and re-scored through the WS-273 villain harness for regression.
  - The trap component keeps a testable meaning: a villain who slowplays must still be
    representable (see the TRAP_LIFT guard in postflopNarrower.js).
    NOT MET, AND DEFERRED RATHER THAN REFUTED, 2026-07-31 — recorded here, not dropped.
    This criterion assumed the slowplayer is a DISTINGUISHABLE villain type. Before building
    a per-villain trap channel we asked what evidence there is: 347,580 hands, FTP + PS,
    700 player-site rows, 14,595 flop decisions. P(check | strong) gives chi2/df = 1.005
    (z = +0.06) — indistinguishable from one population — against 1.859 (z = +15.5) on flop
    bet frequency, a control axis where the same method finds large real heterogeneity.
    So the channel would fit noise AT THIS OBSERVATION DENSITY.
    READ NARROWLY. This is one axis at one sample size. It is NOT a finding that player
    archetypes do not exist — the control axis proves the opposite, and is the answer to
    anyone quoting this line that way. What separates the two axes is OBSERVATIONS PER
    PLAYER, not whether the trait is real: aggression is seen every flop; a revealed strong
    hand is seen a MEDIAN OF 2 TIMES per player against the ~30 needed to move off
    population. An axis that thin returns chi2/df ~ 1 either way. The cross-axis correlation
    (0.036) does not shore it up: at 2 observations per player the rate is nearly noise, and
    noise correlates ~0 with everything by construction — attenuation predicts that number
    whether or not the trait is real.
    ALSO BLIND TO STATE. A corpus average cannot see tilt, drunkenness, or a villain
    adapting to having just been bluffed twice at this table — those switch WITHIN a
    session. Founder observation of such players is not in conflict with this; it is outside
    what the instrument can see, and needs a within-session instrument instead.
    THE RIGHT NEXT TEST is incremental value, not existence: does conditioning on an
    archetype predict better GIVEN the axes that already work, scored on the same decisions
    (POKER_THEORY 11.5)? A real type that is largely a blend of aggression frequency and
    texture adds nothing; that is the question worth answering before building a channel.
    So the shipped behaviour is CAPPING (a check monotonically lowers strong holdings),
    which is what the quintile data wants and what fast-play dominance predicts
    (P(strong | showdown) 33.8% > P(check | strong) 24.0%).
    The mechanism is retained DORMANT, not deleted: below the critical softness
    tauFraction < 0.1875 * (span/iqr) ~ 0.6, TRAP_LIFT still yields a representable
    slowplay. postflopNarrower.test.js test 4 asserts both regimes AND the boundary, and
    fails if TRAP_LIFT is removed — so the channel stays buildable the day an axis is found
    that actually separates.
    Honest limit, per POKER_THEORY 11.8: median per-player evidence is 2 strong-hand spots
    and the corpus is showdown-selected, so this is a weak-power null, not proof of absence.
    See POKER_THEORY 11.8.
