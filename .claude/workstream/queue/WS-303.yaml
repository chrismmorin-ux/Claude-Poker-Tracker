status_note: |
  Filed 2026-07-28 during SPR-158 as the honest residual of WS-291. WS-291's own accept
  criteria demanded positive discrimination at every street; it is met at flop and turn and
  fails at the river, and these two effects are why. Splitting them out rather than
  quietly widening WS-291 keeps the measurement attached to the claim it refutes.
