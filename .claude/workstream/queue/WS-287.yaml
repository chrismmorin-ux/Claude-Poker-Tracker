status_note: |
  Filed 2026-07-27 alongside WS-286. This is the largest single piece of work between
  today and the readiness gate, and the one that decides whether the curriculum
  teaches something true or merely something self-consistent.

  Note the second decision flag carefully. WS-285's corpus evidence was admissible
  because it transferred ESTIMATOR STRUCTURE (a bias-variance fact driven by sample
  depth). A hero-EV edge is much closer to a VALUE — it depends on how the specific
  2009 online pool actually played. The live/online separation may bind here where it
  did not there. Settle it before building, not after measuring.
