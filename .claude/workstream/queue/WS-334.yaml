decision_flags:
  - |
    RESOLVED BY FOUNDER 2026-08-03 — the delete option is OFF THE TABLE. The original
    framing ("if depth-2 does not move the calibration number, delete it") was rejected on
    two grounds, both of which generalise beyond this ticket.

    ONE. A null result is only evidence if the instrument is trustworthy, and this engine
    is not in a verified state. The subsystem under test was just discovered to be dead;
    WS-300 had inverted range fixtures; WS-291 had a doc claim the data refuted; WS-276
    shipped an inert parameter. A "no difference" measured on that substrate is a
    statement about the substrate, not about depth-2.

    TWO. Even from a verified state, a capability's worth is not its marginal effect on
    one axis today. Reanalysis of a different type, a join against data not yet collected,
    or a transformation not yet conceived can make it load-bearing later. Deleting it is
    the one irreversible move; it destroys state space rather than preserving it.

    The standing rule this instantiates — KEEP THE FULL ARTICULABLE FLEXIBILITY OF THE
    GAME. Where accuracy can be increased, increase it. Assume the cracks are never fully
    resolved.
  - |
    OPEN — how to make depth-2 reachable. Candidates: cut the 361ms, raise or restructure
    the budget, or move refinement off the critical path (return depth-1 immediately and
    upgrade the view when depth-2 lands). Latency is the constraint to engineer around,
    not a reason to ship a shallower answer.
  - |
    OPEN — if depth-2 becomes reachable, run to completion or return partial? WS-301 gave
    all three depth-2 entry points a mid-loop bailout, so partial is available.
