status_note: |
  Filed 2026-08-03 while executing WS-301. WS-301 asked "does the live path pay the 8.5s?"
  The answer is no, because the live path does not reach the code at all. WS-301's own
  criteria are met and it is closed; this is the finding that replaced its premise.
  Measurement harness was temporary and deleted, but it is no longer needed: the stage
  ledger shipped with this item (`treeMetadata.latency`) reports the same facts from any
  live evaluation. `src/utils/exploitEngine/__tests__/depthReachability.test.js` guards the
  observability so the degrade can never go silent again.

  SHIPPED ALREADY UNDER THIS ITEM (2026-08-03), decision still open:
    - `treeMetadata.latency` — per-stage ran/blockedBy/atMs/ms ledger, `budgetSkipped`,
      `preRefinementMs`, `overBudget`. Diagnostic only; nothing branches on it.
    - `treeMetadata.depthReached` and `.callDepth2` now report work DONE. They were derived
      from the street, so the metadata asserted depth-2 on every postflop evaluation whether
      or not any ran — a large part of why this hid for months.
    - `depthReachability.test.js` — 4 tests asserting the degrade stays observable.
