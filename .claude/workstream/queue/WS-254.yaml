  - tendencyCalculations.extract3BetStats and ignition stats-engine
    analyzePreflopContext updated in lockstep; statsEngineParity.seam.test.js
    updated to pin the NEW semantics (all 21+ tests green).
  - STAT_PRIORS.foldTo3Bet (and poolBaseline segment handling) reviewed against the
    new definition; recalibrated or explicitly confirmed with a comment.
  - Exploit consumers (preflopAdvisor, weaknessDetector, subActionRules,
    liveGameContext) reviewed — thresholds re-checked against the new stat scale;
    tests updated where behavior legitimately shifts.
  - No regression in the full src/utils engine suite + extension suite.
