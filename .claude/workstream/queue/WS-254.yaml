status_note: |
  ####################################################################################
  # CORRECTION 2026-08-05 — SUPERSEDED IN PART, NOT MERGED AND NOT CLOSED.
  ####################################################################################

  WS-371 (commit 0cf1b915, 2026-08-05) recommended this ticket be SUPERSEDED rather than
  merged, and that recommendation is applied here. Its definition audit — the substance of
  the original scope — IS COMPLETE and is recorded in WS-371's commit message and in
  `src/utils/exploitEngine/preflopFoldQuantities.js`. This ticket has been narrowed to the
  residual WS-371 explicitly could not do: the counter RENAME in
  `tendencyCalculations.extract3BetStats` and the extension's stats engine, in lockstep,
  plus the `poolBaseline` key. See the correction block at the head of `description`.

  THE LOCKSTEP CONSTRAINT, stated once more because it is the reason this cannot be split:
  the app/extension parity seam (`statsEngineParity.seam.test.js:102`) passes TODAY precisely
  because neither side was changed. Renaming one side alone breaks it. This is one atomic
  change across two codebases, in a single commit.

  PRIORITY DELIBERATELY UNCHANGED at P2 / 14.0. Not raised here — the ticket has SHRUNK, not
  grown, and the urgent half already shipped. Recorded for the record: WS-371 measured the
  consequence this ticket had only DESCRIBED (every one of the 14 population cells trips both
  founder-facing over-folding surfaces, so an average villain reads as an over-folder by
  construction). That measurement is why the work moved at P0 while this sat at P2 for two
  weeks. The described-vs-measured gap is the finding; the P2 was not an error of judgement
  on the information available at the time.

  Residual re-verified against HEAD (0cf1b915) before narrowing, by reading code:
  `tendencyCalculations.js:112` (`extract3BetStats`), `:181/:243` (`facedRaisePreflop`),
  `:187/:245` (`foldTo3BetCount`); `ignition-poker-tracker/shared/stats-engine.js:60, 78,
  129` (`seatContext.foldTo3Bet`) and `:200, 229` (`stats.foldTo3BetCount`);
  `poolBaseline.js:69` (`STAT_COUNT_FIELDS.foldTo3Bet`) and `:88` (prior weight);
  `statsEngineParity.seam.test.js:102` (the pinned field list). All still present, all still
  carrying the old names. Sibling WS-255 (limp-reraise not counted as 3-bet) touches the same
  extractor and the same seam — still a candidate for one sprint with this.

  --------------------------------------------------------------------------------
  ORIGINAL NOTE (2026-07-22 / 2026-07-25, PRESERVED — SUPERSEDED ABOVE)
  --------------------------------------------------------------------------------

  Authored at founder request after WS-236 parity work exposed the broad
  definition. Both engines currently agree on the broad definition (parity-pinned)
  so there is no drift risk — this ticket is about whether the definition itself
  is right. Sibling: WS-255.

  EMPIRICAL EVIDENCE (2026-07-25, WS-262 HandHQ mining,
  docs/research/mass-pool-data-2026-07-25.md): on identical hands, the
  tracker's broad definition reads 78-86% while the TRUE opener-facing-3bet
  response is fold 49.9% / call 38.8% / 4-bet 11.0% (n=1.83M). The gap is
  ~30-36pp — exploit consumers reading the broad number as "folds to 3-bets"
  are drastically overestimating fold equity. Raises the urgency of this
  audit; the mined true-response rates are the recalibration reference for
  STAT_PRIORS.foldTo3Bet once the narrow definition lands.
