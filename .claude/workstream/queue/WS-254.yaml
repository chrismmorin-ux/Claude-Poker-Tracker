description: |
  ####################################################################################
  # CORRECTION 2026-08-05 — SCOPE NARROWED. WS-371 (commit 0cf1b915) COMPLETED THIS
  # TICKET'S DEFINITION AUDIT. WHAT REMAINS IS THE RENAME, AND ONLY THE RENAME.
  # The original framing is preserved below the line for provenance. Read the
  # correction block FIRST — most of what the original asks for is already done.
  ####################################################################################

  WHAT WS-371 COMPLETED, so it is not re-done here:

    - THE DEFINITION IS DECIDED AND RECORDED. `preflopFoldQuantities.js` now names the two
      quantities separately and states the conditioning set of each:
        FOLD_VS_PREFLOP_RAISE     a raise preceded this seat's FIRST preflop action —
                                  22,867,051 / 27,800,827 = 82.3% hand-weighted,
                                  75.8% +/- 14.2pp between players
        FOLD_VS_3BET_AFTER_OPEN   this seat RAISED, then faced a 3-bet —
                                  609,756 / 1,260,802 = 48.4% (call 40.0%, 4-bet 11.3%)
      A 33.9pp gap on identical hands. The narrow quantity was ALREADY mined per seat-bucket
      as `open3b`, so it ships as `HANDHQ_OPENER_FACING_3BET` with zero re-mine and a
      byte-identical data table.
    - EVERY CONSUMER IS AUDITED AND EACH IS NOW LABELLED FOR THE QUANTITY IT ACTUALLY WANTS.
      `weaknessDetector` and `villainObservations` wanted the broad one: renamed
      `pf-folds-to-3bet-high` -> `pf-overfolds-vs-preflop-raise`, `V-PF-FOLDS-TO-3BET` ->
      `V-PF-OVERFOLDS-VS-PF-RAISE`, raised P3 -> P1, with n now read from
      `facedRaisePreflop` directly rather than recovered by dividing a count by a rounded
      percentage. `preflopFoldResolver` relied on the broad semantics deliberately and is
      unchanged in behaviour but now asks for the quantity by name.
    - THE THRESHOLDS ARE DERIVED, NOT MOVED. Bar = field between-player mean + 1sd, maximised
      over served buckets (full ring 79.80 + 13.36 = 93.17%), with severity `(p - 93.17) /
      (100 - 93.17)`, replacing two anchors that disagreed at 60 and 55. The old MDF argument
      is rejected on its own terms.
    - NOTHING OUTSIDE `preflopFoldQuantities.js` READS `pct.foldTo3Bet` BY NAME ANY MORE.
    - 15 tests fail against the previous code; 22 of 22 pass now, 3,779 across the affected
      suites.

  WHAT SURVIVES — THE ONLY PART WS-371 COULD NOT DO. WS-371 corrected the SEMANTICS and the
  READERS. It did not rename the COUNTERS, and it says why: the app/extension parity seam
  passes today PRECISELY BECAUSE NEITHER SIDE WAS CHANGED. The remaining residual is three
  names in two codebases:

    1. `tendencyCalculations.extract3BetStats` (`src/utils/tendencyCalculations.js:112`)
       and the accumulator it feeds — `facedRaisePreflop` (`:181`, `:243`), `foldTo3BetCount`
       (`:187`, `:245`), and the local `foldedTo3Bet` flag. The counter is named for a
       quantity it does not measure.
    2. The extension's stats engine (`ignition-poker-tracker/shared/stats-engine.js`) —
       `seatContext.foldTo3Bet` (`:60`, `:78`, `:129`) and `stats.foldTo3BetCount`
       (`:200`, `:229`). Same names, same wrong referent, independently maintained.
    3. The `poolBaseline` key — `STAT_COUNT_FIELDS.foldTo3Bet` = `{ num: 'foldTo3BetCount',
       den: 'facedRaisePreflop' }` (`src/utils/exploitEngine/poolBaseline.js:69`) with its
       prior weight at `:88`, plus the matching `stats.foldTo3Bet` key in the generated
       `handhqReferencePool.js`, whose header already carries a standing warning that the key
       "IS NOT FOLD-TO-A-3-BET ... survives only because `poolBaseline.STAT_COUNT_FIELDS`
       binds to it".

  THE LOCKSTEP CONSTRAINT IS THE WHOLE DIFFICULTY, AND IT IS WHY THIS IS ONE TICKET RATHER
  THAN THREE. `src/utils/__tests__/statsEngineParity.seam.test.js:102` pins
  `'facedRaisePreflop', 'threeBetCount', 'foldTo3BetCount'` as field names that must match
  ACROSS the app and the extension. Renaming either side alone breaks that seam — the suite
  goes red and, worse, the two engines silently diverge if the seam is patched rather than
  moved. So this is ONE ATOMIC CHANGE ACROSS TWO CODEBASES: app extractor, extension stats
  engine, the seam's field list, and the pool key, in a single commit. The generated reference
  table must be regenerated in the same change if its key moves, since it is emitted by
  `scripts/generate-handhq-reference.mjs` and hand-editing it is forbidden.

  WHY THIS STAYED AT P2 AND WHY THAT WAS NOT WRONG. This ticket described the defect
  correctly on 2026-07-22 and even carried the 49.9% evidence in its status note. What it did
  not have was the MEASUREMENT of the consequence — that all 14 population cells trip both
  founder-facing over-folding surfaces, so a perfectly average villain is reported as having a
  leak the entire field has by construction. WS-371 measured that, which is what moved the
  work to P0 and got it done. A described defect and a measured one are not the same object,
  and the priority gap between them is itself a finding worth keeping (memory: numbers carry
  their conditional; a described consequence is not a measured one).

  --------------------------------------------------------------------------------
  ORIGINAL FRAMING (2026-07-22, PRESERVED FOR PROVENANCE — SUPERSEDED ABOVE)
  --------------------------------------------------------------------------------

  Surfaced by the WS-236 parity seam work (2026-07-22). The canonical pipeline's
  extract3BetStats (src/utils/tendencyCalculations.js) computes:

    facedRaise  = a raise occurred before the seat's FIRST preflop action
    threeBet    = facedRaise && seat raised at any point
    foldedTo3Bet = facedRaise && !threeBet && seat folded

  So foldTo3BetCount increments for ANY fold while facing a raise — including a
  plain fold-to-open (fold vs a single 2-bet, no 3-bet anywhere in the hand) and a
  cold-caller folding later. The stat's NAME, its Bayesian prior calibration
  (STAT_PRIORS.foldTo3Bet in exploitEngine/bayesianConfidence.js), the empirical
  pool baseline (poolBaseline.js), and its exploit consumers (preflopAdvisor.js,
  weaknessDetector.js, subActionRules.js, liveGameContext.js, villainObservations.js)
  all read it as "folds specifically when 3-bet" — e.g. sizing up 3-bets vs a
  villain "with high foldTo3Bet" is a very different exploit if the number is
  mostly fold-to-open frequency (which for most players is far higher than true
  fold-to-3bet). First-principles rule applies: the counter must measure the
  decision it claims to measure, not a broader label.

  Scope: decide the correct definition (denominator = raised-then-faced-a-3bet
  opportunities; numerator = folded to the 3-bet), check whether STAT_PRIORS /
  pool-baseline calibration assumed the narrow or broad definition, and fix
  tendencyCalculations + the extension stats-engine IN LOCKSTEP — the WS-236
  parity suite (src/utils/__tests__/statsEngineParity.seam.test.js) pins the two
  engines together and MUST be updated in the same change (it currently pins the
  broad/canonical definition on both sides deliberately).

  POKER_THEORY.md + exploitEngine/CLAUDE.md reads are mandatory before editing
  (engine guardrail). Sibling ticket WS-255 (limp-reraise not counted as 3-bet)
  touches the same extractor — consider one sprint for both.
accept_criteria: |
  SCOPE NARROWED 2026-08-05 — see the correction block. The definition, the consumer audit
  and the threshold derivation are DONE (WS-371, commit 0cf1b915). Do not redo them.

  - THE COUNTERS ARE RENAMED TO THE QUANTITY THEY MEASURE, on BOTH sides, IN ONE COMMIT.
    App: `extract3BetStats` and its accumulator fields (`facedRaisePreflop`,
    `foldTo3BetCount`, the local `foldedTo3Bet`). Extension:
    `ignition-poker-tracker/shared/stats-engine.js` (`seatContext.foldTo3Bet`,
    `stats.foldTo3BetCount`). The target vocabulary already exists and must be reused, not
    reinvented — `preflopFoldQuantities.js` names it `FOLD_VS_PREFLOP_RAISE`.
  - THE PARITY SEAM MOVES WITH THEM. `statsEngineParity.seam.test.js:102` lists the pinned
    field names; it must be updated in the SAME commit and stay green. Changing one codebase
    alone breaks the seam by construction — that is not a merge hazard to be worked around,
    it is the invariant doing its job.
  - THE `poolBaseline` KEY FOLLOWS. `STAT_COUNT_FIELDS.foldTo3Bet` (`poolBaseline.js:69`) and
    its prior weight (`:88`) bind to the counter names; the generated
    `handhqReferencePool.js` `stats.foldTo3Bet` key and its `statConditioning` entry move
    with them. The table is GENERATED — regenerate via
    `node scripts/generate-handhq-reference.mjs`, never hand-edit, and confirm the emitted
    rows are otherwise byte-identical (the same discipline WS-371 held itself to).
  - NO BEHAVIOUR CHANGE. This is a rename, and it should be provable as one: the same inputs
    produce the same numbers, the same observations fire with the same severities, and the
    only diff is identifiers. If a behaviour change appears, something in the correction block
    was wrong and the ticket should stop and report rather than absorb it.
  - IDB / PERSISTED SHAPES ARE CHECKED BEFORE RENAMING ANYTHING THAT LANDS ON DISK. If any
    persisted record or sync payload carries these field names, a rename is a migration, not a
    rename — check `PERSISTENCE_OVERVIEW.md` and the extension sync path first.
  - No regression in the full src/utils engine suite or the extension suite (824+ tests).
