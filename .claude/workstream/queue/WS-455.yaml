description: |
  exportUtils.js importAllData threads userId into saveImportedHand but calls createPlayer/
  createSession without it — both default to GUEST_USER_ID. WS-368 wired one of three entity
  types; the defect class (feedback_userid_data_isolation, WS-238 residual) recurred inside the
  commit written to close it, which is the argument for a mechanism over the convention.
  Also establish clearAllData()'s user scope while in the file (cross-ref FIND-103).
  Full mechanism: findings/FIND-117.yaml. Structural half (S5): CI grep gate on bare
  createPlayer/createSession/saveHand calls.
accept_criteria: |
  - createPlayer and createSession receive the real userId on the import path; test covers a
    signed-in import.
  - CI gate rejects a bare user-scoped constructor call without a userId argument.
  - clearAllData()'s scope is established and documented (or fixed if global).
  - Plain English: import a backup while signed in, then sign out — none of the imported
    players or sessions are still visible.
