decision_flags:
  - |
    THE FOUNDER HOLDS A PRIOR THAT DISCRETE SUB-ARCHETYPES EXIST, AND THE MEASUREMENT DISAGREES.
    Three independent measurements (VPIP/PFR clustering, behavioural-feature clustering, and a
    dial-vs-switch mixture test over nine behaviours) all return a continuum with one dominant axis.
    He is RIGHT that players differ; the six-type container is what the data refuses. He should rule
    on this rather than have it resolved silently in a schema — and he should see the disagreement
    stated plainly, not softened. See WS-437's related surface: the table-recognition need the
    six labels were serving is real and gets its own, firewalled channel.
