naming_resolved: |
  NAMING COLLISION, FOUND AND SETTLED 2026-08-02. The founder's spoken "MDA" expanded to
  Mass Data Analysis. That acronym is ALREADY TAKEN in this repo: MDA = Market Dynamics
  Analysis in the governance layer (.claude/commands/decide.md; the `market_dynamics` block
  validated by cwos-asn-validate, whose exit code 3 is literally "MDA failure"). Two
  meanings for one acronym inside one repo is a fault waiting to happen in exactly the way
  this program exists to prevent.

  Founder response: "Mass Data Analysis was what I used. I'm not tied to it."

  RESOLVED: the canonical name is **Mass Data Field (MDF)**, source id **SRC-012** (raw) /
  **SRC-011** (aggregates). "Field" is not a new coinage — it is FSA's own surface class for
  this object, so the name now states what kind of thing it is. `MDA` is RETIRED in this
  sense and must not appear in code, schemas, or Result Cards; the vocabulary register
  records it as a retired alias so old notes and transcripts still resolve.
