description: |
  FOUNDER DIRECTIVE (2026-08-08, mid-WS-436): "we are going to need to look at each place where
  we use a label and the foundation of data and make sure its all in order and properly listed
  somewhere such that we can rank the estimated impact."

  WS-436 removes the six style labels as engine inputs, but the label anti-pattern has more
  instances than one taxonomy: position labels (tier-4 priors), bucket labels (fallback paths),
  anchor scope predicates, texture categories, SPR zones, seat-bucket rows, line tags — every
  discrete key standing between raw data and an engine parameter. Each has a DATA FOUNDATION
  (founder estimate / mined corpus / fitted curve / structural computation) of varying quality,
  and today there is no single place that lists them, so nothing forces the next WS-436 to be
  noticed rather than stumbled on.

  THE STANDARD BEING ADOPTED (a new consistent thing the repo does, alongside the product):
  - Engine-improvement work is spoken of in terms of ABSOLUTE EV: each change carries its
    measured per-EV impact (bb/100, NET with GROSS beside it, per the change-ledger discipline),
    not a vibe of "better".
  - Absolute-EV framing must NOT flatten the nuance: the nooks and crannies where decisions are
    actually made (per-street, per-facing-action, per-cohort cells) stay visible — the ledger
    ranks by aggregate impact but preserves the decomposition.
  - EXHAUSTIVENESS IS THE BLIND-SPOT DETECTOR: the improvement list must be exhaustive by
    construction. If the ledger cannot name anything that could make the engine better, that is
    not evidence the engine is done — it is evidence we are in a blind spot, and it triggers a
    deep analysis (reframe-engine / eng-engine class), not a celebration.
accept_criteria: |
  - One artifact (docs/standard-of-record/ or docs/research/) that exhaustively lists every
    label-shaped input in the engine paths: the label set, every consumer site (file:line),
    the data foundation underneath it (founder estimate | mined | fitted | structural), the
    foundation's measurement status, and the estimated absolute-EV impact of fixing/removing it
    — measured where a harness exists, bounded-estimate where it does not, with the method named.
  - Entries are RANKED by estimated impact, and each entry names what would raise its estimate
    from bounded to measured (the instrument gap, if any).
  - Exhaustiveness is argued, not assumed: the sweep method (grep patterns, table inventory,
    consumer trace) is recorded in the artifact so a reader can re-run it and find drift.
  - The standard itself is written into doctrine (POKER_THEORY or standard-of-record docs):
    absolute-EV framing, per-change measured impact, exhaustive-list-or-blind-spot rule.
  - The ledger has a maintenance hook: new label-shaped inputs land in the ledger in the same
    change that introduces them (analogous to the schema-baseline additive discipline).
  - WS-436's Result Card (RC-style-collapse) enters as the first measured row — the worked
    example the rest of the ledger is held to.
