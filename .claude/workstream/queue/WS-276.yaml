description: |
  THREE PARTS OF ONE OBJECT. Filed as one item because they cannot be built
  separately: the bluff count is a function of hero's range, and villain's model of
  hero IS a function of hero's actual range.

  RE-SCORED 18 -> 32 on 2026-07-30 (founder session). See status_note for the
  motivating hand — a play the engine could not have found, and would have scored as
  a mistake.

  HALF A — HERO HAS NO RANGE. The engine answers "what is the best action with
  THIS hand, HERE." It never constructs hero's strategy at a node — the
  partition of hero's whole range into actions. Against a non-adjusting fish,
  node-local max-EV is genuinely correct and this is not a bug; the app is
  exploitative by design (§5.4) and balance is a cost against opponents who do
  not observe. But four things are lost:
    - Hero self-audit is impossible. You cannot ask "am I over-folding AS A
      RANGE in this spot" or "is my c-bet frequency defensible" — the same
      weakness-detection machinery pointed at hero requires a hero range to
      point it at. This is the measurable-strategy surface the founder asked
      about, on the hero side.
    - Half B has no object to operate on.
    - Half C (below) has no object to count.
    - Against recurring opponents (the same live room every week), maximal
      deviation is not maximal EV forever.

  HALF C — NO BLUFF:VALUE CONSTRUCTION FROM SIZING (added 2026-07-30, founder).
  Verified absent: the engine has MDF, the auto-profit threshold, and it estimates
  VILLAIN's bluff-to-value ratio — but it never constructs HERO's betting range, so
  it cannot answer the question a player actually asks at the table:

      "At this sizing, how many bluffs does my value count support?"

  The construction is standard and cheap once a hero range exists. For a bet of `s`
  times pot, villain is indifferent when hero's betting range is

      bluff share  = s / (1 + 2s)          bluff combos = value combos x s / (1 + s)

  so a pot-sized bet supports bluffs equal to half the value combos (2:1 value:bluff),
  a half-pot bet — the founder's 3:1 pot-odds example — supports a third (3:1), and a
  2x overbet supports two thirds (1.5:1). With 23 value combos betting a given size,
  half pot licenses ~8 bluffs and pot licenses ~11.

  That is the BALANCED anchor. The exploitative deliverable is the DEVIATION from it,
  which is where this repo's edge lives: against a villain who over-folds, hero can
  carry more bluffs than the ratio permits; against a station, fewer. Same shape as
  WS-310 — compute the theoretical baseline, then measure and apply the departure from
  it. Do not ship the ratio as a prescription.

  HALF B — NOTHING MODELS WHAT VILLAIN THINKS HERO HAS. Verified 2026-07-26 and
  re-verified 2026-07-30: perceived-range logic exists ONLY in
  src/utils/handAnalysis/replayAnalysis.js and hindsightAnalysis.js — post-hoc review.
  The live decision path has none. Every villain fold/call decision is currently
  computed against hero's actual holding or a generic range, but a villain's decision
  derives from their equity vs THEIR PERCEPTION of hero's range. A villain who thinks
  hero is a nit folds differently from one who thinks hero is a maniac — against the
  identical hand.

  This is the biggest lever in the batch that the founder was already reaching
  for: WS-264 names "concealment premium → perceived-range factor (founder
  factor, pending founder completion of the factor definition)". The finding here
  is that it is not a FACTOR. It is a missing state variable — and the only input
  to villain's decision process that hero DELIBERATELY CONTROLS. Table image is
  a resource hero spends and accumulates; the engine currently cannot represent
  it at all, which means it can never advise on it.

  PROPOSED SCOPE (v1 deliberately narrow — this is design-first).
    - A hero range object at a node, constructed from hero's actual action
      history the same way villain ranges already are (reuse rangeEngine, do not
      rewrite range semantics).
    - Bluff:value construction over that range: given a sizing, the supported bluff
      count, and the deviation licensed by this villain's measured fold tendency.
    - Hero self-audit: weaknessDetector pointed at hero's own aggregate play.
      Read-only, non-grading — per feedback_owner_volunteered_grading, an opt-in
      observation surface, never an imposed rank.
    - Perceived-hero-range as an explicit modeled quantity threaded into
      villainDecisionModel: what THIS villain has plausibly observed of hero
      (hands seen, showdowns hero revealed, hero's recent visible aggression) —
      NOT hero's true range and NOT an omniscient one. Per-villain, because a
      villain who arrived twenty minutes ago has seen almost nothing.
    - Discipline: perceived range is a DERIVED OUTPUT of the observation
      history (§7.1). No "hero image = tight" label used as a decision input.
    - Recursion stops at level 2 in v1. Hero models villain modeling hero. No
      deeper. Document the stopping point as deliberate.

  SEQUENCING NOTE. WS-264's concealment-premium mining feeds the empirical side
  of Half B. This item defines the object that mining result plugs into; the
  founder-factor definition WS-264 is waiting on is arguably this design work.
accept_criteria: |
  - Gate 1 (Entry) + Gate 4 (Design) per docs/design/LIFECYCLE.md completed
    before implementation — new surface, new persona-facing concept.
  - Hero range constructible at a node from hero's own action history, using
    existing rangeEngine semantics.
  - BLUFF:VALUE — given a node, a hero range and a sizing, the engine reports the
    value combos that bet that size, the balanced bluff count from s/(1+s), and the
    deviation licensed by this villain's measured fold tendency. Asserted by test at
    three sizings (half pot 3:1, pot 2:1, 2x overbet 1.5:1).
  - The ratio ships as a BASELINE that exploitative deviation is measured against,
    never as a prescription — same discipline as WS-310's Layer A.
  - Hero self-audit surface produces range-level observations about hero's own
    play (frequencies, over/under-fold vs the spot's requirement). Opt-in;
    observational, not graded.
  - Perceived-hero-range modeled per-villain from what that villain has
    plausibly observed, threaded into villainDecisionModel as an input to their
    equity estimate. Test: two villains at the same table with different
    observation histories produce different predicted responses to the identical
    hero action.
  - REGRESSION TEST FROM THE MOTIVATING HAND: with a hero range containing the
    straight-completing combo and an observation history showing recent visible
    aggression, villain's predicted fold rate to a large river bet is materially
    HIGHER than with an empty observation history — same hero holding, same board,
    same sizing. This is the effect the engine currently cannot represent at all.
  - Perceived range is derived from observation history, asserted by test — no
    image label used as a rate lookup (§7.1/§7.2).
  - Level-2 recursion boundary documented in POKER_THEORY.md as a deliberate
    stopping point, with what would justify going deeper.
  - POKER_THEORY.md gains a hero-range / perceived-range / bluff:value section;
    version + changelog bumped.
