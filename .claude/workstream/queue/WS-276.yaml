status_note: |
  Filed 2026-07-26. Verified by grep (re-verified 2026-07-30): perceived-range logic
  exists only in handAnalysis/ (post-hoc), absent from the live exploitEngine path.
  Directly answers the "perceived-range factor pending founder completion" note carried
  in WS-264 — the finding is that it is a state variable, not a factor.
  Design-first: Gates 1 and 4 required before code.

  RE-SCORED 18 -> 32 on 2026-07-30, above WS-307 (31), making this the top item in the
  program. The argument is a hand the founder played, which the engine could not have
  found and would have scored as a mistake:

    QJo on the BTN. HJ opens 15, hero 3-bets to 60, BB cold-calls, HJ calls.
    Flop Q94 rainbow — hero c-bets just under pot with top pair.
    Turn J — hero has two pair, bets 250. HJ folds, BB calls.
    River A — hero shoves 600. BB folds and shows 8Ts: a made straight, second nuts.

  BB folded the second nuts because KT (Broadway on that runout) is credibly in a BTN
  3-betting range, and hero had been visibly betting draws all night. The fold was
  driven ENTIRELY by BB's model of hero's range — the one quantity in villain's decision
  that hero controls, and the one the engine cannot represent.

  Note the structure, which is why this hand is the right motivating case rather than
  just a nice story: on that river hero's two pair BEATS every one-pair hand (AK, AT,
  KQ) and LOSES to every two-pair-or-better (AQ, AJ, A9, sets, KT, T8). There is no
  middle. So the shove folds out only hands hero beats and is called only by hands that
  beat hero — it is a made hand turned into a bluff, and its entire profit came from
  folding out T8/KT/AQ. A node-local max-EV engine with no hero range and no perceived
  range evaluates that shove against villain's range alone and cannot see the mechanism
  that made it profitable.

  Same theme as WS-307 with the sign flipped: there, zero showdown value made bottom
  pair a fine bluff CANDIDATE but the uncapped range could not fold. Here the range was
  capped and the villain over-folds, so a hand WITH showdown value was correctly turned
  into a bluff. Neither spot is decidable without the hero side of the tree.

  Caveat recorded honestly: the play is read-dependent and not balanced-correct — against
  an opponent calling correctly it is a losing shove, and the founder's stated read
  ("more missed draws than value") actually argues for checking. The profit came from a
  different mechanism than the stated reasoning. That does not weaken the ticket; it
  sharpens it, since the engine should be able to tell those two mechanisms apart.
