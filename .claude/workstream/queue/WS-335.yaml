decision_flags:
  - "MAY SPLIT AT DESIGN TIME. Part A (combo-rank executor) is small, self-contained, and cannot be dominated. Part B (class index) is large and carries the real risk. They were raised together by the founder as one delivery question and compose into one artifact, so recommend designing together; split execution if the postflop hand axis turns out to need migration work of its own."
  - "WHAT MAY THE EV-LOSS MEASUREMENT USE? Comparing this card to the ENGINE is a paired per-decision EV difference and the existing hero-EV backtest path can express it. Comparing it to OTHER SURFACES is a surface divergence and belongs to FSA Phase 3, which does not exist yet. These are different measurements and the boundary is thin — resolve it before building, because FSA's standing constraint forbids a second comparison path and the failure mode is building one by accident under a different name."
  - "WHAT ORDERS THE COMBO RANK WITHIN A CLASS? Blocker value, backdoor equity, and realized-equity-when-called are three defensible scalars and they disagree. Recommend measuring rather than choosing, on the same corpus and the same metric as the class ordering."
