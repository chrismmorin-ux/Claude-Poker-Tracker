status_note: |
  Filed 2026-08-02 at founder direction ("it's at least worth testing in comparison to other
  strategies"). Founder proposed two delivery optimizations: suit-ranked mixing and an indexed
  enumeration of hole-card-by-board interactions, and asked explicitly whether either is merely
  a component or is dominated. Analysis confirmed the first is a component that cannot be
  dominated (the suit is unobservable, so determinism is free) subject to the order being
  board-relative rather than absolute, and that the second is dominated IF AND ONLY IF ordered
  by hand strength — which is the reading the phrase "forced positive" most naturally invites,
  and is why the distinction is stated in the accept criteria rather than left to the build.
  The pair composes into an exactly-executable form of any mixed strategy, which is the reason
  to file them as one ticket.
