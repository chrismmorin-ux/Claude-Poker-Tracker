status_note: |
  Premises verified against HEAD (fe716f59) by reading code, not by trusting the brief that
  requested this work. Where the brief was wrong, the correction is recorded rather than silently
  applied — see MO-11 in `.claude/context/MEASUREMENT_OVERSIGHTS.md`.

  VALIDATOR PRECEDENT COPIED: `cwos-reconcile.js:759` `validateFindingProblemClass()` — builds a
  program's declared vocabulary from `problem_classes[].name`, checks findings against it, emits a
  WARNING never a violation because an unclassifiable finding is a finding ABOUT THE PROGRAM and
  that state must persist in the tree. `docs/context-bundles.md` §7.1 extends the reasoning: every
  state this validator detects is one a healthy repo occupies legitimately for a while, and a
  blocking check here would be routed around within a week — worse than no check, because it still
  looks like coverage.

  THE TWO PERSONA KINDS ARE STRUCTURALLY DISTINCT AND THE COUNT CONFIRMS IT. `.claude/agents/*.md`
  holds 38 ANALYTICAL LENSES (who audits the code — estimation-theorist, game-theorist,
  failure-engineer). `docs/design/personas/{core,situational}/` holds 40 PRODUCT PERSONAS (who a
  surface is for — chris-live-player, mid-hand-chris). The field is named `lens:` rather than
  `persona:` deliberately. The validator loads the product personas ONLY to detect the conflation,
  never to resolve a lens: `persona-kind-confusion` fires when a bundle names a product persona as
  a lens. Without it the failure is silent — a category error would read as a typo, and the curator
  would fix the spelling.

  RUN OUTPUT AT TIME OF FILING. `node kit/scripts/cwos-bundle-validate.js`: 2 bundles, ceiling
  40,000 bytes, 4 findings (all `unbundled-task`: WS-405, WS-406, WS-416, WS-417). Five
  `unpinned-include` findings were resolved by `--rehash` before filing. All 8 negative cases fired
  correctly against a throwaway probe bundle (persona-kind-confusion, unresolved-lens,
  missing-section, missing-include, ceiling-breach, bad-exclude-reason, no-withholding,
  vocabulary-drift). `content-drift` confirmed by mutating a pinned file and re-running; it cleared
  on revert. `node kit/scripts/cwos-reconcile.js --quiet`: exit 0, 0 violations, warnings 22 -> 27.

  THAT DELTA IS +5, AND ONLY +4 OF IT IS THIS WORK — the distinction is recorded rather than
  rounded, because rounding it would be MO-11 committed inside the ticket that catalogues MO-11.
  The four are the `context-bundle [*] unbundled-task` warnings above. The fifth is
  `queue: WS-423 has unknown status "reserved"`, a placeholder file written by a concurrently
  running agent while this ran; it is not attributable here and will clear when that agent fills
  its item in. No pre-existing warning changed text or disappeared.

  COORDINATION. `docs/context-architecture.md` is being authored in parallel and owns the
  poker-doctrine heavy/light tier; this owns task scoping and lens assignment. They compose through
  one seam, stated in §6: bundles address doctrine by `path` + `section` HEADING, never by line
  number, so a split may rename or re-tier freely and a broken pointer reports `missing-section`
  rather than silently delivering less than it claims. Both shipped bundles point at
  `POKER_THEORY.md § "7. First-Principles Decision Modeling"` — that heading is the assumption to
  preserve or deliberately break.
