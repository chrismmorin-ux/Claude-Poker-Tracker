decision_flags:
  - |
    OPEN AND THE CENTRAL ONE — SHOULD A DISCOVERY RUN'S TOOL ACCESS ACTUALLY BE SCOPED, OR IS THE
    AUDIT TRAIL THE RIGHT CEILING? Enforcing `excludes` at read time would need per-task tool
    scoping the harness does not offer, and even then auto-memory is injected before any bundle is
    read. The options are: (a) accept the audit trail and invest in the post-hoc check, which is
    cheap and honest but detects only what a finding CITES; (b) pursue real scoping, which is
    expensive, partly outside this repo's control, and would make a discovery run unable to read
    files it might legitimately need; (c) treat the whole withholding rule as a norm and delete the
    machinery. The founder should decide, because (a) and (c) look identical from outside and
    differ entirely in whether anyone can later ask what a run was allowed to see.
  - |
    OPEN — WHETHER `unbundled-task` SHOULD STAY ON. It currently fires on four items and will fire
    on every future item whose problem_class a bundle claims. That is the intended behaviour and it
    is also a warning that grows with adoption: adding a bundle RETROACTIVELY makes existing items
    non-compliant. Either that is the point (the bundle is asserting these items were unscoped all
    along, which is true), or the check should only apply to items created after the bundle's
    `version`. The first is more honest; the second keeps the warning list workable. Note the
    check already skips closed items, so the list is bounded by open work rather than by history.
