schema_version: "1"
# adoption_level retired (WS-438 / ADR-016) — capabilities block is canonical.
adopted_at: ""      # Set during /adopt
repo_type: ""       # Set during /adopt (SaaS, Frontend, etc.)

# Command usage tracking — incremented each time a command runs
# Updated by: session-end (batch), quick-fix epilogue, individual commands
# NOTE (2026-07-27): this ledger was all-zero before today — the "update
# silently" step never actually ran in prior sessions, so these totals count
# from this session forward and UNDERCOUNT the repo's real history. Do not read
# them as lifetime figures until backfilled.
command_usage:
  status: 0
  session_start: 0
  session_end: 1
  next: 0
  workstream: 0
  engine: 0
  build_engine: 0
  audit: 0
  verify: 0
  plan: 0
  pulse: 0
  decide: 0
  # Quick fix and standard mode aren't commands but track session types
  quick_fix_sessions: 0
  # Entered as Quick Fix, escalated to Standard on the second file and stayed
  # there. Counted once, as Standard — the mode it actually ran in. (The
  # session-end protocol nominally says strategic; that would misreport it.)
  standard_sessions: 1
  strategic_sessions: 0

# Engine run tracking — which engines are actually used
engine_runs:
  # engine_name: { runs: N, last_run: date, findings_generated: N, items_created: N }
  # Example:
  # eng-engine: { runs: 3, last_run: "2026-04-01", findings_generated: 12, items_created: 5 }

# Value ledger — concrete evidence of CWOS impact
# Each entry is a timestamped record of value delivered
value_ledger:
  # 8 real defects found + fixed this session, but none were filed as formal
  # FIND-NNN records (the work was founder-reported and shipped directly), so
  # this counter stays 0 rather than being inflated. The findings live in
  # .claude/failures/STALE_CHUNK_DEAD_END.md and DEC-025..028.
  total_findings_caught: 0
  total_items_completed: 0       # No queue items — unqueued founder-reported work
  total_items_created: 0
  # The OnlineView mismatch-reload defect was the SAME pattern already fixed
  # once in 963451f (UpdateBanner); the pattern sweep caught the second instance
  # before it shipped a wrong "update the extension" instruction to the founder.
  regressions_prevented: 1
  invariant_violations_caught: 0
  # (1) system/state.md claimed kit/scripts was never installed — it is.
  # (2) errorLog stamped a hand-maintained 'v122' that froze while the app moved
  #     to v123, so every logged error and exported bug report carried a wrong
  #     build. Now stamped from BUILD_SHA.
  drift_corrections: 2
  decisions_recorded: 4          # DEC-025, DEC-026, DEC-027, DEC-028
  sessions_with_handoff: 1
  # Calculated at read time:
  # value_density = total_findings_caught / max(engine_runs_total, 1)
  # session_continuity = sessions_with_handoff / max(total_sessions, 1)

# Adoption trajectory — tracks which features are actually providing value
# Updated by convergence engine
feature_engagement:
  # Feature: { available: true, used: bool, last_used: date, value_score: 0-10 }
  session_discipline:
    available: true
    used: true
    last_used: "2026-07-27"
    value_score: 0    # Updated by convergence engine based on handoff quality
  queue_management:
    available: false   # Set true at L2+
    used: false
    last_used: ""
    value_score: 0
  engine_analysis:
    available: false   # Set true at L3+
    used: false
    last_used: ""
    value_score: 0
  program_governance:
    available: false   # Set true at L4+
    used: false
    last_used: ""
    value_score: 0
  autonomous_cycles:
    available: false   # Set true at L5
    used: false
    last_used: ""
    value_score: 0

# Escalation readiness — signals that suggest the repo is ready for next level
# Computed by convergence engine, consumed by session-start
escalation_signals:
  current_level: L3
  next_level_ready: false
  readiness_score: 0.0   # 0.0 to 1.0
  signals: []
  # Example signals:
  # - "10+ sessions completed — session discipline is established"
  # - "User manually tracks work outside queue — queue management would help"
  # - "3+ ad-hoc analyses performed — engine framework would formalize this"
  last_evaluated: ""
  recommendation: ""      # Human-readable suggestion

# Convergence metrics — is the system embedding deeper or being ignored?
convergence:
  trend: "unknown"        # "embedding", "stable", "declining", "unused"
  weeks_tracked: 1
  weekly_snapshots:
    - { week: "2026-W31", sessions: 1, commands: 1, findings: 0, items_done: 0, decisions: 4 }
  # Each snapshot: { week: "2026-W14", sessions: N, commands: N, findings: N, items_done: N }
  # Convergence = positive slope on commands+findings over 4+ weeks
  # Decline = negative slope or zero activity for 2+ weeks
  last_evaluated: ""
