name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/__tests__/computeCodeDigest.test.js (WS-572) resolves real commits —
          # digestAt('a60d4084'), digestAt('48bd185e75'), and a `^` parent — to assert that
          # the code digest re-opens exactly the jobs a change invalidated. checkout@v4
          # defaults to fetch-depth: 1, so those commits were absent and digestAt returned
          # null: the test read as an assertion failure ("expected null to be truthy") when
          # the real cause was a shallow clone. Full history is what the test actually needs.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # FIND-086 / WS-431: CI runs `npm test` directly (not smart-test-runner), so the
      # SoR additive gate needs its own step here — it is not redundant with the local one.
      - name: SoR additive-schema gate
        run: bash scripts/check-sor-additive.sh
      # WS-445, and here for the same FIND-086 reason as the step above: CI runs `npm test`
      # directly, so the label-ledger gate needs its own step and is not redundant with the
      # copy in smart-test-runner.sh.
      - name: Label & Foundation Ledger gate
        run: bash scripts/check-label-ledger.sh
      # WS-519 / prog-guide-authority, and here for the same FIND-086 reason as the steps
      # above: CI runs `npm test` directly, so the guide-authority gate needs its own step.
      # It measures inertness as well as conformance — a standard with zero instances passes
      # every conformance check and prints a green tick.
      - name: Guide Authority observance gate
        run: bash scripts/check-guide-ledger.sh
      - run: npm test
      # WS-555, and the same FIND-086 reason as the gates above: CI runs `npm test` directly,
      # and these known-answer checks hang off `preflight`, which CI never invokes. Their own
      # runner opens with the observation that six of them "have caught real bugs" and nothing
      # ran them. `sourceParity` is the WS-555 gate — corpus, Ignition and live-app hands must
      # produce identically-shaped decision rows — and it takes under a second.
      - name: Villain-archetype known-answer checks
        run: npm run check:archetype
      - name: Model Coherence scan (advisory — Phase 1)
        run: node scripts/coherence-scan.cjs
        continue-on-error: true
      - name: Upload coherence manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coherence-manifests
          path: |
            .claude/coherence-report.json
            docs/engine/CANONICAL_PIPELINE.md
            docs/engine/SURFACE_SUBSCRIBERS.md
            docs/engine/INTEGRATION_DEBT.md

  # WS-441: rendered-px 44px touch-floor enforcement. BLOCKING by design — the
  # defect class this guards ("44px targets" believed shipped, delivered at
  # ~31px under the canvas scale transform) survived four months because no
  # instrument measured rendered size. boundingBox() needs no snapshot
  # baselines, so this stays blocking while visual-regression.yml stays advisory.
  touch-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Placeholder env (guest mode — no Firebase project needed)
        run: node scripts/setup-local-env.mjs
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Touch-floor enforcement
        run: npx playwright test tests/playwright/touch-floor.spec.js --project=chromium
