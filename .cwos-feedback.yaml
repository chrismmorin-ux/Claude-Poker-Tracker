  - id: fb-001
    timestamp: "2026-05-20T00:00:00Z"
    session_id: "session-2026-05-20-next"
    category: concern
    summary: "Verify ticket premise against current code DURING /next composition, before approval — not mid-execution"
    detail: >
      SPR-095's two anchors were authored by a Gate-2 blind-spot audit and both
      had premises that didn't match the code: WS-206 assumed LSW line nodes
      store an asserted-equity number to validate against (none exists — equity
      is prose-only), forcing a mid-sprint reframe + an extra founder decision;
      WS-205 risked duplicating existing equity infra (computeComboEquityDistribution).
      The approval option also said "~68 nodes" when only 5 were parity-eligible.
      This is the SAME pattern flagged one sprint earlier (SPR-094: WS-204 was a
      duplicate of pre-existing work) — now a confirmed RECURRING failure mode of
      audit-authored tickets. Fix: /next composition should spend ~2 min checking
      each anchor's core assumption (does the data structure exist? is the work
      already done? what's the real scope/count?) against the codebase BEFORE
      presenting for approval, so reframes/scope-corrections happen upfront in one
      accurate proposal instead of as mid-flight interruptions.
    resolved: false
    resolution: null
  - id: fb-004
    timestamp: "2026-08-01T01:10:00Z"
    session_id: "ses-20260731-2126-fa05cd65"
    category: feature_request
    summary: "Founder directive — route recurring CWOS defects upstream to HomeBase so they get fixed, not just re-logged each session"
    detail: >
      Founder asked that this session's CWOS problems be filed "with HomeBase AI
      input channel so it can fix it eventually." Two defects observed this session,
      both logged in friction_log:

      fr-021 — cwos-next.js `done` still leaves completed_at/completion_commit null
      on template-created queue items. This is fr-020 RECURRING UNCHANGED five weeks
      later, with a complete and correct diagnosis already written at that time
      (presence-vs-value guard). Nothing upstream acted on it. Every sprint close in
      every repo using the standard ticket template loses closure provenance on the
      editable surface, and the backfill debt grows by one item per close (43+ here).

      fr-022 — /next auto-minted a session via cwos-claims, claimed a P0 item, and
      emitted sprint_approved with status:approved BEFORE the founder approved
      anything. A composed-but-unapproved sprint is therefore indistinguishable from
      an approved one in the state files, which made a bare founder "approve" genuinely
      ambiguous and cost a wrong-direction step (the AI routed it to /session-end and
      released the P0 claim before reconstructing the real sequence from the event log).

      THE ACTUAL REQUEST, which is broader than either defect: friction_log currently
      functions as a diary rather than a queue. fr-020 was diagnosed precisely, marked
      non-blocking, and then simply recurred. There is no mechanism that turns a
      repeated friction entry into upstream work. Suggest HomeBase treat a friction id
      recurring across sessions or repos as an automatic kit work item, since recurrence
      is the signal that the "non-blocking, workaround applied" judgement was wrong.
    resolved: false
    resolution: null
  - id: fb-002
    timestamp: "2026-05-20T00:00:00Z"
    session_id: "session-2026-05-20-next"
    category: concern
    summary: "/next resume-check only looks for status:active — misses approved-but-unexecuted sprints"
    detail: >
      SPR-095 was status:approved with items_done:0 (a prior session composed +
      got it approved, then stopped before executing). /next Step 1 only scans for
      status:active, so a freshly-approved-but-unstarted sprint is invisible to the
      resume path and a new /next would stack a second sprint on top, orphaning the
      approved work. Caught only by luck (reading a sprint file for schema reference).
      Fix: Step 1 resume-check should also surface sprints where status==approved AND
      completed_at==null (especially items_done<item_count) and offer to resume them.
    resolved: true
    resolution: >
      Fixed in WS-269 / SPR-152 (commit af6c35d here; upstreamed to the HomeBase
      canonical kit as 29361a4 so /kit-upgrade won't revert it). cwos-next.js gained
      findResumableSprint() — matches status:active, else status:approved with
      completed_at:null — and resolveResumableSprint(), which unions state/sprints.json,
      sprint-index.yaml, and a direct sprints/ dir scan (the dir scan closes the window
      where approve has written the YAML but neither cache has refreshed). approve now
      also refuses to mint a second sprint while one is open, with an
      --override-active-sprint escape valve. Root cause was broader than reported:
      NOTHING in the pipeline ever wrote status:active, so the entire resume path was
      dead code. Regression coverage: kit/scripts/__tests__/cwos-next-resume-approved.test.js
      (11 cases). SPR-143, orphaned by this gap since 2026-06-21, was abandoned in the
      same commit.
  - id: fb-003
    timestamp: "2026-05-20T00:00:00Z"
    session_id: "session-2026-05-20-next"
    category: concern
    summary: "queue-index drift + soft-block flag absent from index make /next ranking unreliable"
    detail: >
      queue-index.yaml disagreed with the WS-*.yaml files: WS-205/206 showed
      status:backlog in the index but were claimed in their files; WS-185 showed
      backlog but was done. Separately, the index summary does NOT carry
      blocked_by_note, so soft-blocked items (the P=22 monetization cluster, WS-191,
      WS-047, WS-092) surfaced at full priority in the first-pass ranking until each
      WS file was opened. Both stem from the absent cwos-reconcile.js (no automated
      index rebuild) — see fr-002/fr-011. Fix: install the reconcile suite, OR
      mirror blocked_by_note into the index, OR have /next read candidate WS files
      before ranking (slower but correct).
    resolved: false
    resolution: null
